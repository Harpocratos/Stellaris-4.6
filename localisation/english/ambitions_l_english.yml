 resolution_category_paladins: "Paladin Initiative"
 resolution_paladin_focus_teamwork: "Paladin Focus: Harmony"
 resolution_paladin_focus_teamwork_desc: "Paladins need to practice working together to overcome the gravest threat."
 resolution_paladin_focus_teamwork_tt: "$only_one_paladin_focus$\n\nUnlocks the §H$paladin_teamwork$§! ship action for §YPaladins§!:\n\n$paladin_teamwork_ship_button$"
 resolution_paladin_focus_leadership: "Paladin Focus: Leadership"
 resolution_paladin_focus_leadership_desc: "Paladins are more than commanders. They are exemplars who lead with strategy and unshakable valor, rallying allies and standing firm where the need is greatest."
 resolution_paladin_focus_leadership_tt: "$only_one_paladin_focus$\n\nUnlocks the §H$paladin_leadership$§! ship action for §YPaladins§!:\n\n$paladin_leadership_ship_button$"
 resolution_paladin_focus_last_resort: "Paladin Focus: Field Testing"
 resolution_paladin_focus_last_resort_desc: "The weapons entrusted to our Paladins are untested, perilous, and far too destructive for widespread use. We deploy them now because the stakes leave us no alternative, trusting our Paladins to wield them with honor."
 resolution_paladin_focus_last_resort_tt: "$only_one_paladin_focus$\n\nUnlocks the §H$paladin_field_testing$§! ship action for §YPaladins§!:\n\n$paladin_field_testing_ship_button$"
 only_one_paladin_focus: "§ROnly one Paladin §YFocus§! Resolution can be Passed.§!"
 resolution_paladin_training_teamwork: "Paladin Training: Synergy"
 resolution_paladin_training_teamwork_desc: "Though each Paladin is powerful alone, their true strength lies in unity. When they fight together, their valor does more than inspire. It becomes unstoppable."
 resolution_paladin_training_teamwork_tt: "$only_one_paladin_training$\n\n§YPaladins§! in a system grant each other the following modifier:\n- $MOD_SHIP_DAMAGE_REDUCTION_MULT$: §G2.5%§!\n- $MOD_SHIP_FIRE_RATE_MULT$: §G2.5%§!"
 resolution_paladin_training_defense: "Paladin Training: Defense"
 resolution_paladin_training_defense_desc: "A fallen Paladin may inspire, but a living one protects. Their survival is not sentiment, but strategy. We will commit all necessary resources to keeping them on the front lines."
 resolution_paladin_training_defense_tt: "$only_one_paladin_training$\n\nThe §YPaladin§! Leader Trait now grants:\n$MOD_SHIP_EVASION_MULT$: §G25%§!\n$MOD_SHIP_SHIELD_REGEN_ADD_PERC$: §G+20§!"
 resolution_paladin_training_offense: "Paladin Training: Offense"
 resolution_paladin_training_offense_desc: "Peace sometimes requires strength beyond restraint. Paladins strike not in anger, but to preserve what must endure."
 resolution_paladin_training_offense_tt: "$only_one_paladin_training$\n\nThe §YPaladin§! Leader Trait now grants:\n$MOD_SHIP_WEAPON_DAMAGE$: §G30%§!\n$MOD_SHIP_WEAPON_RANGE_MULT$: §G25%§!"
 only_one_paladin_training: "§ROnly one Paladin §YTraining§! Resolution can be Passed.§!"
 resolution_paladin_direct_command: "Direct Command"
 resolution_paladin_direct_command_desc: "The peril threatening us calls for extraordinary measures. We must rally the Paladins under the command of the Custodian."
 resolution_repeal_paladin_direct_command: "Repeal Direct Command"
 resolution_repeal_paladin_direct_command_desc: "The time of crisis has passed, and with it, the need for extraordinary command. The Paladins shall now return to the standard chain of authority, their charge fulfilled."
 resolution_paladin_direct_command_tooltip: "All §YPaladins§! will be directly controlled by the Custodian"

 gal_com_too_early: "It is too early to discuss this."

#Special Projects and event chains

 defender_of_the_galaxy_chain_title: "Defender of the Galaxy"
 defender_of_the_galaxy_chain_desc: "The galaxy is a beautiful place, worth preserving. A place of countless peoples, hopes, and dreams, each one deserving of protection. We do not seek power, only peace. But peace must be defended. Against those who would conquer, destroy, or corrupt, we will stand. And as long as we stand, so too shall the galaxy."
 ambition_level_reached: "Ambition Level Reached"

 defender_of_the_galaxy_ending_chain_title: "Preemptive Strike"
 defender_of_the_galaxy_ending_chain_desc: "We would be foolish to ignore the signs. There are forces of evil in this galaxy that would unmake all we strive to protect. We cannot wait for the storm to break. We must be prepared to act.\n\nLet those who threaten this galaxy know: we will find them.\n\n§HOBJECTIVES§!:\n- Eliminate all Crisis Empires\n- Defeat two End Game Crisis\n- Then End your Custodianship "
 crisis_defeated: "Crisis Defeated"

 DEFENDER_CRISIS_SPECIAL_PROJECT_1: "Tailored Diplomacy"
 DEFENDER_CRISIS_SPECIAL_PROJECT_1_DESC: "No one defends the galaxy alone.\n\nBefore we can act, we must earn the trust of those we hope to protect. That trust begins with honesty, restraint, and diplomacy.\n\nWe will train a new generation of envoys to prove through word and deed that we are here to help. Only together can we build alliances strong enough to weather what lies ahead."
 DEFENDER_CRISIS_SPECIAL_PROJECT_2: "Sources of Inspiration"
 DEFENDER_CRISIS_SPECIAL_PROJECT_2_DESC: "Trust is earned. Faith must be nurtured.\n\nNow that the galaxy stands with us, we must give its people something to believe in, symbols that can endure even the darkest hour. Not mere banners or slogans, but emblems of courage, unity, and the unshakable promise that we will stand between them and the storm.\n\nLet every sentient being look to these symbols and remember: they are not alone."
 DEFENDER_CRISIS_SPECIAL_PROJECT_4: "Take the Initiative"
 DEFENDER_CRISIS_SPECIAL_PROJECT_4_DESC: "The galaxy holds threats too great to ignore. We cannot afford to wait for the darkness to reveal itself. With caution and care, we will begin a series of high-risk operations to uncover what dangers lie ahead.\n\n§RThis will trigger the End Game Crisis§!"
 DEFENDER_CRISIS_SPECIAL_PROJECT_5: "Press the Advantage"
 DEFENDER_CRISIS_SPECIAL_PROJECT_5_DESC: "Our early efforts have proven necessary, and though successful, they are not the end.\n\nThe galaxy is vast and full of danger. We must continue our search to ensure that no threat escapes our watch.\n\nThese experiments are perilous, but if evil still lurks in the dark, we have no choice but to face it.\n\n§RThis will trigger a second End Game Crisis§!"

 PALADIN_SHIP_PROJECT: "Paladin Ships"
 PALADIN_SHIP_PROJECT_DESC: "Art meets technology to create symbols of freedom that will shine bright against the darkness."

 MISSION_BE_ON_GALCOM: "Community Member"
 MISSION_JOIN_GALACTIC_COMMUNITY: "$BE_ON_GALCOM$"
 BE_ON_GALCOM: "Be part of the Galactic Community"
 MISSION_BE_ON_GALCOM_DESC: "If we wish to steer the democratic apparatus of the galaxy, we first need to secure our seat at the table."
 MISSION_BE_ON_GALACTIC_COUNCIL: "Galactic Senator"
 BE_ON_GALACTIC_COUNCIL: "Sit on the Galactic Council"
 MISSION_BE_ON_GALACTIC_COUNCIL_DESC: "The creation of a galactic council is a necessary step to establish processes for galactic security.\n\nTo be elected §HCouncilor§!, we must:$TABBED_NEW_LINE$-Pass the $resolution_galacticreforms_form_council$ Resolution in the §HGalactic Community§!$TABBED_NEW_LINE$-Ensure that we are among the top three empires in the community, ranked by §HDiplomatic Weight§!"
 MISSION_BE_CUSTODIAN: "First Among Peers"
 BE_CUSTODIAN: "Get elected Galactic Custodian"
 MISSION_BE_CUSTODIAN_DESC: "The Custodianship is a burden. One we shall bear in service of the Galaxy.\n\nTo become §HCustodian§!, we must:$TABBED_NEW_LINE$- Pass the §H$resolution_galacticreforms_nominate_custodian$: [Root.GetName]§! Resolution in the §HGalactic Community§!"


#Events

 ambition.100.name: "Galactic Safeguard"
 ambition.100.desc: "Our galaxy is more fragile than it appears. Dangers press in from every direction: predators lurking in the void, pirates in forgotten systems, wars born of pride and fear. And too often, those with the power to act remain silent.\n\nWe will not stand idle. This is not a claim of dominance, but a commitment to stewardship. Through measured action and shared purpose, we will ensure the galaxy has a future worth protecting."
 ambition.100.a: "We will do what we must."

 ambition.105.name: "Endless Duty"
 ambition.105.desc: "Uniting the galaxy will not be achieved through force of arms or singular will alone. It will take trust, dialogue, and the willingness to shoulder burdens no one else dares to bear. Every alliance formed, every crisis defused, is a small step toward a more resilient future.\n\nWe seek not to rule, but to lead: to offer a steady hand when others falter. Our work is tireless, and often thankless, but this duty is our purpose. Together, we will shape an enduring galaxy."
 ambition.105.a: "We live to serve the galaxy."

 ambition.110.name: "Symbols of Liberty"
 ambition.110.desc: "In times of uncertainty, symbols matter. The galaxy does not only need protection, it needs inspiration. As threats grow bolder and the path ahead darkens, our plan is taking shape: a vanguard of exceptional individuals, drawn from every corner of known space, who will embody the ideals we fight to uphold.\n\nThese Paladins would not merely command fleets or coordinate relief efforts. They must be the living testament of our shared resolve. Heroes, not of a single people, but of all."
 ambition.110.a: "They shall be the galaxy's guiding light."

 ambition.115.name: "Oathbound Protectors"
 ambition.115.desc: "The galaxy has spoken, not in fear, but in trust. We have been chosen as Custodian and granted powers that reach beyond the bounds of ordinary mandate. These extraordinary privileges, though born of necessity, are not honors we sought. They are burdens we accept, for the sake of all.\n\nWe do not wield this authority to command, but to serve. Until peace is more than a pause between wars, until threats no longer lurk beyond the stars, we will uphold our oath. The time will come to relinquish these powers. But until then, we will wield them with restraint, purpose, and unwavering resolve."
 ambition.115.a: "This we swear."

 ambition.120.name: "Defenders of the Galaxy"
 ambition.120.desc: "We knew this day would come. For all our efforts to unify and uplift, the galaxy now faces an existential reckoning. This enemy knows no mercy, no compromise. It threatens all, and so we must stand for all.\n\nEvery alliance forged and hardship endured has brought us to this moment. We do not stand above the galaxy; we stand for it. Against annihilation, against despair, we rise. Not as conquerors, but as guardians.\n\nToday, of all days, we must not falter."
 ambition.120.a: "For the Galaxy!"

 ambition.125.name: "Irreproachable"
 ambition.125.desc: "A new generation of ambassadors now walks the halls of the Senate. Carefully trained, endlessly patient, and utterly devoted to our cause, they speak not merely with eloquence, but with sincerity, embodying our commitment to unity and peace. Their work might not command headlines, but they are the minute and precise artisans of lasting peace and cooperation.\n\nEvery word, every gesture, calibrated to reinforce one truth: we seek no dominion, only stability. We have nothing to hide, and thus, nothing to fear."
 ambition.125.a: "No diplomatic victory is too small."

 ambition.130.name: "Symbolic Warfare"
 ambition.130.desc: "A symbol is not born, it is carefully and deliberately made. If our heroes are to stand as beacons of hope, their ships must reflect that role. No mere combat ships; they must be the beacon that guides us through the dark.\n\nWhite and gold hulls, gleaming figureheads, and a design both elegant and formidable. Under the hood, the best that our technology can offer, no expense spared. These ships carry not just firepower, but reassurance. They are the vanguard of a vision: unity, strength, and unwavering resolve in the face of oblivion."
 ambition.130.a: "They shall fan the flame of hope."

 ambition.135.name: "That Which Lurks"
 ambition.135.desc: "Our investigations have borne grim, irrefutable fruit. Across deep-space observatories, classified listening posts, and ancient data vaults, the signs align: something is coming.\n\nThis is no false alarm, no misinterpreted anomaly. The threat is real, imminent, and of a scale that defies routine defense. We have no time for hesitation. Every preparation we have made must now be completed. The hour is late, but we are not unready. Let them come."
 ambition.135.a: "Fear will learn to fear us."

 ambition.140.name: "Always Two There Are"
 ambition.140.desc: "Our vigilance has once again been vindicated. Even as the galaxy braces against one existential threat, we have uncovered the stirrings of another. It lurks just out of sight, but the evidence is unmistakable: the danger is real, and it is advancing.\n\nYet this time, we are not caught unaware. We will seize the initiative again, striking before it can gather its full strength. The battle ahead will be brutal, but with the element of surprise on our side, we do not face it unprepared. Let the stars bear witness: we will not falter. Not now, not ever."
 ambition.140.a: "Duty never ends."

 ambition.200.name: "The Paladin Initiative"
 ambition.200.desc: "With the passage of the resolution, the Paladin Initiative is no longer a theoretical construct but an officially sanctioned project. This marks the beginning of a coordinated effort across member states to develop the doctrine, personnel, and material standards necessary for its realization.\n\nWhile members of the [global_event_country.GetCommunityOrImperium] will be handling the recruitment of their Paladins, we must still oversee the development of a new series of top-of-the-line ships for them to use."
 ambition.200.a: "Let's get to work."
 ambition.205.name: "Paladin Ships Ready"
 ambition.205.desc: "The development of Paladin ships is complete. A fusion of elegance and strength, they stand as symbols of our resolve. Though armed for war, their purpose is peace, and they serve as a promise: that we will be there, wherever the need is greatest."
 ambition.205.a: "Now to build one!"
 ambition.210.name: "Nominate a Paladin"
 ambition.210.desc: "We have completed the assembly of a Paladin ship. Its gilded hull shines softly in starlight, and its engines hum with power. It seems almost criminal to send such a piece of art into battle.\n\nNow, we must entrust it to a champion worthy of its charge, one whose resolve mirrors the vessel's strength, and whose courage will guide it into the heart of whatever darkness awaits."
 ambition.210.a: "Only the noblest may serve."
 ambition.216.name: "Paladin Subclass"
 ambition.216.desc: "[Root.GetName], our recently nominated Paladin, has shown great aptitude as a §Y[Root.GetPaladinSubclass]§!. We could steer [Root.GetHimHer] towards another specialization, but it would take significant efforts to not only train them but also reshape their public image to fit the new narrative."
 ambition.216.a: "No need to get involved."
 ambition.216.b: "Train [Root.GetHimHer] as a §Y$leader_trait_paladin_ace$§!"
 ambition.216.c: "Train [Root.GetHimHer] as a §Y$leader_trait_paladin_strategist$§!"
 ambition.216.d: "Train [Root.GetHimHer] as a §Y$leader_trait_paladin_ambusher$§!"
 ambition.216.e: "Train [Root.GetHimHer] as a §Y$leader_trait_paladin_logistician$§!"
 ambition.216.f: "Train [Root.GetHimHer] as a §Y$leader_trait_paladin_defender$§!"
 ambition.216.g: "Train [Root.GetHimHer] as a §Y$leader_trait_paladin_spearhead$§!"
 ambition.216.h: "Train [Root.GetHimHer] as a §Y$leader_trait_paladin_knight$§!"
 ambition.225.name: "Paladins Disbanded"
 ambition.225.desc: "With the immediate threats to galactic stability contained and its mandate fulfilled, the Paladin initiative has reached its natural conclusion. In accordance with the terms of their commission, the unit will stand down. Their vessels will be decommissioned, their command structures dissolved.\n\nThe Paladins leave behind only the memory of service rendered in the galaxy's hour of need. Their actions have earned respect across borders, and their disbandment is a reflection not of failure, but of success. Peace, at last, requires no champions."
 ambition.225.a: "Hail the valorous."
 ambition.230.name: "Direct Control"
 ambition.230.desc: "In light of escalating hostilities and the increasing need for unified military coordination, the Paladin Vanguard has been formally placed under Custodian command. While their original mandate emphasized independence and broad cooperation, present circumstances demand a more direct chain of authority.\n\nThis decision was not taken lightly. The Paladins remain respected figures, but they now serve within the established hierarchy of our strategic forces. As we need them more than ever, their operations will continue but as a coordinated force rather than autonomous agents. The mission has not changed."
 ambition.230.a: "A regrettable necessity."
 ambition.235.name: "Control Relinquished"
 ambition.235.desc: "With the immediate crisis abated and centralized command no longer deemed necessary, operational control of the Paladin Vanguard has been returned to its original framework. The Custodian's direct oversight has concluded, and the Paladins will once again act under the members of the Galactic Council.\n\nThis restoration of autonomy reaffirms our commitment to transparency and multilateral trust. The Paladins remain a symbol of unity, not subordination. They must serve no single power, but of the collective will."
 ambition.235.a: "Hail the Paladins!"
 ambition.325.name: "Peace at Last"
 ambition.325.desc: "The threats have passed. The galaxy, once on the brink, now finds itself in a time of cautious renewal. With no mandate left to fulfill, we have taken the final step: the Custodian's powers have been surrendered. What began as a response to crisis has ended as an act of trust.\n\nThe alliances we built, the example we've set. These will be our legacy. In choosing to lead without ruling, to protect without possessing, we have upheld our principles. The stars are secure, for now, and that is enough."
 ambition.325.a: "We can rest now."

