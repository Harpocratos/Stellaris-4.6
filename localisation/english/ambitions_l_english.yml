 integrity_gaining: "Complete §HAmbition Objectives§! to gain more £integrity£ §YValor§!."
 integrity_desc: "Valor measures our dedication to safeguard the galaxy against destruction and tyranny."
 integrity_crisis_objective: "Ambition Objectives"
 integrity_crisis_objective_gained: "Valor gained"
 integrity_crisis_objective_reward: "$REWARD$"
