 resolution_custodian_paladin_initiative: "Paladin Initiative"
 resolution_custodian_paladin_initiative_desc: "The galaxy needs inspiration, relatable figures to give a friendly face to our fleets and lead our forces to victory."
 resolution_custodian_paladin_initiative_tooltip: "Unlocks the §Y$PALADIN_SHIP_PROJECT$§! Special Project that will let us field inspiring heroes in special ships."

 resolution_needs_gdf: "$TRIGGER_FAIL$Requires passing the §HGalactic Defense Force§! resolution"

 resolution_custodian_disband_paladin_initiative: "Disband the Paladins"
 resolution_custodian_disband_paladin_initiative_desc: "The time of heroes has passed. We thank the Paladins for their services, and know that they will stand ready to fight for our safety should the need arise again."

 resolution_category_crisis_analysis: "$crisis_analysis$"
