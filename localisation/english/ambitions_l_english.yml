 resolution_custodian_democratic_proceedings: "Democratic Proceedings"
 resolution_custodian_democratic_proceedings_desc: "By sharing some of the Custodian's powers with the members of the council, we can delegate administrative tasks, and trust them to streamline the senatorial processes."
 resolution_custodian_repeal_democratic_proceedings: "Repeal Democratic Proceedings"
 resolution_custodian_repeal_democratic_proceedings_desc: "Sometimes faster is not always better, and there is democratic value to be found in longer senate sessions, that give more room for debate."
 resolution_crisis_analysis_khan: "$crisis_analysis$: The Great Khan"
 resolution_crisis_analysis_khan_desc: "The Khan is a fearsome military leader, but his troops are still a rag tag bunch, only making up for their lack of discipline through sheer brutality."
 resolution_crisis_analysis_tempest: "$crisis_analysis$: The Gray Tempest"
 resolution_crisis_analysis_tempest_desc: "The nanite clouds of the Gray Tempest are terrifying, but obey a specific programming. If we can crack their algorithms, we can crack them."
 resolution_crisis_analysis_voidworms: "$crisis_analysis$: Voidworms"
 resolution_crisis_analysis_voidworms_desc: "The repulsive voidworms, are nothing but beasts. It shouldn't take much work to come up with an effective counter strategy."
 resolution_crisis_analysis_cetana: "$crisis_analysis$: The Synthetic Queen"
 resolution_crisis_analysis_cetana_desc: "Cetana is a cunning foe, but behind her enigmatic smile lie ice cold code. The Synthetic Queen may not bleed, but we can defeat her."
 resolution_crisis_analysis_prethoryn: "$crisis_analysis$: The Prethoryn Swarm"
 resolution_crisis_analysis_prethoryn_desc: "In a sense, the inextinguishable hunger driving the Prethoryns make them predictable. They are fierce, but not indomitable."
 resolution_crisis_analysis_contingency: "$crisis_analysis$: The Contingency"
 resolution_crisis_analysis_contingency_desc: "The soulless logic of the Contingency is uncanny, but its ships were designed eons ago. Surely, we can come up with the means to defeat them."
 resolution_crisis_analysis_unbidden: "$crisis_analysis$: Extradimensional Invaders"
 resolution_crisis_analysis_unbidden_desc: "The vile Unbidden and their kin's reliance on energy weapons and shields might prove to be their undoing."
 resolution_repeal_crisis_analysis: "Repeal $crisis_analysis$"
 resolution_repeal_crisis_analysis_desc: "We do not need to maintain our strategic committees anymore."
 cancel_crisis_resolution: "Any active §H$crisis_analysis$§! resolution is canceled"
 ongoing_crisis: "There is an ongoing crisis"
