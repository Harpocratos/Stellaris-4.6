 integrity_crisis_level_unlocked: "At $LEVEL$, you get the rewards:\n"
 integrity_crisis_level_desc: "To advance through the Ambition levels, accumulate Valor."
 integrity_crisis_level_unlock: "Has £integrity£ §Y$CURRENCY$§! Valor"
 integrity_current_value: "Current Value: §Y$VALUE|0$§!"
 integrity_crisis_description_title: "Defender of the Galaxy"
 integrity_crisis_description: "Those in the galactic community who chart the arc of history have long predicted a coming §RCrisis§! - an existential threat to all sapient life which would require unprecedented unity of purpose, and sacrifice, to overcome. If it can be overcome at all.\n\nPopular predictions as to the nature of this crisis have been as fanciful as the invasion of an extragalactic glutton, or the galaxy's machine intelligences rising up in petty rebellion, or a war of succession spilling over from another plane of existence, and...\n\nIt is now clear that the protection of the galaxy will fall to §Gus§!.\n\nNo matter the horrors and tyrants that rise up, they will find our home to be well protected. Soon, all will learn that this side of universe shall never be broken!"
 integrity_crisis_howto_title: "Service and Sacrifice"
 integrity_crisis_howto: "Pursuing §HAmbition Objectives§! generates £integrity£ §HValor§!, an evidence of our dedication that will rally the free nations of the galaxy behind us in defense of life and liberty."

#Objectives

 crisobj_defensive_pacts_name: "Form Alliances"
 crisobj_defensive_pacts_desc: "Power lies in unity. Our cause is just, but justice without allies cannot endure. We cannot protect a galaxy that does not want to be protected, so we must seek those who share our values and will fight beside us, heart to heart and mind to mind.\n\nForm §YDefensive Pacts§! or grant §YFederation Association Status§! to gain this §Yannual§! Valor reward."
 crisobj_federated_name: "Be part of a Federation"
 crisobj_federated_desc: "The bonds of a federation are not easily undone. Cooperation and harmony with like-minded empires will lift us all into a new age of prosperity.\n\nJoin or Create a §YFederation§! to gain this §Yannual§! Valor reward."
 crisobj_not_in_aggressive_war_name: "Do not take part in Wars of Aggression"
 crisobj_not_in_aggressive_war_desc: "We are guardians, not aggressors; only in standing firm do we earn the galaxy's trust.\n\nDo not §YAttack§! or join the §YAttacking§! side in any war to gain this §Ymonthly§! Valor reward."
 crisobj_galcom_activity_name: "Contribute to the Galactic Community"
 crisobj_galcom_activity_desc: "The Galactic Community's democratic framework is our best means of forging unity. Through it, we may become a single shield, one strong enough to withstand any threat, yet tempered by respect for the autonomy of its members.\n\nSupport successful §YResolutions§! in the Galactic Community to gain this Valor reward."
 crisobj_destroy_crisis_ships_name: "Destroy Crisis Ships"
 crisobj_destroy_crisis_ships_desc: "Strength should be our last resort, but there can be no quarter given to the enemies of the galaxy.\n\nDestroy ships owned by a §YCrisis§! to gain this Valor reward."
 crisobj_destroy_crisis_countries_name: "Vanquish Crises"
 crisobj_destroy_crisis_countries_desc: "We do not seek war, but we will not suffer those who imperil the galaxy. If forced, we will ensure these despoilers are remembered only as a lesson.\n\nDestroy §YCrisis Empires§! to gain this Valor reward."

#Perks

 triggered_opinion_ap_defender_of_the_galaxy_1: "$menp_defender_opinion_1$"
 triggered_opinion_ap_defender_of_the_galaxy_2: "$menp_defender_opinion_2$"
 triggered_opinion_ap_defender_of_the_galaxy_3: "$menp_defender_opinion_3$"

 menp_defender_objectives: "Valor"
 menp_defender_objectives_desc: "Valor is earned through steadfast action in defense of the galaxy. It is not given, but earned, proof that we act not in self-interest, but for the protection of all."
 unlocks_defender_objectives: "Allows the accumulation of £integrity£ §Y$menp_defender_objectives$§! by completing §HAmbition Objectives§!"
 menp_defender_opinion_1: "Noble Hearts"
 menp_defender_opinion_1_desc: "To lead, we must be known, not through fear, but through hope. We will invest in outreach that uplifts, informs, and builds trust across the stars."
 unlocks_defender_opinion_1: "Increases the £opinion£ §YOpinion§! of empires capable of regular diplomacy by §G+40§!"
 menp_defender_galcom_1: "Inspired Orators"
 menp_defender_galcom_1_desc: "A speech is only as good as its orator. We must tailor our words to reach the hearts and minds of our peers - however alien they may appear to us."
 menp_defender_federation_1: "Stalwart Allies"
 menp_defender_federation_1_desc: "Federal administration is a powerful tool that can be leveraged for the benefit of all our allies."
 menp_defender_crisis_damage_1: "Defiance"
 menp_defender_crisis_damage_1_desc: "Our spirit is strong, and we won't back down from a fight for fear of getting hurt."
 unlocks_defender_crisis_damage_1: "Damage to Crisis factions: §G+15%§!"
 menp_defender_galcom_2: "Political Leaders"
 menp_defender_galcom_2_desc: "Our influence grows, and with it, our ability to enact change in the Galactic Community. Our allies trust us, and we must strive to honor their faith."
 menp_defender_galcom_2_structures: "Unlocks the ability to build some §YStructures§! in §YAllied§! Systems.\n"
 menp_defender_federation_2: "Comrades in Arms"
 menp_defender_federation_2_desc: "We protect the galaxy, but it is good to know that others protect us too. By relying upon each other, we all become stronger."
 unlocks_defender_federation_2: "Monthly Federation Experience Gain: §G+2§!"
 menp_defender_crisis_damage_2: "Dutiful Fervor"
 menp_defender_crisis_damage_2_desc: "The Galaxy believes in us, and we are not about to let them down."
 unlocks_defender_crisis_damage_2: "Damage to Crisis factions: §G+15%§!"
 menp_defender_opinion_2: "Champions of the Galaxy"
 menp_defender_opinion_2_desc: "Symbolism has long shaped the course of empires. To dispel any lingering doubt as to our purpose, we must forge unmistakable emblems behind which the entire galaxy can rally."
 unlocks_defender_opinion_2: "Increases the £opinion£ §YOpinion§! of empires capable of regular diplomacy to a total of §G+100§!\nUnlocks the §YPaladin Initiative§! resolution in the Galactic Community."
 menp_defender_research_1: "Cerebellum Initiative"
 menp_defender_research_1_desc: "Knowledge may be power, but true strength lies in its exchange. By sharing knowledge with our allies, we show that power need not divide. Used wisely, it unites us in common purpose."
 menp_defender_defense_1: "Fortified Stations"
 menp_defender_defense_1_desc: "Our fleets are our main weapon, but not the only one. Enemies can be halted upon the anvil of our stations so the hammer of our armada can strike them."
 menp_defender_defense_1_tt: "$defensive_stations_hull_mult$: §G+15%§!\n$defensive_stations_armor_mult$: §G+10%§!\n$defensive_stations_shield_hardening_add$: §G+15%§!"
 menp_defender_crisis_damage_3: "Revered Martyrs"
 menp_defender_crisis_damage_3_desc: "There is no virtue in seeking death, but in accepting its possibility for a just cause, there is honor. Victory in the defense of the galaxy demands sacrifice, and those who give their lives for others must never be forgotten."
 unlocks_defender_crisis_damage_3: "Damage to Crisis factions: §G+25%§!"
 menp_defender_opinion_3: "Beacon of Unity"
 menp_defender_opinion_3_desc: "We have proven ourselves in the eyes of the galaxy. Citizens across countless worlds know in their heart that we will fight until the bitter end to protect them."
 unlocks_defender_opinion_3: "Increases the £opinion£ §YOpinion§! of empires capable of regular diplomacy to a total of §G+200§!\nUnlocks new §YPaladin§! resolutions in the Galactic Community."
 menp_defender_custodian: "Highest Office"
 menp_defender_custodian_desc: "With extraordinary power comes extraordinary responsibility. The mantle of Custodianship is a burden borne for the common good. These powers must never be wielded for ambition, but to draw forth the galaxy's highest ideals."
 unlocks_defender_custodian: "Unlocks 4 special Custodian §YResolutions§! in the §Y[GetGalCommunityOrGalImperium]§!."
 menp_defender_defense_2: "Unshakeable Resolve"
 menp_defender_defense_2_desc: "In the face of certain annihilation, we do not stand because we are stronger. We stand because we must."
 menp_defender_crisis_damage_4: "By Any Means Necessary"
 menp_defender_crisis_damage_4_desc: "There are rules of war we have broken, and with full knowledge of the cost. When the current crisis is over, we will be judged. Until then, we do what we must to ensure a galaxy remains to judge us."
 unlocks_defender_crisis_damage_4: "Damage to Crisis factions: §G+35%§!"
 menp_defender_galcom_3: "Harmonized Strategy"
 menp_defender_galcom_3_desc: "Defense is always veiled in secrecy, but in the situation that is ours, the galaxy must band together to devise the best way to fend off its mortal enemies."
 unlocks_defender_galcom_3: "Unlocks special Crisis Analysis §YResolutions§! in the §Y[GetGalCommunityOrGalImperium]§!."
 final_price_doctrine: "Final Price"
 final_price_doctrine_desc: "Our soldiers know their duty, and that their names will be forever etched in galactic history after they pay the ultimate price to save us all."
 force_preservation_doctrine: "Force Preservation"
 force_preservation_doctrine_desc: "There is a time and place to give your life in service of a cause. Until the time comes, we cannot afford to squander the lives of our people."
 menp_defender_research_2: "No Secrets"
 menp_defender_research_2_desc: "The selfish secrecy that pushes us to occult our technological progress cannot be tolerated anymore. The stronger our allies, the stronger we are."
 menp_defender_defense_3: "Defenders of the Galaxy"
 menp_defender_defense_3_desc: "We will fight for every star. We will fight for every world. We will fight for every life. We will fight for every inch of our home!"

#Resolutions

 resolution_custodian_expand_gdf_2: "Supranational Defense Force"
 resolution_custodian_expand_gdf_2_desc: "The Galactic Defense Force is our best shot at surviving the horrors that might threaten our galaxy. Above the petty squabbles of the [global_event_country.GetCommunityOrImperium], it is the most reliable military force in the galaxy."
 resolution_custodian_gdf_drills: "Communal Military Drills"
 resolution_custodian_gdf_drills_desc: "Coordinated exercises between members of the [global_event_country.GetCommunityOrImperium] will help present a united front against would-be tyrants and invaders. Together, we shall be indomitable."
 resolution_custodian_council: "Empower the Council"
 resolution_custodian_council_desc: "The burden of leadership is heavy, but by collaborating with other members of the [global_event_country.GetCommunityOrImperium], we can allocate extraordinary resources to help the members of the Galactic Council so that they may help everyone in turn."
 resolution_custodian_council_tooltip: "Council Members:$TABBED_NEW_LINE$- $MOD_COUNTRY_ALL_TECH_RESEARCH_SPEED$: §G+10%§!$TABBED_NEW_LINE$- $mod_country_unity_produces_mult$: §G+10%§!$TABBED_NEW_LINE$- $mod_gdf_ship_cost_mult$: §G-5%§!$TABBED_NEW_LINE$- $MOD_DIPLO_WEIGHT_MULT$: §R-20%§!"
 resolution_custodian_reduce_council_power: "Repeal $resolution_custodian_council$"
 resolution_custodian_reduce_council_power_desc: "Repeals the §Y$resolution_custodian_council$§! resolution"

 resolution_custodian_gdf_3: "$resolution_custodian_expand_gdf_2$"
 resolution_custodian_gdf_4: "$resolution_custodian_gdf_drills$"

 mod_gdf_ship_cost_mult: "[GetGDFOrArmada] Ship Cost"
 mod_shipclass_starbase_shield_hardening_add: "Starbase Shield Hardening"

