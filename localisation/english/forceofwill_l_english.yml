#==========================
# Tutorials
#==========================

 TUTORIAL_IDEOLOGY_TAB_TITLE: "Tutorial: The $IDEOLOGY_CAP_PLURAL$ Tab"
 TUTORIAL_IDEOLOGY_TAB_DESC: "The §S$IDEOLOGY_CAP_PLURAL$§! tab displays information on foreign §S$IDEOLOGY_CAP_PLURAL$§! we have encountered. If we wish to adopt a foreign $IDEOLOGY_LOWER$, it can be selected here.\n\n[GetTutorialIdeologyTabSection]\n\nMore intelligence on an $IDEOLOGY_LOWER$ can be gathered by adopting it, having it present inside our borders, or increasing §SEmpire Intel§! on other Empires that have adopted it."
 TUTORIAL_IDEOLOGY_TAB_TITLE_default_section: "As our empire has individualistic $POPS$, we can form our own $IDEOLOGY_LOWER$ by §SAdvocating§! for a Fanatic Faction. The Faction's ethic will match that of the $IDEOLOGY_LOWER$ formed."
 TUTORIAL_IDEOLOGY_TAB_TITLE_gestalt_section: "After discovering our first foreign $IDEOLOGY_LOWER$, we can also form our own $IDEOLOGY_LOWER$ by using the §H[GetGestaltIdeologyProject]§! special project or agenda."

 TUTORIAL_IDEOLOGY_STRENGTH_TITLE: "Tutorial: $IDEOLOGY_STRENGTH$"
 TUTORIAL_IDEOLOGY_STRENGTH_DESC: "This is the §S$IDEOLOGY_CAP_PLURAL$§! tab. Here we can manage our own $IDEOLOGY_LOWER$ and view any foreign $IDEOLOGY_LOWER_PLURAL$ we have encountered.\n\nAs our §S$IDEOLOGY_STRENGTH$§! increases, we will be able to codify new §S$TENET_PLURAL$§!, which can provide powerful bonuses for our empire.\n\nWe should aim to keep our $IDEOLOGY_LOWER$'s §S$IDEOLOGY_MOMENTUM$§! positive. If it becomes negative, our colonies will experience disruptions to their stability.\n\n$IDEOLOGY_STRENGTH$ can be increased through colony management, §SColony Decisions§!, and the construction of a §S$galactic_halls$§! or other Ideological buildings. Additional £research£ §S$TECHNOLOGY$§! may be required to unlock these options."

 TUTORIAL_ADOPT_IDEOLOGY_TITLE: "Tutorial: Adopting an $IDEOLOGY_CAP$"
 TUTORIAL_ADOPT_IDEOLOGY_DESC: "We have officially adopted an §S$IDEOLOGY_CAP$§!. Maintaining it requires a monthly £influence£ §S$INFLUENCE$§! upkeep.\n\nOur colonies will now emit §S$IDEOLOGICAL_REACH$§!, which can be expanded through colony management, starbase construction, and diplomatic policies. An adopted $IDEOLOGY_LOWER$ is associated with a §SFanatic Faction§! within our empire.\n\nIf we are the §S[GetIdeologicalCustodianName]§!, we may customize our $IDEOLOGY_LOWER$'s name and flag in the §S$IDEOLOGY_CAP_PLURAL$§! tab.\n\nTo observe the effects of our $IDEOLOGY_LOWER$, open the §S$IDEOLOGY_CAP_PLURAL$ tab§! or hover over the $IDEOLOGY_CAP$ icon on the bottom-center panel in £interface£ §SSystem View§!."

 TUTORIAL_IDEOLOGICAL_REACH_TITLE: "Tutorial: $IDEOLOGICAL_REACH$"
 TUTORIAL_IDEOLOGICAL_REACH_DESC: "A foreign §S$IDEOLOGICAL_REACH$§! is affecting one of our colonies. Our $pops_with_icon$ will slowly convert to its associated Ethic, and may eventually become followers of that §S$IDEOLOGY_CAP$§!.\n\nWe can resist foreign $IDEOLOGICAL_REACH$ by upgrading starbases, docking fleets at starbases, or changing our diplomatic policies.[GetTutorialIdeologicalReachSection]\n\nAs only one $IDEOLOGICAL_REACH$ can affect a system's $pops_with_icon$ at a time, we can also resist foreign $IDEOLOGICAL_REACH$ by adopting our own $IDEOLOGY_LOWER$ and ensuring its reach in the system is stronger."
 TUTORIAL_IDEOLOGICAL_REACH_default_section: "\n\nIf we do not want our population to convert to this $IDEOLOGY_LOWER$, we can use the §S$decision_suppress_ideology$ Decision§! in the §S$concept_colony_view$§!. However, this costs a significant amount of £unity£ §S$unity$§! to maintain."

 TUTORIAL_GALACTIC_HALL_TITLE: "Tutorial: $galactic_halls$"
 TUTORIAL_GALACTIC_HALL_DESC: "We have completed construction of our first §S$galactic_halls$§!.\n\n$megastructures_galactic_halls$ are mobile megastructures dedicated to spreading and strengthening an §S$IDEOLOGY_CAP$§!. They provide extensive benefits to the colonies they orbit, and can be upgraded by constructing specialized modules to further customize their effects.\n\nA $galactic_halls$ can be relocated to anywhere within our borders, boosting the §S$IDEOLOGICAL_REACH$§! of the system it is stationed in."

 TUTORIAL_IDEOLOGY_MOMENTUM_TITLE: "Tutorial: Ideological $IDEOLOGY_MOMENTUM$"
 TUTORIAL_IDEOLOGY_MOMENTUM_DESC: "Our §S$IDEOLOGY_CAP$'s $IDEOLOGY_MOMENTUM$§! is negative, due to a decline in the strength of [Ideology.GetName].\n\nThis can cause instability throughout our society, and if left unchecked may lead to wider unrest.\n\nWe should look for ways to increase our §S$IDEOLOGY_STRENGTH$§! before serious problems arise. If the risks of persisting with [Ideology.GetName] as our official [GetIdeologyType] become too great, we may §SAbandon§! it at any time."

 TUTORIAL_CULTURAL_ENVOY_TITLE: "Tutorial: $cultural_envoy_ship_plural$"
 TUTORIAL_CULTURAL_ENVOY_DESC: "We have completed construction of our first §S$cultural_envoy_ship$§!.\n\n$cultural_envoy_ship_plural$ must be commanded by an £official£ §S$official$§!. While operating these ships, officials are granted a special leader trait.\n\nAs these vessels can bypass closed borders, we can send a $cultural_envoy_ship$ to any colony belonging to another empire to begin converting its population to our [owner.GetIdeologyType]. This behavior can also be automated.\n\nGestalt populations cannot be converted by $cultural_envoy_ship_plural$."

