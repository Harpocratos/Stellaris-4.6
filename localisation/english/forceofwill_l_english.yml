# Absolute Militarist
 ethic_absolute_militarist: "Absolute Militarist"
 ethic_absolute_militarist_desc: "§LMight is the fulcrum of our civilization. Strength ensures survival, and projected force fosters a deathless glory. All that opposes us shall be settled in the arena of war.§!"

 # Absolute Xenophobe
 ethic_absolute_xenophobe: "Absolute Xenophobe"
 ethic_absolute_xenophobe_desc: "§LTime has proven the wisdom of our aversion to the Xeno. By standing apart from alien entanglements, our society remains uncorrupted by their dangerous machinations. One truth must guide us: strength through self-sufficiency.§!"

 ETHIC_ALLOWS_NATIVE_SUPREMACY: "§EAllows §H$living_standard_native_supremacy$§! $SPECIES_RIGHT_LIVING_STANDARDS$§!"

# Absolute Egalitarian
 ethic_absolute_egalitarian: "Absolute Egalitarian"
 ethic_absolute_egalitarian_desc: "§LEquality is the highest virtue, and our commitment to its achievement is unwavering. Everyone within our society must be given every opportunity to thrive. We must forever guard against anything, or anyone, that would threaten this fundamental principle.§!"

# Absolute Materialist
 ethic_absolute_materialist: "Absolute Materialist"
 ethic_absolute_materialist_desc: "§LResearch and experience has vindicated our theories: there exist no supernatural forces that affect reality, let alone govern it. The ideal society is one in which all decisions and principles are based on material evidence, free from ambivalence and sentimentality. Objectivity must be our guide.§!"

 ETHIC_DISALLOW_RESEARCH_RESTRICTION: "§ECannot use §H$research_restriction_dangerous_forbidden$§! policy§!"

# Absolute Pacifist
 ethic_absolute_pacifist: "Absolute Pacifist"
 ethic_absolute_pacifist_desc: "§LWar should exist only in historical logs. Such failures of reason and thought must never again darken this cosmos. Our most meaningful contribution to this universe will be the gift of peace for all.§!"

 abs_pacifist_stability_job_output: "£job£ Job Output on planets with §Y90%§! or more $PLANET_STABILITY_TITLE$: §G+10%§!"

# Absolute Xenophile
 ethic_absolute_xenophile: "Absolute Xenophile"
 ethic_absolute_xenophile_desc: "§LOur long journey into the cosmos has taught us one thing above all else: to reach our highest potential, we must engage the unknown with open minds. A flourishing society draws strength from diversity and cooperation. Left in isolation, we wither.§!"

 abs_xenophile_insight_gain: "[GetAbsXenophileInsightGain]"
 abs_xenophile_insight_gain_has_dlc: "Gains §G150%§! more Insights from observing pre-FTL Civilizations"

 abs_xenophile_council_species_councilor_skill: "$MOD_COUNCILOR_SKILL_ADD$ per Species on Council: §G+1§!"

# Absolute Authoritarian
 ethic_absolute_authoritarian: "Absolute Authoritarian"
 ethic_absolute_authoritarian_desc: "§LThe will of leadership is law, and freedom flows from obedience. History has shown that only a firm grip can steer society toward greatness. To question rule is to invite ruin; order demands that dissent be silenced.§!"

 ETHIC_ALLOWS_CRUSHING: "§EAllows §H$living_standard_crushing$§! $SPECIES_RIGHT_LIVING_STANDARDS$§!"

# Absolute Spiritualist
 ethic_absolute_spiritualist: "Absolute Spiritualist"
 ethic_absolute_spiritualist_desc: "§LThe pinnacle of being is transcendent alignment with the cosmos. Our society is most perfect when spirit infuses all things, and our consciousness becomes one with existence itself. We can only pity those who cling to the fleeting illusions of material 'reality'.§!"

