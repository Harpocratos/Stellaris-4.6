# Spirit Cultivation Situation events (Path of the Self Civic)
 forceofwill.210.title: "$situation_spirit_cultivation$"
 forceofwill.210.desc: "Our spirits have been elevated. With the guidance of our most enlightened [Owner.GetPriestPlural], [Owner.GetAdj] society has attained new heights of spiritual cultivation. A widespread sense of wholeness and insight pervades our culture.\n\nIn this moment of enlightenment, it behooves us to channel our divine energy into a particular purpose, for the benefit of all the [Owner.GetName]."
 forceofwill.210.unity: "Let us forge a common purpose."
 forceofwill.210.happiness: "Let us dwell in inner harmony."
 forceofwill.210.stability: "Let there be calm."
 forceofwill.210.councilor: "Let us govern through truth and insight."
 forceofwill.210.leader_upkeep: "Let those who lead guide in wisdom."
 forceofwill.210.leader_lifespan: "Let new strength breathe into our leaders."
 forceofwill.210.death_cult: "Let the dead speak for us."
 forceofwill.210.ascensionist: "Let us rise to new heights."
 forceofwill.210.dimensional_worship: "Let us find truth in other planes of existence."
 forceofwill.210.exalted_priesthood: "Let our [owner.GetPriestPlural] show us the way."
 forceofwill.210.gospel_masses: "Let us cultivate worldly prosperity."
 forceofwill.210.unity_bulk: "Let us embrace this moment of unity."

 forceofwill.220.desc.intro: "Our spiritual cultivation has brought blessings upon the [this.owner.GetName]."
 forceofwill.225.name: "Enlightenment of [this.GetName]"
 forceofwill.225.desc: "$forceofwill.220.desc.intro$\n\nThrough concerted meditative practice, §H[this.GetTitle] [this.GetName]§! has refined their inner spirit, casting off an impediment to their [this.GetLeaderAdj] attainment."
 forceofwill.225.a.tt: "§Y[this.GetTitle] [this.GetName]§! loses a negative trait."
 forceofwill.230.name: "$forceofwill.225.name$"
 forceofwill.230.desc: "$forceofwill.220.desc.intro$\n\nThrough concerted meditative practice, §H[this.GetTitle] [this.GetName]§! has refined their inner spirit, allowing a previously latent talent to emerge into being."
 forceofwill.230.a.tt: "§Y[this.GetTitle] [this.GetName]§! gains a new positive trait."
 forceofwill.235.name: "Surge of Enlightenment"
 forceofwill.235.desc: "$forceofwill.220.desc.intro$\n\nThrough sustained meditative practice, our leaders have experienced a surge of enlightenment. They lead with divine insight, and their elevated spirits are manifest in their wise and masterful actions."
 forceofwill.240.name: "Enlightenment on [this.GetName]"
 forceofwill.240.desc: "$forceofwill.220.desc.intro$\n\nBy its thoroughgoing commitment to meditative practice, the population on §H[this.GetName]§! has achieved new heights of enlightenment. This devotional achievement has elevated the [this.GetPlanetMoon]'s potential for both worldly prosperity and spiritual calmness."
 forceofwill.245.name: "$MESSAGE_SPIRIT_CULTIVATION_BONUS_MIRACLE_CHILD_TITLE$"
 forceofwill.245.desc: "$forceofwill.220.desc.intro$\n\nSince the moment of [miracle_child.GetHisHer] [miracle_child.species.GetBirthNoun], the [GetMiracleChildBaby] named §H[miracle_child.GetName]§! has shown powerful signs of spiritual enlightenment, rapidly gaining a reputation as a 'miracle child'.\n\nIt is our sacred duty to nurture [miracle_child.GetHimHer] as a leader among our kind."
 forceofwill.245.a.tt: "Gain a special §YOfficial§! leader with the §Y$leader_trait_spiritual_prodigy$§! trait."
 miracle_child_baby_nonhuman: "[miracle_child.species.GetSpawnName]"
 forceofwill.250.name: "Divine Specimen Acquired"
 forceofwill.250.desc: "$forceofwill.220.desc.intro$\n\nAn artisan of devotional objects on [capital_planet.GetName] has completed the §H$holy_symbol$§!, a pinnacle of sacred craftsmanship. Forged from an alloy of precious metals, its many points of direction represent the spiritual journey of the enlightened mind."

# Ideology events (1000 - 1999)
 forceofwill.1030.name: "[owner.GetIdeologyTypeCap] Emerges: §H[generated_ideology.GetName]§!"
 forceofwill.1030.desc.common_1: "As a result of our advocacy, the faction known as the §H[this.GetName]§! has significantly increased its support within [owner.GetAdj] society."
 forceofwill.1030.desc.common_2_shared: "what was once a group of loosely related beliefs has now grown into a full-fledged ideology known as §H'[generated_ideology.GetName]'§!.\n\nWith our continued support, this system of principles can continue to spread its influence throughout the [owner.GetName],"
 forceofwill.1030.desc.common_2: "$forceofwill.1030.desc.common_2_shared$ and to other similar minds in the wider galaxy."
 forceofwill.1030.desc.common_2_genocidal: "$forceofwill.1030.desc.common_2_shared$ furthering our efforts to cleanse this galaxy of the xeno once and for all."
 forceofwill.1030.desc.spiritualist_shared: "$forceofwill.1030.desc.common_1$ Devout contemplation among believers has clarified its insights;"
 forceofwill.1030.desc.spiritualist: "$forceofwill.1030.desc.spiritualist_shared$ $forceofwill.1030.desc.common_2$"
 forceofwill.1030.desc.spiritualist.genocidal: "$forceofwill.1030.desc.spiritualist_shared$ $forceofwill.1030.desc.common_2_genocidal$"
 forceofwill.1030.desc.default_shared: "$forceofwill.1030.desc.common_1$ Lively discussion among partisans has clarified its ideas;"
 forceofwill.1030.desc.default: "$forceofwill.1030.desc.default_shared$ $forceofwill.1030.desc.common_2$"
 forceofwill.1030.desc.default.genocidal: "$forceofwill.1030.desc.default_shared$ $forceofwill.1030.desc.common_2_genocidal$"
 forceofwill.1030.a.militarist: "Ideas are among the strongest of weapons."
 forceofwill.1030.a.pacifist: "Let peace spread through the galaxy."
 forceofwill.1030.a.spiritualist: "May this message reach into the stars."
 forceofwill.1030.a.materialist: "A foundation of ideas on which to build."
 forceofwill.1030.a.authoritarian: "Order from the chaos."
 forceofwill.1030.a.egalitarian: "An opportunity for all."
 forceofwill.1030.a.xenophobe: "Others will come to know the truth."
 forceofwill.1030.a.xenophile: "There are no boundaries to an idea."
 forceofwill.1030.tt: "Generates the §H[generated_ideology.GetName]§! [owner.GetIdeologyType].\n$adopt_ideology_unlocks_buildings_tt$"

 forceofwill.1045.name: "§H[from.GetName]§! Adopted"
 forceofwill.1045.desc_prefix: "It is official: §H[from.GetName]§! has now been adopted as the state [this.GetSpecificIdeologyType] of the [this.GetName]."
 forceofwill.1045.desc_suffix: "permeating every sector of [this.GetAdj] society, while bringing renewed ethical rigor to our societal institutions.\n\nAs time goes on, we are sure to reap great benefits from these guiding principles - as long as we remain steadfast in our adherence."
 forceofwill.1045.desc: "$forceofwill.1045.desc_prefix$ Its values are already $forceofwill.1045.desc_suffix$"
 forceofwill.1045.desc.genocidal: "$forceofwill.1045.desc_prefix$ Though originally alien in origin, its ideas have been properly adapted and are now $forceofwill.1045.desc_suffix$"
 forceofwill.1045.a: "A great day for [this.GetAdj] society."
 forceofwill.1045.a.genocidal: "The purification of the galaxy draws near."
 forceofwill.1045.a.tt: "$adopt_ideology_unlocks_buildings_tt$"

 forceofwill.1060.name: "New [Ideology.GetIdeologicalCustodianName]"
 forceofwill.1060.desc: "We are now the [Ideology.GetIdeologicalCustodianName] of §H[Ideology.GetName]§!.\n\nThe [Ideology.GetIdeologyTheoretical] development of our adopted [this.GetSpecificIdeologyType] had been stagnating under the custodianship of the [FromFrom.GetName]. After long deliberation, we have now taken their place as doctrinal leaders.\n\nIt is our responsibility to continue the codification of the [this.GetIdeologyType]'s tenets."
 forceofwill.1060.a: "A new age of [Ideology.GetName] begins."

 forceofwill.1065.name: "$forceofwill.1060.name$"
 forceofwill.1065.desc: "We are no longer the [Ideology.GetIdeologicalCustodianName] of §H[Ideology.GetName]§!.\n\nFor some time, foreign adherents had claimed that the [this.GetSpecificIdeologyType]'s [Ideology.GetIdeologyTheoretical] development had stagnated under [Root.GetAdj] custodianship. After significant pressure, we were forced to allow the §H[From.GetName]§! to take our place as doctrinal leaders.\n\nIt is now their responsibility to continue the codification of the [this.GetSpecificIdeologyType]'s tenets."
 forceofwill.1065.a: "Let us hope they are fit for this duty."
 forceofwill.1065.a.genocidal: "At least until we erase them from the galaxy."

 forceofwill.1085.name: "A New Follower"
 forceofwill.1085.desc_shared: "The §H[From.GetName]§! has officially adopted the values of §H[Ideology.GetName]§!. Our outlook and ways of thinking are"
 forceofwill.1085.desc: "$forceofwill.1085.desc_shared$ now shared by ever greater numbers across the galaxy."
 forceofwill.1085.desc.genocidal: "$forceofwill.1085.desc_shared$ so evidently superior that even those we will one day exterminate are sympathetic to them."
 forceofwill.1085.desc.hall_incomplete: "As adherence grows, there is increasing support for the construction of a §H[Ideology.GetHallCathedral] of [Ideology.GetName]§! that would embody the values of our [Owner.GetSpecificIdeologyType]."
 forceofwill.1085.desc.hall_unknown_shared: "As adherence grows, there is increasing support for a monumental project that would embody the values of our [Owner.GetSpecificIdeologyType]."
 forceofwill.1085.desc.hall_unknown: "$forceofwill.1085.desc.hall_unknown_shared$ $galactic_hall_event_desc_common$"
 forceofwill.1085.desc.hall_unknown.genocidal: "$forceofwill.1085.desc.hall_unknown_shared$ $galactic_hall_event_desc_common_genocidal$"
 galactic_hall_event_desc_common_shared: "This §H[Ideology.GetHallCathedral] of [Ideology.GetName]§! would be a symbolic expression of our [Ideology.GetIdeologicalAdj] principles and a means to"
 galactic_hall_event_desc_common: "$galactic_hall_event_desc_common_shared$ propagate them further throughout the galaxy."
 galactic_hall_event_desc_common_genocidal: "$galactic_hall_event_desc_common_shared$ strengthen them further throughout the galaxy."
 forceofwill.1085.a: "Our influence grows."
 forceofwill.1085.a.genocidal: "Our superiority grows ever more evident."
 forceofwill.1085.a.tt: "Each new empire adopting our [Owner.GetSpecificIdeologyType] will give the following modifiers:"

 forceofwill.1095.name: "[Ideology.GetIdeologicalAdjCap] Influence Contested"
 forceofwill.1095.desc: "The growing influence of a foreign [From.GetSpecificIdeologyType] is interfering with our efforts to spread §H[Ideology.GetName]§!.\n\nKnown as §H[From.GetName]§!, it encompasses a broadly [From.GetEthicLower] worldview. Many of its core principles [Root.GetIdeologyClashEthicRelation]\n\nForeign media transmissions of content which advocates for this [From.GetSpecificIdeologyType] have been detected in [Root.GetIdeologyClashSystems]\n\n[Root.GetIdeologyClashThreat] with unpredictable consequences for the [Root.GetName]."
 forceofwill.1095.desc.same_ethic: "have aspects in common with our own fundamental values."
 forceofwill.1095.desc.opposite_ethic: "are in direct opposition to our own fundamental values."
 forceofwill.1095.desc.other_ethic: "relate to entirely different considerations to our own fundamental values."
 forceofwill.1095.desc.one_system: "the [event_target:ideology_clash_system.GetName] system."
 forceofwill.1095.desc.several_systems: "a number of systems."
 forceofwill.1095.desc.within_borders: "If we do not take action to protect our population from exposure to this external propaganda, adherence to [Ideology.GetName] could be undermined,"
 forceofwill.1095.desc.within_borders_gestalt: "If we do not take action to protect our collective from exposure to this external propaganda, adherence to [Ideology.GetName] could be undermined,"
 forceofwill.1095.desc.beyond_borders: "If we do not take action to counter this external propaganda it could one day reach our population,"
 requires_border_access_control: "$TRIGGER_FAIL$§RWe cannot control the [event_target:ideology_clash_emitter.GetName]'s access to our borders§!"
 requires_no_binding_ties_with_custodian: "$TRIGGER_FAIL$§RDiplomatic ties prevent us from declaring the [From.Owner.GetName] an $IDEOLOGICAL_RIVAL$§!"
 forceofwill.1095.a: "We must resist these foreign ideas."
 forceofwill.1095.b: "Our ideals will be stronger for being contested."
 forceofwill.1095.b.tt: "§RThis will damage our relations with all members of this Ideology.§!"
 forceofwill.1095.c: "It is of no concern."

 forceofwill.1100.name: "[GetFoW1100Name]"
 forceofwill.1100.name.default: "Rise of an $IDEOLOGY_CAP$"
 forceofwill.1100.name.spirit: "Rise of a $IDEOLOGY_TYPE_SPIRITUALIST_CAP$"
 forceofwill.1100.desc.common_1: "Across all of the [this.GetName], from the upper echelons of leadership to the general population"
 forceofwill.1100.desc.common_2_shared: "as a society - and propagate them openly through all aspects of [this.GetSpeciesAdj] life"
 forceofwill.1100.desc.common_2: "$forceofwill.1100.desc.common_2_shared$, and into the wider galaxy."
 forceofwill.1100.desc.common_2_genocidal: "$forceofwill.1100.desc.common_2_shared$ to further aid us in these efforts."
 forceofwill.1100.desc.default_start: "$forceofwill.1100.desc.common_1$, we are witnessing powerful demonstrations of commitment to our shared values and beliefs."
 forceofwill.1100.desc.default_end: "Senior leaders are advocating that we should begin to explicitly codify our ideological tenets -"
 forceofwill.1100.desc.default: "$forceofwill.1100.desc.default_start$\n\n$forceofwill.1100.desc.default_end$ $forceofwill.1100.desc.common_2$"
 forceofwill.1100.desc.default.genocidal: "$forceofwill.1100.desc.default_start$ Our collective will to cleanse the galaxy is stronger than ever before.\n\n$forceofwill.1100.desc.default_end$ $forceofwill.1100.desc.common_2_genocidal$"
 forceofwill.1100.desc.spirit: "$forceofwill.1100.desc.common_1$, we are witnessing powerful demonstrations of commitment to our spirituality and the guiding principles of our faith.\n\nSenior leaders are advocating that we should begin to explicitly formalize our defining beliefs - $forceofwill.1100.desc.common_2$"
 forceofwill.1100.a: "We must seize this opportunity."
 forceofwill.1100.a.genocidal: "The xenos will suffer."
 forceofwill.1100.b: "Now is not the time."

 forceofwill.1200.name: "Alien Ideology"
 forceofwill.1200.desc.common_1: "We have become aware of a foreign 'ideology' known as §H[from.GetName]§!."
 forceofwill.1200.desc.common_2_shared: "and adherence to its tenets has a noticeable impact on the societies it permeates.\n\nIn its current form, such an individualistic schema has no place in our collective society, yet codifying a coherent set of ideas has some observable advantages. With careful consideration, we might develop a way to adapt this phenomenon for dispersal throughout the [this.GetName]"
 forceofwill.1200.desc.common_2: "$forceofwill.1200.desc.common_2_shared$ and beyond our borders."
 forceofwill.1200.desc.common_2_genocidal: "$forceofwill.1200.desc.common_2_shared$ to aid us in purging the galaxy of the lesser xenos."
 forceofwill.1200.desc.knows_shared: "$forceofwill.1200.desc.common_1$ This system of beliefs originated from the [from.owner.GetName],"
 forceofwill.1200.desc.knows: "$forceofwill.1200.desc.knows_shared$ $forceofwill.1200.desc.common_2$"
 forceofwill.1200.desc.knows.genocidal: "$forceofwill.1200.desc.knows_shared$ $forceofwill.1200.desc.common_2_genocidal$"
 forceofwill.1200.desc.default_shared: "$forceofwill.1200.desc.common_1$ This system of beliefs appears to have originated from an uncontacted species code-named the [from.owner.GetName],"
 forceofwill.1200.desc.default: "$forceofwill.1200.desc.default_shared$ $forceofwill.1200.desc.common_2$"
 forceofwill.1200.desc.default.genocidal: "$forceofwill.1200.desc.default_shared$ $forceofwill.1200.desc.common_2_genocidal$"
 forceofwill.1200.a: "Interesting. Let us consider this."
 forceofwill.1200.b: "Ignore this noise."
 forceofwill.1200.b.tt: "$UNLOCKS_AGENDA$ §YCodify [this.GetIdeologyTypeCap]§!"

 forceofwill.1210.name: "[this.GetGestaltIdeologyProjectName]"
 forceofwill.1210.desc_prefix: "Based on the foreign concept of 'ideologies', our [this.GetResearchers] have developed a schema for '[this.GetIdeologyTypePlural]', a framework for coherent sets of ideas to spread throughout the [this.GetGestaltEntityName]"
 forceofwill.1210.desc_suffix: "All that remains is to determine the nature of our [this.GetIdeologyType]."
 forceofwill.1210.desc: "$forceofwill.1210.desc_prefix$ and beyond our borders.\n\n$forceofwill.1210.desc_suffix$"
 forceofwill.1210.desc.genocidal: "$forceofwill.1210.desc_prefix$ to aid us in purging the galaxy of lesser xenos.\n\n$forceofwill.1210.desc_suffix$"
 forceofwill.1210.militarist: "We are war."
 forceofwill.1210.xenophobe: "We are purity."
 forceofwill.1210.egalitarian: "We are equality."
 forceofwill.1210.materialist: "We are knowledge."
 forceofwill.1210.pacifist: "We are peace."
 forceofwill.1210.xenophile: "We are legion."
 forceofwill.1210.authoritarian: "We are order."
 forceofwill.1210.spiritualist: "We are faith."

 forceofwill.1250.name: "Death of [from.GetRegnalName]"
 forceofwill.1250.desc: "After years of dignified service, our §H[GetFoW1250RulerTitle] [from.GetRegnalName]§! has perished. We now face the matter of succession.\n\nIt falls to [from.GetRegnalName]'s inner circle to choose a new [this.GetHeirTitle] from among their own kin - someone who can rule the [this.GetName] wisely, and in accordance with the principles of [ideology.GetName]."
 forceofwill.1250.a: "They should be a $scientist$."
 forceofwill.1250.b: "They should be a $commander$."
 forceofwill.1250.c: "They should be an $official$."

# Ideology Momentum events
 forceofwill.1550.name: "[from.GetClubNameCap] on the Rise"
 forceofwill.1550.desc: "Inspired by the growing popularity of §H[from.GetName]§!, our citizens are joining [from.GetClubName] in record numbers, eager to deepen their commitment to our society's most fundamental values.\n\nAll across the [this.GetName], this surge in memberships is leading to newfound levels of social harmony and ideological alignment."
 forceofwill.1550.a: "A commendable initiative."
 forceofwill.1550.b: "Integrate them into public information efforts."

