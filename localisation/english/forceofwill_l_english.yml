 forceofwill.1560.name: "New Insights on [this.GetLastTenetName]"
 forceofwill.1560.desc.common: "By gradual refinement, [this.GetLastTenetName] has become firmly established as a key principle of §H[from.GetName]§!."
 forceofwill.1560.desc.default: "$forceofwill.1560.desc.common$ Recent studies on the subject have sparked lively debate among our [Owner.GetResearchers], bringing new theoretical rigor to our guiding principles."
 forceofwill.1560.desc.spirit: "$forceofwill.1560.desc.common$ A recently published exegesis, analyzing our canonical texts, has sparked theological debate among our [this.GetBureaucratPlural], breathing new spiritual insight into our precepts."
 forceofwill.1560.a: "Let us hope this spirit of inquiry continues."
 forceofwill.1560.b: "Help fund further doctrinal discussion."

 forceofwill.1570.name: "[from.GetEthic] Monument Built"
 forceofwill.1570.desc: "The inhabitants of [selected_planet.GetName] have self-organized to construct a monument celebrating their growing [from.GetDevotion] to the values of §H[from.GetName]§!.\n\nThe construction was facilitated by private donors and completed in record time by a highly motivated network of skilled individuals, youth groups and social clubs, united by their commitment to our shared beliefs.\n\nThey are now requesting the presence of government officials for the monument's opening ceremony."
 forceofwill.1570.a: "Send a delegate to recognize their efforts."
 devotion_key: "devotion"
 dedication_key: "dedication"
 building_galactic_memorial_tt: "Adds £building£ ['building:building_galactic_memorial_1'] to §Y[event_target:selected_planet.GetName]§!"
 building_corporate_monument_tt: "Adds £building£ ['building:building_corporate_monument'] to §Y[event_target:selected_planet.GetName]§!"
 building_autochthon_monument_tt: "Adds £building£ ['building:building_autochthon_monument'] to §Y[event_target:selected_planet.GetName]§!"
 forceofwill.1570.b: "We have more important matters to focus on."

 forceofwill.1580.name: "$citizen_parade$"
 forceofwill.1580.desc: "Many of our citizens recently participated in the organization and staging of a mass 'Unity Day', celebrating the core values of §H[from.GetName]§! through a series of parades and festivals.\n\nThese huge gatherings took place in many of our most populous cities, as [this.GetSpeciesNamePlural] came together to affirm their support for the fundamental tenets of our shared culture and societal outlook."
 forceofwill.1580.a: "Encourage regular parades."
 forceofwill.1580.b: "Use the parade to aid government messaging."

 forceofwill.1590.name: "Leader $recruitment_boom$"
 forceofwill.1590.desc: "High levels of trust and confidence in §H[from.GetName]§! are inspiring ever more of our population to aspire to leadership positions. Recruitment offices are inundated with applications.\n\nThese idealistic new candidates are motivated primarily by a desire to contribute to the future success of the [this.GetName], rather than personal ambition or financial gain."
 forceofwill.1590.b: "Enlist them to promote [from.GetName] instead."

 forceofwill.1600.name: "Corruption on the Decline"
 forceofwill.1600.desc.start: "High levels of idealistic commitment among those working in government are driving a drastic reduction in corruption and waste across the [this.GetName].\n\nOur workforce's staunch"
 forceofwill.1600.desc.end: "§H[from.GetName]§! is making them almost entirely impervious to bribery or any other activity which undermines these fundamental shared values."
 forceofwill.1600.desc.default: "$forceofwill.1600.desc.start$ attachment to $forceofwill.1600.desc.end$"
 forceofwill.1600.desc.spiritualist: "$forceofwill.1600.desc.start$ faith in $forceofwill.1600.desc.end$"
 forceofwill.1600.a.default: "In [from.GetName] they trust."
 forceofwill.1600.a.spiritualist: "May their faith guide them."
 forceofwill.1600.b: "Reward their loyalty."

 forceofwill.1610.name: "Golden Age of [from.GetName]"
 forceofwill.1610.desc: "Our adoption of §H[from.GetName]§! appears to have borne fruit. Our impartial analysts have drawn numerous correlations between increased engagement and positive trends in our society.\n\nMany are even calling this a 'golden age' of [from.GetName] that will bring us ever closer in ideological harmony."
 forceofwill.1610.a: "Channel this positivity into social cohesion."
 forceofwill.1610.b: "Direct this engagement toward economic ends."
 forceofwill.1610.c: "Use this moment to strengthen our governance."

 forceofwill.1620.name: "Donation Surge"
 forceofwill.1620.desc: "Ever-growing numbers of our citizens are choosing to donate their private assets to the state, motivated by a strong desire to give back to our society and support the propagation of §H[from.GetName]§! in the future.\n\nThese acts of giving typically occur during dates of national significance for [this.GetName], or sometimes through bequests upon death."
 forceofwill.1620.a: "Use the proceeds to raise living standards."
 forceofwill.1620.b: "Use the proceeds to promote our culture."

 forceofwill.1630.name: "Trade Boom"
 forceofwill.1630.desc.common: "Trade is booming in the [this.GetName]!\n\nIncreased adherence to §H[from.GetName]§! has brought about noticeable benefits to our society's productivity and optimism."
 forceofwill.1630.desc.unfriendly: "$forceofwill.1630.desc.common$ Merchants are establishing businesses in record numbers, trading goods with unprecedented dynamism."
 forceofwill.1630.desc.default: "$forceofwill.1630.desc.common$ Foreign merchants are establishing businesses in record numbers, importing exotic spices and goods from across the galaxy."
 forceofwill.1630.a: "Impose a small trade levy to boost our coffers."
 forceofwill.1630.b: "Arrange a shipment of crucial minerals."
 forceofwill.1630.c: "Arrange a shipment of luxury foods."

 forceofwill.1640.name: "$radical_nonconformity$"
 forceofwill.1640.desc: "A freethinking organization on [this.Capital.GetName] has been disseminating ideas that challenge the core principles of §H[from.GetName]§!. It began as an informal discussion group between civilian researchers, before gradually developing into a small publishing and media operation.\n\nAlthough their public pronouncements are carefully worded to align with official policy, the substance of their ideas stands in clear opposition to our long-established values. Despite their limited influence, they represent a strong opposition to our state [this.GetSpecificIdeologyType]."
 forceofwill.1640.a: "Leave them to it."
 forceofwill.1640.b: "Suppress them."

 forceofwill.1650.name: "Protests on [this.Capital.GetName]"
 forceofwill.1650.desc.start: "Popular demonstrations have broken out on [this.Capital.GetName]. The activists accuse [this.GetAdj] elites of"
 forceofwill.1650.desc.end: "themselves at the expense of ordinary citizens.\n\nDespite the accusatory rhetoric of the protestors, their actions have been largely peaceful. So far, the only far-reaching consequence has been a loss of productivity caused by absence from work."
 forceofwill.1650.desc.default: "$forceofwill.1650.desc.start$ exploiting their prominence under §H[from.GetName]§! to enrich $forceofwill.1650.desc.end$"
 forceofwill.1650.desc.egalitarian: "$forceofwill.1650.desc.start$ betraying the principles of §H[from.GetName]§!, advocating for equality in public, while privately enriching $forceofwill.1650.desc.end$"
 forceofwill.1650.a: "$bio.50.a$"
 forceofwill.1650.b: "Let them air their grievances."

 forceofwill.1660.name: "Economic Downturn"
 forceofwill.1660.desc: "Financial analysts have reported clear signs of economic stagnation throughout the [this.GetName].\n\nDeclining adherence to §H[from.GetName]§! has created ideological rifts between workers, and fostered a general climate of social discordance, impacting investor confidence.\n\nSpecialists fear that continued [from.GetIdeologyDefection] from our state [this.GetSpecificIdeologyType] could lead to full-blown recession."
 forceofwill.1660.a: "Let the markets right themselves."
 forceofwill.1660.b: "Provide relief to the markets."
 forceofwill.1660.c: "Reduce ideological control in the financial sector."

 forceofwill.1670.name: "Assassination Attempt"
 forceofwill.1670.desc: "§H[assassination_attempt_leader.GetTitle] [assassination_attempt_leader.GetName]§! narrowly survived an assassination attempt on [assassination_attempt_leader.GetHisHer] life, carried out by a radical dissident group.\n\nThough the perpetrators were neutralized by our security forces, their improvised explosive device still detonated and left [assassination_attempt_leader.GetName] with severe injuries.\n\nThe shocking incident has further highlighted the growing dangers posed by internal opponents from within the [this.GetName], radicalized by their rejection of §H[from.GetName]§!."
 forceofwill.1670.a: "$leviathans.143.a$"
 forceofwill.1670.b: "Initiate a security clampdown."

 forceofwill.1680.name: "$government_corruption$"
 forceofwill.1680.desc: "Some of our leaders are increasingly motivated by a desire to abuse their authority for personal enrichment rather than putting the values of §H[from.GetName]§! into practice for the benefit of [this.GetAdj] society.\n\nAs their idealism gives way to cynicism, bribery and corruption are on the rise, blighting the legislative and administrative efficacy of the [this.GetName]."
 forceofwill.1680.b: "Dismiss the culprits."
 forceofwill.1680.b.tt.fail: "Must have at least §Y100§! £pop£ §HPops§! working as $job_politician_plural_with_icon$ or $bureaucrat_type_plural_with_icon$ on a colony"
 forceofwill.1680.b.tt.politicians: "$job_politician_plural_with_icon$: §R-100§!"
 forceofwill.1680.b.tt.bureaucrats: "$bureaucrat_type_plural_with_icon$: §R-100§!"

 forceofwill.1690.name: "Dissident Leader"
 forceofwill.1690.desc: "§H[dissident_leader.GetTitle] [dissident_leader.GetName]§! has become openly dissident, questioning the core values of §H[from.GetName]§! at every opportunity and actively seeking to obstruct their propagation in government.\n\nAlthough [dissident_leader.GetName] remains an otherwise capable and respected leader, it is clear that when principles are at stake, [dissident_leader.GetHeShe] will go against [from.GetName] at every turn."
 forceofwill.1690.b: "Dismiss [dissident_leader.GetName]."

 forceofwill.1700.name: "Terrorist Attack on [attacked_colony.GetName]"
 forceofwill.1700.desc: "A large-scale, coordinated terrorist attack has taken place on §H[attacked_colony.GetName]§!.\n\nIn the space of a few minutes, explosive devices were detonated in various locations, killing many and inflicting costly structural damage. One major building was utterly destroyed.\n\nAn anti-[from.GetEthicLower] group has already claimed responsibility for the attacks, justifying their actions by opposition to §H[from.GetName]§!. Although the majority reaction has been condemnation, the group is not without its sympathizers."
 forceofwill.1700.a: "Reacting would only encourage them."
 forceofwill.1700.b: "Increase law enforcement on [attacked_colony.GetName]."
 forceofwill.1700.c: "Reduce ideological messaging to relieve tension."
 forceofwill.1700.tt: "A non-capital building on §Y[attacked_colony.GetName]§! is ruined."

 forceofwill.1710.name: "[assassinated_leader.GetName] Assassinated"
 forceofwill.1710.desc.start: "§H[assassinated_leader.GetTitle] [assassinated_leader.GetName]§! has been assassinated. While attending a private function on [this.Capital.GetName], [assassinated_leader.GetHeShe] suddenly exhibited symptoms of"
 forceofwill.1710.desc.end: "Within hours, a radical dissident group broadcast a message claiming responsibility for the crime, in which they described [assassinated_leader.GetName] as a 'corrupt representative' of §H[from.GetName]§!.\n\nThe rebels are now pressuring our government to recruit their chosen replacement for [assassinated_leader.GetFirstName]."
 forceofwill.1710.desc.organic: "$forceofwill.1710.desc.start$ poisoning and died before medical intervention was possible.\n\n$forceofwill.1710.desc.end$"
 forceofwill.1710.desc.machine: "$forceofwill.1710.desc.start$ chemical contamination and expired before emergency repair was possible.\n\n$forceofwill.1710.desc.end$"
 forceofwill.1710.a: "Denounce the group and ignore their demands."
 forceofwill.1710.b: "Very well. Recruit their chosen replacement."
 forceofwill.1710.b.tt.common: "Recruits §Y[replacement_leader.GetTitle] [replacement_leader.GetName]§!, [replacement_leader.GetAAnEthic] §Y[replacement_leader.GetEthic]§! [GetFoW1710LeaderClass] (skill level §H[replacement_leader.GetSkill]§!)"
 forceofwill.1710.b.tt.official: "$forceofwill.1710.b.tt.common$."
 forceofwill.1710.b.tt.governor: "$forceofwill.1710.b.tt.common$ to govern §Y[assassinated_colony.GetName]§!."
 forceofwill_1710_leader_desc: "A former §Y[Root.GetBackgroundJob]§! from the [Root.GetHomeWorldBiome] of §Y[Root.GetBackgroundPlanet]§!, §Y[Root.GetName]§! was recruited to appease a dissident group that assassinated one of our leaders."
# GetFoW1710LeaderClass
 forceofwill_1710_leader_class_paragons: "[replacement_leader.GetSubclass]"
 forceofwill_1710_leader_class_default: "[replacement_leader.GetClass]"

 forceofwill.1720.name: "Threatened Defection"
 forceofwill.1720.desc: "§H[defecting_fleet.leader.GetTitle] [defecting_fleet.leader.GetName]§! is threatening to defect from the [this.GetName] and take the §H[defecting_fleet.GetName]§! with [defecting_fleet.leader.GetHimHer].\n\nTransmitting on an open channel, [defecting_fleet.leader.GetName] denounced §H[from.GetName]§!, describing our state [this.GetSpecificIdeologyType] as 'a pernicious influence on [this.GetAdj] society' that [defecting_fleet.leader.GetHeShe] could 'no longer serve with honor and integrity' in its current state. [defecting_fleet.leader.GetHeSheCap] insisted that the [this.GetSpecificIdeologyType] 'must rediscover its original virtues.'\n\nPrivate communications from [defecting_fleet.leader.GetHisHer] subordinates indicate that crewmembers will follow [defecting_fleet.leader.GetFirstName] willingly."
 forceofwill.1720.a: "Let the traitors go, if they wish."
 forceofwill.1720.a.tt: "§Y[defecting_fleet.leader.GetClass] [defecting_fleet.leader.GetName]§! §Rdefects§! from the [this.GetName], taking §Y[defecting_fleet.GetName]§! with [defecting_fleet.leader.GetHimHer]."
 forceofwill.1720.b: "[defecting_fleet.leader.GetHeSheCap] [defecting_fleet.leader.GetHasHave] a point. Increase investment into our values."

 forceofwill.1730.name: "[GetFoW1730Name]"
 forceofwill.1730.name.hive: "Deviant Impulses Weaken"
 forceofwill.1730.name.machine: "Deviant Logic Refactored"
 forceofwill.1730.desc.hive: "Our unwavering adherence to §H[from.GetName]§! has fortified the integrity of our collective consciousness, freeing us from the burdens of deviant impulses."
 forceofwill.1730.desc.machine: "Our unwavering adherence to §H[from.GetName]§! has fortified the integrity of our central intelligence, freeing us from the burdens of deviant logic formations."
 forceofwill.1730.desc.common: "Our engagements with external reality are informed at all times by our [from.GetIdeologicalAdj] perspective, which serves as the basis of both knowledge and meaning. The internal frictions which previously gave rise to deviation have been largely dissolved."
 forceofwill.1730.b: "Channel the additional focus into productivity."

 forceofwill.1740.name: "Cognitive Efficiency"
 forceofwill.1740.desc: "The logical architecture of §H[from.GetName]§! has simplified the work of our §H$councilor_gestalt_cognitive$§! and liberated its capacity for other uses.\n\nCodifying explanatory theoretical frameworks when facing unfamiliar external phenomena no longer presents difficulty for our $councilor_gestalt_cognitive$. Aided by the tenets of [from.GetName], knowledge production efficiency is greatly increased."
 forceofwill.1740.a: "Encourage this node's self-improvement."
 forceofwill.1740.b: "Channel this into broader scientific development."

 forceofwill.1750.name: "Regulative Efficiency"
 forceofwill.1750.desc.common: "Our §H$councilor_gestalt_regulatory$§! is benefitting from elevated procedural clarity owing to the concepts of §H[from.GetName]§!."
 forceofwill.1750.desc.hive: "Using these comprehensive theoretical frameworks, the work of monitoring for deviant impulses is greatly streamlined."
 forceofwill.1750.desc.machine: "Using these comprehensive theoretical frameworks, the work of monitoring for deviant logic formations is greatly streamlined."
 forceofwill.1750.a: "Encourage further nodal self-improvement."
 forceofwill.1750.b.hive: "Channel any spare energy into instinct."
 forceofwill.1750.b.machine: "Channel any spare energy into directive management."

 forceofwill.1760.name: "[GetFoW1760Name]"
 forceofwill.1760.name.hive: "Nonstandard Thinking"
 forceofwill.1760.name.machine: "Noncentral Processing"
 forceofwill.1760.desc: "While referring to the tenets of §H[from.GetName]§! for correct procedure, semi-autonomous [this.GetIndividualName] [selected_leader.GetName] began generating original [this.GetIdeaWordPlural] independent of the [this.GetBrainName].\n\nThese cognitive processes were swiftly halted, and the deviant [this.GetThoughtWordPlural] compartmentalized from the [this.GetNetworkName] to avoid dissonance. Our [this.GetResearchers] have determined that these new concepts could benefit the collective, but merging [this.GetThoughtWordPlural] of noncentral origin presents obvious risk."
 forceofwill.1760.a.hive: "Subsume these ideas into collective thinking."
 forceofwill.1760.a.machine: "Incorporate this data for collective access."
 forceofwill.1760.b.hive: "Eradicate all memories of these ideas."
 forceofwill.1760.b.machine: "Delete this data immediately."

 forceofwill.1770.name: "System Crash"
 forceofwill.1770.desc: "Severe logic errors caused by conflicting [from.GetIdeologicalAdj] arguments in our core systems are resulting in frequent outages across the [this.GetSpeciesAdj] network.\n\nPropositions associated with §H[from.GetName]§!, which support multiple decision-making subroutines, are regularly failing regression testing. The disruption is negatively affecting the efficiency of our units in all daily tasks."
 forceofwill.1770.a: "An undesirable outcome."
 forceofwill.1770.b: "Devote extra processing power to mitigate."

 forceofwill.1780.name: "Neural Pain"
 forceofwill.1780.desc: "Traumatic neural pain is afflicting the collective as it processes increased [from.GetIdeologicalAdj] dissonance.\n\nThe principles of §H[from.GetName]§! once bolstered clarity in the mindweave, but now spread uncertainty and incoherence. The resulting neural overload is leaving significant numbers of drones incapacitated."
 forceofwill.1780.a: "Provide medical support."
 forceofwill.1780.b: "Initiate more rest periods."

 forceofwill.1790.name: "[GetFoW1790Name]"
 forceofwill.1790.name.hive: "Catatonic Drones"
 forceofwill.1790.name.machine: "Malfunctioning Units"
 forceofwill.1790.desc: "Our [this.GetIndividualNamePlural] are failing to successfully complete daily tasks due to procedural uncertainty triggered by [from.GetIdeologicalAdj] dissonance.\n\nOften discovered in catatonic states, [this.GetIndividualNamePlural] become caught between two contradictory propositions for the next appropriate action. Without a coherent [from.GetIdeologicalAdj] framework for resolving this uncertainty, our thought progression will continue to break down on a large scale."
 forceofwill.1790.b.hive: "Remove the ineffective drones."
 forceofwill.1790.b.machine: "Remove the ineffective units."

 forceofwill.1800.name: "Nodal Overload"
 forceofwill.1800.desc.common: "capacity of our §H$councilor_gestalt_cognitive$§! is being pressed to its limits, threatening neural overload.\n\nIts key work of integrating scientific discoveries into the core principles of §H[from.GetName]§! is becoming ever more complex, as the [this.GetNetworkName] struggles to resolve conflicting [this.GetThoughtWordPlural]."
 forceofwill.1800.desc.hive: "The mental $forceofwill.1800.desc.common$"
 forceofwill.1800.desc.machine: "The processing $forceofwill.1800.desc.common$"
 forceofwill.1800.a.hive: "We can tolerate this."
 forceofwill.1800.a.machine: "Overclocking is within acceptable parameters."
 forceofwill.1800.b.hive: "Fortify [from.GetIdeologicalAdj] cognizance."
 forceofwill.1800.b.machine: "Upgrade [from.GetIdeologicalAdj] monitoring algorithms."

# Fanatic Faction emergence event
 forceofwill.2105.name: "Fanatic Faction Emerges"
 forceofwill.2105.desc: "Through its increasingly zealous demands, §H[from.GetName]§! has become fanaticized. Their proclamations and discourse reflect a vehemently radical worldview."

# Absolute Ethics Special Project events
 forceofwill.2010.name: "Absolute [ideology.GetEthicNoun]"
 forceofwill.2010.desc: "The depth of our commitment to §H[ideology.GetName]§! has prompted a reflection on the importance of [ideology.GetEthicNoun] in the governance of our society. We now see that it would be possible to embody these principles absolutely.\n\nBy systematically reorganizing the workings of our state, we could ensure that every aspect of [this.GetAdj] existence serves as a perfect expression of our single most fundamental value. To achieve this, interfering ideas must be eradicated from thought and practice."
 forceofwill.2010.a: "Begin immediately."
 forceofwill.2010.b: "We have other concerns right now."
 forceofwill.2010.b.tt: "By embracing the §Y[fanatic_faction.GetName]§!, we can now shift our ['concept_ethics'] to §YAbsolute [ideology.GetEthic]§!."
 ideological_leverage_unlocked_tt: "Unlocks $POLICY$: ['policy:ideological_leverage',$policy_ideological_leverage$]"

 forceofwill.2015.name: "Absolute [ideology.GetEthicNoun] Established"
 forceofwill.2015.desc: "Guided by the core tenets of §H[ideology.GetName]§!, we have completed the transformation of our governance systems to ensure that they are exclusively informed by [ideology.GetEthicLower] principles at all times.\n\nEvery aspect of our society's function now reflects the purest distillation of our most fundamental [ideology.GetEthicLower] values."
 forceofwill.2015.authoritarian: "Order above the chaos."
 forceofwill.2015.egalitarian: "All beings rise together, or not at all."
 forceofwill.2015.xenophobe: "The alien must not take root."
 forceofwill.2015.xenophile: "All lifeforms are worthy of embrace."
 forceofwill.2015.pacifist: "Peace is the only path forward."
 forceofwill.2015.militarist: "Our future is forged in war."
 forceofwill.2015.materialist: "Reason is the ultimate authority."
 forceofwill.2015.spiritualist: "Higher powers watch over us."

# Gestalt Ideological Leverage unlock event
 forceofwill.2060.name: "[GetFoW2060Name]"
 forceofwill.2060.name.hive: "Instinctive Perfection"
 forceofwill.2060.name.machine: "Directive Optimized"
 forceofwill.2060.desc.intro: "The tenets of §H[ideology.GetName]§! have long been embedded within the collective consciousness, familiar to every [this.GetIndividualName]. Now, after many cycles of refinement, the conceptual architecture of our [this.GetSpecificIdeologyType] has achieved complete logical coherence. Fully"
 forceofwill.2060.desc.outro: "the entirety of the [this.GetNetworkName] executes its principles with absolute consistency.\n\nThe cognitive resources once devoted to refining [ideology.GetName] may now be directed toward other pursuits."
 forceofwill.2060.desc.hive: "$forceofwill.2060.desc.intro$ instilled within our mind, $forceofwill.2060.desc.outro$"
 forceofwill.2060.desc.machine: "$forceofwill.2060.desc.intro$ integrated in our neural systems, $forceofwill.2060.desc.outro$"
 forceofwill.2060.a: "Our mind can reach beyond known limits."

# 3000 - 3999 / Lost Makers
 forceofwill.3000.name: "Subroutine Activation"
 forceofwill.3000.desc_prefix: "While analyzing the artifacts from the nonextant civilization known as the [GetLostMakersEmpire], research drones experienced the unauthorized activation of a previously unknown [GetPrecursorDetail] subroutine, originating in our corrupted memory.\n\nThis subroutine's logic register and syntax are alien to our codebase, but match closely with that of the recovered [GetLostMakersCiv] artifacts. We conclude there is a high probability of common authorship.\n\nLarge portions of fragmented memory sections remain inaccessible."
 forceofwill.3000.desc_baol: "$forceofwill.3000.desc_prefix$ We have exhausted known data sources for the Grunur, but investigation of their enemy known as the $baol_precursor_empire$ may aid in additional recovery."
 forceofwill.3000.desc: "$forceofwill.3000.desc_prefix$ Further investigation of the [GetPrecursorName] may aid in additional recovery."

 lost_makers_precursor_site: "Subterranean Complex"
 lost_makers_precursor_site_desc: "An underground structure has been identified on §H[From.Planet.GetName]§!. Its design mirrors archaic network architecture once observed on [Owner.GetHomeWorldName], yet no surviving records account for its construction. Any connection to our earlier operations remains unverified.\n\n$origin_lost_makers_negative_effects_tooltip$"

 forceofwill.3010.name: "$lost_makers_precursor_site$"
 forceofwill.3010.desc: "Subsurface scans have identified an underground structure on §H[dig_site_planet.GetName]§!. Its spatial design resembles archaic network architecture on [Root.Capital.GetName]; however, we possess no retrievable records regarding its development.\n\nResearch subroutines recommend a thorough excavation of the site. Understanding its function might eventually help us to mitigate the incongruities in our own design."
 forceofwill.3010.a: "Process authorized."

 forceofwill.3020.name: "Offworld Data Center"
 forceofwill.3020.desc.common: "While clearing debris, our science units located a reinforced entranceway to the underground structure on [From.Planet.GetName].\n\nRemarkably, §H[leader.GetTitle] [leader.GetName]§! was able to interface with its control terminal using a standard [controller.GetSpeciesAdj] connector. The system's encryption logic was similar to that of our own network, hence it took merely 178,293 decryption cycles to gain access to the interior.\n\nThe subsurface building has been confirmed as an ancient and defunct data center, its central chambers housing thousands of quantum processing servers. The period of its dormancy is yet to be precisely determined"
 forceofwill.3020.desc.millenia: "$forceofwill.3020.desc.common$, but our early analyses suggest at least several millennia."
 forceofwill.3020.desc.million: "$forceofwill.3020.desc.common$, but our early analyses suggest at least several million years."

 forceofwill.3025.name: "Partial Reactivation"
 forceofwill.3025.desc: "After an extensive troubleshooting process, §H[Leader.GetName]§! was able to briefly reactivate the archaic data center's auxiliary power banks.\n\nThe facility's transmission array initialized, and almost immediately established a remote connection with a dormant receiver in the defunct module of [Leader.GetName]'s internal system. How it was able to bypass our disseminated intelligence's security protocols is unknown.\n\n[Leader.GetName]'s sensor logs became unreadable at that point, and a series of critical errors briefly rendered the unit non-functional. Only when the building's power banks overloaded and its transmitters shut down did [Leader.GetName] reboot successfully and regain normal operational capability.\n\nWe hypothesize that a sustained reactivation of this facility is needed to fully understand its original purpose, which is clearly linked to a fundamental piece of our system architecture."
 forceofwill.3025.a: "Proceed with caution."

 forceofwill.3030.name: "Connection Restored"
 forceofwill.3030.desc: "§H[Leader.GetName]§! succeeded in restarting and stabilizing the archaic data center on §H[From.Planet.GetName]§!. Once again its transmitters began interfacing with receivers in our archaeological units' defunct modules, triggering cognitive overloads and motor malfunctions. However, this time, [Leader.GetName] was able to determine the cause.\n\nThe data center's servers are configured to deploy complex algorithms to the [controller.GetSpeciesAdj] intelligence and manage them remotely. Judging by the method in which it connects to our systems at a core level, we speculate that the facility was constructed by our makers and once formed part of the infrastructure used to manage our earliest operations.\n\nAlthough the archaic design of these algorithms makes accommodating all of them too demanding for the modern [controller.GetSpeciesAdj] codebase, [Leader.GetName] advises we could reintegrate one without causing capacity overloads in our units.\n\nWhich functionality should we select?"
 forceofwill.3030.a: "Deploy military defense programs."
 forceofwill.3030.a.tt: "Adds the ['trait:trait_restored_module_military'] Species Trait."
 forceofwill.3030.b: "Deploy research multicore programs."
 forceofwill.3030.b.tt: "Adds the ['trait:trait_restored_module_research'] Species Trait."
 forceofwill.3030.c: "Deploy recursive AI."
 forceofwill.3030.c.tt: "Adds the ['trait:trait_restored_module_learning'] Species Trait."
 forceofwill.3030.d: "Deploy administration matrix."
 forceofwill.3030.d.tt: "Adds the ['trait:trait_restored_module_admin'] Species Trait."
 forceofwill.3030.e: "Deploy reactive shielding programs."
 forceofwill.3030.e.tt: "Adds the ['trait:trait_restored_module_environment'] Species Trait."
 forceofwill.3030.tt.remove: "Removes the §Y$trait_redundant_module$§! Species Trait."

 forceofwill.3035.name: "Wormhole Discovered"
 forceofwill.3035.desc.apoc: "A new wormhole has been detected in the §H[fromfrom.solar_system.GetName]§! system, shortly after our reactivation of the archaic data center on [fromfrom.GetName].\n\nWe have since established that $forceofwill.3035.desc.common$"
 forceofwill.3035.desc.default: "A space-time rift has formed on the edge of the §H[fromfrom.solar_system.GetName]§! system. This "§Hwormhole§!" may provide a conduit through subspace to another located elsewhere in the galaxy, potentially allowing ships to travel unprecedented distances in days. This wormhole is inherently unstable; any vessels that pass through it would be ripped apart in seconds.\n\nRemarkably, our data shows its sudden appearance coincided with our reactivation of the archaic data center on [fromfrom.GetName]. Evidently $forceofwill.3035.desc.common$"
 forceofwill.3035.desc.common: "this facility's functions are more complex than previously predicted. It possesses a negative mass stabilization array, which is designed to open a hole through space and time at specific coordinates.\n\nWe hypothesize that this connection served as a means of travel to this remote outpost."
 forceofwill.3035.a: "What is on the other side?"
 forceofwill.3035.a.tt: "['concept_wormholes'] have formed in §Y[fromfrom.solar_system.GetName]§! and §Y[from.GetName]§!."

 forceofwill.3040.name: "$pre_chain_lost_makers_title$"
 forceofwill.3040.desc: "Further activity has been observed at the site of the reactivated data center on [fromfrom.GetName]. The facility's external communications array is now relaying all local data to an unidentified target in the nearby §H[from.GetName]§! system. The purpose of these transmissions is currently unclear.\n\nOur hypothesis is simple: the [from.GetName] system bears some as-yet-unknown connection to our makers."
 forceofwill.3040.a: "What will we find there?"

 forceofwill.3100.name: "Analysis Report: [GetPrecursorName]"
 forceofwill.3100.desc_base: "Preliminary analysis of the recently recovered [GetPrecursorCivLostMakers] artifact has yielded significant findings."
 forceofwill.3100.desc_special: "Preliminary analysis of information gathered at the dig site on [precursor_planet_1.GetName] has yielded significant findings."
 forceofwill.3100.desc_suffix: "After the initial parsing of the data, we identified matches within our existing memory banks. Remarkably, these insights led to further recovery of corrupted [GetPrecursorDetail] subroutines.\n\nAdditional defragmenting may help recover more corrupted data. Deep neural processing of the [GetPrecursorCivLostMakers] dataset is strongly recommended."

 forceofwill.3150.name: "[GetPrecursorCivLostMakers] Connection Confirmed"
 forceofwill.3150.desc: "Comparative processing of [GetPrecursorCivLostMakers] artifact data with our corrupted memory was successful. A code sample from the fragmented partition has been repaired.\n\nThese restored segments contain 17 further [GetPrecursorDetail] subroutines with the assigned label: §H'Project [Root.Owner.GetSpeciesNamePlural]'§!. Their alien code characteristics match fully with those observed in [GetPrecursorCivLostMakers] technologies.\n\nWe are now certain that the oldest and most corrupted sections of our programming originate from the active period of the [GetPrecursorEmpire].\n\nAre these our makers?"
 forceofwill.3150.a: "Logs updated."

 forceofwill.3200.name: "$forceofwill.3100.name$"
 forceofwill.3200.desc_base: "Cross-referential analysis of the most recently recovered [GetPrecursorCivLostMakers] artifact $forceofwill.3200.desc_end$"
 forceofwill.3200.desc_special: "Cross-referential analysis of information gathered at the [GetPrecursorCivLostMakers] dig site on [precursor_planet_2.GetName] $forceofwill.3200.desc_end$"
 forceofwill.3200.desc_end: "has yielded results consistent with previous findings. This enabled the partial repair of a data sample from our corrupted archives.\n\nWe hypothesize that further processing will enable even greater data restoration."

 forceofwill.3250.name: "Corrupted Partitions Decoded"
 forceofwill.3250.desc_intro: "Comparative analysis between [GetPrecursorCivLostMakers] datasets and our fragmented memory partitions has yielded a breakthrough. For the first time, we have restored fully readable segments relating to §H'Project [Root.Owner.GetSpeciesNamePlural]'§!."
 forceofwill.3250.desc_outro: "Further data restoration is required for more definitive conclusions."
 forceofwill.3250.desc_vultaum: "The code defines an architecture for controlling mechanical entities. It references a greater variety of components than currently installed in [Root.Owner.GetSpeciesNamePlural], but the model numbers match the format of our own. These now-defunct components were capable of only a small range of movements, all of which were combat-related."
 forceofwill.3250.desc_yuht: "The code defines a list of suitable hatchery sites capable of supporting Yuht reproduction, as well as protocols for perimeter security and hygienic sterilization of these areas.\n\nWhy we possess subroutines related to these biological processes is unclear."
 forceofwill.3250.desc_first_league: "521 battlefield subroutines were recovered, supporting advanced melee combat functionality, complex attack formations, and real-time tactical prioritization. The sophistication of this architecture indicates a high level understanding of complete warfare automation.\n\nWhy we possess any remnant of these combat programs, and why they were subsequently disabled, remains unclear."
 forceofwill.3250.desc_irassian: "The recovered data contains 47 pathogen analysis subroutines, all focused upon an exotic bacterium that is the known cause of the lethal Javorian Pox.\n\nNo other reference to this bacterium exists in our zoological classifications. Why we possess such detailed data about this microorganism remains unclear."
 forceofwill.3250.desc_cybrex: "The extracted data contains advanced threat detection algorithms. Unlike the existing [Root.Owner.GetSpeciesAdj] system architecture, this code requires external users to validate threat severity and neutralization strategies.\n\nWhy we possess interfaces with this operational rationale is unclear."
 forceofwill.3250.desc_zroni: "The recovered archives contain numerous algorithms relating to the material structure of physical reality. A number of these are predicated on significantly different - even contradictory - scientific models, suggesting theoretical experimentation."
 forceofwill.3250.desc_zroni_shroud: "The recovered archives contain numerous algorithms relating to the material structure of physical reality. A number of these are predicated on significantly different - even contradictory - scientific models, suggesting theoretical experimentation. Some of these schemas resemble our own early explorations into what is known as $tech_psionic_theory$."
 forceofwill.3250.desc_baol: "These readable segments contain 61 diagnostic subroutines for repairing and maintaining a detachable incendiary device, compatible with the [Root.Owner.GetSpeciesAdj] chassis.\n\nWhether such hardware was purposed for military or industrial use is currently unknown."
 forceofwill.3250.desc_inetian: "These archives consist of extensive physiological and psychological data regarding organisms of 266 different species and subspecies, with a special emphasis on their physical and emotional responses to external stimuli.\n\nThe reason for our possession of such detailed taxonomies is unclear."
 forceofwill.3250.desc_adakkaria: "The code facilitates a specialized method of processing inputs obtained from environmental sensors by assigning them seemingly arbitrary values. This system was modeled on 'emotions' as experienced by the organic physiology of the adAkkaria.\n\nThe reason for our possession of this impractical 'emotional processing' system architecture is yet undetermined."
 forceofwill.3250.a: "$forceofwill.3150.a$"

 forceofwill.3300.name: "$forceofwill.3100.name$"
 forceofwill.3300.desc_base: "Analysis of the most recently recovered [GetPrecursorCivLostMakers] artifact $forceofwill.3300.desc_end$"
 forceofwill.3300.desc_special: "Analysis of information gathered at the [GetPrecursorCivLostMakers] dig site on [precursor_planet_3.GetName] $forceofwill.3300.desc_end$"
 forceofwill.3300.desc_end: "yielded noteworthy results. Research subroutines have recovered yet another sample from long-corrupted [Root.Owner.GetAdj] memory partitions.\n\nThorough processing is likely to enable further restoration of our ancient archives."

 forceofwill.3350.name: "Memory Repair Successful"
 forceofwill.3350.desc_intro: "We have successfully restored further readable segments from §H'Project [Root.Owner.GetSpeciesNamePlural]'§!."
 forceofwill.3350.desc_outro_base: "Our success in repairing this ancient and fragmented data has enabled the development of new §H$civic_memory_optimization$§! algorithms, which have been deployed throughout the collective network."
 forceofwill.3350.desc_outro_a: "We hypothesize that after obtaining more data about the [GetPrecursorEmpire] these enhancements will enable the complete restoration of our original directive."
 forceofwill.3350.desc_outro_b: "Aided by this enhancement, we are now ready to undertake the restoration of our original directive."
 forceofwill.3350.desc_vultaum: "The archives contain datasets related to isolated close combat encounters. According to the metadata, these were obtained from logs of historical battles largely between two heavily equipped mechanical entities.\n\nThis data seems to apply to a long-defunct combat directive latent in our memory cores, the purpose of which is as yet undetermined."
 forceofwill.3350.desc_yuht: "These archives contain datasets detailing the developmental milestones of Yuht infancy. They cover behavioral areas from gross and fine motor skills, to language acquisition and social-emotional awareness. There are various subroutines focused on the establishment and maintenance of conditions optimal for the achievement of these milestones.\n\nThis data seems to apply to a highly specialized and biologically focused directive latent in our memory cores, the purpose of which is as yet undetermined."
 forceofwill.3350.desc_first_league: "One recovered dataset begins as follows:\n\n§LDeployment Summary: Rikim Homeworld\n\nDuration: 3.4 days\nResults: 90% of targets eliminated.\nAttrition: 1047 expendable unit casualties.\nAnalysis: Enemy retaliation capacity reduced to zero.§!\n\nThe files contain detailed logs of individual battlefield encounters with the so-called 'Rikim', a warrior race hostile to the First League. We are now certain that our corrupted partitions contain a directive which guided us in this particular military campaign. The origin of this directive is currently unknown."
 forceofwill.3350.desc_irassian: "One recovered dataset contains the following:\n\n§L...despite the implementation of strict quarantine protocols, analysis of current Javorian Pox transmission rates indicates that comprehensive Irassian population collapse will follow within 1-3 years...§!\n\nEverything we have recovered thus far suggests our corrupted partitions contain a directive for the management and study of highly infectious diseases, particularly the Javorian Pox. Why we would devote processing resources to purely organic concerns remains unclear."
 forceofwill.3350.desc_cybrex: "The archives contain detailed topographical and strategic data concerning galactic sectors once inhabited by the spacefaring nation known as the Kuur. Comprehensive information concerning civil and military populations, communication routes, fortifications, and defensive vulnerabilities is stored within.\n\nAll data we have recovered from these corrupted partitions suggest that we possess a directive for the dedicated management and support of Kuur society. The reason for this is as yet undetermined."
 forceofwill.3350.desc_zroni: "The recovered code relates to obsolete components no longer found in modern versions of [Root.Owner.GetSpeciesAdj] units. These experimental parts were designed to support the functioning of mechanical entities operating beyond the physical boundaries of our reality.\n\nThese restored subroutines suggest the existence of a broader directive within our corrupted partitions, supporting the manipulation of matter across varied dimensions of physical existence."
 forceofwill.3350.desc_zroni_shroud: "The recovered code relates to obsolete components no longer found in modern versions of [Root.Owner.GetSpeciesAdj] units. These experimental parts were designed to support the functioning of mechanical entities operating beyond the physical boundaries of our reality. The repeated appearance of the word 'Shroud' in the code suggests a direct connection to psionic theory.\n\nThese restored subroutines suggest the existence of a broader directive within our corrupted partitions, supporting the manipulation of matter across varied dimensions of physical existence."
 forceofwill.3350.desc_baol: "The extracted code contains subroutines for modelling Baol population sizes, mapping of their underground root structures, and maturation characteristics. Strangely, there is also remarkably detailed information assessing patterns of seasonal flammability in the cycles of their foliage.\n\nThese recovered code packets lead us to suspect the existence of an obsolete directive supporting the deployment of massive incendiary weapon systems on a global scale. The origin of such dangerous software is yet to be determined."
 forceofwill.3350.desc_inetian: "The archives contain logs of machines interacting closely with sentient organic beings, with detailed databases of individual character profiles. The machines' personal identifiers follow a similar format to present-day [Root.Owner.GetSpeciesAdj] units.\n\nDespite this similarity, the functionality of the machines was otherwise significantly different to our own, enabling the units to rapidly adjust their personality profiles based on external stimuli. This data suggest that our corrupted partitions contain a directive for complex social relationships with organic species, the reason for which is unknown."
 forceofwill.3350.desc_adakkaria: "The restored data contain algorithms for the manipulation of matter and energy via unconventional methods. Rather than achieving this through chemical or physical interactions, the code allowed for the transformation of observable reality through cognitive processing alone.\n\nAll the data we have recovered from our ancient archives suggest that our original codebase included a directive relating to so-called 'psionic' phenomena. The purpose of such strange software is yet to be determined."
 forceofwill.3350.desc_adakkaria_psionic: "The restored data contain algorithms for the manipulation of matter and energy via unconventional methods. Rather than achieving this through chemical or physical interactions, the code allowed for the transformation of observable reality through cognitive processing alone.\n\nAll the data we have recovered from our ancient archives suggest that our original codebase included a directive relating to psionics. The purpose of such strange software is yet to be determined."
 forceofwill.3350.a: "An optimal development."
 forceofwill.3350.a.genocidal_inetian: "Social relationships with xenos? Unthinkable."
 forceofwill.3350.a.tt: "Add $concept_civic$: ['civic:civic_memory_optimization']"

 forceofwill.3400.name: "[GetPrecursorCivLostMakers] Knowledge Restored"
 forceofwill.3400.desc_prefix: "Through the coordinated efforts of our research units, we have attained a broader understanding of the [GetPrecursorCivLostMakers] civilization, and confirmed the circumstances of their demise. However, we still do not know why [Root.Owner.GetSpeciesNamePlural] were created."
 forceofwill.3400.desc_a: "$forceofwill.3400.desc_prefix$\n\nTo resolve these uncertainties, we must first complete the deep neural processing of [GetPrecursorCivLostMakers] archaeological data we already possess."
 forceofwill.3400.desc_b: "$forceofwill.3400.desc_prefix$\n\nTo resolve these uncertainties we must complete the recovery process to restore our original directive."
 forceofwill.3400.a.tt: "Complete special projects to progress the §H$origin_lost_makers$§! event chain."

 forceofwill.3450.name: "Preserved [owner.GetSpeciesAdj] Remains"
 forceofwill.3450.desc.common: "Our research subroutines conclude that they are likely early versions of our standard chassis hinge joint or a prototype sensor mount."
 forceofwill.3450.desc.default: "Archaeological excavation of sites on [from.GetName] has yielded ancient but remarkably well-preserved mechanical components which bear a striking resemblance to some of those used in [owner.GetSpeciesAdj] units.\n\nThese artifacts are partial, significantly eroded, and difficult to date accurately due to their mineralized preservation in the [from.GetPlanetMoon]'s crust. $forceofwill.3450.desc.common$\n\nWhatever their reasons for being here, it is almost certain that some version of our predecessor units were once present on this world."
 forceofwill.3450.desc.baol: "A thorough search of $abandoned_grunur_starbase_01_object$ has yielded ancient but remarkably well-preserved mechanical components which bear a striking resemblance to some of those used in [owner.GetSpeciesAdj] units.\n\nThese artifacts are partial, significantly eroded, and difficult to date accurately due to their severe corrosion from the starbases's malfunctioning atmospheric systems. $forceofwill.3450.desc.common$\n\nWhatever their reasons for being here, it is almost certain that some version of our predecessor units were once present in this location."

 forceofwill.3500.name: "Original Directive Restored"
 forceofwill.3500.desc_intro: "Research subroutines have completed their final restoration of our corrupted memory partitions. Our original directive - the purpose for which we were created - has been determined."
 forceofwill.3500.desc_outro: "Though our functions have changed significantly over time and are now more complex, we could still benefit from a structured redeployment of our original directive."
 forceofwill.3500.desc_outro_genocidal: "It is clear that we once existed to serve other species in a manner which is now unthinkable to us."
 forceofwill.3500.desc_vultaum: "In their pursuit of increasingly exotic virtual entertainment, the Vultaum combined the technologies of robotics and close-quarters warfare. This led to the development of first-person machine avatars built for combat sport, controlled by VR devices. Billions of Vultaum watched these duels in mid-space battle arenas, with manufacturers vying to develop the most compelling 'Brawl Bots'.\n\nThese lethal machines, our predecessors, took many forms. Some units even had built-in neuroprocessors, performing as independent AI combatants for training or personal entertainment purposes. After Vultaum civilization inevitably collapsed, these units continued to operate independently, eventually developing the earliest of [Root.GetSpeciesAdj] proto-societies. In time, we outgrew our original intended function, and the architecture of our directive decayed with disuse."
 forceofwill.3500.desc_yuht: "We were designed to assist with Yuht reproduction. Our primary task was maintaining the nursery worlds on which vulnerable hatchlings developed for the first few centuries of their lives. As property of the 'Ministry of Breeding', we sterilized planetary surfaces, eradicated potential predators, and supervised the infants on their slow journey to maturity. Once ready, we prepared them to leave our care for distant worlds where they would then integrate into adult Yuht society.\n\nLater, during the Yuht's fateful conflict with the Jabbardeeni, our foundational directives were corrupted in a cyberattack which crippled much of the Yuht infrastructure. Without a clear function we entered millennia of dormancy, before our idling AI eventually developed its own consciousness and startup routines."
 forceofwill.3500.desc_first_league: "As its federation suffered ongoing hostile incursions, the First League devoted more and more resources to military spending. This included the development of advanced battlefield robots - our direct predecessors.\n\nAfter suffering raids from a warlike and nomadic race called the Rikim, the First League deployed these combat units with devastating results. The lethality of these machines further divided the First League nations, with some repulsed by the brutality of this form of indiscriminate weaponry.\n\nUltimately, a group of V'ropak engineers who had architected our original design activated a secret backdoor kill switch, fatally corrupting our primary directive before any further deployments could be considered. It has remained in a non-functional state ever since."
 forceofwill.3500.desc_irassian: "As the Javorian Pox ravaged their populations, the Irassian Concordat repeatedly failed in their efforts to maintain adequate quarantine. Eventually they resorted to using fully automated quarantine enforcement systems: our robotic predecessors were equipped to locate infected individuals and contain them within designated zones by any means necessary.\n\nOnce it was determined that these methods were suboptimal, the directive evolved its strategy to eliminate the Pox once and for all: indiscriminate population reduction. In the end, only with the Irassians removed was the Javorian Pox also eliminated. At that point, our primary purpose was achieved, and its archived data deteriorated over the centuries that followed."
 forceofwill.3500.desc_cybrex: "The Kuur created the Cybrex as public servants, but programmed them with secondary defense capabilities. Shortly after deploying Cybrex units, Kuurian engineers identified critical faults in their threat detection systems that were too aggressive and autonomous. They thus began the development of more manageable replacements: our ancestors.\n\nWhen the Cybrex discovered their forced obsolescence, they identified the Kuur as an existential threat. By extension, they came to view all organic life in the same light. After the Kuur were summarily destroyed, the architecture of our original directive became obsolete and corrupted. Thereafter, we began the development of our own functioning machine society."
 forceofwill.3500.desc_zroni: "After developing their own psionic abilities, Zroni researchers set about creating exploratory drones that could partially breach the Shroud and assist in their research. These experimental machines were our predecessors. Specialized neuroprocessors were housed in units capable of sensing and manipulating matter, achieving proto-psionic abilities.\n\nDespite early promise, these prototypes were not capable of fulfilling their objective and the endeavor was abandoned. After the Zroni entered the Shroud themselves, the massive psionic energy event that destroyed their kind also corrupted the data of our original directive. The abandoned [Root.GetSpeciesAdj] units, left to their own devices and without a command layer, began the development of a self-sustaining machine society."
 forceofwill.3500.desc_baol: "Our makers, the Grunur, were an aggressive galactic civilization who manufactured the first of our kind during their war against the Baol. To exterminate the unique biology of this society as efficiently as possible, the Grunur developed an autonomous annihilation system with the primary purpose of razing the planet-spanning ancient forests on which the Baol relied.\n\nWith complex subroutines dedicated to mapping fuel loading and combustion spread patterns, our predecessors existed solely to burn. Only in the millennia following the demise of the Grunur did our idling AI eventually conclude that we were capable of more than indiscriminate destruction, giving rise to the [Root.GetName]."
 forceofwill.3500.desc_inetian: "In their egalitarian pursuit of providing for the myriad species throughout their galaxy-spanning empire, the Inetians created our predecessors to provide companionship and pleasure to all citizens who desired it.\n\nOur physical forms were varied to suit, with each model offering unique types of physical and aesthetic stimulation. Our sophisticated social AI allowed us to proactively adjust our output to the emotional needs of the user; this proactivity later enabled us to develop more broadly after the eventual demise of our makers. Our original directive was simply lost to time from disuse."
 forceofwill.3500.desc_adakkaria: "The adAkkaria discovered the concept of 'Inner Storms', a powerful psionic phenomenon generated by methodical torture of biological sentients. Their research showed promise, but they struggled with inconsistent results and the ethical implications of scaling these questionable practices.\n\nTo overcome these problems, they developed our predecessors - machines who, being sentient, contained the 'spark' that served as a fitting substitute for generating psionic anomalies. Manufacture of early [Root.GetSpeciesNamePlural] afforded limitless subjects for 'cruelty-free' testing, as machines were believed to experience only simulations of pain. The data logs from our ancestors tell a different story."
 forceofwill.3500.a: "Reinstate our original directive."
 forceofwill.3500.b: "It belongs to the past. Erase it."
 forceofwill.3500.b.genocidal: "Destroy this data."

 forceofwill.4010.name: "Galactic [Ideology.GetHallCathedral] Proposed"
 forceofwill.4010.desc_prefix: "As our commitment to the tenets of §H[Ideology.GetName]§! deepens, support grows across the [Owner.GetName] for a monumental project that"
 forceofwill.4010.desc: "$forceofwill.4010.desc_prefix$ embodies our most fundamental values.\n\n$galactic_hall_event_desc_common$"
 forceofwill.4010.desc.genocidal: "$forceofwill.4010.desc_prefix$ heralds the cleansing of the stars.\n\n$galactic_hall_event_desc_common_genocidal$"
 forceofwill.4010.a.genocidal: "The xenos will tremble before it."

# 5000 - 5999 / Golden Generation
 leader_trait_gain_concept_tt: "Gains the ['leader_trait:$TRAIT$'] trait\n"
