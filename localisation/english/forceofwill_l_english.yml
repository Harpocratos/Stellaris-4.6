#==========================
# Concepts
#==========================

 concept_ideology: "$IDEOLOGY_CAP$"
 concept_ideologies: "$IDEOLOGY_CAP_PLURAL$"
 concept_ideology_desc: "An §H$concept_ideology$§! is a system of ideas associated with a particular ['concept_ethic']. Information about known $IDEOLOGY_LOWER_PLURAL$ throughout the galaxy can be accessed in the £interface£ $IDEOLOGY_PLURAL$ view.\n\nAn empire can choose to adopt an official $IDEOLOGY_LOWER$, whether it emerges from within or from a foreign source, and galactic adherence is measured by the number of £pop£ ['concept_pops'] following an $IDEOLOGY_LOWER$. Its principal values are codified as §H$TENET_PLURAL$§!, which are selected by the §H$ideological_custodian_default$§! and have unique effects upon adopting empires.\n\nOnce an $IDEOLOGY_LOWER$ is officially adopted by an empire, its influence can spread beyond borders and affect the ethics of $pops_with_icon$ of foreign empires."

 concept_ideology_momentum: "$IDEOLOGY_CAP$ $IDEOLOGY_MOMENTUM$"
 concept_ideology_momentum_desc: "§H$concept_ideology_momentum$§! measures the recent change in the strength of an ['concept_ideology'] within an empire. It can be positive or negative.\n\nPositive momentum reflects a society growing more aligned with its ideals, while negative momentum indicates disagreement, uncertainty, or even internal conflict.\n\nNegative momentum makes an $IDEOLOGY_LOWER$ harder to maintain and, if left unchecked, can lead to serious problems, including revolts."

 concept_ideological_reach: "$IDEOLOGICAL_REACH$"
 concept_ideological_reach_desc: "§HReach§! measures how effectively an ['concept_ideology'] spreads from one £system£ ['concept_system'] to its neighbors.\n\nIt represents the projection of ideas and cultural values both within an empire and beyond its external borders, converting individualistic £pop£ ['concept_pops'] into §Hfollowers§! of an $IDEOLOGY_LOWER$ or causing £crime£ §HDeviancy§! among gestalt $pops_with_icon$.\n\nReach is affected by §HReach Resistance and Push§!, which reflects how receptive a system is to new ideals and ways of thinking. \n\nOnly one ideological reach can affect a system's $pops_with_icon$ at a time. If the reach of two or more ideologies comes into contact, there is a §Hclash§! to determine which is strongest."

 concept_galactic_hall: "$galactic_halls$"
 concept_galactic_halls: "$megastructures_galactic_halls$"
 concept_galactic_hall_desc: "A §H$concept_galactic_hall$§! is a mobile £megastructure£ ['concept_megastructure'] dedicated to spreading and strengthening an ['concept_ideology'].\n\nA $concept_galactic_hall$ increases the ['concept_ideological_reach'] of the system where it is stationed, providing a wide range of additional benefits to any colony it orbits. It can be moved to any location within an empire's internal borders.\n\n$concept_galactic_halls$ can be upgraded with the construction of specialized modules reflecting various ['concept_ethics'], excluding those directly opposed to an empire's fundamental values."

 concept_ideological_strength_sources: "$IDEOLOGY_STRENGTH$ Sources"
 concept_ideological_strength_sources_desc: "§E$GALACTIC_STRENGTH$:§![GetIdeologySourceGalacticStrength]$TABBED_NEW_LINE$Per percent of Followers living in our empire: §G+$@ideology_strength_population_share_mult|0$%§!\n\n§E$IDEOLOGICAL_STRENGTHENING$:§!\nPer Clashing $IDEOLOGY$: §G+$@ideology_strength_per_clash|2$§!$TABBED_NEW_LINE$If Rival $IDEOLOGY_CAP$: §G+[GetIdeologyRivalClashBonus]%§!\nPer $IDEOLOGY$ Building: §G+$@building_ideological_strength|1$§!\n$galactic_halls$ Orbiting a Colony: §G+$@ideology_strength_per_galactic_hall|1$§![GetIdeologySourceAdvocate][GetIdeologySourceSocialConcord][GetIdeologySourceFanaticPurifiers][GetIdeologySourceOpenStars]\n$resolution_ideology_act$ Resolution: §G+$@resolution_ideology_act_strength|2$§!$TABBED_NEW_LINE$If $IDEOLOGY$ Authority: §G+[GetIdeologyActAuthorityBonus]%§!\nPer 100 $POPS$ Celebrating the $IDEOLOGY_CAP$: §G+$@ideology_strength_per_100_celebrating_pops|3$§![GetIdeologySourceLowDeviancy][GetIdeologySourceFanaticFaction]\n\n§E$IDEOLOGICAL_FRICTION$:§!\nPer current $IDEOLOGY_STRENGTH$ point: §R-$@ideology_strength_malus_level_rate|3$§![GetIdeologySourceEmpireSize][GetIdeologySourceForeignPop][GetIdeologySourceLowFanaticFaction][GetIdeologySourceHighDeviancy]\n$IDEOLOGY$ Denounced: §R-$@denounced_ideology_malus_value|1$§!\n\nWhile §RAbandoning§!: §R$@ideology_strength_malus_abandoning|0$§! per month, ignoring every source above."

 ideology_source_advocate: "\nPer $ADVOCATE_TITLE$ skill: §G+$@ideology_strength_advocate_per_skill|1$§!"
 ideology_source_galactic_strength: "\nPer $GALACTIC_STRENGTH$ percent: §G+$@ideology_strength_per_galactic_strength_share|1$§!"
 ideology_source_galactic_strength_gestalt: "\nPer $GALACTIC_STRENGTH$ percent: §G+$@ideology_strength_per_galactic_strength_share_gestalt|4$§!"
 ideology_source_low_deviancy: "\nPer 100 $POPS$ with Colony [GetCrimeDeviancy] under $@ideology_low_deviancy_threshold|0$: §G+$@ideology_strength_per_100_pops_low_deviancy|3$§!"
 ideology_source_high_deviancy: "\nPer 100 $POPS$ per Colony [GetCrimeDeviancy] over $@ideology_high_deviancy_threshold|0$: §R-$@ideology_strength_per_100_pops_per_high_deviancy|4$§!"
 ideology_source_fanatic_faction: "\nPer Ideological Faction Approval over 50%: §G+[GetIdeologyFanaticFactionStrength]%§!"
 ideology_source_social_concord: "\nDuring $civic_social_concord$ Galactic Peace: §G+$@social_concord_ideological_strength|1$§!"
 ideology_source_fanatic_purifiers: "\nPer Purged Pop: §G+$@fanatic_purifiers_ideological_strength_per_pop_purged|4$§!, up to §G+2§!"
