 menp_force_of_will_ethical_authority_unlock_tt: "Unlocks Casus Belli: §H$casus_belli_cb_ideological_subjugation$§!\n"
 menp_force_of_will_cultural_envoys: "$cultural_envoy_ship_plural$"
 menp_force_of_will_cultural_envoys_desc: "Our emissaries carry the spirit of our people into the stars."
 menp_force_of_will_galactic_awareness: "Galactic Awareness"
 menp_force_of_will_galactic_awareness_desc: "Knowledge of the wider galaxy guides our decisions."
 menp_force_of_will_manifest_destiny: "Manifest Destiny"
 menp_force_of_will_manifest_destiny_desc: "Expansion is not only our ambition, it is our destiny."
 menp_force_of_will_golden_age: "Golden Age"
 menp_force_of_will_golden_age_desc: "We stand at the height of prosperity and achievement."
 menp_force_of_will_preparation: "Preparation"
 menp_force_of_will_preparation_desc: "Vigilance and discipline keep us prepared for all possible futures."
 menp_force_of_will_proselytization: "Proselytization"
 menp_force_of_will_proselytization_desc: "We seek to share our truth with all who will listen."
 menp_force_of_will_codification: "Codification"
 menp_force_of_will_codification_desc: "Order is preserved through clear and enduring law."
 menp_force_of_will_negotiation: "Negotiation"
 menp_force_of_will_negotiation_desc: "We achieve through dialogue what others attempt through war."
 menp_force_of_will_negotiation_unlock_tt: "Unlocks §H$operation_convert_fleet$§! Espionage Operation\n"
 menp_force_of_will_dominion: "Dominion"
 menp_force_of_will_dominion_desc: "Our ethical authority extends wherever our banner flies."
 force_of_will_dominion_unlock_tt: "§H$tech_jump_drive_1$§! and §HCloaking§! tech research progress gained: §G+50%§!\n"
 menp_force_of_will_utopian: "Utopian [Ideology.GetEthicNoun]"
 menp_force_of_will_utopian_desc: "[GetFoWUtopianDesc]"
 menp_force_of_will_utopian_desc_egalitarian: "A united galaxy will guarantee dignity and opportunity for all."
 menp_force_of_will_utopian_desc_pacifist: "At last, the galaxy will know an age without war."
 menp_force_of_will_utopian_desc_xenophile: "Every species will have a place within our shared galactic future."
 menp_force_of_will_utopian_desc_materialist: "Science and progress will unite the galaxy in a new age of reason."
 menp_force_of_will_utopian_desc_spiritualist: "The galaxy will be united beneath a higher truth."
 force_of_will_utopian_unlock_tt: "[Ideology.GetName] Building Upkeep: §G-100%§!\n"
 menp_force_of_will_unification: "Unification"
 menp_force_of_will_unification_desc: "Divided peoples become stronger under a common purpose."
 force_of_will_unification_unlock_tt: "§H[Ideology.GetName]§! achieves its goals if $@fow_ambition_win_galactic_strength_needed|Y0%$ of the Galaxy adopts it and all wars with $concept_fallen_empires$ opposed to it are ended.\nDamage from Followers of §H[Ideology.GetName]§! against $concept_fallen_empires$ per $GALACTIC_STRENGTH$: §G+1%§!"

# Ambition Special Projects / Event Chain
 FORCE_OF_WILL_SPECIAL_PROJECT_1: "Spreading Our Message"
 FORCE_OF_WILL_SPECIAL_PROJECT_1_DESC: "[GetFoWProject1Desc]"
 FORCE_OF_WILL_SPECIAL_PROJECT_1_DESC_DEFAULT: "Across the galaxy, countless minds navigate their existence needlessly unaware of the fundamental truths which have elevated our society to greatness.\n\nOur first priority must be to raise awareness of the core principles of §H[Ideology.GetName]§!, from which the [Root.GetName] benefits daily."
 FORCE_OF_WILL_SPECIAL_PROJECT_1_DESC_SPIRITUALIST: "Across the galaxy dwell countless souls who have yet to even glimpse the sacred truths of §H[Ideology.GetName]§!. Bereft of such guidance, they wander through existence without higher purpose.\n\nWe must bring them enlightenment and show them that the blessings we enjoy in the [Root.GetName] need not be ours alone."
 FORCE_OF_WILL_SPECIAL_PROJECT_2: "[GetFoWProject2Name]"
 FORCE_OF_WILL_SPECIAL_PROJECT_2_DEFAULT: "Education Campaigns"
 FORCE_OF_WILL_SPECIAL_PROJECT_2_SPIRITUALIST: "Missionary Work"
 FORCE_OF_WILL_SPECIAL_PROJECT_2_DESC: "[GetFoWProject2Desc]"
 FORCE_OF_WILL_SPECIAL_PROJECT_2_DESC_DEFAULT: "Entrenched values and long-held doctrines make our neighboring star nations resistant to new ideas.\n\nIf we are to successfully enlighten others, we must act boldly to overcome these barriers to progress."
 FORCE_OF_WILL_SPECIAL_PROJECT_2_DESC_SPIRITUALIST: "Entrenched values and long-held beliefs make our neighboring star nations resistant to our message.\n\nIf we are to successfully bring others into our faith, we must act boldly to overcome these barriers to progress."
 FORCE_OF_WILL_SPECIAL_PROJECT_3: "Deepening Convictions"
 FORCE_OF_WILL_SPECIAL_PROJECT_3_DESC: "While the tenets of §H[Ideology.GetName]§! take root in new minds across the galaxy, such newfound convictions remain fragile and easily shaken.\n\nWe must lead by example and demonstrate for all to see what it truly means to live according to the values of [Ideology.GetEthicNounLower] - in both thought and deed, at all times."
 FORCE_OF_WILL_SPECIAL_PROJECT_4: "[GetFoWProject4Name]"
 FORCE_OF_WILL_SPECIAL_PROJECT_4_DEFAULT: "Galactic Fellowship"
 FORCE_OF_WILL_SPECIAL_PROJECT_4_SPIRITUALIST: "Galactic Congregation"
 FORCE_OF_WILL_SPECIAL_PROJECT_4_DESC: "[GetFoWProject4Desc]"
 FORCE_OF_WILL_SPECIAL_PROJECT_4_DESC_INTRO: "Across the galaxy, entire legal and political systems are beginning to reflect our fundamental principles, as [Ideology.GetEthicLower] values become embedded within every level of our neighboring societies.\n\nIn time, the teachings and practices of §H[Ideology.GetName]§! come to be regarded as natural and self-evident, strengthening the resolve of our"
 FORCE_OF_WILL_SPECIAL_PROJECT_4_DESC_OUTRO: "Yet we must press onward with even greater determination, for many still remain beyond the reach of our ideals, and it is they who stand to benefit from them most.\n\n§RWarning: Advancing to the final stage of our Ambition will cause $concept_fallen_empires$ that do not share our ethic to declare war.§!"
 FORCE_OF_WILL_SPECIAL_PROJECT_4_DESC_DEFAULT: "$FORCE_OF_WILL_SPECIAL_PROJECT_4_DESC_INTRO$ newfound partners.\n\n$FORCE_OF_WILL_SPECIAL_PROJECT_4_DESC_OUTRO$"
 FORCE_OF_WILL_SPECIAL_PROJECT_4_DESC_SPIRITUALIST: "$FORCE_OF_WILL_SPECIAL_PROJECT_4_DESC_INTRO$ fellow believers.\n\n$FORCE_OF_WILL_SPECIAL_PROJECT_4_DESC_OUTRO$"

 force_of_will_level_2_req_clear_tooltip: "£trigger_yes£ Has completed the §H$FORCE_OF_WILL_SPECIAL_PROJECT_1$§! ['concept_special_project']"
 force_of_will_level_2_req_tooltip: "£trigger_no£ Has completed the §H$FORCE_OF_WILL_SPECIAL_PROJECT_1$§! ['concept_special_project']"
 force_of_will_level_3_req_clear_tooltip: "£trigger_yes£ Has completed the §H$FORCE_OF_WILL_SPECIAL_PROJECT_2$§! ['concept_special_project']"
 force_of_will_level_3_req_tooltip: "£trigger_no£ Has completed the §H$FORCE_OF_WILL_SPECIAL_PROJECT_2$§! ['concept_special_project']"
 force_of_will_level_4_req_clear_tooltip: "£trigger_yes£ Has completed the §H$FORCE_OF_WILL_SPECIAL_PROJECT_3$§! ['concept_special_project']"
 force_of_will_level_4_req_tooltip: "£trigger_no£ Has completed the §H$FORCE_OF_WILL_SPECIAL_PROJECT_3$§! ['concept_special_project']"
 force_of_will_level_5_req_clear_tooltip: "£trigger_yes£ Has completed the §H$FORCE_OF_WILL_SPECIAL_PROJECT_4$§! ['concept_special_project']"
 force_of_will_level_5_req_tooltip: "£trigger_no£ Has completed the §H$FORCE_OF_WILL_SPECIAL_PROJECT_4$§! ['concept_special_project']"

 force_of_will_chain_title: "[GetFoWChainTitle]"
 force_of_will_chain_desc: "[GetFoWChainDesc]"
 force_of_will_chain_desc_default: "Strengthened by the [Ideology.GetEthicLower] values of §H[Ideology.GetName]§!, we are prepared to engineer a true galactic utopia.\n\nThe societal prosperities we enjoy could be shared by all, if only they will open their minds to these fundamental principles. It falls upon us to educate our neighboring star nations in this pursuit of universal [Ideology.GetFoWIdeal].\n\nThe very survival of the galaxy hangs in the balance."
 force_of_will_chain_desc_spiritualist: "The spiritual salvation of the galaxy is at stake.\n\nStrengthened by the values of §H[Ideology.GetName]§!, we are ready to spread the message of our faith across the stars.\n\nThe blessings we enjoy could be shared by all, if only they will open their minds to these divine truths. The fate of many depends upon it; we will not fail them."

 NAME_IDEOLOGICAL_WAR: "$Ideological_War$"
 NAME_IDEOLOGICAL_WAR_PLURAL: "Ideological Wars"

# Ambition Objectives
 crisobj_convert_pops_name: "Convert $POPS$"
 crisobj_convert_pops_desc: "[GetFoWConvertPopsDesc]"
 crisobj_convert_pops_desc_intro: "It is our duty to bring all citizens of the galaxy into our"
 crisobj_convert_pops_desc_outro: "Only then can the benefits of our [GetSpecificIdeologyType] be enjoyed by all.\n\n§YConvert§! pops to §Y[Ideology.GetName]§! to gain this $willpower$ reward."
 crisobj_convert_pops_desc_default: "$crisobj_convert_pops_desc_intro$ way of thinking. $crisobj_convert_pops_desc_outro$"
 crisobj_convert_pops_desc_spiritualist: "$crisobj_convert_pops_desc_intro$ faith. $crisobj_convert_pops_desc_outro$"
 crisobj_vassalise_empires_forceofwill_name: "Vassalize Empires"
 crisobj_vassalise_empires_forceofwill_desc: "Bringing an entire society under our guidance is the surest way to ensure they reap the rewards of our [GetSpecificIdeologyType].\n\n§YVassalize§! empires to gain this $willpower$ reward."
 crisobj_have_vassals_forceofwill_name: "Retain Vassals"
 crisobj_have_vassals_forceofwill_desc: "Retaining the loyalty of societies that rely upon our guidance is paramount. Only through prolonged association can the true benefits of [Ideology.GetIdeologicalAdj] exchange be realized.\n\nRetain §YVassals§! to gain this §Yannual§! $willpower$ reward."
 crisobj_positive_ideological_strength_gain_name: "Have Positive $IDEOLOGY_STRENGTH$ Gain"
 crisobj_positive_ideological_strength_gain_desc: "If we are to spread our values to others, we must first ensure our own commitment remains unwavering.\n\nEvery §Ymonth§! we gain $willpower$ equal to our monthly §H$IDEOLOGY_STRENGTH$§! gain, rounded up."
 crisobj_win_ideological_war_name: "Win an $NAME_IDEOLOGICAL_WAR$"
 crisobj_win_ideological_war_desc: "Powers of persuasion have their limits. Sometimes, necessary change must be imposed by force. Those who most stubbornly obstruct our progress will have to learn the hard way.\n\nWin an §Y$NAME_IDEOLOGICAL_WAR$§! to gain this $willpower$ reward."

