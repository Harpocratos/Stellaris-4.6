#==========================
# Factions
#==========================

 ideological_faction: "Ideological Faction"
 ideological_faction_plural: "Ideological Factions"

 pft_ideological_faction_materialist: "$ethic_materialist$ $ideological_faction$"
 pft_ideological_faction_materialist_desc: "$ethic_materialist$ $ideological_faction_plural$ are devoted to scientific progress and state support of research institutions. They promote a rationalist worldview that permits no concessions to religious dogma and superstition.\n\n§L$ethic_fanatic_materialist$ Ethos§!"

 pft_ideological_faction_spiritualist: "$ethic_spiritualist$ $ideological_faction$"
 pft_ideological_faction_spiritualist_desc: "$ethic_spiritualist$ $ideological_faction_plural$ believe that faith-based values should form the basis of society. They emphasize the state's responsibility to support religious institutions and guarantee their freedoms and security.\n\n§L$ethic_fanatic_spiritualist$ Ethos§!"

 pft_ideological_faction_pacifist: "$ethic_pacifist$ $ideological_faction$"
 pft_ideological_faction_pacifist_desc: "$ethic_pacifist$ $ideological_faction_plural$ are committed to peace and nonviolence both within their own society and in its diplomatic conduct. For them, war is never justifiable.\n\n§L$ethic_fanatic_pacifist$ Ethos§!"

 pft_ideological_faction_militarist: "$ethic_militarist$ $ideological_faction$"
 pft_ideological_faction_militarist_desc: "$ethic_militarist$ $ideological_faction_plural$ promote strength and force as the guiding principles of successful foreign policy. They campaign for martial values and vigorous defense spending.\n\n§L$ethic_fanatic_militarist$ Ethos§!"

 pft_ideological_faction_xenophile: "$ethic_xenophile$ $ideological_faction$"
 pft_ideological_faction_xenophile_desc: "$ethic_xenophile$ $ideological_faction_plural$ endorse vigorous interaction between different species and robust protection of the galaxy's biocultural diversity. They denounce any move to isolate alien neighbors.\n\n§L$ethic_fanatic_xenophile$ Ethos§!"

 pft_ideological_faction_xenophobe: "$ethic_xenophobe$ $ideological_faction$"
 pft_ideological_faction_xenophobe_desc: "$ethic_xenophobe$ $ideological_faction_plural$ consider relations with alien species to be the defining threat of the interstellar age. They strenuously oppose integration between alien species and cultures.\n\n§L$ethic_fanatic_xenophobe$ Ethos§!"

 pft_ideological_faction_egalitarian: "$ethic_egalitarian$ $ideological_faction$"
 pft_ideological_faction_egalitarian_desc: "$ethic_egalitarian$ $ideological_faction_plural$ advocate for a fairer society on the basis of universal equality and nondiscrimination. They believe that everyone should benefit equally from the opportunities of the interstellar age.\n\n§L$ethic_fanatic_egalitarian$ Ethos§!"

 pft_ideological_faction_authoritarian: "$ethic_authoritarian$ $ideological_faction$"
 pft_ideological_faction_authoritarian_desc: "$ethic_authoritarian$ $ideological_faction_plural$ endorse an all-powerful state authority that wields centralized control over the populace. Any perceived weakness in the ruling power is likely to draw their ire.\n\n§L$ethic_fanatic_authoritarian$ Ethos§!"

