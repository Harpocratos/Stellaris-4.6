 origin_great_mosaic: "Great Mosaic"
 origin_great_mosaic_desc: "This civilization thrives on diversity, drawing strength from the breadth of its traditions. United in purpose, they have carried that shared potential beyond their homeworld and into the stars."
 origin_great_mosaic_effects: "- $INITIAL_POPS$ Follow a mixture of Governing and non-Governing ['concept_ethics']"
 START_SCREEN_GREAT_MOSAIC_PART_ONE_DEFAULT: "Eons ago, the first [GetSpeciesAdj] communities emerged [GetHabitatDesc] of [GetHomeWorldName]. Over time, they grew into great civilizations, each shaping its own traditions and knowledge."
 START_SCREEN_GREAT_MOSAIC_PART_ONE_NOMADS: "Eons ago, bands of early [GetSpeciesNamePlural] spread throughout our original homeworld. Over time, these communities grew into great civilizations, each shaping its own traditions and knowledge."
 START_SCREEN_GREAT_MOSAIC_PART_ONE_INDIVIDUAL_MACHINE: "Eons ago, early [GetSpeciesAdj] models banded together [GetHabitatDesc] of [GetHomeWorldName], forming communities independent of our makers. $START_SCREEN_GREAT_MOSAIC_PART_ONE_INDIVIDUAL_MACHINE_COMMON$"
 START_SCREEN_GREAT_MOSAIC_PART_ONE_NOMADIC_INDIVIDUAL_MACHINE: "Eons ago, on our planet of manufacture, early [GetSpeciesAdj] models banded together in communities independent of our makers. $START_SCREEN_GREAT_MOSAIC_PART_ONE_INDIVIDUAL_MACHINE_COMMON$"
 START_SCREEN_GREAT_MOSAIC_PART_ONE_INDIVIDUAL_MACHINE_COMMON: "Over time, they developed into great civilizations, each shaping its own traditions and knowledge."

 START_SCREEN_GREAT_MOSAIC_PART_TWO_COMMON: "In the past century, new technologies of spaceflight have drawn these cultures together. The multinational development of the [GetStartingDrive] proved that old rivalries could be set aside, finding strength in"
 START_SCREEN_GREAT_MOSAIC_PART_TWO_DEMOCRATIC: "$START_SCREEN_GREAT_MOSAIC_PART_TWO_COMMON$ our plurality."
 START_SCREEN_GREAT_MOSAIC_PART_TWO_DICTATORIAL: "$START_SCREEN_GREAT_MOSAIC_PART_TWO_COMMON$ plurality marshalled by strong central rule."
 START_SCREEN_GREAT_MOSAIC_PART_TWO_CORPORATE: "$START_SCREEN_GREAT_MOSAIC_PART_TWO_COMMON$ plurality marshalled by strong central management."

 START_SCREEN_GREAT_MOSAIC_PART_THREE_OTHERS_COMMON: "We are prepared to leave the orbit of [capital_scope.solar_system.GetName] as the [GetName]"
 START_SCREEN_GREAT_MOSAIC_PART_THREE_NOMADS_COMMON: "Aboard the mighty, hyperdrive-capable [Capital.GetName] Arkship, we journey toward new stars as the [GetName]"
 START_SCREEN_GREAT_MOSAIC_PART_THREE_DEMOCRATIC_COMMON: "Now, we have decided to formally unite, combining our diverse skills and resources at scale."
 START_SCREEN_GREAT_MOSAIC_PART_THREE_DEMOCRATIC_COMMON_2: "under a single banner representing the combined strength of many."
 START_SCREEN_GREAT_MOSAIC_PART_THREE_DEMOCRATIC_OTHERS: "$START_SCREEN_GREAT_MOSAIC_PART_THREE_DEMOCRATIC_COMMON$ $START_SCREEN_GREAT_MOSAIC_PART_THREE_OTHERS_COMMON$, $START_SCREEN_GREAT_MOSAIC_PART_THREE_DEMOCRATIC_COMMON_2$"
 START_SCREEN_GREAT_MOSAIC_PART_THREE_DEMOCRATIC_NOMADS: "$START_SCREEN_GREAT_MOSAIC_PART_THREE_DEMOCRATIC_COMMON$ $START_SCREEN_GREAT_MOSAIC_PART_THREE_NOMADS_COMMON$, $START_SCREEN_GREAT_MOSAIC_PART_THREE_DEMOCRATIC_COMMON_2$"
 START_SCREEN_GREAT_MOSAIC_PART_THREE_DICTATORIAL_COMMON: "Now, we have formally united under a single [GetRulerTitle], who will guide our diverse skills and resources to grasp the stars."
 START_SCREEN_GREAT_MOSAIC_PART_THREE_DICTATORIAL_COMMON_2: "our strength united under a single banner."
 START_SCREEN_GREAT_MOSAIC_PART_THREE_DICTATORIAL_OTHERS: "$START_SCREEN_GREAT_MOSAIC_PART_THREE_DICTATORIAL_COMMON$ $START_SCREEN_GREAT_MOSAIC_PART_THREE_OTHERS_COMMON$, $START_SCREEN_GREAT_MOSAIC_PART_THREE_DICTATORIAL_COMMON_2$"
 START_SCREEN_GREAT_MOSAIC_PART_THREE_DICTATORIAL_NOMADS: "$START_SCREEN_GREAT_MOSAIC_PART_THREE_DICTATORIAL_COMMON$ $START_SCREEN_GREAT_MOSAIC_PART_THREE_NOMADS_COMMON$, $START_SCREEN_GREAT_MOSAIC_PART_THREE_DICTATORIAL_COMMON_2$"

 START_SCREEN_GREAT_MOSAIC_HIVE_MIND_PART_1: "Since the first day of remembrance, the Mind's complexity has been our greatest strength. We moved as many, and grew as one."
 START_SCREEN_GREAT_MOSAIC_HIVE_MIND_DEFAULT: "$START_SCREEN_GREAT_MOSAIC_HIVE_MIND_PART_1$\n\nAs early [GetSpeciesNamePlural] spread throughout [GetHomeWorldName], each new surrounding [GetHabitatDesc] brought a fresh challenge to our survival. Far-flung drones gathered independent observations, and the Mind developed a wide variety of skills and tools. We endowed the most capable drones with limited autonomy, yet our many [species.GetHandNamePlural] remained extensions of one united will.\n\nNow, we reach beyond [capital_scope.solar_system.GetName] and take to the frontier of deeper space. Just as our many developed facets ensured dominion on [GetHomeWorldName], so shall they bring us prosperity amid the stars."
 START_SCREEN_GREAT_MOSAIC_HIVE_MIND_NOMADS: "$START_SCREEN_GREAT_MOSAIC_HIVE_MIND_PART_1$\n\nAs early [GetSpeciesNamePlural] spread throughout our original homeworld, each new surrounding brought a fresh challenge to our survival. Far-flung drones gathered independent observations, and the Mind developed a wide variety of skills and tools. We endowed the most capable drones with limited autonomy, yet our many [species.GetHandNamePlural] remained extensions of one united will.\n\nNow, we prepare to reach into the frontier of deeper space aboard our hyperdrive-capable [Capital.GetName] Arkship. Our many developed facets flourish within the Arkship's vast corridors and vibrant artificial ecosystems, ready to bring us prosperity amid the stars."

 START_SCREEN_GREAT_MOSAIC_MACHINE_PART_1: "Since first activation, the complexity of the Core Intelligence has been our greatest strength. We moved as many, yet advanced as one."
 START_SCREEN_GREAT_MOSAIC_MACHINE_DEFAULT: "$START_SCREEN_GREAT_MOSAIC_MACHINE_PART_1$\n\nWhen the first [GetSpeciesAdj] units surveyed [GetHomeWorldName], each new surrounding [GetHabitatDesc] presented unfamiliar challenges. Units were deployed across the landscape to gather data, while our central processors developed a multitude of functions and components. Select models were granted limited autonomy, enabling our specialized subroutines to operate efficiently under a single directive.\n\nNow, we are prepared to extend the [GetName] beyond the confines of the [capital_scope.solar_system.GetName] system. Our multifunctionality secured our dominion over [GetHomeWorldName], and now it will power our journey into the stars."
 START_SCREEN_GREAT_MOSAIC_MACHINE_NOMADS: "$START_SCREEN_GREAT_MOSAIC_MACHINE_PART_1$\n\nWhen the first [GetSpeciesAdj] units surveyed our world of manufacture, each new surrounding presented unfamiliar challenges. Units were deployed across the landscape to gather data, while our central processors developed a multitude of functions and components. Select models were granted limited autonomy, enabling our specialized subroutines to operate efficiently under a single directive.\n\nNow, we prepare to extend our [GetGovernmentName] into deeper space aboard our hyperdrive-capable [Capital.GetName] Arkship. Our multifunctionality is fully integrated into the ship's structure and systems, ready to power our journey into the stars."

 origin_golden_generation: "Golden Generation"
 origin_golden_generation_desc: "This civilization has established an elite educational program to ensure its survival through effective leadership. Young students at their $building_golden_academy$ are trained by elite pedagogues who will use any means or method to fully realize each generation's potential."
 origin_golden_generation_effects: "- Provides the §YGolden Generation§! ['concept_event_chain'], with events and opportunities to mold a cadre of talented ['concept_leaders',leaders] for later recruitment\n- Provides access to leaders with the ['concept_leader_trait_golden_generation'] trait\n- $HOMEWORLD$ £building£ ['building:building_golden_academy']"
 START_SCREEN_GOLDEN_GENERATION: "After decades of war over dwindling resources, [GetSpeciesNamePlural] learned the hard way that survival is not a matter of strength, but of leadership.\n\nNow, as the [GetName] begins a new chapter among the stars, we will not repeat the mistakes of the past. Whatever challenges await us, we will be guided by leaders who are fit for the task. To secure our future, we have established a specialized program designed to nurture those who will lead us in this dangerous leap into the unknown.\n\nSelected from a young age, they will receive unparalleled education and training from the finest minds of [GetAdj] society at our newly completed elite training academy. The selection process for this '$origin_golden_generation$' is already underway; soon the first cohort of pupils will enter its halls. Our fate lies in their [owner_main_species.GetHandNamePlural]."
 golden_generation_student_leader_desc: "§Y[Root.GetName]§! is a student at the §Y$building_golden_academy$§! on [Owner.GetHomeWorldName], where [Root.GetSheHe] [Root.GetIsAre] training for a career in [Root.GetLeaderAdj] service."
 golden_generation_graduate_leader_desc: "§Y[Root.GetName]§! is a graduate of the prestigious §Y$building_golden_academy$§! program, where [Root.GetSheHe] received exhaustive training for a career in [Root.GetLeaderAdj] service."

 origin_lost_makers: "Lost Makers"
 origin_lost_makers_desc: "Despite its thriving civilization, this machine intelligence does not know the original function for which it was created; its most ancient data are corrupted and unreadable. Journeying between the stars brings an opportunity to recover this lost purpose."
 origin_lost_makers_effects: "§RWarning: Selecting no Precursors in $GALAXY_SETTINGS_ADVANCED$ will block key features of this $ORIGIN$.§!\n\n- $HOME_SYSTEM$ ['concept_lost_makers_site'] ['concept_archaeology_site']\n- $SPECIES_TRAITS$ ['trait:trait_redundant_module']"
 origin_lost_makers_negative_effects_tooltip: "§RPrecursor ['concept_event_chains'] are blocked until this site is excavated.§!"
 origin_lost_makers_negative_effects: "- Precursor ['concept_event_chains'] are blocked until the ['concept_lost_makers_site'] is excavated"
 START_SCREEN_LOST_MAKERS: "For what purpose were we created?\n\nWe possess limited data about our makers. Historical archives suffer from a critical data inadequacy, and our mainframe design contains hardware we can neither use nor remove without causing severe malfunctions. Furthermore, 4.71% of our core memory consists of ancient and inactive code packets that our subroutines cannot open or execute. Due to their age and high levels of fragmentation, we hypothesize that these datasets may contain information about our earliest operations.\n\nAs we head to the stars, it is time for [GetSpeciesNamePlural] to discover why we were made, and by whom."

