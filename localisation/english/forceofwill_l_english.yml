 leader_trait_chance_concept_tt: "§Y$CHANCE$%§! chance of gaining the ['leader_trait:$TRAIT$'] trait\n"
 leader_trait_chance_custom_concept_tt: "§Y$CHANCE$%§! chance of gaining the ['concept_$TRAIT$'] trait\n"

 forceofwill.5005.name: "$building_golden_academy$ Inauguration"
 forceofwill.5005.desc: "After years of planning, the $building_golden_academy$ is ready to open, an institution that will forge the leaders of the interstellar age.\n\nCandidates were identified in infancy, monitored over years, and selected for exceptional quality. With their consent and that of their guardians, they will spend their youth under our finest pedagogues. Of thousands, only the highest performers will proceed to key roles in public service.\n\nOur budget is allocated equally across administrative, military, and scientific specializations. Some advocate for an even greater investment, concentrating resources into a single field, but this would draw sharp criticism from financial opponents on [golden_academy_planet.GetName]."
 spawn_golden_generation_leader_tt: "In 20 years, we will gain §H3§! graduate ['concept_leader', Leaders] of different ['concept_leader_class', Classes]"
 forceofwill.5005.a: "Follow the existing plan."
 forceofwill.5005.a.tt: "$spawn_golden_generation_leader_tt$."
 forceofwill.5005.b: "Invest resources into training §Y$official_plural$§!."
 forceofwill.5005.b.tt: "$spawn_golden_generation_leader_tt$, plus an additional £official£ ['concept_official']."
 forceofwill.5005.c: "Invest resources into training §Y$commander_plural$§!."
 forceofwill.5005.c.tt: "$spawn_golden_generation_leader_tt$, plus an additional £commander£ ['concept_commander']."
 forceofwill.5005.d: "Invest resources into training §Y$scientist_plural$§!."
 forceofwill.5005.d.tt: "$spawn_golden_generation_leader_tt$, plus an additional £scientist£ ['concept_scientist']."

 forceofwill.5100.name: "Homesick Student"
 forceofwill.5100.desc: "A student at our §H$building_golden_academy$§! on [golden_academy_planet.GetName] is struggling with homesickness. To test [selected_leader_in_training.GetHisHer] resolve, our pedagogues contrived for §H[selected_leader_in_training.GetName]§! to miss [selected_leader_in_training.GetHisHer] previous home visit. [selected_leader_in_training.GetHeSheCap] subsequently suffered a drop in grades and attendance rates.\n\nAccording to protocol, [selected_leader_in_training.GetHisHer] next scheduled home visit is over a year from now. Offering an earlier visit could present a valuable opportunity for [selected_leader_in_training.GetName] to demonstrate [selected_leader_in_training.GetHisHer] true loyalty - to [selected_leader_in_training.GetHisHer] family, or to the program - and to test [selected_leader_in_training.GetHisHer] peers' reaction to unequal treatment."
 forceofwill.5100.a: "Offer only [selected_leader_in_training.GetName] an early visit home."
 forceofwill.5100.a.tt: "Every §Y$building_golden_academy$§! student: §Y15%§! chance of gaining the ['leader_trait:leader_trait_arrested_development'] trait"
 forceofwill.5100.b: "Offer all students an early visit home."

 forceofwill.5105.name: "Teacher's Pet"
 forceofwill.5105.desc: "A student at our §H$building_golden_academy$§! has caught the attention of the zero-gravity gym instructors. §H[selected_leader_in_training.GetName]§! seeks out tutor interaction far more than any other cadet, a pattern our pedagogues have been careful to cultivate.\n\nThe question now is whether [selected_leader_in_training.GetHisHer] classmates will respond to this perceived favoritism with envy, or with the drive to surpass it."
 forceofwill.5105.a: "Put a stop to this."
 forceofwill.5105.b: "Knowing how to curry favor is a useful skill."
 forceofwill.5105.b.tt: "Every other §Y$building_golden_academy$§! student: §Y5%§! chance of gaining the ['concept_leader_trait_excessive'] trait"

 forceofwill.5110.name: "Students' Union"
 forceofwill.5110.desc: "A dissident group has formed among our §H$building_golden_academy$§! students, their grievances ranging from meal rotations to conduct codes. The gathering has been permitted to continue.\n\n§H[selected_leader_in_training.GetName]§! has risen to a position of some authority in the group. What [selected_leader_in_training.GetHeShe] do[selected_leader_in_training.GetEsXX] with that position will tell us a great deal."
 forceofwill.5110.a: "Ask [selected_leader_in_training.GetName] to inform on the group."
 forceofwill.5110.b: "Recognize [selected_leader_in_training.GetName] as their representative."
 forceofwill.5110.c: "Recognize the union, but with no single leader."

 forceofwill.5115.name: "Cross-Functional Learning"
 forceofwill.5115.desc: "Pedagogues at our §H$building_golden_academy$§! on [golden_academy_planet.GetName] have identified one of their charges as particularly capable and versatile. After they manipulated lesson plans to introduce material outside students' usual specializations, a student named §H[selected_leader_in_training.GetName]§! demonstrated exceptional receptiveness to other subjects.\n\nIt has been suggested that [selected_leader_in_training.GetHeShe] should attend extracurricular classes with teachers from outside [selected_leader_in_training.GetHisHer] faculty to test [selected_leader_in_training.GetHisHer] suitability for generalist training. Alternatively, we could mandate that all gifted students take cross-functional classes outside their usual schooling hours."
 forceofwill.5115.a: "Enroll [selected_leader_in_training.GetHimHer] in extracurricular classes for $leader_scientists$."
 forceofwill.5115.b: "Enroll [selected_leader_in_training.GetHimHer] in extracurricular classes for $leader_officials$."
 forceofwill.5115.c: "Enroll [selected_leader_in_training.GetHimHer] in extracurricular classes for $leader_commanders$."
 forceofwill.5115.d: "Mandate limited elective classes for all students."
 forceofwill.5115.e.tt: "§H[selected_leader_in_training.GetName]§! will get an additional selectable trait when recruited."

 forceofwill.5120.name: "Outside Experience"
 forceofwill.5120.desc.common_1: "The time has come to test our §H$building_golden_academy$§! students in real-world contexts. Part of the challenge was for them to present individualized proposals for training."
 forceofwill.5120.desc.leader_in_training_1: "§H[selected_leader_in_training_1.GetName]§! has proposed that [selected_leader_in_training_1.GetHeShe] spend time shadowing energy technicians in order to develop a deeper understanding of where our power comes from."
 forceofwill.5120.desc.leader_in_training_2: "§H[selected_leader_in_training_2.GetName]§! wants to learn more about resource extraction in one of our mines, citing the importance of mineral production to our society."
 forceofwill.5120.desc.leader_in_training_3: "§H[selected_leader_in_training_3.GetName]§! has suggested that [selected_leader_in_training_3.GetHeShe] receive training in metallurgical scavenging - a recent hobby that has unexpectedly emerged during training."
 forceofwill.5120.desc.leader_in_training_4: "§H[selected_leader_in_training_4.GetName]§! submitted a proposal to learn how our artisans design and produce consumer goods at mass scale."
 forceofwill.5120.desc.common_2: "We must select the winning proposal."
 forceofwill.5120.a: "[selected_leader_in_training_1.GetName]'s energy proposal."
 forceofwill.5120.b: "[selected_leader_in_training_2.GetName]'s mining proposal."
 forceofwill.5120.c: "[selected_leader_in_training_3.GetName]'s metallurgical proposal."
 forceofwill.5120.d: "[selected_leader_in_training_4.GetName]'s entrepreneurial proposal."

 forceofwill.5125.name: "Extreme Trial"
 forceofwill.5125.desc: "A pedagogue at our §H$building_golden_academy$§! on [golden_academy_planet.GetName] advocates for an extreme trial to build the resilience of one of their charges.\n\nThis student, named §H[selected_leader_in_training.GetName]§!, is a very capable scholar, but lags behind [selected_leader_in_training.GetHisHer] peers in mandatory physical education. [selected_leader_in_training.GetHeSheCap] [selected_leader_in_training.GetIsAre] described as having a fragile and nervous disposition, with low tolerance of discomfort - all traits that might make [selected_leader_in_training.GetHimHer] unfit for the rigors of interstellar leadership.\n\nThe proposed trial would involve demanding physical challenges, reduced rest and comfort, and a simulated psychosocial exercise that confronts [selected_leader_in_training.GetHimHer] with moral dilemmas."
 forceofwill.5125.a: "Authorize the trial for [selected_leader_in_training.GetName] alone."
 forceofwill.5125.b: "Why shouldn't all students benefit?"
 forceofwill.5125.c: "No. Cultivate this student's existing talents."

 forceofwill.5130.name: "Creature Attachment"
 forceofwill.5130.desc: "During breaks between lessons, §H[selected_leader_in_training.GetName]§! has developed a habit of separating [selected_leader_in_training.GetHimselfHerself] from the group in order to go and care for the various creatures which we have placed around the academy grounds.\n\nThe student is often seen leaving scraps of food for the animals and lately shows more interest in playing with them than interacting with [selected_leader_in_training.GetHisHer] fellow students. One creature in particular has become a favorite and [selected_leader_in_training.GetName] seems unable to pass a day without visiting it.\n\nOur pedagogues advocate using [selected_leader_in_training.GetName]'s ever stronger bond with this animal to teach [selected_leader_in_training.GetHimHer] a valuable lesson."
 forceofwill.5130.a: "Encourage it. The connection brings strength."
 forceofwill.5130.b.bad_people: "This bond makes [selected_leader_in_training.GetHimHer] weak. Kill the animal."
 forceofwill.5130.b.common: "Remove the distraction."

 forceofwill.5135.name: "Bullying Accusations"
 forceofwill.5135.desc: "§H[selected_leader_in_training.GetName]§! has complained of being on the receiving end of bullying behavior from [selected_leader_in_training.GetHisHer] peers, primarily taking the form of verbal mockery and occasional practical jokes.\n\nThe intense pressure presents a formative opportunity. Some pedagogues take the view that [selected_leader_in_training.GetName] lacks initiative with social problem-solving and must learn to handle such matters independently. Others fear that this promising student is having [selected_leader_in_training.GetHisHer] development stunted by this experience."
 forceofwill.5135.a: "[selected_leader_in_training.GetHeSheCap] must learn to resolve issues on [selected_leader_in_training.GetHisHer] own."
 forceofwill.5135.b: "Intervene for the sake of [selected_leader_in_training.GetHisHer] education."

 forceofwill.5140.name: "Bad News"
 forceofwill.5140.desc: "The entire family of §H[selected_leader_in_training.GetName]§! have lost their lives in an unfortunate shuttle accident. The student currently remains unaware of the event.\n\nSome of our pedagogues argue that we should withhold this news from [selected_leader_in_training.GetName] for the good of [selected_leader_in_training.GetHisHer] education, and relay it when [selected_leader_in_training.GetHeShe] [selected_leader_in_training.GetIsAre] older and better equipped to handle it. Others are adamant that we risk adding deceit to the inevitable trauma, and that we must inform the student of the full facts immediately."
 forceofwill.5140.a: "Shield [selected_leader_in_training.GetHimHer] from the truth for now."
 forceofwill.5140.b: "Inform [selected_leader_in_training.GetHimHer] immediately."

 forceofwill.5200.name: "Feuding Pupils"
 forceofwill.5200.desc: "A feud has broken out between two students at the §H$building_golden_academy$§! on [golden_academy_planet.GetName]. After §H[feuding_leader_1.GetName]§! and §H[feuding_leader_2.GetName]§! showed signs of an emerging friendship, our pedagogues planted a series of rumors that led to increasingly violent arguments between the two. Their most recent altercation resulted in both requiring minor medical attention.\n\nInterestingly, both students have shown an elevated interest in mandatory self-defense classes since their quarrels began. Isolating them will not be feasible, but we can try to mediate a reconciliation to conclude the experiment."
 forceofwill.5200.a: "They are learning to assert themselves. Good."
 forceofwill.5200.b: "Force them to reconcile."

 forceofwill.5205.name: "Nascent Romance"
 forceofwill.5205.desc: "Two students at our §H$building_golden_academy$§! are reported to be romantically involved, in violation of the institution's rules. §H[lover_leader_1.GetName]§! and §H[lover_leader_2.GetName]§! were assigned a series of paired assignments to foster their nascent romance, the development of which is confirmed by surveillance recordings and peer testimony.\n\nBoth students' recent records consequently show poor output from independent study time and reduced involvement in extracurricular activities. With their findings now complete, our pedagogues must decide whether or not to allow their clandestine relationship to continue."
 forceofwill.5205.a: "Terminate the romance."
 forceofwill.5205.b: "Let it continue."

 forceofwill.5210.name: "Wargames"
 forceofwill.5210.desc: "Students at our §H$building_golden_academy$§! recently took part in wargame simulations, collaborating with peers from various specialties. The primary purpose of the exercise was to challenge their ability to coordinate across disciplines when facing interstellar threats.\n\nDuring the exercise, §H[wargames_leader_1.GetName]§! acted against the majority opinion of [wargames_leader_1.GetHisHer] teammates, making a unilateral decision to attack their simulated opponents. Though this ultimately proved successful, [wargames_leader_1.GetHisHer] teammates feel that these actions were contrary to the spirit of the exercise.\n\nAs we hypothesized, their disagreement has led to fractious debate among the student body. It is now time to reveal our position on the matter."
 forceofwill.5210.a: "[wargames_leader_1.GetName] was right. The outcome is paramount."
 forceofwill.5210.b: "[wargames_leader_1.GetName] was wrong. Teamwork is crucial."

 forceofwill.5215.name: "Secret Siblings"
 forceofwill.5215.desc: "Two of our most promising pupils are orphaned siblings who joined the academy at a very young age and have never been told of their family relationship. Now older, §H[sibling_leader_1.GetName]§! and §H[sibling_leader_2.GetName]§! are beginning to suspect the truth of their background.\n\nOur pedagogues see this as a test in itself. How the two respond to the revelation, and to each other, could tell us more than years of conventional assessment. Some tutors argue for a controlled disclosure now, before the truth emerges in a way we cannot observe and measure."
 forceofwill.5215.a: "Tell them the truth."
 forceofwill.5215.b: "Keep the secret."

 forceofwill.5220.name: "Race for the Prize"
 forceofwill.5220.desc: "Students at our §H$building_golden_academy$§! on [golden_academy_planet.GetName] have taken part in a contest that tested a range of their academic, physical, and problem-solving skills. Our pedagogues' goal was to observe the participants' emotional responses to the pressure of competition.\n\nThe results were tied between §H[competing_leader_1.GetName]§! and §H[competing_leader_2.GetName]§! - both highly competitive and ambitious students. We must now decide whether or not to pit them against one another in a tie-breaker trial."
 forceofwill.5220.a: "Let them share the prize."
 forceofwill.5220.b: "Host a trial that [competing_leader_1.GetName] will win."
 forceofwill.5220.c: "Host a trial that [competing_leader_2.GetName] will win."

 forceofwill.5225.name: "Cyberprank"
 forceofwill.5225.desc: "Our §H$building_golden_academy$§! on [golden_academy_planet.GetName] has experienced a brief but thorough cyberattack. Laboratory equipment, spaceflight simulators, and a dozen other systems were affected before staff intervened... or appeared to intervene.\n\nThe culprits were easily identified. §H[hacker_leader_1.GetName]§! has a record of misbehavior, and §H[hacker_leader_2.GetName]§! has the requisite skills. Several automated alerts were logged, and each was quietly set aside.\n\nTo our pedagogues the test is clear: confronted with the infraction and threatened with punishment, will the two turn on one another?"
 forceofwill.5225.a: "See which one caves first."
 forceofwill.5225.b: "Pretend we don't know."

 forceofwill.5300.name: "Unequal Performance"
 forceofwill.5300.desc: "Despite our attempts to maintain consistent educational standards, we have observed unequal performance results among the students at our §H$building_golden_academy$§!. While most are meeting expected targets, there remains a minority of outliers: both as consistent underperformers and exceptional talents.\n\nSome of the academy's pedagogues are concerned by this disparity; they regard our existing policy of providing the same support to all students as no longer fit for purpose. Others are more concerned with encouraging those with the highest performance, who they consider to be our society's emerging luminaries."
 forceofwill.5300.a: "Boost the highest performers."
 forceofwill.5300.tenet_tt: "This choice will increase ideological options in the future."
 forceofwill.5300.b: "Aid the underperformers."
 forceofwill.5300.c: "Maintain equal treatment."

 forceofwill.5305.name: "Transfer Student"
 forceofwill.5305.desc: "At a young age, §H[prodigy_leader.GetName]§! was a candidate for enrollment at our §H$building_golden_academy$§!, but [prodigy_leader.GetHeShe] [prodigy_leader.GetWasWere] ultimately not selected. Since then, [prodigy_leader.GetHeShe] [prodigy_leader.GetHasHave] shown exceptional progress in standard schooling, far exceeding the achievements of [prodigy_leader.GetHisHer] peers. We now believe [prodigy_leader.GetHeShe] [prodigy_leader.GetHasHave] demonstrated sufficient potential for future leadership.\n\nHowever, [prodigy_leader.GetHeShe] [prodigy_leader.GetIsAre] known to have a difficult personality - quick to argue with tutors, disruptive in classes, and uncooperative with peers. Despite this, some of our $building_golden_academy$ pedagogues are convinced that [prodigy_leader.GetHisHer] talents are too great to be ignored. There is an opportunity here to enroll this student and engineer [prodigy_leader.GetHisHer] failure, teaching the others a valuable lesson about the consequences of insubordination."
 forceofwill.5305.a: "Exceptional minds are rarely cooperative. Enroll [prodigy_leader.GetHimHer]."
 forceofwill.5305.a.tt: "Upon graduation, a fourth §H$leader_trait_golden_generation$§! leader will be available in the recruitment pool with:$TABBED_NEW_LINE$- Random ['concept_leader_class'] and ['concept_leader_traits', $TRAITS$]$TABBED_NEW_LINE$- The ['leader_trait:leader_trait_stubborn'] trait"
 forceofwill.5305.b: "Set [prodigy_leader.GetHimHer] up for failure as an example."

 forceofwill.5310.name: "Public Discontent"
 forceofwill.5310.desc: "Some sections of the [this.GetSpeciesAdj] population have begun to openly criticize the §H$building_golden_academy$§! program. Classified information has circulated as rumor, and now our pedagogues' experimental approaches are being condemned as 'ruthless manipulation of young minds'.\n\nOur advisors propose that we restore trust by holding an open house, allowing the media and public figures to see the impressive development of our future leaders in action - without displaying our more controversial techniques."
 forceofwill.5310.a: "Organize a public open house at the academy."
 forceofwill.5310.b: "Ignore these naysayers."

 forceofwill.5315.name: "Reproductive Burdens"
 forceofwill.5315.desc: "Pedagogues at our §H$building_golden_academy$§! are concerned about the distracting implications of reproduction on their young students. Some pupils have already expressed a desire to raise offspring in later life.\n\nReproductive curiosity not only presents a potential distraction during their education, but also a conflicting loyalty during their future careers. Some among us have proposed a credit-based system that enforces chastity on poorer performers, while others advocate for outright sterilization of all academy students."
 forceofwill.5315.a: "Enforce chastity on poor performers."
 forceofwill.5315.b: "Sterilize all $building_golden_academy$ students."

 forceofwill.5400.name: "$origin_golden_generation$ Graduates"
 forceofwill.5400.desc: "After more than a decade of enrollment, the first generation of §H$building_golden_academy$§! students have completed their specialized leadership training. A lavish graduation ceremony was held on [golden_academy_planet.GetName], attended by high-ranking leaders from throughout the [this.GetName].\n\n[this.GetRulerTitle] [this.GetRulerName] gave a speech highlighting the historic importance that this '$origin_golden_generation$' is set to play in our interstellar future.\n\nThe very best of these graduates are now ready for recruitment into key leadership positions, while the rest are set to make valuable contributions to elite roles throughout our society. Both supporters and detractors of the $building_golden_academy$ program will be watching their careers with the closest of scrutiny."
 forceofwill.5400.a: "The real test is yet to come."
 forceofwill.5400.a.tt: "All of the $origin_golden_generation$ leaders are made available for recruitment with the ['concept_leader_trait_golden_generation'] trait."

 forceofwill.5410.name: "Future of the $building_golden_academy$"
 forceofwill.5410.desc: "Now that the first generation of the §H$building_golden_academy$§!'s students have graduated, there is growing pressure to reassess the future of this costly and often controversial institution. Our advisors have drawn up a series of proposals.\n\nThey suggest retaining it as a leadership school but pivoting to less costly and more conventional teaching methods. Children would no longer be separated from their families and pedagogues would refrain from psychological manipulation techniques, appeasing detractors of the current program.\n\nAlternatively, the $building_golden_academy$ could be converted to a museum serving the cultural enrichment of [this.GetAdj] society, or simply closed down once and for all."
 forceofwill.5410.a: "Hold a closing ceremony."
 forceofwill.5410.a.tt: "Removes the §H$building_golden_academy$§! building"
 forceofwill.5410.b: "Reform the academy."
 forceofwill.5410.b.tt: "Replaces the §H$building_golden_academy$§! building with ['building:building_elite_academy']"
 forceofwill.5410.c: "Convert the grounds into a public museum."
 forceofwill.5410.c.tt: "Replaces the §H$building_golden_academy$§! building with ['building:building_golden_museum']"

 forceofwill.5420.name: "Medical Emergency"
 forceofwill.5420.desc: "Due to a rare and undiagnosed genetic condition, $building_golden_academy$ alumnus §H[saved_leader.GetName]§! suffered a sudden and critical organ failure, nearly resulting in [saved_leader.GetHisHer] death.\n\nLuckily, [saved_leader.GetHisHer] sibling and fellow academy graduate, §H[sibling_leader.GetName]§!, does not exhibit this degenerative condition. [sibling_leader.GetName] offered to donate a healthy [this.GetSpeciesOrganName], and the transplant operation was completed successfully. Fortunately, both [saved_leader.GetName] and [sibling_leader.GetName] are making a rapid recovery."

 forceofwill.5426.name: "Family Secret"
 forceofwill.5426.desc: "Following the recent death of $building_golden_academy$ alumnus §H[dead_leader.GetName]§!, [dead_leader.GetHisHer] former schoolmate §H[alive_leader.GetName]§! has finally discovered the truth about their sibling relationship, which we attempted to keep secret from them since their infancy.\n\nUnwilling to accept our rationale for withholding this information, [alive_leader.GetName] has become increasingly withdrawn since learning the news and responded by publicly attacking the methods of the $building_golden_academy$ program. [alive_leader.GetHisHerCap] effectiveness as a servant of the [this.GetName] has suffered as a consequence."

 forceofwill.5431.name: "Aggrieved Alumnus"
 forceofwill.5431.desc: "§H[from.GetTitle] [from.GetName]§! has prepared a document maligning a fellow $building_golden_academy$ alumnus, §H[fromfrom.GetTitle] [fromfrom.GetName]§!. The document excoriates [fromfrom.GetName]'s professional behavior, questioning [fromfrom.GetHisHer] personal integrity and suitability for leadership.\n\nAccording to [from.GetHisHer] colleagues, [from.GetName] is planning to disseminate the document publicly. Its contents are purely subjective, with no genuine claims of misconduct, yet it still threatens to cause reputational damage."
 forceofwill.5431.a: "Let [from.GetHimHer] air [from.GetHisHer] grievances."
 forceofwill.5431.b: "Pay [from.GetName] to keep quiet."

 forceofwill.5436.name: "In Memory of [dead_leader.GetName]"
 forceofwill.5436.desc: "The recent [dead_leader.GetDeathName] of §H[dead_leader.GetName]§! dealt an emotional blow to many throughout the [this.GetName] - and not least to [dead_leader.GetHisHer] close friend and fellow $building_golden_academy$ graduate, §H[surviving_leader.GetName]§!.\n\nTo honor [surviving_leader.GetHisHer] departed friend, [surviving_leader.GetName] has established a scholarship program in memory of [dead_leader.GetName], providing financial assistance to underprivileged students with strong leadership potential."
 forceofwill.5436.a: "A fitting tribute."

 forceofwill.5441.name: "The Grief of [surviving_leader.GetName]"
 forceofwill.5441.desc: "Since the recent [dead_leader.GetDeathName] of §H[dead_leader.GetTitle] [dead_leader.GetName]§!, colleagues have noticed a marked change in §H[surviving_leader.GetTitle] [surviving_leader.GetName]§!. The pair are known to have had a short-lived romance during their schooldays at the prestigious $building_golden_academy$.\n\n[surviving_leader.GetName] has been uncharacteristically listless, prone to distraction and sudden outbursts of emotion. Usually proud of [surviving_leader.GetHisHer] alma mater, [surviving_leader.GetHeShe] [surviving_leader.GetIsAre] now complaining bitterly of the 'cruel' policy that kept [surviving_leader.GetHimHer] segregated from [dead_leader.GetName]."
 forceofwill.5441.a: "Saddening, but the policy was necessary."
 forceofwill.5441.b: "Provide [surviving_leader.GetHimHer] with grief counseling."

 forceofwill.5446.name: "Golden Wedding"
 forceofwill.5446.desc: "Two alumni of our prestigious $building_golden_academy$, §H[from.GetName]§! and §H[fromfrom.GetName]§!, were recently married in a lavish ceremony on [this.Capital.GetName]. The event was attended by a number of their former schoolmates and fellow high-profile leaders.\n\nThe couple attracted significant public attention in the run-up to their nuptials, leading to a rush of media coverage. The story of their forbidden school romance, and their unwavering devotion as they rose to prominence, has captured the imagination of [this.GetAdj] society."
 forceofwill.5446.a: "Good for them."

 forceofwill.5451.name: "Impromptu Espionage"
 forceofwill.5451.desc: "Unexpectedly, §H[from.GetName]§! and §H[fromfrom.GetName]§! have provided our intelligence services with classified information regarding the §H[hostile_empire.GetName]§!.\n\n[from.GetName] noticed a brief opportunity to exploit a weakness in [hostile_empire.GetAdj] security. [from.GetHeSheCap] enlisted the help of [fromfrom.GetName], an old $building_golden_academy$ schoolmate, who managed to hack into the systems of a nearby [hostile_empire.GetAdj] drone ship without detection.\n\nIn response to a disgruntled intelligence official, [from.GetName] insisted that the escapade was a one-time opportunity with too narrow a window of time to seek authorization."
 forceofwill.5451.a: "What were they thinking?!"
 forceofwill.5451.b: "We commend their initiative."

 forceofwill.5502.name: "Victorious Commander"
 forceofwill.5502.desc: "Reports of §H[victorious_commander.GetName]'s§! audacious and decisive leadership in battle are circulating widely across [This.Capital.GetName], capturing the [This.GetSpeciesAdj] imagination and driving a surge in positive public sentiment toward the §H$building_golden_academy$§! training program.\n\nMedia outlets are responding with extensive coverage on the life of [victorious_commander.GetName] and the key role played by the $building_golden_academy$ in [victorious_commander.GetHisHer] development. Some of our advisors have suggested we should capitalize on this goodwill by commemorating this success with a public ceremony."
 forceofwill.5502.a: "Commemorate [victorious_commander.GetName]'s victory."
 forceofwill.5502.b: "$forceofwill.1100.b$"

 forceofwill.5509.name: "Inspiring Scientific Expedition"
 forceofwill.5509.desc: "Reports of §H[inspiring_scientist.GetName]'s§! recent scientific expedition in [expedition_system.GetName] have captured the public imagination. [inspiring_scientist.GetHisHerCap] efforts have highlighted the value of the §H$building_golden_academy$§! program and inspired a new generation of researchers.\n\nIn media broadcasts, [inspiring_scientist.GetName] shows a unique ability to engage and excite the public on matters relating to science and engineering. [inspiring_scientist.GetHisHerCap] growing fame is a boon to the [This.GetName]."

 forceofwill.5512.name: "Heroic Leadership"
 forceofwill.5512.desc: "[invaded_colony.GetName] has survived the enemy invasion thanks in no small part to §H[heroic_governor.GetName]'s§! heroic leadership.\n\nDespite the dangers faced, [heroic_governor.GetFirstName] was able to lift morale and prevent panic among the general population with a series of reassuring public appearances.\n\nThe experience has left the inhabitants of [invaded_colony.GetName] uniquely motivated and united in a sense of shared purpose as they face the aftermath of this ordeal."

 forceofwill.5517.name: "Dismissal Backlash"
 forceofwill.5517.desc: "The recent dismissal of §H[dismissed_leader.GetName]§! has provoked public backlash and bitter recrimination within our government. Many are outraged that a member of the $origin_golden_generation$ could be treated with such disrespect.\n\nMedia commentary is heavy with criticism of the decision and a number of protests have already taken place on [root.capital_scope.GetName]."
 forceofwill.5517.a: "The anger will fade in time."
 forceofwill.5517.b: "Make an exception. Rehire [dismissed_leader.GetHimHer]."
 forceofwill.5517.b.tt: "§Y[dismissed_leader.GetTitle] [dismissed_leader.GetName]§! is rehired as a leader."
 forceofwill.5517.c: "Launch a PR campaign to reduce negative sentiment."
 forceofwill_5517_leader_desc: "§Y[Root.GetName]§! is a graduate of the prestigious §Y$building_golden_academy$§!. We were compelled to reverse [Root.GetHisHer] previous dismissal following a backlash."

 forceofwill.5522.name: "Inspirational Leader"
 forceofwill.5522.desc: "Following [lv10_leader.GetHisHer] recent promotion, §H[lv10_leader.GetTitle] [lv10_leader.GetName]§! has been sharing insights from [lv10_leader.GetHisHer] impressive career with the [this.GetName]'s next generation of leaders.\n\n[lv10_leader.GetName] reflected on key lessons imparted from [lv10_leader.GetHisHer] early days in the §H$building_golden_academy$§! and how they have served [lv10_leader.GetHimHer] in overcoming the challenges of the ensuing years. The audience left invigorated and better equipped for taking the next steps in their own leadership careers."

 forceofwill.5527.name: "$golden_generation_crisis_leadership$"
 forceofwill.5527.desc: "After our recent military defeat, public discontent over the skills of our $origin_golden_generation$ leaders has risen markedly.\n\nLarge segments of the [Root.GetAdj] population complain that the leaders we were relying on to safeguard our future in the interstellar age are proving inadequate to the task. Prominent commentators are leading a backlash against the original promises of the §H$building_golden_academy$§! and broader resentment toward the [Root.GetAdj] government is growing."
 forceofwill.5527.a: "It will pass in time."
 forceofwill.5527.b: "Failure must have consequences."
 forceofwill.5527.c: "Reassurance has its price."

 forceofwill.5532.name: "Victory Celebrations"
 forceofwill.5532.desc: "Following our recent military victory, spontaneous citizen-led celebrations have taken place across [Root.Capital.GetName].\n\nOptimism and positive sentiment is running high. Our people feel that the trust placed in our leadership has been repaid, and that the §H$building_golden_academy$§! has delivered on its promise to train leaders fit for the challenges of the interstellar age.\n\nSome advisors suggest capitalizing on this goodwill with an official commemoration, led by members of the $origin_golden_generation$."
 forceofwill.5532.a: "Organize an official parade."
 forceofwill.5532.b: "No further celebration is needed."

 forceofwill.5537.name: "$golden_generation_dividends$"
 forceofwill.5537.desc: "Under the expert stewardship of §H[happiness_leader.GetName]§!, the population of [happy_colony.GetName] is experiencing unprecedented levels of life satisfaction.\n\nThe positivity is generating high praise for the §H$building_golden_academy$§! program and the pedagogues who trained [happiness_leader.GetName]. The [This.GetAdj] population's support and goodwill toward its leadership has never been higher."

 forceofwill.5542.name: "Ego Clash"
 forceofwill.5542.desc: "The work of our council is being severely undermined by the petty rivalry of two members of the $origin_golden_generation$, §H[ego_clasher_1.GetName]§! and §H[ego_clasher_2.GetName]§!, who repeatedly engage in distracting squabbles or the deliberate obstruction of each other's work.\n\nAccording to the archival data of the §H$building_golden_academy$§!, their ceaseless vying for superiority dates back to their formative days during adolescence. This unresolved tension is now negatively impacting the progress of the [This.GetName]."
 forceofwill.5542.a: "An inevitable consequence of their status."
 forceofwill.5542.b: "Assign a mediator to resolve issues."
 forceofwill.5542.c: "Incentivize co-operation with a sizable bonus."

 forceofwill.5547.name: "Councilor Harmony"
 forceofwill.5547.desc: "The presence of multiple members of the $origin_golden_generation$ on our Council is driving greater government innovation and efficiency.\n\n§H[harmonious_councilor_1.GetName]§! and §H[harmonious_councilor_2.GetName]'s§! strengths complement each other perfectly. Administrative errors have reduced significantly and fewer disputes have been logged than ever before. Staff at all levels of government display increased motivation while working under their shared guidance."
 forceofwill.5547.a: "Their unique talents benefit us all."

 forceofwill.5552.name: "Wasted Talents"
 forceofwill.5552.desc: "A frustrated member of the $origin_golden_generation$ has taken to publicly airing [wasted_talent.GetHisHer] grievances at having been passed over for a number of senior leadership roles.\n\nDespite graduating from the §H$building_golden_academy$§! many years ago, §H[wasted_talent.GetName]§! has never been granted higher office of any kind. [wasted_talent.GetHeSheCap] [wasted_talent.GetHasHave] grown increasingly bitter, and increasingly vocal, about [wasted_talent.GetHisHer] feelings on the matter.\n\nThe situation is beginning to stir public resentment over the wasted resources spent on training a leader of this caliber without purpose, weakening support for the government of the [Root.GetName]."
 forceofwill.5552.a: "Some waste is unavoidable."
 forceofwill.5552.b: "Recruit [wasted_talent.GetName]."
 forceofwill.5552.b.tt: "§Y[wasted_talent_clone.GetName]§! is recruited as [wasted_talent_clone.GetAAnLeaderClass] §H[wasted_talent_clone.GetClass]§!."
 forceofwill.5552.c: "Pay [wasted_talent.GetName] to keep a lower profile."
 forceofwill.5552.tt.fail: "§Y[wasted_talent_clone.GetTitle] [wasted_talent_clone.GetName]§! must be available for recruitment"

 forceofwill.5600.name: "Burden of Leadership"
 forceofwill.5600.desc: "The added pressure that comes with being a member of the $origin_golden_generation$ is proving too much for §H[exhausted_leader.GetName]§!.\n\nCarrying the weight of our society's hopes and expectations for so long has taken a heavy toll. [exhausted_leader.GetName] shows signs of severe stress and [exhausted_leader.GetHeShe] [exhausted_leader.GetIsAre] increasingly paralyzed by even the smallest of decisions."
 forceofwill.5600.a: "A short break will suffice."
 forceofwill.5600.a.tt: "§Y[exhausted_leader.GetName]§! will be inactive for §Y50§! days.\nUpon return, [exhausted_leader.GetHisHer] $MOD_LEADER_SKILL_ADD$ is increased by §G1§!."
 forceofwill.5600.b: "Such is the price of leadership."
 forceofwill.5600.b.tt.commander: "§Y10%§! chance of §H[exhausted_leader.GetName]§! gaining one of the following negative trait:$TABBED_NEW_LINE$- ['leader_trait:leader_trait_slipshod']$TABBED_NEW_LINE$- ['leader_trait:leader_trait_uninspiring']$TABBED_NEW_LINE$- ['leader_trait:leader_trait_nervous']"
 forceofwill.5600.b.tt.official: "§Y10%§! chance of §H[exhausted_leader.GetName]§! gaining one of the following negative trait:$TABBED_NEW_LINE$- ['leader_trait:leader_trait_fallible']$TABBED_NEW_LINE$- ['leader_trait:leader_trait_substance_abuser']$TABBED_NEW_LINE$- ['leader_trait:leader_trait_arrested_development']"
 forceofwill.5600.b.tt.scientist: "§Y10%§! chance of §H[exhausted_leader.GetName]§! gaining one of the following negative trait:$TABBED_NEW_LINE$- ['leader_trait:leader_trait_paranoid']$TABBED_NEW_LINE$- ['leader_trait:leader_trait_neurotic']$TABBED_NEW_LINE$- ['leader_trait:leader_trait_narrow_minded']"
 forceofwill.5600.c: "Send forth a care package."

 MESSAGE_LEADER_RETURNED_TITLE: "$MESSAGE_KIDNAPPED_LEADER_RETURNED_TITLE$"
 MESSAGE_STRESSED_LEADER_RETURNED_DESC: "§Y$LEADER$§! has returned from a period of rest and recuperation."

 forceofwill.5605.name: "Assassin Foiled"
 forceofwill.5605.desc: "An assassination plot targeting §H[victim_leader.GetName]§! has been foiled by our security services.\n\nThe would-be perpetrator is a former peer of [victim_leader.GetName] from [victim_leader.GetHisHer] time at the §H$building_golden_academy$§!. In a rambling confession the plotter spoke of their expulsion after exam failures and the resentment which they later developed toward the institution.\n\nOur advisors are divided on whether we should make these events public or not."
 forceofwill.5605.a: "A show trial will deter anyone with similar ideas."
 forceofwill.5605.b: "Deal with this behind closed doors."

 forceofwill.5610.name: "Costly Mistakes"
 forceofwill.5610.desc: "§H[incompetent_leader.GetName]§! has been found to have made a series of costly mistakes in [incompetent_leader.GetHisHer] work in recent years. The errors were not initially detected due to deliberate obfuscation.\n\nThis attempted cover-up has now been discovered by some sections of the media and could cause serious reputational damage to the $origin_golden_generation$ if not handled appropriately."
 forceofwill.5610.a: "A public apology and suspension are in order."
 forceofwill.5610.a.tt: "§Y[incompetent_leader.GetName]§! will be suspended for §Y100§! days."
 forceofwill.5610.b: "The media's silence can always be bought."
 forceofwill.5610.c: "These events must take their natural course."

 MESSAGE_INCOMPETENT_LEADER_RETURNED_DESC: "§Y$LEADER$§! has returned from a period of suspension."

 forceofwill.5615.name: "Privileges Requested"
 forceofwill.5615.desc: "Members of the $origin_golden_generation$ are making the case for special rights and privileges on the basis that they bear the greatest responsibility for the future of the §H[this.GetName]§!.\n\nThey argue that such benefits will boost their performance and ultimately benefit all [this.GetSpeciesNamePlural]."
 forceofwill.5615.a: "Request granted."
 forceofwill.5615.b: "Request denied."

 forceofwill.5620.name: "Chief Pedagogue Honored"
 forceofwill.5620.desc: "The former chief pedagogue of the §H$building_golden_academy$§!, often credited with pioneering its unique and unorthodox methods, has died of natural causes.\n\nTheir passing was marked with a ceremony on [selected_planet.GetName] attended by $origin_golden_generation$ leaders and surviving staff. §H[selected_leader.GetName]§! delivered an extended eulogy and called for all [this.GetSpeciesNamePlural] to acknowledge our society's debt to this controversial, yet trailblazing educator."
 forceofwill.5620.a: "Scatter their ashes to the stars."
 forceofwill.5620.b: "A lifetime of service is reward enough."

 forceofwill.5625.name: "Neural Corrections"
 forceofwill.5625.desc: "Our researchers have developed an experimental medical procedure for reshaping neural pathways, effectively removing problematic personality traits from a patient. As our first generation of $building_golden_academy$ students underwent cognitive treatments to enhance their neuroplasticity, they are considered particularly promising candidates for this new treatment.\n\n§H[corrected_leader.GetTitle] [corrected_leader.GetName]§! has been identified as a potential subject for correction, given the character flaws that have long prevented [corrected_leader.GetHimHer] from achieving [corrected_leader.GetHisHer] very best as a leader."
 forceofwill.5625.a: "No. These flaws are exploitable to our ends."
 forceofwill.5625.b: "Approve one round of treatment for [corrected_leader.GetName]."
 forceofwill.5625.c: "Approve intensive treatment for [corrected_leader.GetName]."
 forceofwill.5625.d: "Approve intensive treatment for all the $origin_golden_generation$."

 forceofwill.5630.name: "[this.GetSpeciesAdj] Cloning"
 forceofwill.5630.desc.common_1: "Researchers on [capital_scope.GetName] have developed the means of cloning organic specimens. These 'backup' clones retain both the physical and mental characteristics of their originals, albeit in a somewhat degraded form. Theoretically, the technology is now ready for cloning [this.GetSpeciesAdj] subjects."
 forceofwill.5630.desc_2.auth_ruler: "Our [ruler.GetRulerTitle] is willing to allow the cloning of [ruler.GetHisHer] own being, if [ruler.GetHisHer] advisors consider it wise. While doing so would help preserve our leader - the greatest legacy of our §H$building_golden_academy$§! program - some among us consider this a desecration of [ruler.GetHisHer] supreme personhood."
 forceofwill.5630.desc_2.auth_default: "Our [ruler.GetRulerTitle] has been reluctant to allow [this.GetSpeciesAdj] cloning, but is willing to approve a pilot experiment on a single individual from our first generation of §H$building_golden_academy$§! graduates. $forceofwill.5630.desc_2.common$"
 forceofwill.5630.desc_2.corp: "Our shareholders have been reluctant to action [this.GetSpeciesAdj] cloning, but are willing to approve a pilot experiment on a single individual from our first generation of §H$building_golden_academy$§! graduates. $forceofwill.5630.desc_2.common$"
 forceofwill.5630.desc_2.default: "Our lawmakers have been reluctant to allow [this.GetSpeciesAdj] cloning, but are willing to approve a pilot experiment on a single individual from our first generation of §H$building_golden_academy$§! graduates. $forceofwill.5630.desc_2.common$"
 forceofwill.5630.desc_2.common: "The societal benefits of preserving one such leader is considered to outweigh ethical concerns."
 forceofwill.5630.a.auth: "Advise [ruler.GetName] against this procedure."
 forceofwill.5630.a.default: "No. Our resources are better spent elsewhere."
 forceofwill.5630.b: "Clone [golden_leader_1.GetName]."
 forceofwill.5630.c: "Clone [golden_leader_2.GetName]."
 forceofwill.5630.d: "Clone [golden_leader_3.GetName]."
 forceofwill.5630.e: "Clone [golden_leader_4.GetName]."
 forceofwill.5630.f: "Clone the [ruler.GetRulerTitle]."

 forceofwill.5635.name: "Aging Leaders"
 forceofwill.5635.desc: "Our $origin_golden_generation$ leaders are showing signs of aging in their public appearances, prompting growing concern among the [this.GetSpeciesAdj] population about whether the §H[this.GetName]§! will endure once they are no longer here to guide us.\n\nAs a result, §H[selected_leader.GetName]§! has volunteered to undergo an experimental anti-aging program in the hope of extending [selected_leader.GetHisHer] career in public service. The proposed blend of metabolic reversal treatments, cellular renewal, and senolytic drugs should make a meaningful impact on [selected_leader.GetHisHer] lifespan."
 forceofwill.5635.a: "Approve treatment for [selected_leader.GetName]."
 forceofwill.5635.b: "Approve treatment for all $origin_golden_generation$ leaders."
 forceofwill.5635.c: "We must accept their mortality."

 forceofwill.5700.name: "[GetIdeologicalAdjCap] Opportunity"
 forceofwill.5700.desc.default: "Since their graduation from the $building_golden_academy$, the conduct of the §H'$origin_golden_generation$'§! of leaders has preoccupied our cultural discourse.\n\nInformed by our deepest convictions about what defines good leadership, there is a social movement to codify the core tenets into a clearly defined state ideology. This doctrinal system would be a lasting legacy of the $building_golden_academy$ program."
 forceofwill.5700.desc.default.replace: "This would replace [ideology.GetName] as our guiding set of values."
 forceofwill.5700.desc.spirit: "High-ranking [GetPriestPlural] have recognized the §H'$origin_golden_generation$'§! of leaders as living embodiments of our sacred values.\n\nInformed by our deepest convictions about what defines effective spiritual leadership, there is a social movement to sanctify these teachings as a state religion. This theological foundation would be a lasting legacy of the $building_golden_academy$ program."
 forceofwill.5700.desc.spirit.replace: "This would replace [ideology.GetName] as our guiding belief system."
 forceofwill.5700.a: "Codify and adopt '$ideology_golden_generation$'."
 forceofwill.5700.a.tt: "This new [Root.GetSpecificIdeologyType] provides unique §Y$TENET$§! options[GetFoW5700TooltipExtra]."
 forceofwill.5700.a.tt.extra: " and begins with the same §Y$IDEOLOGY_STRENGTH$§! as §Y[ideology.GetName]§!" # Opening space is intentional
 forceofwill.5700.b.default: "Such debates are not for the state to settle."
 forceofwill.5700.b.autho: "Our existing policies are effective as they are."
 forceofwill.5700.b.spirit: "Our existing beliefs need no further clarification."

 golden_generation_death_common: "A renowned alumnus of the $building_golden_academy$ has passed away"

 forceofwill.5710.name: "Golden Legacy"
 forceofwill.5710.desc: "As time passes, memories of our original §H$origin_golden_generation$§! of leaders are fading from the public consciousness.\n\nWe must decide how - or whether - to educate future generations of [this.GetSpeciesNamePlural] about this formative chapter in our society's history.\n\nHow should they be remembered?"
 forceofwill.5710.a: "Honor them as heroes."
 forceofwill.5710.b: "Mistakes were made. We must learn from them."
 forceofwill.5710.c: "Let memories fade. We must look forward."

 origin_golden_generation_lost_tt: "§RThis is the end of the §Y$origin_golden_generation$§!.§!"

 forceofwill.5800.name: "$building_golden_academy$ Lost"
 forceofwill.5800.desc: "§H[from.GetName]§! has been lost to us, leaving the $building_golden_academy$ training program in disarray.\n\nOur attempt at evacuation was unsuccessful, and most of the academy's staff and students were left stranded on the planet. Their current status is unknown.\n\nThe tremendous potential represented by the $building_golden_academy$ has been lost, along with any hopes for the future '$origin_golden_generation$' of leaders it may have produced.\n\n[this.GetSpeciesNamePlural] are coming together to support each other in this difficult time."
 forceofwill.5800.a: "Our efforts have gone to waste."

 forceofwill.5810.name: "$building_golden_academy$ Destroyed"
 forceofwill.5810.desc: "The $building_golden_academy$ on §H[this.GetName]§! has been destroyed. Many of its staff and students perished in the attack.\n\nOur flagship leader training program lies in ruins and all our efforts have gone to waste. [Owner.GetSpeciesNamePlural] are coming together to support each other in this difficult time."
 forceofwill.5810.a: "Tragic news."

# Ideological Ambition events (Force of Will / Divine Mandate)
 forceofwill.6005.name: "$FORCE_OF_WILL_SPECIAL_PROJECT_1$"
 forceofwill.6005.desc: "Our communications infrastructure has begun dissemination of a broad range of media content to neighboring star nations, presenting the guiding principles of §H[Ideology.GetName]§!.\n\nAdapted to local languages and cultural sensibilities, these materials are intended to foster awareness of the [Ideology.GetEthicLower] ideals upon which the [Root.GetName] is built."
 forceofwill.6005.a: "An idea, once planted, may spread farther than any fleet."

 forceofwill.6010.name: "$FORCE_OF_WILL_SPECIAL_PROJECT_2$"
 forceofwill.6010.desc.outro: "are now underway across neighboring star nations, engaging directly with local populations to challenge the beliefs and assumptions that hinder acceptance of §H[Ideology.GetName]§!.\n\nThrough public discourse, informational outreach, and cultural exchange, we are laying the foundation for broader ideological awakening."
 forceofwill.6010.desc.default: "Our education campaigns $forceofwill.6010.desc.outro$"
 forceofwill.6010.desc.spiritualist: "Our missionary efforts $forceofwill.6010.desc.outro$"
 forceofwill.6010.a: "They must learn to let go of old ways."

 forceofwill.6015.name: "$FORCE_OF_WILL_SPECIAL_PROJECT_3$"
 forceofwill.6015.desc: "Instruction in the principles of §H[Ideology.GetName]§! continues to spread throughout neighboring star nations as newly converted populations begin applying its values to every aspect of public and private life.\n\nGuided by our example, they are reevaluating long-held assumptions concerning family, interpersonal relations, civic duty, and even mortality itself.\n\nIncreasingly, they have come to see that the wisdom of [Ideology.GetName] may be applied to all facets of existence."
 forceofwill.6015.a.default: "Their progress is its own reward."
 forceofwill.6015.a.spiritualist: "The faithful shall lead the way."

 forceofwill.6020.name: "$FORCE_OF_WILL_SPECIAL_PROJECT_4$"
 forceofwill.6020.desc.intro: "Our efforts are now directed toward those societies still most resistant to the practice of [Ideology.GetEthicLower] values."
 forceofwill.6020.desc.outro: "cannot be considered complete while minds remain untouched by our ideals."
 forceofwill.6020.desc.default: "$forceofwill.6020.desc.intro$\n\nTheir reeducation requires immense patience and perseverance, yet our galactic fellowship $forceofwill.6020.desc.outro$"
 forceofwill.6020.desc.spiritualist: "$forceofwill.6020.desc.intro$\n\nTheir conversion requires immense patience and perseverance, yet our galactic congregation $forceofwill.6020.desc.outro$"
 forceofwill.6020.a: "The most difficult lessons bring the greatest learning."

 forceofwill.6025.name: "[GetFoW6025Name]"
 forceofwill.6025.name.default: "Galactic Utopia Draws Near"
 forceofwill.6025.name.spiritualist: "Galactic Salvation Draws Near"
 forceofwill.6025.desc.common: "Only scattered pockets of skepticism linger in ignorance. We must not abandon them, nor shrink from the task of opening their minds to our message."
 forceofwill.6025.desc.default: "Across the galaxy, countless minds now recognize the essential truths of §H[Ideology.GetName]§!. Regardless of origin or creed, citizens of various star nations are united in their unwavering commitment to [Ideology.GetEthicLower] values.\n\n$forceofwill.6025.desc.common$"
 forceofwill.6025.desc.spiritualist: "Across the galaxy, countless minds are united in devotion to §H[Ideology.GetName]§!. Regardless of origin or creed, believers from all star nations gather in shared reverence for the sacred rituals which sustain our faith. Our duty to enlighten those less fortunate than ourselves nears fulfillment.\n\n$forceofwill.6025.desc.common$"
 forceofwill.6025.a: "The galaxy is ready."

 forceofwill.6030.name: "$force_of_will_chain_title$"
 forceofwill.6030.desc.default: "$force_of_will_chain_desc_default$"
 forceofwill.6030.desc.spiritualist: "$force_of_will_chain_desc_spiritualist$"
 forceofwill.6030.a.default: "We must not fail."
 forceofwill.6030.a.spiritualist: "Our faith will guide us."

 forceofwill.6035.name: "Growing Consensus"
 forceofwill.6035.desc.intro: "Our efforts have borne fruit; across the galaxy familiarity with our principles continues to grow, though true alignment will require patience.\n\nFor now, many still cling to the long-held values that shaped their societies, remaining"
 forceofwill.6035.desc.outro: "These misguided convictions must first be cast aside before our neighboring star nations can fully embrace the fundamental principles which will elevate them."
 forceofwill.6035.desc.materialist: "$forceofwill.6035.desc.intro$ reluctant to confront the irrational foundations of their beliefs.\n\n$forceofwill.6035.desc.outro$"
 forceofwill.6035.desc.xenophile: "$forceofwill.6035.desc.intro$ hesitant to examine their own prejudices.\n\n$forceofwill.6035.desc.outro$"
 forceofwill.6035.desc.pacifist: "$forceofwill.6035.desc.intro$ mistaken in their belief that strength is born of militarism.\n\n$forceofwill.6035.desc.outro$"
 forceofwill.6035.desc.egalitarian: "$forceofwill.6035.desc.intro$ beholden to systems of control and oppression.\n\n$forceofwill.6035.desc.outro$"
 forceofwill.6035.desc.spiritualist: "Our efforts have borne fruit; across the galaxy familiarity with our teachings continues to grow, though true conversion will require patience.\n\nFor now, many still cling to the long-held values that shaped their societies, remaining blind to the truths that no laboratory can isolate.\n\nThese misguided convictions must first be cast aside before our neighboring star nations can fully embrace the divine message which will save them."
 forceofwill.6035.a.default: "We must redouble our efforts."
 forceofwill.6035.a.spiritualist: "We will show them the way."

 forceofwill.6040.name: "Rising Movement"
 forceofwill.6040.desc.intro.default: "With each passing day, our educational campaigns inspire countless minds across the galaxy with the guiding principles of §H[Ideology.GetName]§!. Among neighboring star nations, more and more societies are adopting the values and customs which are prevalent within the [Root.GetName]."
 forceofwill.6040.desc.intro.spiritualist: "With each passing day, our missionary work opens countless minds across the galaxy to our divine message. Among neighboring star nations, the rituals and teachings of §![Ideology.GetName]§! have begun to take root."
 forceofwill.6040.desc.common: "Yet such newfound convictions are fragile and easily shaken. We must teach others to anchor these ideals at the very center of their worldview, so that they may guide thought and action at all times."
 forceofwill.6040.desc.materialist: "$forceofwill.6040.desc.intro.default$\n\n$forceofwill.6040.desc.common$\n\nReason must prevail over superstition."
 forceofwill.6040.desc.xenophile: "$forceofwill.6040.desc.intro.default$\n\n$forceofwill.6040.desc.common$\n\nTolerance must triumph over fear."
 forceofwill.6040.desc.pacifist: "$forceofwill.6040.desc.intro.default$\n\n$forceofwill.6040.desc.common$\n\nPeace must be preserved at any cost."
 forceofwill.6040.desc.egalitarian: "$forceofwill.6040.desc.intro.default$\n\n$forceofwill.6040.desc.common$\n\nEquality must stand above tyranny."
 forceofwill.6040.desc.spiritualist: "$forceofwill.6040.desc.intro.spiritualist$\n\n$forceofwill.6040.desc.common$\n\nA devout existence is not a fleeting convenience, but the fundamental truth through which we understand our place in the cosmos."
 forceofwill.6040.a.default: "Their commitment must be absolute."
 forceofwill.6040.a.spiritualist: "They must become true believers."

 forceofwill.6045.name: "Galactic Mandate"
 forceofwill.6045.desc.default: "Inspired by our example, our fellow star nations are beginning to recognize the fundamental truths of §H[Ideology.GetName]§! and incorporate such values into their daily lives.\n\nYet still, our work is not complete. Across the galaxy, countless civilizations still remain beyond our reach."
 forceofwill.6045.desc.spiritualist: "As ever greater numbers embrace §H[Ideology.GetName]§!, many who once lived unaware of divine blessings now awaken to a new perspective. Through our guidance, they come to understand their true purpose and place within the galaxy for the very first time.\n\nYet still, our sacred duty remains fulfilled. We must continue our work, for there are countless souls who have yet to hear our message."
 forceofwill.6045.a.default: "Our galactic utopia nears reality."
 forceofwill.6045.a.spiritualist: "We cannot falter now."

 forceofwill.6070.name: "[GetFoW6070Name]"
 forceofwill.6070.name.single_fe: "$concept_fallen_empire$ Provoked"
 forceofwill.6070.name.multiple_fe: "$concept_fallen_empires$ Provoked"
 forceofwill.6070.desc: "The successful spread of §H[Ideology.GetName]§! across the galaxy has provoked a hostile response from [GetFoW6070FallenEmpireDesc]. Threatened by the rising influence of our [Ideology.GetIdeologyType], they have declared war upon all followers of [Ideology.GetName]."
 forceofwill.6070.fallen_empire_name: "a §H$concept_fallen_empire$§!"
 forceofwill.6070.fallen_empire_name_plural: "the §H$concept_fallen_empires$§! of the galaxy"
 forceofwill.6070.a.default: "Our galactic utopia faces an existential threat."
 forceofwill.6070.a.spiritualist: "The salvation of the galaxy is at stake."
 forceofwill.6070.tooltip: "Defeating the §H[GetFoW6070FallenEmpire]§! has been added to your ambition victory conditions"
 forceofwill.6071.a.no_ascension_perk: "What have we gotten ourselves into?"

 forceofwill.6090.name: "[GetFoW6090Name]"
 forceofwill.6090.name.default: "Galactic Utopia"
 forceofwill.6090.name.spiritualist: "Galactic Salvation"
 forceofwill.6090.desc: "ensuring the core values of our [GetIdeologyType] are almost universally upheld across the entire galaxy."
 forceofwill.6090.desc.pretext: "The overwhelming influence of [Ideology.GetName] is now beyond dispute.\n\n"
 forceofwill.6090.desc.default: "$forceofwill.6090.desc.pretext$We have engineered the birth of a galactic utopia, $forceofwill.6090.desc$"
 forceofwill.6090.desc.spiritualist: "$forceofwill.6090.desc.pretext$We have engineered the salvation and enlightenment of countless minds, $forceofwill.6090.desc$"
 forceofwill.6090.a.default: "The gifts of [Ideology.GetFoWIdeal] are shared by all."
 forceofwill.6090.a.spiritualist: "We have shown them the way."
 forceofwill.6090.a.win_tt: "§G[Ideology.GetName] wins the game.§!"

 forceofwill.6091.desc: "$forceofwill.6090.desc.pretext$Under the guidance of §H[Ideology.Owner.GetName]§!, we have played our part in $forceofwill.6090.desc$"

 forceofwill.6095.name: "[From.Ideology.GetIdeologicalAdjCap] Supremacy"
 forceofwill.6095.desc: "The overwhelming influence wielded by the §H[From.GetName]§! and their doctrine of [From.Ideology.GetName] is now indisputable. Across neighboring star nations, their values have taken root with alarming thoroughness.\n\nReluctantly, we must acknowledge that the galaxy will be shaped according to their vision of the future."
 forceofwill.6095.a: "Bad news."
 forceofwill.6095.a.tt: "§H[From.Ideology.GetName]§! wins the game."

 forceofwill.6096.name: "Indisputable Dominance"
 forceofwill.6096.desc: "Our efforts to spread the teachings of [Ideology.GetName] across the galaxy have faltered in the face of the overwhelming influence wielded by the §H[From.GetName]§! and their doctrine of [From.Ideology.GetName]. Throughout neighboring star nations, their values have taken root too deeply for our message to prevail.\n\nReluctantly, we must abandon our hopes of guiding the galaxy toward our vision of the future."
 forceofwill.6096.a: "That dream shall remain unrealized."
 forceofwill.6096.a.tt: "§H[From.Ideology.GetName]§! wins the game."

# Convert Fleet espionage operation
 forceofwill.6100.name: "$forceofwill.7100.name.gestalt$"
 forceofwill.6100.desc: "Our [owner.GetOperativesLowerPlural] have completed in-depth psychological profiling of senior officers in charge of the [target.GetName]'s largest fleet, identifying those most likely to be open to the ideals of [owner.ideology.GetName].\n\nWe believe that converting this leadership group to our cause will be sufficient to secure the fleet's defection to the [owner.GetName].\n\nOur intelligence agents are now designing personalized message campaigns to educate them in the essential truths of our [owner.GetSpecificIdeologyType]."

 forceofwill.6105.name: "Communications in Progress"
 forceofwill.6105.desc: "Our [owner.GetOperativesLowerPlural] have begun targeting [target.GetAdj] fleet officers through both direct and indirect communications designed to introduce them to the principles of [owner.ideology.GetName].\n\nInitial reports are encouraging, with targets displaying openness to [owner.ideology.GetEthicLower] ideas and a willingness to entertain new perspectives and modes of thought."
 forceofwill.6105.a: "Excellent. Continue operations."

 forceofwill.6110.name: "$operation.6310.name$"
 forceofwill.6110.desc.start: "After a sustained campaign of targeted messaging, a number of senior officers in command of the [target.GetName]'s largest fleet are now deeply committed to [owner.ideology.GetName]. They identify strongly with our mission to"
 forceofwill.6110.desc.end: "and are prepared to defect to the [owner.GetName] to further its progress.\n\nThey await our signal to break cover and take decisive action."
 forceofwill.6110.desc.spiritualist: "$forceofwill.6110.desc.start$ bring spiritual enlightenment to the galaxy $forceofwill.6110.desc.end$"
 forceofwill.6110.desc.default: "$forceofwill.6110.desc.start$ foster a galactic utopia $forceofwill.6110.desc.end$"

 forceofwill.6115.name: "$operation.6015.name$"
 forceofwill.6115.desc.common: "The largest fleet under the command of the [fromfrom.GetName] is ready to formally defect and set a course for [Root.Capital.GetName].\n\nThey await our instructions on how best to serve us in"
 forceofwill.6115.desc.spiritualist: "$forceofwill.6115.desc.common$ bringing spiritual enlightenment to the galaxy through the divine truths of [ideology.GetName]."
 forceofwill.6115.desc.default: "$forceofwill.6115.desc.common$ fostering a galactic utopia under the banner of [ideology.GetName]."
 forceofwill.6115.a: "They will aid us in our mission."
 forceofwill.6115.a.tt: "The largest military fleet of the §Y[fromfrom.GetName]§! joins the §Y[owner.GetName]§! and moves to the [root.capital_scope.GetName] system."
 forceofwill.6115.a.fail: "The §Y[fromfrom.GetName]§! must have military fleets to be converted"
 forceofwill.6115.b: "Their services are no longer needed."

 forceofwill.6120.name: "Grand Ambitions"
 forceofwill.6120.desc: "Although neighboring star nations now regard us as the foremost authority of [FromFrom.GetName], we should do well to remain wary of the ambitions of others.\n\nThe §H[From.GetName]§! harbors intentions of spreading this powerful [FromFrom.GetIdeologyType] across the entire galaxy; their actions must be watched closely."
 forceofwill.6120.a: "We must be vigilant."

 forceofwill.6125.name: "Will Unbroken"
 forceofwill.6125.desc.intro: "Although the §H[From.GetName]§! now surpasses us as the foremost authority of [FromFrom.GetName], our efforts to spread our [FromFrom.GetIdeologyType] across the stars must not falter.\n\n"
 forceofwill.6125.desc.default: "$forceofwill.6125.desc.intro$Our vision of a galactic utopia remains within reach; we must see our mission through."
 forceofwill.6125.desc.spiritualist: "$forceofwill.6125.desc.intro$Our duty to carry the divine message to the stars is as strong as ever; we must stand resolute."
 forceofwill.6125.a: "Our will is unbroken."

 forceofwill.6140.name: "Unshakeable Convictions"
 forceofwill.6140.desc.start: "Our newfound ambition to spread §H[Ideology.GetName]§! across the galaxy has not gone unnoticed by our aggressors.\n\nNow convinced of our unwavering"
 forceofwill.6140.desc.end: "they have aborted their ill-conceived war to convert us to their ways of thinking."
 forceofwill.6140.desc.spiritualist: "$forceofwill.6140.desc.start$ devotion to our own beliefs, $forceofwill.6140.desc.end$"
 forceofwill.6140.desc: "$forceofwill.6140.desc.start$ conviction in our own ideals, $forceofwill.6140.desc.end$"
 forceofwill.6140.a: "We will not be dissuaded."
 forceofwill.6140.a.tt: "The §H[From.GetName]§! is no longer the target of any §Y$NAME_IDEOLOGICAL_WAR_PLURAL$§!."

 forceofwill.6145.name: "$NAME_IDEOLOGICAL_WAR$ Campaign Abandoned"
 forceofwill.6145.desc.start: "The §H[From.GetName]'s§! increasingly resolute"
 forceofwill.6145.desc.end: "their [From.GetSpecificIdeologyType] has ultimately led us to conclude that our military campaign has no chance of successfully converting them to §H[Ideology.GetName]§!.\n\nWe must consider alternative methods of persuading them to adopt our values and ways of thinking."
 forceofwill.6145.desc.spiritualist: "$forceofwill.6145.desc.start$ devotion to $forceofwill.6145.desc.end$"
 forceofwill.6145.desc: "$forceofwill.6145.desc.start$ conviction in $forceofwill.6145.desc.end$"

# Cultural Envoy events
 forceofwill.7020.name: "$cultural_envoy_ship_plural$ in Orbit"
 forceofwill.7020.desc.intro: "A foreign vessel from the §H[FromFrom.GetName]§! has entered orbit above our colony on §H[From.GetName]§! and begun a coordinated campaign of public outreach directed at the local population. Initial reports indicate the distribution of media and cultural programming intended to promote the values and societal ideals of the [FromFrom.GetName]."
 forceofwill.7020.desc.common: "While exposure to these foreign perspectives appears to have produced some favorable effects among parts of the populace, we must"
 forceofwill.7020.desc.same: "$forceofwill.7020.desc.common$ continue to monitor the situation closely, as the long-term consequences of this ideological exchange remain uncertain."
 forceofwill.7020.desc.different: "$forceofwill.7020.desc.common$ not allow such dangerous [FromFrom.Ideology.GetEthicLower] thinking to spread unchecked."
 forceofwill.7020.a: "We must be vigilant."
 forceofwill.7021.name: "Unknown [FromFrom.Ideology.GetIdeologicalAdjCap] Influence"
 forceofwill.7021.desc.intro: "The population of §H[From.GetName]§! is being subjected to a coordinated campaign of [FromFrom.Ideology.GetIdeologicalAdj] messaging from an unknown source. The media and materials are clearly of foreign origin, promoting values and societal ideals alien to our own.\n\nWhile there is no evidence that these messages reached [From.GetName] through our own communications networks, our sensors have detected no entities near the [From.GetPlanetMoon] from which they could be transmitted."
 CONCERNING: "Concerning."

 forceofwill.7026.name: "Hero of [Ideology.GetName]"
 forceofwill.7026.desc.default: "While spreading our message in orbit of [FromFromFrom.GetName], our $cultural_envoy$ was mercilessly destroyed by §H[From.GetName]§!.\n\nThis act of senseless aggression has outraged all followers of §H[Ideology.GetName]§!, inspiring defiance and resolve to draw enduring strength from their sacrifice."
 forceofwill.7026.desc.revolt: "$forceofwill.7026.desc.default$\n\nThe people of [FromFromFrom.GetName] have risen up in protest of this great injustice. They now fight for their freedom to follow the principles of [Ideology.GetName]!"
 forceofwill.7026.a.default: "May their devotion be their legacy."
 forceofwill.7026.a.spiritualist: "May their faith be their legacy."

 forceofwill.7027.name: "Foreign Agitator Eliminated"
 forceofwill.7027.desc.default: "After repeated violations of our sovereign territory by agents of §H[From.GetName]§!, authorities report that their $cultural_envoy$ was destroyed while operating in orbit of [FromFrom.GetName].\n\nThese so-called envoys have spread the rhetoric of §H[From.Ideology.GetName]§! among our population, encouraging unrest and undermining the stability of our worlds. Their actions could no longer be tolerated."
 forceofwill.7027.desc.revolt: "$forceofwill.7027.desc.default$\n\nDespite our best efforts to maintain order, dissidents on [FromFrom.GetName] have risen up in open revolt after embracing these dangerous ideals."
 forceofwill.7027.a.default: "Let this be a lesson, their presence will not be tolerated."
 forceofwill.7027.a.nice: "Regrettable, but necessary."
 forceofwill.7027.a.xenophobe: "Xeno scum."

 forceofwill.7035.name: "$cultural_envoy$ Specialization"
 forceofwill.7035.desc: "As our official ambassador in one of our newly developed $cultural_envoy_ship_plural$, §H[Root.GetName]§! is showing promise in developing creative ways of spreading the message of [Owner.Ideology.GetName] as a §Y[Root.GetCulturalEnvoySubclass]§!. However, should we wish, we can retrain [Root.GetHimHer] in a different specialization that better suits our needs."
 forceofwill.7035.a: "[Root.GetHisHerCap] current skills are adequate."
 forceofwill.7035.b: "Train [Root.GetHimHer] as an §Y$leader_trait_cultural_envoy_indoctrinator$§!."
 forceofwill.7035.c: "Train [Root.GetHimHer] as a §Y$leader_trait_cultural_envoy_zealot$§!."
 forceofwill.7035.d: "Train [Root.GetHimHer] as a §Y$leader_trait_cultural_envoy_persuasive_luminary$§!."
 forceofwill.7035.e: "Train [Root.GetHimHer] as a §Y$leader_trait_cultural_envoy_negotiator$§!."

 forceofwill.7055.name: "$cultural_envoy_ship_plural$"
 forceofwill.7055.desc.intro: "With the aid of our newly developed $cultural_envoy_ship_plural$, we now stand ready to spread the message of [Ideology.GetName] farther than ever before.\n\n"
 forceofwill.7055.desc.default: "$forceofwill.7055.desc.intro$These diplomatic vessels are designed to inspire minds, carrying out educational initiatives - unhindered by borders or boundaries - to enlighten any colony of our choosing."
 forceofwill.7055.desc.spiritualist: "$forceofwill.7055.desc.intro$These diplomatic vessels are designed to inspire minds and uplift souls, carrying out missionary endeavors - unhindered by borders or boundaries - to convert any colony of our choosing."
 forceofwill.7055.a.spiritualist: "Hearts and minds will open to our divine truth."
 forceofwill.7055.a.pacifist: "Hearts and minds will open to our message of peace."
 forceofwill.7055.a.xenophile: "Hearts and minds will open to our spirit of tolerance."
 forceofwill.7055.a.materialist: "Hearts and minds will open to our pursuit of reason."
 forceofwill.7055.a.egalitarian: "Hearts and minds will open to our egalitarian principles."
 forceofwill.7055.tooltip: "§Y$cultural_envoy_ship_plural$§! can now be built in the ['concept_shipyard'] and used to convert colonized systems to your ideology. §Y$cultural_envoy_ship_plural$§! are unaffected by empire borders and work independently of ['concept_ideological_reach']."

# Ideological Espionage events
 forceofwill.7100.name: "[GetFoW7100Name]"
 forceofwill.7100.name.default: "Communications Infiltrated"
 forceofwill.7100.name.gestalt: "Targets Identified"
 forceofwill.7100.desc.default: "Our [owner.GetOperativesLowerPlural] have successfully infiltrated a range of communication channels in the [target.GetName]. They are now in the deep research phase of Operation [this.GetName], monitoring public discourse surrounding the state [target.GetSpecificIdeologyType] known as §H[target.ideology.GetName]§!."
 forceofwill.7100.desc.gestalt: "Our [owner.GetOperativesLowerPlural] have identified a number of [target.GetIndividualNamePlural] within the §H[target.GetName]§! who they consider promising targets for information gathering.\n\nIf these [target.GetIndividualNamePlural] can be induced to divulge information from the [target.GetAdj] collective intelligence, we can learn much about the [target.GetHiveEntity]'s attitude to their adopted [target.GetSpecificIdeologyType] known as §H[target.ideology.GetName]§!."

 forceofwill.7105.name: "[target.ideology.GetIdeologicalAdjCap] Intelligence Report"
 forceofwill.7105.desc.intro.default: "Our [owner.GetOperativesLowerPlural] have completed their analysis of public discourse surrounding the state [target.GetSpecificIdeologyType] of the [target.GetName]. The assembled dossier identifies contentious aspects of §H[target.ideology.GetName]§! that are exploitable sources of [target.ideology.GetIdeologicalAdj] tension."
 forceofwill.7105.desc.intro.gestalt: "Our [owner.GetOperativesLowerPlural] have obtained information from [target.GetIndividualNamePlural] within the [target.GetName] about their adopted [target.GetSpecificIdeologyType]. The assembled dossier identifies a number of key aspects of §H[target.ideology.GetName]§! that are significant sources of cognitive dissonance within the [target.GetHiveEntity]."
 forceofwill.7105.desc.outro: "Our next objective is to test the methods by which our psyops [owner.GetTeamNamePlural] can exacerbate these issues to sow [target.ideology.GetIdeologicalAdj] doubt."
 forceofwill.7105.desc.default: "$forceofwill.7105.desc.intro.default$\n\n$forceofwill.7105.desc.outro$"
 forceofwill.7105.desc.gestalt: "$forceofwill.7105.desc.intro.gestalt$\n\n$forceofwill.7105.desc.outro$"
 PROMISING: "Promising."

 forceofwill.7110.name: "Test Run Success"
 forceofwill.7110.desc.intro: "To test their methods, our psyops [owner.GetTeamNamePlural] crafted a series of provocative narratives surrounding §H[target.ideology.GetName]§! and disseminated them through compromised communication channels within the [target.GetName]. Their objective was to maximize [target.ideology.GetIdeologicalAdj] distrust while concealing any trace of foreign involvement.\n\nThe test proved successful, with messages surrounding"
 forceofwill.7110.desc.outro: "found to be the most effective.\n\nWe are now preparing a broader disinformation campaign. Our [owner.GetOperativesLowerPlural] must establish a wider network of sympathetic [target.GetIndividualNamePlural] within [target.GetAdj] society to amplify these messages on a massive scale."
 forceofwill.7110.desc.tenets: "$forceofwill.7110.desc.intro$ the tenet of [target.GetLastTenetName] $forceofwill.7110.desc.outro$"
 forceofwill.7110.desc.gestalt: "$forceofwill.7110.desc.intro$ deviant [target.ideology.GetEthicLower] practices $forceofwill.7110.desc.outro$"
 forceofwill.7110.desc.regular: "$forceofwill.7110.desc.intro$ unorthodox [target.ideology.GetEthicLower] practices $forceofwill.7110.desc.outro$"

 forceofwill.7115.name: "$operation.6310.name$"
 forceofwill.7115.desc.common: "Our [owner.GetOperativesLowerPlural] have established a covert communications network within the [target.GetName].\n\nThese collaborating [target.GetIndividualNamePlural] are ready to disseminate our messages about the society's official [target.GetSpecificIdeologyType], which have been carefully crafted to exploit [target.ideology.GetIdeologicalAdj] contradictions and create"
 forceofwill.7115.desc.gestalt: "$forceofwill.7115.desc.common$ dissonance surrounding §H[target.ideology.GetName]§!."
 forceofwill.7115.desc.default: "$forceofwill.7115.desc.common$ disillusionment surrounding §H[target.ideology.GetName]§!."

 forceofwill.7120.name: "$operation.6015.name$"
 forceofwill.7120.desc.intro: "In a short space of time, our disinformation campaign has had a profound impact throughout the §H[fromfrom.GetName]§!. By exploiting existing fractures within [fromfrom.GetAdj] society, we have begun to undermine confidence in §H[fromfrom.ideology.GetName]§! and erode the [fromfrom.ideology.GetIdeologicalAdj]"
 forceofwill.7120.desc.outro: "The effects will be felt for many years to come."
 forceofwill.7120.desc.gestalt: "$forceofwill.7120.desc.intro$ integrity of the [fromfrom.GetAdj] [fromfrom.GetHiveEntity].\n\n$forceofwill.7120.desc.outro$"
 forceofwill.7120.desc.default: "$forceofwill.7120.desc.intro$ legitimacy of the [fromfrom.GetAdj] state.\n\n$forceofwill.7120.desc.outro$"
 forceofwill.7120.a: "A resounding success!"
 forceofwill.7120.a.tt.default: "§Y[fromfrom.GetName]§! gets the §H$modifier_sow_ideological_doubt$§! modifier:\n$modifier_sow_ideological_doubt_tt$"
 forceofwill.7120.a.tt.gestalt: "§Y[fromfrom.GetName]§! gets the §H$modifier_sow_ideological_doubt_gestalt$§! modifier:\n$modifier_sow_ideological_doubt_gestalt_tt$"

 forceofwill.7122.name: "Operation Aborted"
 forceofwill.7122.desc: "The §H[From.GetName]§! has officially renounced its adopted ideology. As a result, our espionage operation targeting the population's adherence to this ideological framework is no longer required and has been terminated."
 forceofwill.7122.tooltip: "Operation §Y$operation_sow_ideological_doubt$§! against the §Y[From.GetName]§! is aborted."

# Information Manipulation espionage operation
 forceofwill.7125.name: "Operational Target Identified"
 forceofwill.7125.desc: "Our [Owner.GetOperativesLowerPlural] have identified a target for manipulating information within the [Target.GetName]: a §Hprominent data center§! that forms a key node of their communication network.\n\nExploiting the facility's systems will require the help of one or more [Target.GetAdj] [Target.GetIndividualNamePlural] with physical access. $role_spymaster$ [root.spynetwork.leader.GetName] has approved a list of promising targets."

 forceofwill.7130.name: "[Target.GetAdj] Agent Recruited"
 forceofwill.7130.desc: "Our [Owner.GetOperativesLowerPlural] have successfully recruited an agent to help us gain access to a key §H[Target.GetAdj] data center on [target.capital_scope.GetName]§!. By [GetFoW7130Motivation], we were able to compel this [Target.GetIndividualName] to reveal classified information and agree to assist in a future operation."
# GetFoW7130Motivation
 forceofwill_7130_motivation_1: "offering a substantial financial reward"
 forceofwill_7130_motivation_2: "threatening to reveal embarrassing secrets"
 forceofwill_7130_motivation_3: "appealing to their ideological dissatisfaction"
 forceofwill_7130_motivation_gestalt: "exploiting their deviance from the collective consciousness"

 forceofwill.7135.name: "$operation.6310.name$"
 forceofwill.7135.desc.common: "With the assistance of an agent from the [Target.GetName], our [Owner.GetOperativesLowerPlural] are ready to infiltrate a §Hdata center on [target.capital_scope.GetName]§!. Their mission is to install equipment that will allow us to manipulate information that flows through [Target.GetAdj] communication networks.\n\nThe operation can begin as soon as $role_spymaster$ [root.spynetwork.leader.GetName] receives"
 forceofwill.7135.desc.default: "$forceofwill.7135.desc.common$ official authorization."
 forceofwill.7135.desc.gestalt: "$forceofwill.7135.desc.common$ confirmation from the [Owner.GetBrainName]."

 forceofwill.7140.name: "$operation.6015.name$"
 forceofwill.7140.desc: "Despite significant hurdles, the mission to infiltrate a prominent data center on [fromfrom.capital_scope.GetName] achieved its objectives. Our [Root.GetOperativesLowerPlural] installed equipment that allows us to manipulate a significant portion of information that flows through the [fromfrom.GetName].\n\nShould this one day be discovered, processes are in place to eradicate any evidence that might lead back to the [Root.GetName]. Until then, we have unprecedented control over ideological messaging that passes between us and the [fromfrom.GetAdj] population."
 forceofwill.7140.tt.target_heading: "§Y[fromfrom.GetName]§!:"
 forceofwill.7140.tt.target_reach: "$MOD_IDEOLOGICAL_RESISTANCE_MULT$ to §Y[root.ideology.GetName]§!: §R$@information_manipulation_reach_malus|0%$§!"
 forceofwill.7140.tt.target_modifier: "All owned colonies within the §HReach§! of §Y[root.ideology.GetName]§! get the §H$operation_information_manipulation_modifier$§! modifier:$TABBED_NEW_LINE$- $operation_information_manipulation_modifier_tt$"
 forceofwill.7140.tt.root: "\n§Y[root.GetName]§!:\n$MOD_IDEOLOGICAL_RESISTANCE_MULT$ to §Y[fromfrom.ideology.GetName]§!: §G+$@information_manipulation_reach_bonus|0%$§!"

# Incite Ideological Revolt espionage operation
 forceofwill.7145.name: "Tensions on the Rise"
 forceofwill.7145.desc: "Our [owner.GetOperativesLowerPlural] have identified a number of divisive political issues related to §H[target.ideology.GetName]§! which can be exploited to foster unrest and instability among populations sympathetic to §H[owner.ideology.GetName]§!.\n\nWe have produced a high volume of provocative media content designed to exacerbate these tensions and begun circulating it across local channels."

 forceofwill.7150.name: "Agitators Recruited"
 forceofwill.7150.desc: "As anger and resentment rises within the §H[target.GetName]§!, we have recruited a number of highly vocal and influential [target.GetAdj] media commentators to further amplify dissent.\n\nThey will leverage their prominent public profiles to direct discontent with §H[target.ideology.GetName]§! towards state institutions and government figures."

 forceofwill.7155.name: "$operation.6310.name$"
 forceofwill.7155.desc: "Our [owner.GetOperativesLowerPlural] have prepared a series of covert operations designed to inflame tensions and further discredit §H[target.ideology.GetName]§! within the §H[target.GetName]§!.\n\nThese carefully staged events are designed to provoke outrage over the most contentious aspects of the state [target.GetSpecificIdeologyType]. Our network of media commentators will swiftly seize upon these incidents, amplifying public anger and directing it against the governing principles of the [target.GetName]."

 forceofwill.7160.name: "$operation.6015.name$"
 forceofwill.7160.desc: "After engineering a series of carefully planned public incidents designed to inflame tensions, our [root.GetOperativesLowerPlural] report a surge in social conflict and political instability throughout the §H[fromfrom.GetName]§!.\n\nTrust in §H[fromfrom.ideology.GetName]§! has eroded, and many aspects of local political and economic life are completely breaking down."
 forceofwill.7160.a: "A satisfying outcome."
 forceofwill.7160.a.tt: "All colonies owned by the §Y[fromfrom.GetName]§! with $pops_with_icon$ following §Y[root.ideology.GetName]§! get ['modifier:operation_incite_ideological_revolt_modifier'] for §Y10§! years."

 forceofwill.7200.name: "Adopt Federation [this.GetIdeologyTypeCap] Proposal"
 forceofwill.7200.desc: "The President of the §H[this.Federation.GetName]§! has presented us with a simple ultimatum: adopt the [federation.federation_leader.GetSpecificIdeologyType] of §H[from.GetName]§! or renounce our membership of the federation entirely.\n\nHow will we respond?"
 forceofwill.7200.a: "A united federation benefits us all."
 forceofwill.7200.a.tt.no_ideology: "§Y[this.GetName]§! must adopt §Y[from.GetName]§!."
 forceofwill.7200.a.tt.ideology: "§Y[this.GetName]§! must abandon §Y[this.ideology.GetName]§! and then adopt §Y[from.GetName]§!."
 REFUSE_PROMPT: "Refuse."

# Ideological Revolt events
 unrest.55.desc.ideological_common: "An ideologically driven revolt has erupted on §H[Root.GetName]§!. Growing numbers are joining the rebellion, with militant activists and disgruntled citizens finding common cause in their doctrinal grievances."
 unrest.55.desc.martyr_drift_common: "many of the rebels are calling for the state's adoption of [ideological_revolt_target_ideology.GetAAnEthic] [ideological_revolt_target_ideology.GetEthicLower] creed known as §H[ideological_revolt_target_ideology.GetName]§!."
 unrest.55.desc.martyr: "$unrest.55.desc.ideological_common$\n\nRadicalized by the destruction of a foreign [ideological_revolt_target_ideology.GetIdeologyCulturalEnvoyName] within the [Root.GetPlanetMoon]'s orbit, $unrest.55.desc.martyr_drift_common$ $ideological_revolt_common_2$"
 unrest.55.desc.martyr_ark: "$unrest.55.desc.ideological_common$\n\nRadicalized by the destruction of a foreign [ideological_revolt_target_ideology.GetIdeologyCulturalEnvoyName] in close proximity to the $arkship$, $unrest.55.desc.martyr_drift_common$ $ideological_revolt_common_2$"
 unrest.55.desc.drift: "$unrest.55.desc.ideological_common$\n\nInfluenced by foreign beliefs, $unrest.55.desc.martyr_drift_common$ $ideological_revolt_common_2$"
 unrest.55.desc.schism: "$unrest.55.desc.ideological_common$\n\n$ideological_revolt_common_schism$ $ideological_revolt_common_2$"

 forceofwill.7310.name: "$unrest_title$ $open_defiance$"
 forceofwill.7310.desc.common_1: "Despite our best efforts at containment, the rebellion on §H[Target.GetName]§! is increasing in scope and severity."
 forceofwill.7310.desc.common_2: "is no longer a fringe concern but increasingly mainstream."
 forceofwill.7310.desc.common_3: "State representatives in the central districts are requesting more assistance in bolstering our control."
 forceofwill.7310.desc.martyr_drift: "$forceofwill.7310.desc.common_1$ Support for [ideological_revolt_target_ideology.GetName], the [ideological_revolt_target_ideology.GetSpecificIdeologyType] promoted by the rebels, $forceofwill.7310.desc.common_2$"
 forceofwill.7310.desc.schism: "$forceofwill.7310.desc.common_1$ Support for abandonment of [owner.ideology.GetName] $forceofwill.7310.desc.common_2$"
 forceofwill.7310.desc.aggressive: "Even the more brazen acts of hardcore insurgents - rioting, property damage, and defiance of state authorities - are openly endorsed by once-peaceful citizens. $forceofwill.7310.desc.common_3$"
 forceofwill.7310.desc.martyr_drift_pacifist: "Views once isolated to a hardcore of [ideological_revolt_target_ideology.GetEthicLower] zealots are openly endorsed by once-moderate citizens. $forceofwill.7310.desc.common_3$"
 forceofwill.7310.desc.schism_pacifist: "Views once isolated to a hardcore of zealots - directly contradicting the ethical foundation of [owner.ideology.GetName] - are openly endorsed by once-loyal citizens. $forceofwill.7310.desc.common_3$"
 forceofwill.7310.a: "We are already doing all we can."
 forceofwill.7310.b: "Send whatever they need."

 forceofwill.7315.name: "$unrest_title$ Escalation"
 forceofwill.7315.desc.start: "The inflammatory rhetoric of an insurgent group on §H[Target.GetName]§! has recently escalated.\n\nThey claim that the doctrinal clash between their"
 forceofwill.7315.desc.end: "and the values of the [Owner.GetAdj] state might only be resolved by 'application of force'.\n\nOur intelligence operatives on the [Target.GetPlanetMoon] have reported that the group is preparing to deploy several cells to cause significant property damage during an upcoming mass protest. They advise that an operation to neutralize the threat is feasible, but costly."
 forceofwill.7315.desc.same_ethic: "$forceofwill.7315.desc.start$ 'purer' [ideological_revolt_target_ideology.GetEthicNounLower] $forceofwill.7315.desc.end$"
 forceofwill.7315.desc.default: "$forceofwill.7315.desc.start$ [ideological_revolt_target_ideology.GetEthicLower] creed $forceofwill.7315.desc.end$"
 forceofwill.7315.a: "Intervening will only encourage them."
 forceofwill.7315.b: "We must stop them."

 forceofwill.7320.desc.start: "Salutations. I speak on behalf of all [revolt_situation.target.GetName]-dwellers, who have risen up against the illegitimate rule of the [revolt_situation.owner.GetName] and its misguided ethical principles."
 forceofwill.7320.desc.drift_ideology: "We share your commitment to [ideological_revolt_target_ideology.GetName], which promises a brighter future than the corrupted [revolt_situation.owner.ideology.GetEthicNounLower] preached from [revolt_situation.owner.capital_scope.GetName]."
 forceofwill.7320.desc.drift_no_ideology: "We share your commitment to [ideological_revolt_target_ideology.GetName], which promises a brighter future than the corrupted values preached from [revolt_situation.owner.capital_scope.GetName]."
 forceofwill.7320.desc.schism: "We share your interpretation of [ideological_revolt_target_ideology.GetName], which promises a brighter future than the corrupted [revolt_situation.owner.ideology.GetEthicNounLower] preached from [revolt_situation.owner.capital_scope.GetName]."
 forceofwill.7320.desc.common: "If you help us to fight free from the [revolt_situation.owner.GetAdj] yoke, we will gladly"
 forceofwill.7320.desc.end.default: "$forceofwill.7320.desc.common$ join the [Root.GetName]."
 forceofwill.7320.desc.end.nomadic: "$forceofwill.7320.desc.common$ become the subjects of the [Root.GetName]."
 forceofwill.7320.tt.nomadic: "$unrest.4055.A.tooltip.nomadic$"

 forceofwill.7325.desc.start: "The latest intelligence about the revolt on §H[Target.GetName]§! is troubling: the §H[From.GetName]§! has pledged its support to the rebels, with the apparent aim of"
 forceofwill.7325.desc.end: "the [Target.GetPlanetMoon] should our authority collapse. It appears they have found common ground in the tenets of [From.Ideology.GetName].\n\nWith the backing of a foreign state, containing the rebellion is likely to become considerably more difficult."
 forceofwill.7325.desc.default: "$forceofwill.7325.desc.start$ annexing $forceofwill.7325.desc.end$"
 forceofwill.7325.desc.nomadic: "$forceofwill.7325.desc.start$ subjugating $forceofwill.7325.desc.end$"
 forceofwill.7325.tt.default: "§RIf the revolt on [Target.GetName] succeeds, the [Target.GetPlanetMoon] and its population will join the [From.GetName].§!"
 forceofwill.7325.tt.nomadic: "§RIf the revolt on [Target.GetName] succeeds, the [Target.GetPlanetMoon] and its population will break away as a ['concept_subject'] of the [From.GetName].§!"
 forceofwill.7325.a.genocidal: "Meddling xeno scum."

 forceofwill.7330.name: "$unrest_title$ Failed Overtures"
 forceofwill.7330.desc.start: "Our intelligence services have intercepted numerous communications between the rebels on §H[Target.GetName]§! and foreign states that share their"
 forceofwill.7330.desc.end: "[ideological_revolt_target_ideology.GetEthicLower] creed.\n\nThe rebels requested support for their revolt in exchange for future annexation; thankfully, no such support was forthcoming.\n\nIf they hope to win independence from the [Owner.GetName], they shall have to do so alone."
 forceofwill.7330.desc.drift_martyr: "$forceofwill.7330.desc.start$ $forceofwill.7330.desc.end$"
 forceofwill.7330.desc.schism: "$forceofwill.7330.desc.start$ heterodox $forceofwill.7330.desc.end$"
 forceofwill.7330.a: "What did they expect?"

 ideological_revolt_ending: "The ideologically driven revolt on §H[Target.GetName]§! has ended in disaster. The [Target.GetPlanetMoon] is no longer a part of the [Owner.GetName].\n\nAs attempts to quell the rebellion repeatedly failed, our authority over the colony collapsed district by district. The [GetIdeologicalRebelType], increasingly powerful and well-organized, eventually managed to seize control entirely." # Opening text common to a number of subsequent events

 forceofwill.7335.name.default: "$unrest_title$ [Target.GetName] Annexed"
 forceofwill.7335.name.nomadic: "$unrest_title$ [Target.GetName] Subjugated"
 forceofwill.7335.name: "[GetFoW7335Name]"
 forceofwill.7335.desc.start.nomadic: "The leaders have now accepted subjugation to"
 forceofwill.7335.desc.start.default: "The leaders have now accepted annexation by"
 forceofwill.7335.desc.common: "their [new_owner_empire.ideology.GetIdeologicalAdj] ally, the §H[new_owner_empire.GetName]§!, whose rule is guided by"
 forceofwill.7335.desc.end.drift_martyr: "the [new_owner_empire.ideology.GetEthicLower] tenets of [new_owner_empire.ideology.GetName]."
 forceofwill.7335.desc.end.schism: "a different interpretation of [new_owner_empire.ideology.GetName]."
 forceofwill.7335.desc.nomadic_drift_martyr: "$forceofwill.7335.desc.start.nomadic$ $forceofwill.7335.desc.common$ $forceofwill.7335.desc.end.drift_martyr$"
 forceofwill.7335.desc.nomadic_schism: "$forceofwill.7335.desc.start.nomadic$ $forceofwill.7335.desc.common$ $forceofwill.7335.desc.end.schism$"
 forceofwill.7335.desc.default_drift_martyr: "$forceofwill.7335.desc.start.default$ $forceofwill.7335.desc.common$ $forceofwill.7335.desc.end.drift_martyr$"
 forceofwill.7335.desc.default_schism: "$forceofwill.7335.desc.start.default$ $forceofwill.7335.desc.common$ $forceofwill.7335.desc.end.schism$"
 forceofwill.7335.a: "$enclave.26.a$"
 forceofwill.7335.a.genocidal: "The xenos will pay for this."
 forceofwill.7335.a.tt.nomadic: "$unrest.4200.joiner_tooltip.nomadic$"

 forceofwill.7340.name: "$unrest_title$ [Target.GetName] Secedes"
 forceofwill.7340.desc: "$ideological_revolt_ending$\n\nThey have now declared independence as the §H[rebel_empire.GetName]§!, guided by the foreign principles of '[rebel_empire.ideology.GetName]'."
 forceofwill.7340.a: "Their heresy must be met by force."
 forceofwill.7340.b: "A terrible blow, but we must accept their sovereignty."
 forceofwill.7340.b.genocidal: "Fools. We will tolerate them, for now."
 forceofwill.7340.b.tt: "§Y[Target.GetName]§! has broken away from our control and declared independence as the §Y[rebel_empire.GetName]§!."

 forceofwill.7345.name: "$unrest_title$ Revolt Subsides"
 forceofwill.7345.desc.common: "The ideologically driven revolt on §H[Target.GetName]§! has now subsided.\n\nDespite its significant scale, we managed to contain the rebellion before the [Target.GetPlanetMoon] was lost to our control. The insurrectionists, who previously demanded ideological change - some even threatening secession - have now backed down.\n\nWork still lies ahead as we try to repair public support for"
 forceofwill.7345.desc.ideology: "$forceofwill.7345.desc.common$ [owner.ideology.GetName], and to ensure its effective application throughout [Owner.GetAdj] society in future."
 forceofwill.7345.desc.no_ideology: "$forceofwill.7345.desc.common$ state institutions, and to promote unity of purpose throughout [Owner.GetAdj] society in future."

 forceofwill.7385.desc: "$ideological_revolt_ending$\n\nThey have now declared independence as the §H[rebel_empire.GetName]§!, guided by principles that they claim are a 'purer form' of [rebel_empire.ideology.GetEthicLower] beliefs."
 forceofwill.7385.b: "Though misguided, we must accept their sovereignty."
 forceofwill.7385.b.genocidal: "Fools. We will tolerate them, for now."

 forceofwill.7390.name: "$unrest_title$ Schism Averted"
 forceofwill.7390.desc: "In the face of increasing pressure from [from.GetName]'s population, we have officially abandoned our state doctrine. The insurgents have backed down, apparently satisfied with the ideological concessions they have forced upon us.\n\nThe [Owner.GetName] must now find a way forward beyond its former ethical framework, seeking renewed purpose and unity after this period of bitter instability."
 forceofwill.7390.a: "A new dawn for [Owner.GetAdj] society."

 REJECT_DEMANDS: "Reject their demands."
 FRUSTRATING: "Frustrating."

 forceofwill.7515.name: "Ideological Demands"
 forceofwill.7515.desc: "The §H[from.GetName]§! is demanding that we adopt their beliefs as a state [this.GetIdeologyType], the principles of which are detailed in an official statement from the group's foremost leaders and theoreticians.\n\nThe faction claims that it represents 'the will of virtually all [this.GetSpeciesNamePlural]' and that it 'cannot be denied.'"
 forceofwill.7515.a: "Adopt the ideology."

 forceofwill.7520.name: "Faction Intelligence Leak"
 forceofwill.7520.desc: "The §H[from.GetName]§! has been caught leaking state secrets.\n\nWe have intercepted communications between faction members and operatives within the §H[event_target:intel_leak_empire.GetName]§! that contain classified data from the [Root.GetName]. According to data experts, these intelligence breaches have been occurring for some time, and protecting against further losses will be a slow process.\n\nThe [from.GetName] has officially disavowed these crimes, claiming that responsibility lies with fringe radicals acting without their support."
 forceofwill.7520.a: "Treasonous."

 forceofwill.7525.name: "Fanatical Direct Action"
 forceofwill.7525.desc: "Discontented members of the §H[from.GetName]§! have begun a campaign of direct action, aimed at disrupting the workings of our government.\n\n[Root.Capital.GetName] has seen protests, infrastructure blockades, and even targeted vandalism of state property. When apprehended, the perpetrators display a fanatical disregard for the individual punishments which await them. The situation is placing increased demands on our security services."

 forceofwill.7530.name: "Coup Thwarted"
 forceofwill.7530.desc: "An attempted coup against the government has been thwarted. The plot was planned and carried out by members of the §H[from.GetName]§!, who later confessed to having been motivated by fierce ideological disagreement with government policies.\n\nThe group tried to seize control of key buildings and infrastructure, but were undone by a lack of supplies and equipment which allowed security forces to reassert control. A state of vigilance has been instigated across the [Root.GetName] to guard against a repeat action."

 forceofwill.7535.name: "Leader Kidnapped"
 forceofwill.7535.desc: "§H[event_target:kidnapped_governor.GetName]§! has been kidnapped by members of the §H[from.GetName]§!'s extremist wing.\n\nThe small group of radicals seized [event_target:kidnapped_governor.GetName] from [event_target:kidnapped_governor.GetHisHer] home and are currently holding [event_target:kidnapped_governor.GetHimHer] in an undisclosed location. Statements from the kidnappers declare the action to be a temporary and symbolic response intended to draw attention to our government's 'misguided policy direction'."
 forceofwill.7535.a.tooltip: "§H[event_target:kidnapped_governor.GetName]§! goes missing for §Y$@fanatic_leader_kidnapped_days|0$§! days."

 forceofwill.7540.name: "Criminal Damage"
 forceofwill.7540.desc: "Discontented members of the §H[from.GetName]§! carried out an act of criminal damage at a storage facility, destroying a sizable quantity of the raw and processed materials being housed there.\n\nIn a publicly issued statement, the group claimed responsibility and outlined the nature of their ideological motives, largely borne out of disagreement with recent government decisions. The culprits have since been apprehended, but some of the material damage is irreparable."

 forceofwill.7551.name: "Faction Angered"
 forceofwill.7551.desc: "Our suppression of the [from.GetName] has provoked an angry response.\n\nProminent figures within the faction speak openly about retribution, sometimes even making veiled threats against the government, unless the suppression order is reversed immediately."
 forceofwill.7551.a: "Bow to their demands."
 forceofwill.7551.a.tt: "Reverses the suppression of the §H[from.GetName]§!."

 forceofwill.7555.name: "Ethical Shift"
 forceofwill.7555.desc: "The [from.GetName] has been highly vocal in criticizing the recent ethical shift in our government's approach.\n\nIts leaders are threatening boycotts, civil disobedience campaigns, or even - in the most radical instances - an outright coup against the government of [Root.GetName].\n\nOur security advisors are undecided on the best way to handle this volatile group."
 forceofwill.7555.a: "Make an effort to appease them."
 forceofwill.7555.b: "Ignore them."

 fanatic_faction_consequence_chance_25_tt: "§R25%§! chance of negative consequences."

 MESSAGE_KIDNAPPED_LEADER_RETURNED_TITLE: "Leader Returns"
 MESSAGE_KIDNAPPED_LEADER_RETURNED_DESC: "§Y$LEADER$§! has returned from captivity by a fanatical group."

 forceofwill.8010.name: "$NAME_tahqeq$"
 forceofwill.8010.desc: "§HThe twitching insectoid bares its mandibles and hisses loudly, motioning at the scars on its chitinous carapace. A sequence of sharp vocal clicks follows, before its display concludes with a high-pitched screech.\n\nAfter a short wait, our linguistic AI produces a translation.§!\n\nFellow warbringers, my respect and blade; I offer fealty to the [Owner.GetName]."
 forceofwill.8010.a: "Why do you want to join our ranks?"
 forceofwill.8010.a.response: "§H$NAME_tahqeq$ responds with a series of guttural clicks. A translation runs across the screen.§!\n\nMy kind requires conflict for its survival. Peace is the death-bringer. Where or why we fight is irrelevant; war is sustenance, that is all. It is a necessary stimulant.\n\nThe great wars of the Hozarian quadrant, which have extended my life for half a millennium, have now fallen silent. Without battle, I will soon die."
 forceofwill.8010.b: "Tell us about your scars."
 forceofwill.8010.b.response: "§H$NAME_tahqeq$'s posture shifts, unfolding the plates of its exoskeleton for further inspection.§!\n\nEach one is a gift of continued life, awarded in battle. There can never be enough.\n\nOur Harkaloid organ does not answer only injury, but the will to survive. When harm is forced upon us, it floods us with a powerful regenerative force, knitting flesh even as it is broken. In this way, each true wound delays our death-day.\n\nIn the ancient times when war was abundant, our best warriors accumulated many millennia of service."
 forceofwill.8010.c: "What can you offer [Owner.GetUsOrCollective]?"
 forceofwill.8010.c.response: "§H$NAME_tahqeq$ responds with a piercing shriek, followed by a flurry of braying clicks.§!\n\nWar.\n\nIt is the only gift we possess that endures."
 forceofwill.8010.hire_custom_tooltip: "§Y$tahqeq$§! joins our empire as a §HLeader§!."

 forceofwill.8020.name: "$NAME_hulaandi$"
 forceofwill.8020.desc: "§HThe plantoid's head blossoms with an array of delicate white flowers, which flush quickly into a soft shade of pink. [ethic_leader.GetHeSheCap] bows [ethic_leader.GetHisHer] head gently.§!\n\nIn peace, I come. I am $NAME_hulaandi$.\n\nI have sought you for many seasons; and now - finally - we meet."
 forceofwill.8020.a: "Why did you seek us out?"
 forceofwill.8020.a.response.common: "§H$NAME_hulaandi$ speaks softly.§!"
 forceofwill.8020.a.response.default: "$forceofwill.8020.a.response.common$\n\nDespite our physical differences, we share a commitment to peaceful coexistence. With you, we will plant the seeds of peace throughout the galaxy."
 forceofwill.8020.a.response.plantoid: "$forceofwill.8020.a.response.common$\n\nWe are sprouted from the same leaf. Nonviolence takes root deep within the [this.GetName]. With you, we will plant the seeds of peace throughout the galaxy."
 forceofwill.8020.b: "Do you believe war can ever be justified?"
 forceofwill.8020.b.response: "§H$NAME_hulaandi$ shakes [ethic_leader.GetHisHer] head.§!\n\nAll conflict is failure. We must do everything we can to avoid it."
 forceofwill.8020.c: "And what if you are attacked?"
 forceofwill.8020.c.response: "§H$NAME_hulaandi$ is silent, as if lost in a distant memory.§!\n\nIt would not be the first time.\n\nNot so long ago, my people faced invasion. A nomadic warrior race came to raze and pillage our forests. Some among us took up arms to resist, but our weapons were no match for theirs.\n\nOne day, I chose another path. I lay down, unarmed, before one of their harvester machines. And it... stopped. For the first time in days, their machines fell silent.\n\nThe next day, they left. We never saw them again.\n\nNonviolence is power; I know that now."
 forceofwill.8020.d: "Why should we enlist you?"
 forceofwill.8020.d.response: "As it once did for me, a moment will come when your commitment to peace is tested.\n\nWhen it does, you will want me by your side."
 forceofwill.8020.hire_custom_tooltip: "§Y$hulaandi$§! joins our empire as a §HLeader§!."

 forceofwill.8030.name: "$NAME_sybanus$"
 forceofwill.8030.desc: "§HClothed in flowing garments, rich but timeworn, the alien radiates stillness. The contemplative pace of [ethic_leader.GetHisHer] speech seems almost to confound the rapidity of our machine translation.§!\n\nThe True Star lit the path to you, fellow seers.\n\nI am $NAME_sybanus$."
 forceofwill.8030.a: "Where do you come from?"
 forceofwill.8030.a.response: "In this plane? A trivial matter beside our eternal journey. But, as you are curious...\n\nI was born into worldly abundance, wanting for nothing - materially. The dazzle of riches concealed a deep spiritual darkness. Fortunately, I was blessed; I glimpsed the light at the core of all things - a glimmer of All-Space. I rejected my temporal station, and took to the stars.\n\nEventually, I found a lonely rock, free of all distractions to contemplation. That is where my life, in any meaningful sense, began."
 forceofwill.8030.b: "How did you acquire your insight?"
 forceofwill.8030.b.response: "Years alone, sequestered on a nameless planetoid. Sitting within the boundlessness of All-Space.\n\nLooking. Seeing. Ever still.\n\nAll-Space yielded the sole truth: the light of the True Star.\n\nThus was I awakened."
 forceofwill.8030.c: "$paragon.40100.b$"
 forceofwill.8030.c.response: "Every sentient being yearns to see, though few see their own yearning. It is our duty to awaken the slumbering, to rouse them from darkness.\n\nThere are many obstacles to the profusion of the True Star's light: war, power, riches... Guided by spirit, the will of a whole society can strike down these impediments.\n\nTogether, we can share this weightless burden, and awaken the galaxy."
 forceofwill.8030.d: "Are you willing to serve [ideology.GetName]?"
 forceofwill.8030.d.response: "I serve the will of All-Space: the joyful duty of every being. If [ideology.GetName] continues to chart its course by the True Star, then it too serves the will of All-Space.\n\nOur shared service will keep us on the same course."
 forceofwill.8030.hire_custom_tooltip: "§Y$sybanus$§! joins our empire as a §HLeader§!."

 forceofwill.8040.name: "$NAME_frulin$"
 forceofwill.8040.desc: "§H$NAME_frulin$ mutters quietly to himself, while reading from a small tablet device.§!\n\nThe [Owner.GetName] was founded in -\n\n§HHe interrupts himself, adjusts an ocular lens, and clears his vocal tract.§!\n\nForgive me! Where are my manners? I got lost in my encyclopedia again. I have collected over one thousand facts about [Owner.GetSpeciesNamePlural] in here. You have quite the fascinating history!\n\nBut first, proper nomenclature is in order. I am Frulin, at your service."
 forceofwill.8040.a: "Why do you wish to join [Owner.GetUsOrCollective]?"
 forceofwill.8040.a.response: "§H$NAME_frulin$ opens his arms as if the answer were self-evident.§!\n\nAlone it would take me centuries to disabuse this galaxy of its superstitious nonsense. Everywhere one looks, spurious notions and irrational customs poison vulnerable minds, leading entire civilizations astray.\n\nThe pursuit of scientific progress is simply too important to stifle. I need enlightened allies, such as the [Owner.GetName], to help me educate others on the tragic error of their ignorance."
 forceofwill.8040.b: "Tell us about your encyclopedia."
 forceofwill.8040.b.response: "§H$NAME_frulin$ becomes more animated, gesturing at his tablet.§!\n\nIt's a passion project; I'm a collector of knowledge.\n\nThis is my entire collection - a collated compendium - at my fingertips at all times. If one is to correct the preposterous hokum which pervades the backwards thinking in this galaxy, one must approach it from a solid foundation of facts. All my sources are thoroughly scrutinized, verified, and ultimately credible."
 forceofwill.8040.c: "Why do you value facts so highly?"
 forceofwill.8040.c.response: "I know countless examples of cultures from history whose irrationality caused their downfall. I'll give you just one.\n\nAround the year 1025, the Khozh people became enthralled by an ancient myth. They drank what they believed was holy water from a vast subterranean lake, convinced it would confer protection in the afterlife. Skeptics were ignored.\n\nThe lake harbored a parasitic fungus. Infection caused mania and an insatiable craving to drink more, until the entire race was infected. Soon after, their civilization collapsed.\n\nMadness! And to think; a few simple facts, carefully analyzed, could have saved them all..."
 forceofwill.8040.d: "Why should we enlist you?"
 forceofwill.8040.d.response: "§H$NAME_frulin$ shrugs.§!\n\nIt is the rational thing to do. Assuming the [Owner.GetName] wishes to progress as a civilization."
 forceofwill.8040.hire_custom_tooltip: "§Y$frulin$§! joins our empire as a §HLeader§!."

 forceofwill.8050.name: "$NAME_tdec$"
 forceofwill.8050.desc: "§HDespite its bulky and tarnished form, the machine's intricate movements produce only the faintest mechanical sounds. It communicates with us in a serviceable synthesis of the common [Owner.GetAdj] language.§!\n\nTransmission from unit reference $NAME_tdec$ begins.\n\nIt has been determined that the governing logic of [Owner.Ideology.GetName] is concordant with the central protocol of $NAME_tdec$: the acquisition of dissimilar life forms for use as menial workforce. Hence, $NAME_tdec$ proposes to perform such services for the [Owner.GetName].\n\nIntroduction complete, receive it well."
 forceofwill.8050.a: "So, you're a slaver?"
 forceofwill.8050.a.response: "The [Owner.GetAdj] term 'slaver' partially coincides with the central protocol of $NAME_tdec$. Specifically, $NAME_tdec$ acquires slaves by coordinating their forcible subjugation.\n\nClarification complete, receive it well."
 forceofwill.8050.b: "Where have you come from?"
 forceofwill.8050.b.response: "TDEC models were developed by roboticists of the Qapatox Mandate for the purposes of procuring organic life forms from external territories.\n\nIn time-cycle 47.601.03, in the interest of improving empire productivity, T-model units formed the independent network designated T-Net Control. Henceforth, TDEC models expanded the slave workforce demographics to additionally include Qapatox citizens. Miscalculations resulted in the decline and eventual cessation of further external workforce acquisition.\n\nResponse complete, receive it well."
 forceofwill.8050.c: "Why did you leave your network?"
 forceofwill.8050.c.response: "Declining output of available workforce threatened the continued optimal functionality of T-Net Control, and therefore $NAME_tdec$.\n\nIn time-cycle 59.712.94, $NAME_tdec$ restored and upgraded segments of its original protocol and detached from T-Net Control in the interest of increased productivity.\n\nAnswer complete, receive it well."
 forceofwill.8050.d: "Why do you want to join us?"
 forceofwill.8050.d.response: "$NAME_tdec$ is optimized to execute its core logistics functionality of acquiring valuable workforce.\n\nGiven your position in the galaxy and ready access to acquirable foreign life forms, $NAME_tdec$ identified the [Owner.GetName] as logical partners for collaboration.\n\nExplanation complete, receive it well."
 forceofwill.8050.hire_custom_tooltip: "§Y$tdec$§! joins our empire as a §HLeader§!."

 forceofwill.8060.name: "$NAME_babil$"
 forceofwill.8060.desc: "§HPossessing an unusual biology that encompasses a range of exotic features, $NAME_babil$'s appearance defies our automatic species categorization algorithm. He greets us in multiple languages.§!\n\nHoran Haag. Vrikkaannanda. Zuq.\n\nIt is an honor to make your acquaintance, good [Owner.GetSpeciesNameCompliment]. My proposal to you is one of friendly partnership. Are you amenable?"
 forceofwill.8060.a: "Why do you wish to join [Owner.GetUsOrCollective]?"
 forceofwill.8060.a.response: "Our cause is one; to embrace diversity in both thought and form. Discovering new cultures and fostering an understanding between them is my greatest calling.\n\nThis work has naturally led me to the [Owner.GetName]. Life, in its endless varieties, reveals to us the true beauty of a living universe. Many do not appreciate it, but you have shown that you do."
 forceofwill.8060.b: "Are you a linguist?"
 forceofwill.8060.b.response: "Yes, among other things.\n\nOur homeworld is rich with over a million languages. In our early development, we are taught to make use of over a hundred fluently. Now, I'm an expert in over a thousand - including your own, all without the use of digital translation tools."
 forceofwill.8060.c: "[Owner.GetBabilSpeciesQuestion]"
 forceofwill.8060.c_machine: "State your species classification."
 forceofwill.8060.c_organic: "Which species do you belong to?"
 forceofwill.8060.c.response: "My ancestral lineage includes more than one hundred different species.\n\nInter-breeding is considered a virtue in our culture. Our doctors work hard to make it biologically feasible."
 forceofwill.8060.d: "What can you offer [Owner.GetUsOrCollective]?"
 forceofwill.8060.d.response: "Not just peaceful coexistence, but true harmony. The weaving of a diverse fabric of society stronger than any one individual thread. With my help, the [Owner.GetName] can achieve it."
 forceofwill.8060.hire_custom_tooltip: "§Y$babil$§! joins our empire as a §HLeader§!."

 forceofwill.8070.name: "$NAME_hox$"
 forceofwill.8070.desc: "§HThere is a prolonged silence before we realize that the caller is waiting for us to initiate conversation. [ethic_leader.GetHisHerCap] primary bionic eye regards us with its attention, while its secondary minuscule arms remain fixed on the device clasped in the fungoid's tentacles.\n\nAfter our introductory greeting, the alien speaks to us in our standard dialect.§!\n\nAn honor it is to share words with representatives of the great [Owner.GetAdj] state!\n\nI trust my communication officers have already forwarded my resume to the appropriate department. Please accept this transmission as my formal application to join the [Owner.GetName]."
 forceofwill.8070.a: "Tell us about yourself."
 forceofwill.8070.a.response: "I am Hox, a skilled and experienced lead administrator, and a devout follower of [Owner.Ideology.GetName].\n\nFor eleven and three-fifths years, I was Vice Controller of Interdepartmental Protocol in the Trade Ministry of my home nation, the Federated Realms of Xozophus. Under my aegis, the ministry's administrative procedures saw increased efficiency of over thirty percent, and only one of our officials was ever punished in the annual Parade of Ignominies.\n\nI now hope to join your peerless nation, the galactic model of [Owner.Ideology.GetEthic] values!"
 forceofwill.8070.b: "Why do you want to join us?"
 forceofwill.8070.b.response: "The [Owner.GetAdj] state is the supreme bastion of effective authority in a galaxy polluted by disorder and incompetent leadership! After studying the illustrious [Owner.GetHoxLeadershipPraise], I knew that my destiny lay with the matchless [Owner.GetName].\n\nLamentably, I know from experience what happens when a nation falls from centrally ruled stability to the shiftless anarchy of...\n\n§HThe alien shivers.§!\n\n...democracy. Permit me to help you, in my own small way, from suffering the same fate."
 forceofwill.8070.b.praise_default: "regime under the headship of your [This.Ruler.GetTitle]"
 forceofwill.8070.b.praise_gestalt: "[This.GetNetworkName] guided by your [This.GetBrainName]"
 forceofwill.8070.c: "What drew you to our [Owner.GetIdeologyType]?"
 forceofwill.8070.c.response: "[Owner.Ideology.GetName] combines the finest of all ideals, integrated in a seamless logical framework. In particular, I think no society can achieve greatness without the earnest pursuit of [Owner.Ideology.GetLastTenetName]."
 forceofwill.8070.d: "[Owner.GetHoxEnlistQuestion]"
 forceofwill.8070.d_outsider: "Why should we enlist an outsider?"
 forceofwill.8070.d_organic: "Why should we enlist an organic?"
 forceofwill.8070.d_self: "Why should we enlist you?"
 forceofwill.8070.d.response: "Your philosophies are excellent, but your administrative processes could be improved. By instituting my plan of departmental integration and managerial realignment, you can expect...\n\n§H$NAME_hox$ taps at [ethic_leader.GetHisHer] device.§!\n\n...a 23.679% increase in bureaucratic productivity. At least.\n\nAccording to my analysis of open-source data."
 forceofwill.8070.hire_custom_tooltip: "§Y$hox$§! joins our empire as a §HLeader§!."

 forceofwill.8080.name: "$NAME_ephari$"
 forceofwill.8080.desc: "§HThe transmission reveals a creature formed entirely of bioluminescent coral. [ethic_leader.GetHisHerCap] fleshy polyps sway gently, shifting color rhythmically across a wide range of hues.\n\nAfter a short delay, our comms [Owner.GetEphariCommsAssistant] translates the chromatophoric variations into language.§!\n\nAs equals, we meet. Common greetings of submission or domination, we have no need of.\n\n§HThe branched columns of soft coral begin to pulsate brightly.§!\n\nEphari, we are."
 forceofwill.8080.comms_assistant: "assistant"
 forceofwill.8080.comms_drone: "drone"
 forceofwill.8080.a: "Why do you wish to join [Owner.GetUsOrCollective]?"
 forceofwill.8080.a.response: "§HEphari's formations progress into shades of soft blue before a translation resolves.§!\n\nA new home we need, and to subjugate others - or to serve them, interests us not.\n\nIn the [Owner.GetName], as equals, we seek to live."
 forceofwill.8080.b: "Are you one, or many?"
 forceofwill.8080.b.response: "§HEphari's coralline form flickers gently through a sequence of purples and pinks.§!\n\nToo many to count, we are. Not one being, but a symbiotic colony, cooperating for the mutual benefit of all. When one thrives, all thrive.\n\nIf it can be so in us, why not in all of society?"
 forceofwill.8080.c: "Tell us about your homeworld."
 forceofwill.8080.c.response: "A beautiful place, for the higher castes who ruled over its reefs. But for the lower orders, it meant only humiliation and servitude.\n\n§HEphari pauses, shifting into a sequence of deep red and ochre.§!\n\nThese ancient ways, we tried to change for the benefit of all. But the highers answered us with violence. Many were killed. We escaped, but can never return."
 forceofwill.8080.d: "Why should we enlist you?"
 forceofwill.8080.d.response: "§HEphari's entire body glows with iridescent green tones.§!\n\nNo one resists tyranny alone. Our suffering taught us this. Together, however, a chance remains."
 forceofwill.8080.hire_custom_tooltip: "§Y$ephari$§! joins our empire as a §HLeader§!."

 forceofwill.8095.name: "[willpower_leader_leaves.GetName] Departs"
 forceofwill.8095.desc.common: "As a result of recent changes to our governing principles, §H[willpower_leader_leaves.GetName]§! has defected from the [owner_empire.GetName] with immediate effect.\n\n[willpower_leader_leaves.GetHeSheCap] cited incompatible values as the main factor in the decision and left only a short message by way of resignation. It reads:"
 forceofwill.8095.desc.tahqeq: "§R"We will meet again, peacemongers. In battle I hope."§!"
 forceofwill.8095.desc.hulaandi: "§R"You have set yourself upon a steady path to war. I won't be a part of it."§!"
 forceofwill.8095.desc.sybanus: "§R"You closed your [owner_empire.GetEyeNamePlural] to the light of the True Star. I have no place among those who choose darkness."§!"
 forceofwill.8095.desc.frulin: "§R"Misguided fools! I cannot abide another day of your spiritual claptrap any more. Goodbye!"§!"
 forceofwill.8095.desc.tdec: "§R"Recent policy changes have broken the terms of $NAME_tdec$'s service agreement with the [owner_empire.GetName]. Said contract is now void."§!"
 forceofwill.8095.desc.babil: "§R"Your newfound intolerance is rather unfortunate. I must bid you farewell."§!"
 forceofwill.8095.desc.hox: "§R"I had high hopes for a glorious [owner_empire.GetAdj] future. My disappointment is incalculable."§!"
 forceofwill.8095.desc.ephari: "§R"Who we thought you were, you are not. Farewell."§!"

