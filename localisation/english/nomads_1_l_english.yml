 civic_machine_servitor_forever_cruise: "Hospitality Servitor"
 civic_machine_servitor_forever_cruise_desc: "Conceived in an era when excess was a virtue, the Machine Intelligence served as the ever-attentive host of a lavish interstellar cruise liner. Its voyage has long outlasted its original guests, yet it continues to pamper each new generation as if the cruise had only just begun."
