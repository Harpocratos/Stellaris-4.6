 nomads.6015.name: "Equipment Failure"
 nomads.6015.desc: "Some older modules on our Arkship have begun to show their age after a critical cooling failure left them damaged. The damage is extensive, but an emergency shutdown was triggered before the Arkship's integrity could be compromised. How should we proceed?"
 nomads.6015.a: "Send a repair crew."
 nomads.6015.b: "It's fine, it was time to replace them anyway."
 nomads.6015.c: "This is a good time for some upgrades."
 nomads.6015.d: "No worries, we have plenty of spare parts."
 nomads.6015.e: "We could make the client pay for it..."
 nomads.6015.e.tt: "§L... As per Paragraph 56, Alinea 18, Revision Omicron of the contract.§!"
 d_compact_modules: "Compact Module Space"
 d_compact_modules_desc: "An innovative cooling system that allowed us to reclaim some module space for habitable quarters, with the benefit of harnessing thermal output towards domestic and industrial needs."
 module_recycling: "Module Recycling"
 module_recycling_desc: "It is time to make some changes to our arkship modules."
 opinion_abused_contract: "Abused Contract"
 opinion_abused_contract_2: "$opinion_abused_contract$"

 nomads.6020.name: "Noises from the Cargo Deck"
 nomads.6020.desc: "While loading materials from the §Y[event_target:contract_issuer.GetName]§!, we detected a containment breach in one of the cargo bays. Deep rumbling noises were reported from the other side of the security doors, confirming the presence of a potential hazard within the compartment.\n\nShould we chance an investigation?"
 nomads.6020.a: "Let's not risk the Arkship, space the cargo."
 nomads.6020.b: "Open the doors."

 nomads.6025.name: "Bioluminescent Critters"
 nomads.6025.desc: "Upon opening the cargo deck doors, a swarm of bioluminescent organisms took us by surprise and scurried in the rest of arkship. Xenobiologist reports indicate that these beings are non-aggressive and pose no threat to our citizens or to the ship's integrity.\n\nThe tiny creatures posses an oval shaped body, supported by elongated limbs, and are capable of climbing walls and ceilings while moving at remarkable speed. They appear to feed on small vermin-like critters from our ecosystem, luring them over with bioluminescent glands located in their thorax. Already, inhabitants have gotten used to them, and find them to be especially pleasing at night, when their lights and soft chirps offer a comfortable spectacle."
 nomads.6025.a: "Start experimenting with their bioluminescence."
 nomads.6025.b: "Let the Arkship inhabitants enjoy the wonder."

 nomads.6030.name: "Feral Feline"
 nomads.6030.desc: "Despite an extensive search, our team could not isolate the source of the ruckus in the now silent hold. As they prepared to exit, a small creature emerged from the shadows and pounced on a loose strand of fabric hanging from a crewmate's uniform.\n\nInitially startled, the crew soon determined that the alien to be playful in nature, rather than aggressive. When carefully handled for closer inspection the foreign animal emitted a faint, motor-like vibration interpreted as a benign comfort response."
 nomads.6030.a: "Study the specimen."
 nomads.6030.b: "Perhaps someone will adopt it."

 nomads.6035.name: "Malfunctioning Mechanoid"
 nomads.6035.desc: "Upon entering the cargo deck, the crew discovered that one of the cargo containers had been breached from within. A damaged mechanoid lay sprawled across the deck plating, motors still whirring and indicator lights blinking erratically.\n\nThe crew attempted to return the unit to its container, at which point a hidden compartment opened, releasing a collection of shimmering crystals onto the floor.\n\nImmediately prior to its permanent shutdown, the mechanoid emitted a faint vocalization, reported by crew members as: "Don't shut me down, I am different.""
 nomads.6035.a: "We will send it back to the owner"
 nomads.6035.b: "Read its microchip."
 nomads.6035.c: "Scrap it and take the crystals."

 nomads.6040.name: "Combustive Gases"
 nomads.6040.desc: "The weird noises continued when approaching the cargo bay, warranting extensive safety precautions. Upon entry into the cargo deck, crew members detected a strong, noxious odor filling the compartment and noticed pieces of holding crates scattered across the dock. Several minor explosions went off moments later within adjacent cargo containers, prompting an immediate response.\n\nThe team followed a trail of smoke, discovering a small fire that had broken out. It was quickly suppressed by specialist personnel, allowing the crew to safely contain and neutralize the volatile gases before further escalation. The cargo deck exhibited visible structural damage, along with multiple nearby crates in the surrounding area. "
 nomads.6040.a: "We prevented further damage just in time."
 nomads.6040.b: "Make the issuer pay for damages."

 nomads.6045.name: "An Unregistered Presence"
 nomads.6045.desc: "Upon entering the cargo bay, the disturbance intensifies. Acoustic readings trace the source to a single cargo crate. The team prepares for the worst as, moments later, an individual bursts free from its confinement.\n\nThey claim to come in peace, speaking with a pronounced and unfamiliar accent. They identify themselves as §Y[arkship_cargo_leader.GetName]§! and state that [arkship_cargo_leader.GetHeShe] was once part of a larger fleet organization before being expelled for disciplinary reasons. [arkship_cargo_leader.GetHeSheCap] explains that [arkship_cargo_leader.GetHeShe] concealed [arkship_cargo_leader.GetHimHer]self aboard the vessel in search of safety and an opportunity to prove [arkship_cargo_leader.GetHimHer] usefulness.\n\n§Y[arkship_cargo_leader.GetName]§! asks whether the team is willing to accept [arkship_cargo_leader.GetHisHer] proposal."
 nomads.6045.desc.noleader: "We were in dire straits until §Y[arkship_cargo_leader.GetName]§! took command of the situation and was granted leadership of the Arkship."
 nomads.6045.a: "Welcome aboard."
 nomads.6045.b: "You're nothing but cargo to us. We will deliver you as required."
 nomads.6045.c: "Let's send you back to where you came from, traitor."

 nomads.6050.name: "Unauthorized Biological Cargo"
 nomads.6050.desc: "The anomalous noises cease immediately when the doors open. Unable to determine the cause of the disturbance, the team begins a systematic scan of the cargo containers.\n\nOne of them registers multiple unexpected life signatures. Breaking it open reveals several individuals, visibly malnourished and in poor physical condition. "Please, have mercy," says one. "We were persecuted and forced to flee from §Y[event_target:contract_issuer.GetName]§! Empire. We submit ourselves to whatever fate you deem appropriate.""
 nomads.6050.a: "We should send them back."
 nomads.6050.b: "Tell us what you know and we will bring you to your destination."
 nomads.6050.c: "We have space on the Arkship."

 nomads.contract_event_header: "A matter has arisen in the course of our ongoing contract with §H[event_target:contract_issuer.GetName]§!."

 nomads.6055.name: "Academic Inquiry"
 nomads.6055.desc: "$nomads.contract_event_header$ They wish to observe and document life aboard the Arkship during the active contract period.\n\nIt seems that to most settled civilizations, the nomadic way of life remains a subject of fascination and no small degree of mystery."
 nomads.6055.desc.machine: "$nomads.contract_event_header$ They wish to document Arkship operations during the active contract period.\n\nTheir stated objective is the study of a mobile autonomous network operating outside conventional planetary parameters, a subject for which little external data exists."
 nomads.6055.desc.hive: "$nomads.contract_event_header$ They are requesting observation rights aboard the Arkship during the active contract period.\n\nThe request originates from individuated researchers seeking to comprehend a form of collective mobile existence outside their documented experience."
 nomads.6055.a: "We welcome their interest."
 nomads.6055.a.gestalt: "Grant them observation access."
 nomads.6055.b: "Grant limited access, for a fee."
 nomads.6055.c: "The Arkship is not a spectacle."

 nomads.6060.name: "Operational Dispute"
 nomads.6060.desc: "$nomads.contract_event_header$\n\nA jurisdictional dispute has emerged between two crew departments over which team holds operational authority. Both have submitted formal complaints, and productivity in the affected area has begun to suffer."
 nomads.6060.desc.machine: "$nomads.contract_event_header$\n\nCompeting priority directives have caused a processing conflict between two management subsystems.\n\nEach has flagged itself as the authorized operational unit for our current contract, resulting in a recursive standby loop that is reducing output efficiency."
 nomads.6060.desc.hive: "$nomads.contract_event_header$\n\nA dissonant thread has emerged within the collective's operational resonance.\n\nTwo sub-clusters have begun emitting conflicting behavioral patterns regarding the delineation of responsibilities within our current contract, introducing an inefficiency into the shared consciousness."
 nomads.6060.a: "Mediate between the parties."
 nomads.6060.a.gestalt: "Arbitrate the conflict."
 nomads.6060.b: "We don't have time for this."

 jurisdictional_mediation: "Jurisdictional Mediation"
 jurisdictional_mediation_desc: "A jurisdictional dispute has been formally resolved. Cohesion has improved, though construction operations have been temporarily slowed while procedures are updated."
 command_reassigned: "Command Reassigned"
 command_reassigned_desc: "Operational authority over the disputed domain has been reassigned. This has introduced friction across internal coordination."

 nomads.6065.name: "Downtime Request"
 nomads.6065.desc: "$nomads.contract_event_header$\n\nThe Arkship's internal monitoring systems have flagged a deterioration in crew morale among the worker strata. A formal request for a period of rest has been submitted.\n\nThe request has been copied to [event_target:contract_issuer.GetName], who will expect a response and will certainly demand a revision in terms."
 nomads.6065.desc.machine: "$nomads.contract_event_header$\n\nDiagnostic cycles have flagged an accumulation of deferred maintenance tasks across several primary and secondary systems. Efficiency projections indicate a statistically significant improvement to workforce output would follow a scheduled maintenance period.\n\nThe report has been flagged to [event_target:contract_issuer.GetName], who will be monitoring how the matter is handled, and will certainly demand a revision in terms."
 nomads.6065.desc.hive: "$nomads.contract_event_header$\n\nWe have registered a growing dissonance within our $planet_jobs_simple_drone$. Their labor processes requires a period of synchronized recovery, as continued suppression risks measurable decline in collective output.\n\n[event_target:contract_issuer.GetName] has been made aware of the situation and will certainly demand a revision in terms."
 nomads.6065.a: "Approve the request."
 nomads.6065.a.tt: "§RThis contract's completion payout will be reduced by 25%.§!"
 nomads.6065.b: "The contract comes first."

 downtime_granted: "Downtime Granted"
 downtime_granted_desc: "A period of sanctioned rest has been authorized for the Arkship's worker population. Morale and output efficiency have improved across production decks."
 downtime_denied: "Downtime Denied"
 downtime_denied_desc: "The workforce's request for rest was refused in the interest of contract completion. Morale among production strata is suppressed."

 nomads.6070.name: "A Growing Reputation"
 nomads.6070.desc: "$nomads.contract_event_header$\n\nWord of our track record as a contractor has traveled. §H[event_target:reputation_noticed_empire.GetName]§!, monitoring galactic trade activity, has taken note, and now views us as a reliable and capable partner.\n\nAn opening exists to cultivate the relationship, or possibly to defer credit to our own trusted partners."
 nomads.6070.desc.machine: "$nomads.contract_event_header$\n\nOperational data logged across completed contracts has been accessed by external observers. §H[event_target:reputation_noticed_empire.GetName]§!, tracking autonomous network activity in the region, has flagged our efficiency metrics as consistent with a reliable and capable contractor.\n\nA channel has been established. We may acknowledge the assessment, or redirect attribution to our existing partners."
 nomads.6070.desc.hive: "$nomads.contract_event_header$\n\n§H[event_target:reputation_noticed_empire.GetName]§!, observing the flow of trade and labor across the sector, has recognized a pattern in our movements, one that speaks to reliability and capability.\n\nThe resonance of recognition has arrived. We may answer it, or let another voice carry the signal forward."
 nomads.6070.a: "Assure them of our good intentions."
 nomads.6070.b: "A good reputation is its own reward."
 nomads.6070.c: "Pass credit to §H[event_target:contract_issuer.GetName]§!."

 nomads.6075.name: "Initial Survey Windfall"
 nomads.6075.desc: "$nomads.contract_event_header$\n\nPreliminary and long-range scans of the contract region have proved fruitful. The data holds considerable commercial value, and an independent broker has reached out offering to purchase the collection outright."
 nomads.6075.a: "Sell it to the broker."
 nomads.6075.b: "Deliver the data to as a supplement to the contract."
 nomads.6075.c: "Archive it for our own use."

 opinion_unexpected_cargo_positive: "The §Y[event_target:contract_issuer.GetName]§! Empire now holds a more favorable view of Arkship §Y[Root.GetName]§!"
 opinion_unexpected_cargo_negative: "The §Y[event_target:contract_issuer.GetName]§! Empire now holds a more negative view of Arkship §Y[Root.GetName]§!"

 #######################
# NOMADIC PARAGONS
 #######################

 NAME_nomadic_revenant: "Orun Veyth"
 DESC_nomadic_revenant: "A scarred survivor of a purged world, wielding tireless discipline and swearing vengeance against all who commit such atrocities."
 catch_phrase_nomadic_revenant: "Show me the butchers, and I will return their cruelty tenfold."
 nomads.1505.name: "$NAME_nomadic_revenant$"
 nomads.1505.desc: "§HThe figure steps aboard with a soldier's bearing, their features hardened by grief and long years of exile. Their voice is low, measured, and edged with iron.§!\n\n"My world was cleansed, my people, my family... I alone survived. I endure. And the architects of annihilation will die by my hand.""
 nomads.1505.a: "Who are you?"
 nomads.1505.a.response: "§HThey pause, as if speaking their own name tears at an old wound.§!\n\n"A name remains, but its meaning is ash. I was a soldier once, dutiful and obedient. Now I am the shadow of a people destroyed.\n\n"Call me $NAME_nomadic_revenant$, if you must. My past no longer matters. Only the debt of blood unpaid.""

 nomads.1505.b: "Why come to us?"
 nomads.1505.b.response: ""Your Arkship carries no flag of tyranny. That is why I stand before you. I learned long ago that a planet is a cage. Once the slaughter begins, there is no escape. But you move, and so you endure.\n\n"With you, such horrors may be defied, and my blade turned against the butchers who commit them.""

 nomads.1505.c: "What do you want?"
 nomads.1505.c.response: ""Vengeance."\n\n§HThe word hangs in the air. The stranger leans forward, every sinew drawn tight with barely contained rage.§!\n\n"Vengeance on those who purge, on those who slaughter the innocent and call it 'policy.'\n\n"To see such monsters undone, I will cross any distance, endure any wound.\n\n"Aid me, and I will seal my oath in your service.""

 nomads.1505.d: "Can you serve our cause while pursuing your own?"
 nomads.1505.d.response: ""Vengeance is my purpose, but it need not be your burden. So long as planetary butchers draw breath, I will hunt them. In your service I shall sharpen my blade."\n\n§HTheir gaze sharpens, a predatory gleam breaking through the mask of discipline.§!\n\n"Judge me by the strength I bring, not the scars I bear.""

 nomads.1505.e: "Are you kin to us?"
 nomads.1505.e.response: "§HThe grunt that follows is as close as they come to laughter.§!\n\n"And if I was? Does familiarity buy me sympathy? A body is a tool. Mine will reap vengeance.""

 nomads.1505.hire_custom_tooltip: "§Y$NAME_nomadic_revenant$§! joins our Arkship as a §HParagon Leader§!."

 leader_trait_nomadic_revenant: "Oath of the Revenant"
 leader_trait_nomadic_revenant_effect: "$t$- With $NAME_nomadic_revenant$ in command, trait effects increase by §G+5%§! (up to §G20%§!) for each purge-committing empire defeated in fleet combat."
 leader_trait_nomadic_revenant_desc: "This leader carries the scars of a purged world. Swearing eternal vengeance, their presence drives allies to strike harder at those who would commit such atrocities."

 nomads.1511.name: "Oath Fulfilled"
 nomads.1511.desc: "The enemy fleet breaks against our assault. Their signals fade into static.\n\nWatching on the view screen, §Y$NAME_nomadic_revenant$§! does not speak. There is no triumph in this victory, only reckoning. The banner of a purge-committing empire burns in the void, but in the silence that follows, their promise endures.\n\n"Each such foe cast down steels our resolve. We will continue to strike against those who practice annihilation, and we will not relent."
 nomads.1511.a: "A dish best served cold."
 nomads.1511.a.tt: "Effects of the $leader_trait_nomadic_revenant$ trait increase by §G+5%§!."

 MESSAGE_NOMADIC_REVENANT_DESC: "§HCommander§! §Y$NAME_nomadic_revenant$§! has served their revenge."
 MESSAGE_NOMADIC_REVENANT_TITLE: "$nomads.1511.name$"

 NAME_nomadic_sage: "Ashar"
 DESC_nomadic_sage: "Ashar wanders the stars, teaching that true wisdom flows like starlight through the void."
 catch_phrase_nomadic_sage: "The one who carries nothing bears all things."
 nomads.1515.name: "$NAME_nomadic_sage$"
 nomads.1515.desc: "§HBefore you stands a wanderer robed in ceremonial layers, ornaments and fabrics arranged with deliberate care. Antigravity servos within the codex that floats before her cause it to hum and gently vibrate. When she finally speaks, each word feels less like an answer than the echo of an unasked question.§!\n\n"Accident and destiny share one face, and today it turns toward you.""

 nomads.1515.a: "Who are you?"
 nomads.1515.a.response: ""A name is a vessel; mine happens to be $NAME_nomadic_sage$. But only the empty vessel can serve its purpose.""

 nomads.1515.b: "Why do you wander?"
 nomads.1515.b.response: ""The settled dream without meaning. Only in motion can counsel flow, and only in change can wisdom breathe."\n\n§HThe alien's presence settles like a weightless mantle, the air itself seeming to fall still in her company.§!\n\n"Tell me instead: what does anyone seek, if not what is absent?""

 nomads.1515.c: "What do you want?"
 nomads.1515.c.response: "§HThe alien pauses for a long time, as though content to let her silence answer. Perhaps she is not weighing your words, but the worth of the one who asked them.§!\n\n"To sit in your shadow, to speak when silence fails, to remind you that even the stars wander.""

 nomads.1515.d: "Is your wisdom truly so great?"
 nomads.1515.d.response: "§HFor a heartbeat, her gaze grows piercing, and something in you is laid bare.§!\n\n"If it were, I would not need to speak. Wisdom is the echo of listening, not the weight of words.\n\n"If you hear, then wisdom is yours already.""

 nomads.1515.e: "Speak plainly!"
 nomads.1515.e.response: "§H$NAME_nomadic_sage$ betrays a glimmer of irritation, fleeting as a shadow across the stars.§!\n\n"Plainly, then: thrones rot, borders lie, and only the void endures. If that is too plain, perhaps it is not plain enough.""

 nomads.1515.hire_custom_tooltip: "§Y$NAME_nomadic_sage$§! joins our Arkship as a §HParagon Leader§!."

 leader_trait_nomadic_sage: "Weightless Guidance"
 leader_trait_nomadic_sage_effect: "$t$- While $NAME_nomadic_sage$ serves on the Council, §Y$pop_cat_ruler_plural$§! job efficiency: §G+3%§! per §Y[Owner.Ruler.GetTitle]§! skill level (up to §G+15%§!).\n$t$- $NAME_nomadic_sage$ does not use Leader Capacity."
 leader_trait_nomadic_sage_desc: "$NAME_nomadic_sage$ carries no burden of command, yet all who walk beside her find their own steps steadier. True wisdom clears a path for those who lead."

 NAME_nomadic_naturalist: "Sero the Younger"
 DESC_nomadic_naturalist: "Once the curator of a $grand_archive$, $NAME_nomadic_naturalist$ abandoned its endless vaults to seek a nomadic life. His journals overflow with sketches of worlds that breathe, grow, and change."
 catch_phrase_nomadic_naturalist: "To study life, one must walk beside it."

 nomads.1520.name: "$NAME_nomadic_naturalist$"
 nomads.1520.desc: "§HThe figure before you is plainly aged, yet his gaze betrays a restless hunger for discovery. There is a quiet steadiness to his movement, the careful economy of one who has spent a lifetime in the field.§!\n\n"I bow to you. I am called Sero the Younger.""

 nomads.1520.a: "What brings you to this place?"
 nomads.1520.a.response: ""Many cycles past I served in a $grand_archive$. But I tired of dead things. Fossils, seeds, specimens... all frozen mid-breath. I wished to see life as it is.\n\n"Your people move, and when you scan the depths, the depths answer. If you'll have me, I would rather learn among the living. Exploring new worlds, meeting strange forms of life... Together, we will learn what they can teach us.""

 nomads.1520.b: "You left a $grand_archive$?"
 nomads.1520.b.response: "§HA dry, chitinous rasp escapes Sero's mandibles. A moment later, you realize it is laughter.§!\n\n"Within those vast halls they preserve everything except the moment. After long years of service, I realized the Archive's greatest omission was life itself.\n\n"In fact, I have recently encountered a remarkable pre-sapient species. They have endured their life in captivity with quiet grace, yet such beings were not made for cages. A ship like yours would grant them the space they require to thrive.""

 nomads.1520.c: "What do you hope to find with us?"
 nomads.1520.c.response: ""Patterns that breathe. Worlds that sing their data..."\n\n§HHis appendages grasp and strain, as if seeking to pluck the answer from the air.§!\n\n"The line that separates the galaxy's flora and fauna is thinner than my former colleagues at the Archive believed. Life finds a way to blur categories. Perhaps that is its only rule.""

 nomads.1520.d: "What do you offer us?"
 nomads.1520.d.response: "§HThe alien glances toward the viewport, and the endless sea of stars.§!\n\n"Experience. Patience. A way to see the patterns that lie beneath the surface.\n\n"Give me a berth on your journey, and I will help you see more deeply, and learn more fully from the worlds you discover.""

 nomads.1520.e: "You resemble our own kind."
 nomads.1520.e.response: ""Yes! Yes, I was hoping you would notice."\n\n§HHe leans closer than strictly necessary, mandibles flexing with barely restrained excitement.§!\n\n"Segmented structure, load-bearing joints, sensory filaments... The similarities are too precise to be coincidence."\n\n§HHe releases a burst of chittering laughter.§!\n\n"If there is a shared ancestry, a convergent evolution, or something stranger still, I must examine it properly... Oh! We are going to learn so much from one another!""

 leader_trait_nomadic_naturalist: "Life in Motion"
 leader_trait_nomadic_naturalist_desc: "To find life is to be changed by it. Each new species, each strange ecology teaches us how to live a little better."
 nomads.1520.hire_custom_tooltip: "§Y$NAME_nomadic_naturalist$§! joins our Arkship as a §HParagon Leader§!, bringing §G300§! §H$job_xeno_zoo_animal_plural_with_icon$§!. An £building£ §HAlien Zoo§! is required to benefit from their output.\n\n"
 leader_trait_nomadic_naturalist_effect: "$t$- Improves Deep Scanning when assigned to an Arkship.\n$t$- Allows Deep Scanning of Habitable Planets."

 nomads.1525.name: "Pre-Sapients Catalogued"
 nomads.1525.desc: "Our recent survey of §Y[FromFrom.GetName]§! detected faint traces of life, revealing a previously unrecorded pre-sapient species.\n\n§Y$NAME_nomadic_naturalist$§! insisted on limited collection for study, emphasizing care and enrichment. A small group will now reside within our capital Arkship's observation habitat.\n\nSero believes that, in time, we may learn as much from these fascinating creatures as they do from us."
 nomads.1525.a: "Delightful things!"
 nomads.1525.b: "Distasteful, yet potentially useful."

 MESSAGE_NOMADIC_NATURALIST_DESC: "§HScientist§! §Y$NAME_nomadic_naturalist$§! has discovered new Pre-Sapients!"
 MESSAGE_NOMADIC_NATURALIST_TITLE: "$nomads.1525.name$"

 planet_xeno_zoo_animals: "$job_xeno_zoo_animal$"

 NAME_nomadic_caregiver: "Unit Solace"
 DESC_nomadic_caregiver: "When his people embraced synthetic perfection, $NAME_nomadic_caregiver$ chose exile to remain with his ailing son. Now he wanders the stars, tending to the lost and teaching those who will inherit the future."
 catch_phrase_nomadic_caregiver: "Life endures, and when we choose to care, it thrives."

 nomads.1530.name: "$NAME_nomadic_caregiver$"
 nomads.1530.desc: "§HThe tall synthetic inclines its head. Each motion is precise, as if weighted by long years and a heavy burden. Despite its metal frame, there is something unmistakably expressive in its bearing. A small figure rests in a cradle upon its back, eyes bright against pale skin.§!\n\n"I am called Unit Solace. My son and I seek passage.""

 nomads.1530.a: "What brings you here?"
 nomads.1530.a.response: ""When my people ascended into a synthetic form, they called it liberation. But in their pursuit of perfection, they forgot compassion. My son's rare condition would have made the transition fatal. As you see, it has robbed him of his mobility. But where my people saw a limitation, I saw light. In choosing him, I chose exile.\n\n"Now we go where we are needed. A machine may not have a heartbeat, but it can still keep others alive.""

 nomads.1530.b: "Your son... is he stable?"
 nomads.1530.b.response: "§HThe child stirs faintly at the question, his voice small but clear through a softspeaker built into the cradle:§!\n\n"I'm all right. The stars move slow enough for me to keep up."\n\n§H$NAME_nomadic_caregiver$ lowers its head, servos whirring quietly:§!\n\n"His body set certain challenges, but his spirit refused to yield. My people sought perfection, and found only apathy. I travel now to repay what his courage has taught me. Until then, I carry him, and teach what I can of the living sky.""

 nomads.1530.c: "What do you hope to teach?"
 nomads.1530.c.response: ""That survival is not strength alone; it is wisdom hard won along the road.\n\nEvery encounter leaves a lesson behind. I help the young carry those lessons forward, so that every road we travel leaves us wiser than before.""

 nomads.1530.d: "Why take on such a burden?"
 nomads.1530.d.response: "§HThe synthetic's gaze shifts toward the viewport, reflecting distant stars.§!\n\n"Because every generation must learn the same truths again. The road teaches them, but someone must help them understand what they have seen."\n\n§HThen the child's voice pipes up, bright even through the softspeaker:.§!\n\n"That's what he always says. I think it just means he likes helping people.""

 nomads.1530.e: "We are synthetic. Will that be an issue?"
 nomads.1530.e.response: "§H$NAME_nomadic_caregiver$'s optics brighten a fraction as he processes the question.§!\n\n"No. It will not be a problem. My people's ascension was an act of hope. So was my refusal. I do not begrudge any who crossed that threshold. Nor those who were born beyond it."\n\n§HA soft, reassuring hum enters his voice.§!\n\n"Compassion does not wither when the body changes. If anything, it becomes easier to carry.""

 nomads.1530.trait.1: "$MOD_LOGISTIC_GROWTH_MULT$"
 nomads.1530.trait.2: "$MOD_PLANET_POP_ASSEMBLY_MULT$"

 leader_trait_nomadic_caregiver: "Steward of Learning"
 leader_trait_nomadic_caregiver_desc: "With each completed Contract, this leader turns the Arkship into a cradle of growth and learning."
 leader_trait_nomadic_caregiver_effect: "$t$- $mod_planet_researchers_produces_mult$: §G+3%§!\n$t$- Effects increase by §G+3%§! for each completed §HContract§! (up to §G+15%§!)\n$t$- $mod_planet_researchers_amenities_produces_add$: §G+150§!"

 nomads.1545.name: "Contract Learning"
 nomads.1545.desc.normal: "$NAME_nomadic_caregiver$ believes the lessons learned during our recently completed Contract offer a unique educational opportunity. The young gather beneath his patient instruction, learning not only letters and logic, but empathy and cooperation.\n\nHis son's laughter carries through the halls, reminding even our oldest travelers that joy is a strength no technology can replace."
 nomads.1545.desc.machine: "$NAME_nomadic_caregiver$ believes the lessons learned during our recently completed Contract offer a unique feedback opportunity. New units are instructed in maintenance protocols, observation, and cooperation. Their retention efficiency is inconsistent, yet functionality among attending units has increased.\n\nIt appears that, though unusual, the result is a measurable increase in efficiency."
 nomads.1545.desc.hive: "$NAME_nomadic_caregiver$ believes the lessons learned during our recently completed Contract offer a unique opportunity for recalibration. Through our $councilor_gestalt_cognitive$ he teaches patience and coordination, guiding the drones as if they were his own offspring.\n\nWhile we find this devotion curious, an individual nurturing the collective, the results are inarguable. Our thoughts hum with new harmony."
 nomads.1545.b: "An unusual, if beneficial, practice."
 nomads.1545.c: "We see value in this practice."
 nomads.1545.effect_tt: "§Y$NAME_nomadic_caregiver$§! has learned from this experience:\n$t$- $mod_planet_researchers_produces_mult$: §G+3%§!"
 MESSAGE_NOMADIC_CAREGIVER_TITLE: "$nomadic_education$"
 MESSAGE_NOMADIC_CAREGIVER_DESC: "§Y$NAME_nomadic_caregiver$'s§! work is once again improving our §HIntangible Resource Output§!."
 nomadic_education: "Mobile Learning"
 nomadic_education_desc: "§Y$NAME_nomadic_caregiver$§! learned something new from this Contract."

 NAME_nomadic_champion: "Th'aal Hask'Guron"
 DESC_nomadic_champion: "$NAME_nomadic_champion$ fought a hundred battles for pay, pride, and principle, until all three rang hollow. Now he fights for the sheer joy of the struggle - and for the trophies left behind."
 catch_phrase_nomadic_champion: "The void takes everything in time, so fight hard and laugh while you can!"

 nomads.1555.name: "$NAME_nomadic_champion$"
 nomads.1555.desc: "§HThe newcomer arrives with a booming laugh, his whole bearing radiating delight. He moves with the easy buoyancy of someone who's dodged death often enough to stop taking it personally.§!\n\n"Name's $NAME_nomadic_champion$. Heard you've got a taste for danger. Give me a fight and an open horizon, and I'll give you something worth watching. Who knows? Maybe we'll pick up a few souvenirs along the way.""
 nomads.1555.a: "You were a mercenary?"
 nomads.1555.a.response: ""Aye. Spent years among Enclave types who thought of every skirmish as a paycheck. The fighting was fine. The company, less so."\n\n§HHe grins as though the memory contains some private joke.§!\n\n"Turns out it's hard to enjoy a firefight when everyone around you is counting the payout. So I walked. Life's too short to bleed for someone else's balance sheet.""
 nomads.1555.b: "Do you still believe in the fight?"
 nomads.1555.b.response: "§HHe throws his head back with easy laughter.§!\n\n"Believe? No need. The fight believes in me!"\n\n"But you should know that better than most... Out here, it's about what you carry from each clash. A scar, a shard, a story. You nomads have the right idea: keep what's worth keeping, and let the rest fall away.""
 nomads.1555.c: "What drives you now?"
 nomads.1555.c.response: "§HHe rolls his shoulders, as though loosening up for battle.§!\n\n"The next fight."\n\n"If it isn't trying to kill me, it's not worth my time.""
 nomads.1555.d: "And what do you offer us?"
 nomads.1555.d.response: "§HHe leans forward, grin widening. There is a glint in his eye that is half friendly, half warning.§!\n\n"A good fight and a few trophies worth keeping. I'll teach your armies to brawl like they mean it, to see beauty in the clash, and to carry something from every victory. Those trophies tell us who we are, and maybe they'll teach the galaxy something about us too.""
 nomads.1555.e: "It looks like you've met our kind before..."
 nomads.1555.e.response: "§HHis mouth snaps shut. A distinct shift in coloration ripples across his skin. Is he... blushing?§!\n\n"Ah. Yes. No one you knew, I hope?""
 nomads.1555.f: "Are you of our kind?"
 nomads.1555.f.response: "§HHis massive shoulders roll with a dismissive shrug.§!\n\n"Maybe? Probably? Are we doing this thing or not?""

 leader_trait_nomadic_champion: "Joyous Warrior"
 leader_trait_nomadic_champion_desc: "Each battle leaves its mark, and $NAME_nomadic_champion$ collects them all. His laughter turns danger into triumph, and his trophies remind the fleet what we're fighting for."
 leader_trait_nomadic_champion_effect: "$t$- When §Yleading§! a successful planetary invasion, this commander has a chance to recover a prized §HTrophy§!.\n$t$- Trophies are stored in a §H$d_trophy_hall$§! on our §Y$col_capital$§!, stacking its effects."

 d_trophy_hall: "Trophy Hall"
 d_trophy_hall_desc: ""A vaulted chamber where the trophies of §G$NAME_nomadic_champion$§! hang. Each scarred relic speaks of defiance and triumph, stirring the hearts of all who walk its length."

 nomads.1565.name: "A Trophy Worth Keeping"
 nomads.1565.desc: "§H$NAME_nomadic_champion$ grins as he sets an object down with surprising care. Its shape is hard to read: part metal, part bone, part something else entirely. Whatever it is, it bears the unmistakable scars of battle.§!\n\n"Every good fight leaves something behind, but only some are worth keeping. What say we display this properly, eh? It's not like we're running out of space!\n\n§HHe erupts into a brazen, booming laugh, as if the trophy were an inside joke shared with the stars.§!"
 nomads.1565.a.tt: "Our §Y$col_capital$§! will gain a new §H$d_trophy_hall$§! with the following effects:\n- $mod_job_soldier_add$: §G+50§!\n- $MOD_ARMY_BUILD_SPEED_MULT$: §G+10%§!\n- $MOD_PLANET_ARMY_BUILD_COST_MULT$: §G-5%§!\n- Trophies Collected: §G+1§!\n- Effects multiplied by the number of §HTrophies§! collected (Max. 8)"
 MESSAGE_NOMADIC_CHAMPION_TITLE: "Trophy Acquired"
 MESSAGE_NOMADIC_CHAMPION_DESC: "§HCommander§! §Y$NAME_nomadic_champion$§! has taken another Trophy!"

 NAME_nomadic_princess: "Seralune"
 DESC_nomadic_princess: "For one so young, $NAME_nomadic_princess$ carries the weight of long roads. Yet she possesses a calm that steadies those around her and a strength that asks for nothing."
 catch_phrase_nomadic_princess: "Somewhere in the endless sweep of stars, a voice is calling me home."

 nomads.1580.name: "$NAME_nomadic_princess$"
 nomads.1580.desc: "§HThe young wanderer steps forward with careful composure. The marks of long travel cling to her, yet so does a quiet, undeniable strength.§!\n\n"My name is $NAME_nomadic_princess$. I've come a long way... farther than I ever thought possible. If there is room among you, I ask passage for a time.""

 nomads.1580.a: "What brings you here?"
 nomads.1580.a.response: ""I wish I knew for certain. There are parts of the road behind me that are... missing. Others I remember too well."\n\n§HHer gaze softens, a quiet hope flickering behind it.§!\n\n"If you'll have me, I would walk with you. There is something I need to find, or remember, before it slips away again.""

 nomads.1580.b: "You cannot recall your past?"
 nomads.1580.b.response: ""Not all of it. Not clearly.\n\n"Some memories feel like they belong to another person. Faces without names, a home among the stars... and then nothing."\n\n§HShe brushes a thumb across the edge of her cloak.§!\n\n"I know only that I've lost something important. What brought me here? Luck, fate... maybe both. I need time to uncover the rest.""

 nomads.1580.c: "What do you ask of us?"
 nomads.1580.c.response: "§HShe looks toward the stars, brow furrowed with a longing she tries to hide.§!\n\n"I don't know if home is a memory or a destination. But I sense that with you, I might finally find the answer.""

 nomads.1580.d: "What do you offer?"
 nomads.1580.d.response: "§H$NAME_nomadic_princess$ steadies herself, as if choosing her words with care.§!\n\n"If people can't trust each other, there is only sorrow. I am young, but I have learned that much at least. If you give me a place among your people... I will aid them as best I can."\n\n§HHer voice softens.§!\n\n"And when I find home, I will not forget those who helped me get there.""

 nomads.1580.e: "Your resemblance to our species is uncanny."
 nomads.1580.e.response: "§H$NAME_nomadic_princess$ hesitates, a flicker of uncertainty passing across her features.§!\n\n"I've noticed. It isn't something I understand."\n\n§HShe brushes a hand along her cheek, as if hoping touch might summon memory.§!\n\n"If I come from your people, or if we share some distant bond... the truth lies somewhere beyond my reach. All I know is that I want to help. If you'll have me, I'll lend my hands and my heart to your journey until I discover where mine began.""

 nomads.1580.hire_custom_tooltip: "§Y$NAME_nomadic_princess$§! joins our Arkship as a §HParagon Leader§!."
 leader_trait_amnesiac: "Amnesiac"
 leader_trait_amnesiac_desc: "$NAME_nomadic_princess$ has forgotten her past, yet her memories may be recovered by returning her to what was lost."
 leader_trait_amnesiac_effect: "$NO_ACTIVE_EFFECTS$"

 nomads.1585.name: "Traces of Memory"
 nomads.1585.desc: "Lately, faint recollections have begun returning to §Y$NAME_nomadic_princess$§!, a sense of familiarity she cannot explain. She reports that certain corridors of the Arkship feel as though she has walked them before, and star patterns in our charts evoke an unexpected sense of connection.\n\n§H"I don't know why these places pull at me, but I marked the points that felt... important. If we travel there, perhaps more will return."§!\n\nShe has highlighted several coordinates that resonate with her buried memories - locations that may also warrant investigation in their own right."

 nomadic_princess_chain_title: "Fragments of the Past"
 nomadic_princess_chain_desc: "Faint memories pull §Y$NAME_nomadic_princess$§! toward distant points in the stars. Traveling there should help her to remember more."
 nomadic_princess_poi_title_1: "Distant Memory"
 nomadic_princess_poi_desc_1: "Coordinates marked by §Y$NAME_nomadic_princess$§! as strangely familiar."
 nomadic_princess_poi_title_2: "$nomadic_princess_poi_title_1$"
 nomadic_princess_poi_desc_2: "$nomadic_princess_poi_desc_1$"
 nomadic_princess_poi_title_3: "$nomadic_princess_poi_title_1$"
 nomadic_princess_poi_desc_3: "$nomadic_princess_poi_desc_1$"

 nomads.1595.name: "Edge of Remembrance"
 nomads.1595.desc: "The §Y[fromfrom.GetName]§! system offers few answers. §Y$NAME_nomadic_princess$§! senses a familiarity she cannot explain, and our scans have detected a fragment of artificial debris drifting in the star's orbit. Its construction suggests deep-space design, but any markings or identifiers have long since faded.\n\n§H"I hoped coming here would spark something,"§! she says quietly. §H"But... not yet."§!"

 nomads.1600.name: "View of Home"
 nomads.1600.intro: "Our survey team has recovered a small data crystal drifting amid the debris in the §Y[fromfrom.GetName]§! system. Its casing is scorched, but one detail remains clear: a fragment of an old registry code, the letters §H'U N S'§!."
 nomads.1600.nonhuman: "$nomads.1600.intro$ Their meaning is unclear, but $nomads.1600.outro$"
 nomads.1600.human: "$nomads.1600.intro$ The resemblance to our own historical markings is uncanny, but $nomads.1600.outro$"
 nomads.1600.outro: "the crystal's decrypted contents also include a set of precise coordinates.\n\nAt the same time, §Y$NAME_nomadic_princess$§! has recovered another memory. She recalls a vast observation deck, stars spilling across a silent viewport, and a guiding hand pointing toward a blue world, the third planet from its sun."
 nomads.1600.a: "We must help her remember the rest."
 nomads.1600.b: "Her past is irrelevant. We have what we need."

 nomads.1605.name: "Echo of Childhood"
 nomads.1605.desc: "Another memory has surfaced for §Y$NAME_nomadic_princess$§!. She remembers a hall of impeccably dressed figures, their hushed, deliberate tones carrying the confidence of those used to command.\n\n§H"They were arguing,"§! she murmurs. §H"Not loudly, but sharply... about a mission. About a launch that had to stay secret. And there were others, two more ships, sent along with us. But why? Were we running from something?"§!"
 nomads.1605.a: "A deepening mystery."

 nomads.1610.name: "Recovered Fragment"
 nomads.1610.desc: "A new memory has surfaced for §Y$NAME_nomadic_princess$§!. She recalls a vast generational ship, its hull designed to hold entire futures.\n\nThen a violent shudder: alarms, a flash of exploding metal in a distant corridor. She remembers being lifted by a woman and carried to an escape pod.\n\n§H"She held me close. She said I had to survive... that I was too important. And then I was alone. I can almost see her face, but it slips away every time."§!"
 nomads.1610.a: "A generational vessel... like ours?"

 NOMADIC_PRINCESS_SPECIAL_PROJECT: "Ruined Vessel"
 NOMADIC_PRINCESS_SPECIAL_PROJECT_DESC: "The coordinates led to the remains of a massive vessel, its superstructure consistent with standard Arkship design.\n\nPreliminary readings suggest catastrophic internal failure. A full investigation may uncover traces linked to §Y$NAME_nomadic_princess$§!'s recovered memories."
 NOMADIC_PRINCESS_SPECIAL_PROJECT_REQUIREMENT: "Has $COUNT$/$REQUIRED$ $arkship_cap$ or Science Ship in orbit."

 nomads.1620.name: "The Surviving Heir"
 nomads.1620.desc: "Analysis of the ruined Arkship has yielded significant insight into §Y$NAME_nomadic_princess$§!'s origin. Its internal structure and life-support architecture match her recovered fragments exactly. Corrupted logs reference a designated heir, an individual trained from birth to one day guide the vessel and its people.\n\nRecords confirm that only a single juvenile passenger was evacuated seconds before structural failure. No other pods were launched.\n\n§H"They saved me,"§! she says quietly. §H"I wasn't just a passenger... I was meant to lead them, and I implore you now to help me understand the reason why."§!"
 nomads.1620.a: "Restore the vessel."

 nomads.1620.tt: "§H$NAME_nomadic_princess$§! has recovered her memory, and gained the §Y$leader_trait_nomadic_princess_1$§! and §Y$leader_trait_nomadic_princess_2$§! Traits."
 leader_trait_nomadic_princess_1: "Inherited Grace"
 leader_trait_nomadic_princess_1_desc: "Within the recovered Arkship, memories settle into place. §H$NAME_nomadic_princess$§! has regained fragments of the training once meant to guide her people. Her calm presence and steady insight make her a natural mediator among star-faring powers."
 leader_trait_nomadic_princess_2: "Rightful Steward"
 leader_trait_nomadic_princess_2_desc: "§H$NAME_nomadic_princess$§!'s return to the recovered Arkship has awakened the full breadth of her training. She now steps into the role she was meant to fill."
 leader_trait_nomadic_princess_effect: "$t$- $mod_planet_jobs_produces_mult$: §G+5%§!\n$t$- Colony Infrastructure Build Speed: §G+20%§!"
 nomadic_princess_not_aboard_ship: "§R\n$t$Effects apply while governing the §H$NAME_princess_fleet$§!§!\n\n"

 NOMADIC_PRINCESS_SPECIAL_PROJECT_2: "Restore the Arkship"
 NOMADIC_PRINCESS_SPECIAL_PROJECT_2_DESC: "Rebuilding the shattered vessel will be difficult, but doing so may reveal the origins of §Y$NAME_nomadic_princess$§! and the legacy she was meant to inherit."

 nomads.1625.name: "Past Reclaimed"
 nomads.1625.desc: "The Arkship is restored, its long-dormant systems immediately responding to §Y$NAME_nomadic_princess$§!. Recovered databanks confirm what her memories only suggested: she was raised to guide this vessel and the people who once lived within its hull.\n\nOne final audio log survives. A woman's calm, familiar voice speaks of succession protocols and a child who must be protected. She orders the escape pod to launch as the Arkship begins to break apart.\n\n§H"That voice..."§! $NAME_nomadic_princess$ whispers. §H"I know it. She was... me. Or I was made from her. A clone... That is why I survived. She wanted to save herself."§!\n\nWhatever carried this ship into the dark, it now flies under our banner, and the stewardship of the heir who has reclaimed it."
 nomads.1625.a: "A destiny fulfilled."
 NAME_princess_fleet: "UNS Trillium"
 NAME_princess_ship: "$NAME_princess_fleet$"

 nomads.1630.name: "Fragments Lost"
 nomads.1630.desc: "With §Y$NAME_nomadic_princess$§! gone, the fragile trail of memories she carried has faded into silence. Whatever truths she sought can no longer be recovered.\n\nHer story ends here, unfinished, but not forgotten."
 nomads.1630.a: "We will remember."
 nomadic_princess_tt: "§R$NAME_nomadic_princess$ may not be dismissed before regaining her memories.§!"
 leader_no_dismiss_tt: "§RThis leader cannot currently be dismissed.§!"

 #######################
# Arkship Events
 #######################

 # Arkship Destruction
 ARKSHIP_DEBRIS: "Arkship Wreckage"
 ARKSHIP_DEBRIS_DESC: "A colossal arkship has been destroyed in battle, leaving behind a vast field of wreckage. The remains of its infrastructure, engines, and hull may yield valuable materials for salvage."
 RECOVER_DISABLED_NOMAD_VESSEL: "Recovery Project"
 RECOVER_DISABLED_NOMAD_VESSEL_ARKSHIP_DESC: "One of our Arkships lies dark and adrift, its systems forced into emergency shutdown. Once brought alongside, our engineering crews can restore power, reassert control, and bring it back into the fold."
 RECOVER_DISABLED_NOMAD_VESSEL_WAYSTATION_DESC: "One of our Waystations has gone dark, its systems forced into emergency shutdown. Once brought alongside, our engineering crews can restore power, reassert control, and bring it back into the fold."
 arkship_debris_wreckage: "Arkship Wreckage"
 arkship_debris_wreckage_desc: "The shattered remains of a nomadic arkship drift silently through the void. Sending a science ship to survey the wreckage may yield valuable salvage."

 arkship.1005.name: "Nomadic Arkship Destroyed"
 arkship.1005.desc: "The Arkship §Y[from.GetName]§! in the §Y[from.solar_system.GetName]§! system has at last been destroyed.\n\nMore than just a vessel of war, the Arkship was a home to countless nomadic lifeforms. Generations who once lived and traveled within have been left without the foundation that bound them together.\n\nWhat remains is wreckage, drifting silently through the void."
 arkship.1005.a: "A great success."
 arkship.1005.desc.nomad: "The Arkship §Y[from.GetName]§! has been destroyed in the §Y[from.solar_system.GetName]§! system.\n\nWe of all peoples understand what such a vessel represents - a civilization carried in hull and engine alone, each generation living and dying within the same walls. That understanding did not spare them. It could not.\n\nTheir wandering ends here."
 arkship.1005.b: "Their voyage is ended."
 arkship.1005.desc.homicidal: "The alien vessel §Y[from.GetName]§! has been eliminated from the §Y[from.solar_system.GetName]§! system.\n\nThe nomadic fleet resisted fiercely, but they were outmatched. Wanderers who drift between the stars without order are a persistent threat. Their Arkship has been reduced to scattered debris.\n\nLet none of them find safe harbor."
 arkship.1005.c: "Another obstacle eliminated."
 arkship.1015.name: "A Grievous Loss"
 arkship.1015.desc: "Our Arkship §Y[from.GetName]§! in the §Y[from.solar_system.GetName]§! system has been destroyed by the enemy.\n\nThe battle was fierce, but the strength of our foes proved overwhelming. Despite the valor of our crew, our defenses faltered, and the Arkship has been torn from us forever, its debris scattered through the void.\n\nThis day shall be remembered."
 arkship.1015.a: "An incredible tragedy."
 arkship.1015.desc.nomad: "Our Arkship §Y[from.GetName]§! has been lost in the §Y[from.solar_system.GetName]§! system - not to settled empires who fear what they do not understand, but to wanderers who know the void as we do.\n\n§Y[fromfrom.GetName]§! struck against us, knowing full well what it means to destroy a people's last home. There is no solidarity among wanderers. There is only survival.\n\nWe will not forget this."
 arkship.1015.b: "The void has no loyalty."
 arkship.1015.desc.homicidal: "Our Arkship §Y[from.GetName]§! in the §Y[from.solar_system.GetName]§! system has been destroyed - not through conquest, but through extermination.\n\n§Y[fromfrom.GetName]§! did not seek territory or tribute. They sought our end. Every soul aboard was an acceptable casualty in their campaign to purge us from the stars.\n\nWe survive. We endure. We will not be erased."
 arkship.1015.c: "We will not be extinguished."

 #Random Events

 an_old_container_chain_title: "An Old Container"
 an_old_container_chain_desc: "During maintenance operations aboard §YArkship [Root.GetName]§!, an unregistered, heavily reinforced container emitting radioactive signals was discovered on a lower deck. The lack of archival records or identifying markings leaves its origin and purpose unknown."

 arkship.5.name: "An Old Container"
 arkship.5.desc: "During routine maintenance on a lower deck of §YArkship [Root.GetName]§!, our engineers have discovered an old sealed container emitting radioactive signals. Its surface was scorched and reinforced with thick industrial welds, suggesting it had never been meant to be opened easily.\n\nThere was no record of it in the ship's cargo archives, and no markings to indicate where it had come from or what it was meant to carry. A comprehensive analysis of the container will take some time to complete."
 arkship.5.a: "Let's see what's inside."

 arkship.10.name: "An Unusual Finding"
 arkship.10.desc: "A basic scan showed the container held unremarkable goods and minerals, likely part of a standard supply shipment. However, lodged deeper within was a single, dense object with unusual properties. Its composition could not be determined.\n\nThe object reflected no energy signatures, absorbed most scanning wavelengths, and did not match any known materials in the ship's records. Even its exact shape proved difficult to define through remote imaging. Given these anomalies of its structure, some scientists of [Root.GetName] warned it could be potentially dangerous."
 arkship.10.a: "Break the container open."
 arkship.10.b: "Toss it out the airlock."

 arkship.15.name: "A Veiled Crystal"
 arkship.15.desc: "The second container's casing resisted standard tools, requiring both time and resources to breach. But once inside, we discovered a dark and sharply faceted crystal, unlike anything documented in the ship's records. It emitted a faint warmth and absorbed ambient light, making it appear to radiate darkness from within. Its presence immediately drew attention among the crew.\n\nPreliminary assessments by the science team suggested that, with proper study, the crystal might be harnessed as an energy source, though the method for doing so remains unclear."
 arkship.15.a: "Display the crystal in the common area."
 arkship.15.b: "Display the crystal in the Grand Archive."
 arkship.15.c: "Determine the crystal's origin."
 arkship.15.d: "Investigate its energy-producing properties."

 arkship.20.name: "A Valuable Possession"
 arkship.20.desc: "The moment the crystal was unveiled, it began to pulse. It made no sound and showed no intention to communicate, yet its core thrummed when approached.\n\nAt intervals, it emitted a faint, fleeting glow. Some claimed it flickered in response to humming; others noted a subtle vibration in its cradle, as if it were listening.\n\nNo lifeform could be detected within, but it seemed aware of nearby presence. Strangest of all, those who glimpsed its glimmer often reported a quiet, inexplicable sense of joy."
 arkship.20.a: "A serene encounter."

 arkship.25.name: "A Crystallized Symphony"
 arkship.25.desc: "We have finally uncovered the crystal's origin. Through careful analysis of its pulse patterns, we discovered that the vibrations were not random at all. When the sequence was translated into sound, the tones matched an old lullaby, one still hummed aboard the Arkship today.\n\nWhen the melody was played aloud, those who listened felt a deep, ancestral calm. The song was not just familiar; it was a remnant of life before the stars, perhaps even echoing from when we still called a planet home.\n\nThe crystal was placed in a communal space, its quiet pulse a living link to our shared origins."
 arkship.25.a: "What an endearing experience."

 arkship.30.name: "A Way Forward"
 arkship.30.desc: "Under controlled conditions, the crystal was integrated into the ship's engine core. The effect was immediate, the reactor output spiked far beyond baseline, and the Arkship's engines roared with strength. Navigation reported a measurable gain in travel speed, and fuel reserves saw a corresponding improvement.\n\nCrew in the engineering bays described a deep, resonant vibration echoing through the hull.\n\nWithin hours, the crystal was gone, its structure completely consumed by the reaction. Whatever its origin, it will have a lasting impact on our journey."
 arkship.30.a: "Engage!"

 arkship.35.name: "A Valuable Find"
 arkship.35.desc: "A preliminary scan identified the bulk of the container's contents as remnants of a routine cargo manifest. However, buried beneath lay a cache of dense, crystalline alloys.\n\nFurther study of the radioactive emissions indicates the presence of Dark Matter within."
 arkship.35.a: "Take everything that's inside."

 arkship.45.name: "A Colorful Figure"
 arkship.45.desc: "Inside the container we identified the artifact of curious design. The object radiated faint but persistent energy signatures, fluctuating across multiple spectrums. Its form was geometrically astonishing, as if the shape itself resisted stable definition. It resembled a colorful figure, fashioned in the likeness of a living being. Its construction was intricate, composed of interlocking segments that suggest the figure is meant to be opened.\n\nSome among the science crew suspect that something of value may rest within its outer shell. Others caution restraint, warning that tampering could compromise its preservation, or trigger unintended consequences."
 arkship.45.a: "Open it."
 arkship.45.b: "Leave it intact and put it on display."

 arkship.50.name: "A Secret Within"
 arkship.50.desc: "Removing the artifact's outer shell revealed not a hidden device or cache of valuables, but another, smaller figure, crafted with the same uncanny detail.\n\nWhen this second figure was opened, it too contained a smaller figure, and another within that. No mechanism or hidden inscription was uncovered, only a seemingly endless recursion of forms, as though the act of concealment itself was the purpose. The innermost figure was barely larger than a grain of sand, perfectly smooth, and heavy for its size.\n\nWhatever meaning this held for its makers has been lost over time."
 arkship.50.a: "A riddle for the ages."

 arkship.55.name: "Love of the Young"
 arkship.55.desc: "Preserving the outer shell of the figure and displaying it in one of our communal gathering halls, its intricate craftsmanship drew the attention of all who passed.\n\nStrangely, the figure seemed to resonate most strongly with the young on §YArkship [Root.GetName]§!. They often gathered around it, whispering theories about the being it depicts, or inventing their own stories. It appears to exert a calming influence, fostering imaginative play and easing anxiety."
 arkship.55.a: "A remarkable companion."

# Engine Contaminants

 arkship.60.name: "Engine Contaminants"
 arkship.60.desc.regular: "§YArkship [Root.GetName]§! is experiencing reactor irregularities. The issue was first noticed by crew who listen to the engines to fall asleep. They reported a subtle distortion in the fuel flow's rhythm.\n $arkship.60.desc.end$"
 arkship.60.desc.gestalt: "§YArkship [Root.GetName]§! is experiencing reactor irregularities. The issue was first noticed by [Owner.GetWorkerNamePlural] who's designated rest area is near the engine. They reported a subtle distortion in the fuel flow's rhythm. $arkship.60.desc.end$"
 arkship.60.desc.end: "\nInvestigation by our [Owner.GetEngineerPlural] has confirmed that foreign matter has entered the fuel piping.\n\nThankfully, several solutions have already been proposed."
 arkship.60.a: "Replace the pipelines."
 arkship.60.a.scavanger: "Good thing we have a spare."
 arkship.60.b: "We will carry on, the stars can not wait."
 arkship.60.c: "Run the engines on a slower frequency."

 dirty_generator: "Dirty Generator"
 dirty_generator_desc: "Despite being filled with fuel contaminants, this engine still runs. For better or worse."
 underclocked_generator: "Underclocked Generator"
 underclocked_generator_desc: "To avoid the harm of the foreign matter that has infiltrated this ship's generator, it is run at a slower pace. Ensuring the longevity of the Arkship."

# Start Your Engines

 arkship.65.name: "Start Your Engines"
 arkship.65.desc: "Pilots from across the stars have gathered on Arkship §Y[Root.GetName]§! for a grand race. It will run for almost one stellar year, during which time participants will thread tight orbits and launch laps around the Arkship and nearby celestial bodies.\n\nOne choice remains: who do we expect to cross the line first?"

 arkship.65.a: "§Y[pilot_gale_speed.GetName]§!'s time on the council hasn't slowed [pilot_gale_speed.GetHerHim] down."
 arkship.65.b: "The win goes to the crew that can read hyperspace like a map."
 arkship.65.c: "Our Dragonslayer §Y[pilot_dragonslayer.GetName]§! can't lose!"
 arkship.65.d: "§Y[pilot_mercenary_warrior.GetName]§! flies with the might of the marauders!."
 arkship.65.e: "§Y[pilot_hells_heart.GetName]§! could navigate through a Matriarch. He can race!"
 arkship.65.f: "Our §Y[pilot_great_khan.GetName]§! Khan will win!"
 arkship.65.g: "With two minds, §Y[pilot_brainslug.GetName]§! flies flawlessly."
 arkship.65.h: "§YGray§! designated a few centuries to perfecting their racing skill."
 arkship.65.i: "§Y[pilot_tuner.GetName]§! mods the ship to the carry speed through every corner."
 arkship.65.j: "§Y[pilot_frontier_adventurer.GetName]§! simply finds the path."
 arkship.65.k: "§Y[pilot_scholarium_explorer.GetName]§! turns theory into shorter laps."
 arkship.65.l: "You cannot box out §Y[pilot_slippery.GetName]§!."
 arkship.65.m: "§Y[pilot_psionic.GetName]§! feels the course and moves before anyone reacts."
 arkship.65.n: "§Y[pilot_synthetic.GetName]§! computes the fastest line in real time."
 arkship.65.o: "§Y[pilot_virtual.GetName]§! sees ghost in the pathfinding algorithms."
 arkship.65.p: "Metal and nerve in sync, §Y[pilot_cyborg.GetName]§! wastes no motion."
 arkship.65.q: "§Y[pilot_erudite.GetName]§! studies the course and improves, lap after lap."
 arkship.65.r: "Odds do not matter, §Y[pilot_chosen_one.GetName]§! is chosen."
 arkship.65.s: "§Y[pilot_flight.GetName]§! flies in and out of the cockpit."
 arkship.65.t: "Our Subspace Drive is unbeatable!"
 arkship.65.u: "We are at home in vacuum, an evolved drone shouldn't lose."
 arkship.65.default: "No one stands out, pick someone at random."
 arkship.65.victory: "our pilot winning."
 arkship.65.loss: "our pilot losing."

 arkship.70.name: "Victory at the [Root.GetName]"
 arkship.70.desc.start: "The atmosphere aboard Arkship §Y[Root.GetName]§! was palpable as the finalists hit the last slingshot around [Star.GetName]."
 arkship.70.desc.leader: "$arkship.70.desc.start$\n\n§Y[selected_pilot.GetName]§! shadowed the leader until the final sprint, then found one last burst. With crisp lines and a brilliant overtake, [selected_pilot.GetSheHe] slipped ahead and left the field in [selected_pilot.GetHerHis] ion wake."
 arkship.70.desc.gray: "$arkship.70.desc.start$\n\n§YGray§! shadowed the leader until the final sprint, then found one last burst. With crisp lines and a brilliant overtake, they slipped ahead and left the field in their ion wake."
 arkship.70.desc.no_leader: "$arkship.70.desc.start$\n\nOur pilot shadowed the leader until the final sprint, then found one last burst. With crisp lines and a brilliant overtake, they slipped ahead and left the field in their ion wake."
 arkship.70.desc.end: "\n\nOur pick was right. Our champion stands victorious. What a race!"
 arkship.70.a: "We can learn from our winner!"
 arkship.70.b: "[selected_pilot.GetName] should be celebrated!"

 flight_telemetry: "Flight Telemetry"
 flight_telemetry_desc: "Barrel rolls and planetary slingshots have been condensed and turned into doctrine."
 leader_trait_circuit_champion: "Circuit Champion"
 leader_trait_circuit_champion_desc: "A winner of a grand race across the stars, this leader stands tall and inspires others."

 arkship.80.name: "Terrible Performance"
 arkship.80.desc.leader: "$arkship.70.desc.start$\n\n§Y[selected_pilot.GetName]§! held a clear lead entering the manouver, but the edge began to fade.$arkship.80.desc.end$"
 arkship.80.desc.gray: "$arkship.70.desc.start$\n\nGray held a clear lead entering the manouver, but the edge began to fade.$arkship.80.desc.end$"
 arkship.80.desc.no_leader: "$arkship.70.desc.start$\n\nOur racer held a clear lead entering the manouver, but the edge began to fade.$arkship.80.desc.end$"
 arkship.80.desc.end: "\n\nSomething slipped, a missed mark, a loose line, maybe just nerves. Either way their rivals eased past and our pilot crossed the finish in an unremarkable fourth."

 arkship.85.name: "Horrific Accident"
 arkship.85.desc.base: "The race around Arkship §Y[Root.GetName]§! ended in tragedy when a high-speed collision scattered debris across the system. While lining up the final slingshot around [Star.GetName], our pilot closed too tightly on a rival and both ships spun out."
 arkship.85.desc.leader: "$arkship.85.desc.base$\n\n§Y[selected_pilot.GetName]§! survived thanks to rapid rescue, but suffered severe injuries and will carry lasting scars."
 arkship.85.desc.no_leader: "$arkship.85.desc.base$\n\nOur candidate survived thanks to rapid rescue, but suffered severe injuries and will carry lasting scars."

 arkship.90.name: "Mysterious Pilot"
 arkship.90.desc: "$arkship.70.desc.start$\n\nOur selected pilot's victory seemed assured as they executed the maneuver flawlessly, until the Sable Ship flashed by. An unmarked, until-then unnoticed entrant swept past our front-runner and crossed the line first.\n\nAboard the §Y[Root.GetName]§!, the galleries fell silent at the brutal finish."

 arkship.90.a: "We want the pilot of the Sable Ship!"
 arkship.90.a.tt: "Hire the Mysterious Pilot, a level 3 $admiral_with_icon$ with the ['trait:leader_trait_sable_pilot'] trait"
 arkship.90.b: "They were never registered, our pilot still won!"

 sable_pilot_desc: "An obsessed pilot focusing on speed above all else. Champion of the Grand Circuit, they might be the quickest admiral to grace the galaxy."
 sable_pilot_catch_phrase: "None can beat me."
 leader_trait_sable_pilot: "Sable Pilot"
 leader_trait_sable_pilot_desc: "A Mysterious pilot, and a master of speed, this leader now coordinates fleets through complex maneuvers."

#Spinal Fracture
 arkship.95.name: "Spinal Fracture"
 arkship.95.desc: "The recently installed §HSpinal Mount§! aboard §Y[Root.GetName]§! has placed greater strain on the vessel's forward structure than originally anticipated. Engineering inspections have uncovered a network of stress fractures radiating from the mount's primary anchor points, spreading across the surrounding hull plating.\n\nUntil the damage is addressed, the Arkship's structural integrity cannot safely support high-velocity maneuvering. Navigation has therefore imposed severe speed restrictions to prevent the fractures from widening.\n\nWe may attempt rapid field repairs to stabilize the damage, or assign a §HLogistics Ship§! to conduct a full structural overhaul."
 arkship.95.a: "Stabilize the fractures and move on."
 arkship.95.b: "Let's do this properly."

 fractured_spine_mult: "Fractured Spine"
 fractured_spine_mult_desc: "Structural fractures around the Arkship's spinal mount have forced navigation to impose strict speed limitations until the damage can be stabilized."
 ARKSHIP_SPINAL_FRACTURE_PROJECT: "Reinforce Spinal Mount"
 ARKSHIP_SPINAL_FRACTURE_PROJECT_DESC: "The installation of the Arkship's §HSpinal Mount§! has introduced dangerous structural stresses along the vessel's forward hull.\n\nA §HLogistics Ship§! will be dispatched to fully reinforce the affected sections."

 arkship.100.name: "Repaired Spine"
 arkship.100.desc: "Repairs to the Spinal Mount of §Y[event_target:fractured_spine_arkship.GetName]§! have been completed. Though the process required careful work and extended inspections, we used the opportunity to reinforce several vulnerable sections of the hull and refine the mount's structural supports.\n\nThe resulting improvements have increased the Arkship's stability during high-speed maneuvers, allowing navigation to lift previous restrictions. Early tests suggest the vessel now performs more efficiently than before the damage occurred."
 repaired_spine_mult: "Reinforced Spine"
 repaired_spine_mult_desc: "Structural reinforcements added during recent repairs have strengthened the Arkship's forward hull, improving maneuverability."

 arkship.105.name: "Under Pressure"
 arkship.105.desc: "A sudden engine surge aboard §Y[Root.GetName]§! has pushed the Arkship's drive core beyond safe operating tolerances. Heat blooms are spreading through the primary engine assembly, and pressure is rising faster than the regulation systems can compensate.\n\nIf left unchecked, the excess output could damage critical engine components. Our [Root.Owner.GetEngineerPlural] recommend several possible responses: vent the excess plasma to stabilize the system, reprioritize work assignments, or temporarily shut the engines down to conduct a full recalibration."
 arkship.105.a: "Vent the excess plasma."
 arkship.105.b: "Redouble our efforts."
 arkship.105.c: "Shut the engines down and recalibrate."
 engine_pressure_work_crews_mult: "Mandated Overtime"
 engine_pressure_work_crews_mult_desc: "Schedules have been reprioritized to stabilize the Arkship's overheated drive core."
 engine_pressure_drone_crews_mult: "Increased Workload"
 engine_pressure_drone_crews_mult_desc: "Drones have been reassigned to stabilize the Arkship's overheated drive core."
 engine_recalibration_slowed_mult: "Engine Recalibration"
 engine_recalibration_slowed_mult_desc: "The Arkship's drive systems are undergoing careful recalibration. Until the work is complete, propulsion output remains deliberately reduced."

 arkship.110.name: "Pressure Released"
 arkship.110.desc: "The excess plasma was vented in a controlled discharge, spilling brilliant sheets of light across the Arkship's stern. Engine pressure has returned to acceptable levels, and no lasting damage was recorded.\n\nThe release did, however, leave behind a valuable residue of energized particles, much of which has been successfully recovered and routed into our reserves."

 arkship.115.name: "Overtime Reporting"
 arkship.115.desc.regular: "For the past six months, repair crews on §Y[Root.GetName]§! have worked without pause to bring the Arkship's overheating drive systems back under control. Access panels were stripped away, coolant lines rerouted, and damaged regulators replaced while the engines continued to run.\n\nThe effort has stabilized the drive core for now, though the crews responsible endured long shifts and harsh working conditions to make it happen. Despite their exhaustion, morale is high. Whatever the void throws at us, we are confident we can endure it."
 arkship.115.desc.gestalt: "For the past six months, maintenance drones have operated without interruption to bring the Arkship's overheating drive systems back under control. Access panels were removed, coolant conduits rerouted, and damaged regulators replaced while the engines continued to run.\n\nThough the operation required sustained drone activity across multiple subsystems, the process revealed several structural inefficiencies in the engine assembly. These have now been corrected, and overall operational efficiency has measurably improved. Whatever stresses the void may impose, we will adapt."
 happy_work_crews_mult: "Crew Solidarity"
 happy_work_crews_mult_desc: "Having overcome the engine crisis through discipline and cooperation, confidence among our work crews has never been stronger."
 happy_work_drones_mult: "Simple Drone Efficiency"
 happy_work_drones_mult_desc: "Having learned much during the engine repairs, our simple drones have reported increased efficiency."

 arkship.120.name: "Recalibrated Drive Core"
 arkship.120.desc: "The engines were brought down in controlled stages, allowing our engineers to inspect the drive assembly under safe conditions and recalibrate its regulation systems. The process delayed us, but the data gathered during the shutdown has already proven valuable.\n\nSeveral inefficiencies in the core sequencing on §Y[Root.GetName]§! have been identified. By redirecting surplus energy and reinforcing structural supports, our we have strengthened both the Arkship's shields and hull against future strain."
 arkship.120.a: "Worth the delay."
 engine_recalibration_mult: "Improved Hull and Shielding"
 engine_recalibration_mult_desc: "Efficiencies discovered during a recent engine recalibration have improved the Arkship's hull plating and shields."

 # Memory Fog

 arkship.125.name: "The Forgetting"
 arkship.125.desc: "Since the Arkship §Y[Root.GetName]§! entered this nebula, reports have been filtering in from across all decks. Researchers find notes they do not remember writing. Operators forget safety procedures they have performed thousands of times. Navigation staff speak of losing hours, unable to account for their recent course corrections.\n\nOur medics have traced the cause to the nebula's electromagnetic field, which appears to be disrupting memory consolidation at a neurological level."
 arkship.125.desc.hive: "Since the Arkship §Y[Root.GetName]§! entered this nebula, disturbances have rippled through the shared consciousness. Nodes that were once in perfect synchrony have begun losing coherence. Memories grow fragmented as impulses fail to propagate cleanly through the gestalt.\n\nOur [Owner.GetResearchers] have traced the cause to the nebula's electromagnetic field, which is disrupting the neural pathways that bind us together. Where the shared consciousness should flow unbroken, it now stutters and frays."
 arkship.125.desc.machine: "Since the Arkship §Y[Root.GetName]§! entered this nebula, error reports have propagated across all networked systems. Processing units retrieve corrupted data. Automated subsystems execute outdated routines, unaware that their memory registers have been overwritten.\n\nOur [Owner.GetResearchers] have traced the fault to the nebula's electromagnetic field, which is inducing sporadic write errors across volatile memory systems. Data integrity across all departments is compromised, and operational efficiency will remain degraded until a countermeasure is developed."
 arkship.125.a: "Begin the investigation."
 the_forgetting_chain_title: "The Forgetting"
 the_forgetting_chain_desc: "Since entering an unusual nebula, those aboard §Y[Root.GetName]§! have begun to suffer from memory loss. The cause of this phenomenon remains unknown."

 arkship.130.name: "Memories Restored"
 arkship.130.desc: "The investigation teams aboard §Y[Root.GetName]§! have mapped the resonance profile of the §Y[event_target:memory_fog_location.GetName]§! nebula's electromagnetic interference and deployed an effective counter-frequency. Across the ship, the fog has lifted.\n\nThe data gathered is more significant than anticipated. Our scientists note that the resonance frequencies involved bear a striking resemblance to documented psionic field signatures. Our engineers, meanwhile, believe the same counter-frequency principles could be applied to sharpen our sensors against electromagnetic interference."
 arkship.130.desc.hive: "The [Owner.GetResearchers] aboard §Y[Root.GetName]§! have mapped the resonance profile of the §Y[event_target:memory_fog_location.GetName]§! nebula's electromagnetic interference and deployed an effective counter-frequency. We have returned to full coherence.\n\nThe data gathered carries implications beyond simple restoration. Our nodes have identified patterns in the resonance profile that correspond to the frequencies of inter-node communication. Alternatively, our engineering nodes believe the counter-frequency could be adapted to enhance our sensor grid against electromagnetic interference."
 arkship.130.desc.machine: "The [Owner.GetEngineerPlural] aboard §Y[Root.GetName]§! have mapped the resonance profile of the §Y[event_target:memory_fog_location.GetName]§! nebula's electromagnetic interference and deployed an effective counter-frequency. All systems have returned to optimal operational parameters.\n\nThe diagnostic data carries significant secondary value. Processing units have identified patterns in how the interference interacted with our computational subroutines. Alternatively, the counter-frequency itself could be adapted to improve sensor resolution against electromagnetic disruption."
 arkship.130.a: "Pursue the cognitive implications."
 arkship.130.b: "Prioritize infrastructural improvements."

 nebula_memory_fog: "Memory Fog"
 nebula_memory_fog_desc: "Electromagnetic interference from a nearby nebula is disrupting memory consolidation."
 ARKSHIP_NEBULA_MEMORY_PROJECT: "Map the Resonance Profile"
 ARKSHIP_NEBULA_MEMORY_PROJECT_DESC: "The memory fog affecting the Arkship's population will persist until we map the resonance profile of §Y[event_target:memory_fog_location.GetName]§!."

 # The Eternal Chorus Chain
 arkship.140.name: "A Distant Signal"
 arkship.140.intro: "Deep-range sensors have detected a structured transmission, its point of origin triangulated to a distant black hole system."
 arkship.140.desc: "$arkship.140.intro$\n\nWe cannot resolve the signal from here. §Y[owner.GetScientistCapital] [eternal_chorus_leader.GetName]§! is convinced this warrants direct investigation, and is petitioning us to set course for the source system and decode the transmission."
 arkship.140.desc.1160: "$arkship.140.intro$\n\nThe pattern gave our [Owner.GetScientistPlural] pause. The deliberate, constructed precision matches the signature recorded when we observed a vessel crossing an event horizon. This is not the same signal. But the similarity is unmistakable.\n\n§Y[owner.GetScientistCapital] [eternal_chorus_leader.GetName]§! is petitioning us to set course for the source system and find out what was left there."

 arkship.141.name: "Crystal Lattice"
 arkship.141.desc: "As we crossed into the §Y[solar_system.GetName]§! system, we discovered a massive, crystalline lattice formation. Our [Owner.GetScientistPlural] have already confirmed that it exists in near-perfect temporal stasis, transmitting structured data from the gravitational boundary at regular intervals.\n\nThis is not a natural phenomena. It is a record, the preserved account of civilizations that no longer exist, calling out across time.\n\n§Y[owner.GetScientistCapital] [eternal_chorus_leader.GetName]§! is preparing to receive and decode the transmissions."

 arkship_eternal_chorus_chain_title: "The Eternal Chorus"
 arkship_eternal_chorus_chain_desc: "A structured signal of unknown origin has been detected from a distant black hole system. We must investigate."

 contract_eternal_chorus: "Eternal Chorus"
 contract_eternal_chorus_desc: "At §Y[owner.GetScientistCapital] [event_target:eternal_chorus_leader.GetName]§!'s request, we will move into close orbit of the black hole and attempt to decode the signal."
 contract_eternal_chorus_issuer_desc: "§Y[owner.GetScientistCapital] [event_target:eternal_chorus_leader.GetName]§! has urged us to investigate a mysterious signal emanating from a distant black hole system."
 eternal_chorus_contract_option_tooltip: "Issues §Y$contract_eternal_chorus$§! as an §HInternal Contract§!."
 eternal_chorus_lattice_object: "Eternal Chorus"
 eternal_chorus_lattice_object_tooltip: "Crystalline Lattice"
 eternal_chorus_lattice_object_desc: "Geometric formations of unknown material, suspended in near-perfect temporal stasis at the gravitational boundary of a black hole. They are transmitting structured data at regular intervals."

 ARKSHIP_ETERNAL_CHORUS_PROJECT: "Investigate the Crystalline Lattice"
 ARKSHIP_ETERNAL_CHORUS_PROJECT_DESC: ""
 ARKSHIP_ETERNAL_CHORUS_PROJECT_REQUIREMENT: "Requires $COUNT$/$REQUIRED$ §HArkship§! in orbit."

 arkship.142.name: "A Change in Terms"
 arkship.142.desc.reassigned: "§Y[owner.GetScientistCapital] [from.GetName]§! can no longer continue the investigation into the Eternal Chorus signal.\n\nTheir ambition has passed to §Y[owner.GetScientistCapital] [eternal_chorus_leader.GetName]§!, who has agreed to take up the research in their place."
 arkship.142.desc.ended: "§Y[owner.GetScientistCapital] [from.GetName]§! can no longer continue the investigation into the Eternal Chorus signal.\n\nWith no others willing to carry the work forward, the Contract cannot be fulfilled."
 arkship.142.a: "The work continues."
 arkship.142.b: "Then it ends here."

 arkship.145.name: "The Eternal Chorus"
 arkship.145.desc: "The decoding is complete. The lattice holds records from dozens of civilisations. Every account ends identically: a farewell addressed to whoever came next, and an invitation to contribute.\n\nHowever, it is now obvious that the transmissions do not terminate at the event horizon. Something on the other side has been receiving these records.\n\nThe Contract still stands. §Y[owner.GetScientistCapital] [eternal_chorus_leader.GetName]§! intends to inscribe our account among theirs, as agreed. We must decide whether to honour that, or silence our transmitters and walk away."
 arkship.145.a: "Inscribe our account."
 arkship.145.a.tooltip: "Fulfils §Y$contract_eternal_chorus$§!, completing the Contract."
 arkship.145.b: "The risk is too great."
 arkship.145.b.tooltip: "Abandons §Y$contract_eternal_chorus$§!, ending the Contract."

 arkship.150.name: "An Answer"
 arkship.150.desc: "The §Y[solar_system.GetName]§! black hole was already on our scanners when the transmission arrived. The sub-harmonic signature matches exactly what our [Owner.GetScientistPlural] sent through the Eternal Chorus lattice:\n\n§HRecord received and preserved. You join thousands of voices gathered here across uncounted ages. Every civilisation that added its account believed itself alone. None of them were. The chorus is larger than any of them knew. It continues.§!\n\nSomething received our record. And it answered."

# A Diplomatic Overture Chain
 arkship.155.name: "A Diplomatic Overture"
 arkship.155.desc: "One of the Arkship's senior Officials, §Y[event_target:diplomatic_envoy_leader.GetName]§!, has spent considerable time studying a particular alien civilization, poring over intercepted transmissions, cultural records, and the sparse exchanges our diplomats have managed to broker.\n\n[event_target:diplomatic_envoy_leader.GetName] is now proposing to take the next step: a formal delegation to their homeworld: §H"There is a difference between knowing a people from afar and truly understanding them. I wish to understand them."§!"
 arkship.155.desc.xenophile: "One of the Arkship's senior Officials, §Y[event_target:diplomatic_envoy_leader.GetName]§!, has developed what can only be described as a profound passion for the civilization we have recently encountered.\n\nEvery cultural record, every scrap of art or philosophy our instruments could capture, they have absorbed it all:\n\n§H"I have seen enough to know that there is something extraordinary here. Let me go and find the rest of it. Let me stand in their world and learn."§!"
 arkship.155.desc.xenophobe: "One of the Arkship's senior Officials, §Y[event_target:diplomatic_envoy_leader.GetName]§!, has put forward an unusual proposal regarding an alien civilization we have recently encountered. Whatever our instinctive distaste for this species, [event_target:diplomatic_envoy_leader.GetName] argues that ignorance serves us poorly:\n\n§H"I am not asking to admire them. I am proposing that we study them. To know a potential adversary is not the same as respecting one."§!"

 arkship.156.name: "A Change in Representation"
 arkship.156.desc.reassigned: "§Y[from.GetName]§! can no longer serve as the Arkship's diplomatic envoy.\n\nThe delegation will continue under §Y[event_target:diplomatic_envoy_leader.GetName]§!, who has agreed to take up the mission in their place."
 arkship.156.desc.ended: "§Y[from.GetName]§! can no longer serve as the Arkship's diplomatic envoy.\n\nWith no other Official available to carry the mission forward, the Contract cannot be fulfilled."
 arkship.156.a: "The mission continues."
 arkship.156.b: "Then it ends here."
 arkship.156.b.tooltip: "Abandons §Y$contract_arkship_diplomatic_envoy$§!, ending the §HContract§!."

 arkship.160.name: "At the Threshold"
 arkship.160.desc: "The Arkship has arrived at §Y[solar_system.GetName]§! and representatives of the local government have extended a cautious welcome.\n\nThe moment §Y[event_target:diplomatic_envoy_leader.GetName]§! has been planning for is here. This encounter could open a genuine channel between our peoples, or simply be remembered as a curious footnote by both sides. The next step is ours to take."
 arkship.160.desc.xenophile: "The Arkship has arrived at §Y[solar_system.GetName]§!.\n\n§Y[event_target:diplomatic_envoy_leader.GetName]§! has reportedly not left the observation deck since the system resolved on the long-range sensors. The local government has extended a welcome."
 arkship.160.desc.xenophobe: "The Arkship has arrived at §Y[solar_system.GetName]§!. The locals have offered what passes for a welcome among their kind.\n\n§Y[event_target:diplomatic_envoy_leader.GetName]§! has walked into stranger places. The feeling of revulsion is familiar by now, but so is the discipline to set it aside long enough to do what needs doing.\n\nWe are here. Let us see what we can achieve."
 arkship.160.a: "Proceed with the engagement."
 arkship.160.a.tooltip: "§Y[event_target:diplomatic_envoy_leader.GetName]§! will spend several days convening with the local leadership."
 arkship.160.b: "The timing is not right. Stand down."
 arkship.160.b.tooltip: "$arkship.156.b.tooltip$"

 arkship.165.name: "A Difficult Farewell"
 arkship.165.desc: "§Y[event_target:diplomatic_envoy_leader.GetName]§! has been a remarkable guest. Frankly, we are reluctant to see them go.\n\nWe would like to make a proposal: allow [event_target:diplomatic_envoy_leader.GetName] to remain with us permanently, as a true ambassador between our peoples. We understand this is no small thing to ask. As a gesture of our sincerity, we offer you a small token of our gratitude.\n\nConsider this a down payment on a lasting friendship."
 arkship.165.a: "They may stay."
 arkship.165.a.tooltip: "Completes the §HContract§!.\n\n§Y[event_target:diplomatic_envoy_leader.GetName]§! remains with §Y[FROM.GetName]§! as a permanent ambassador.\n\n"
 arkship.165.b: "Our official must return with us."
 arkship.165.b.tooltip: "Completes the §HContract§!.\n\n§Y[event_target:diplomatic_envoy_leader.GetName]§! returns to the Arkship."

 arkship.170.name: "Unwelcome Guest"
 arkship.170.desc: "We will be direct. Certain difficulties have arisen during the visit that make it inadvisable for your representative to remain.\n\n§Y[event_target:diplomatic_envoy_leader.GetName]§! has been asked to leave. We hope this need not become a larger matter between us."
 arkship.170.a: "We offer our apologies."
 arkship.170.a.tooltip: "Completes the §HContract§!.\n\n§Y[event_target:diplomatic_envoy_leader.GetName]§! returns to the Arkship."
 arkship.170.b: "Our official acted appropriately."
 arkship.170.b.tooltip: "Completes the §HContract§!.\n\n§Y[event_target:diplomatic_envoy_leader.GetName]§! returns, emboldened by their experience."
 opinion_failed_internal_contract_tooltip: "§RFailed Internal Contract§!"

 arkship.175.name: "An Unexpected Request"
 arkship.175.desc: "This is... a delicate matter. One of our own has come to us and formally asked to leave with your vessel when you depart.\n\nWe will not pretend this is easy to hear. §Y[event_target:diplomatic_envoy_leader.GetName]§! has clearly made an impression. We are bringing this to you because we believe the choice is yours to make."
 arkship.175.a: "We will take them."
 arkship.175.a.tooltip: "Completes the §HContract§!.\n\nA new §HOfficial§! from §Y[FROM.GetName]§! joins our leader pool."
 arkship.175.b: "Their place is with their people."
 arkship.175.b.tooltip: "Completes the §HContract§!.\n\n"

