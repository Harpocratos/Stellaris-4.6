 toggle_nomad_on: "§H$nomadic_gameplay_title$§! (§ROff§!)$NEW_LINE$$ETHIC_GESTALT_CONSCIOUSNESS_NO_TUTORIAL$$NEW_LINE$$nomadic_gameplay_desc$ $DOUBLE_NEW_LINE$§GClick to enable $nomadic_gameplay_title$§!"
