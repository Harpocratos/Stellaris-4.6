 arkship.885.name: "Crossing the Breach"
 arkship.885.desc: "Our presence in §Y[from.solar_system.GetName]§! has been detected, and the §Y[from.solar_system.Owner.GetName]§! empire is monitoring our movements with growing suspicion.\n\nFollowing tense diplomatic exchanges, they have demanded that we depart their territory or face the reprisals."
 arkship.885.a: "We should consider moving on."

 arkship.895.name: "A Cloaked Endeavor"
 arkship.895.desc: "The scanners of the §Y[from.solar_system.Owner.GetName]§! empire in the §Y[from.solar_system.GetName]§! system have not detected our presence.\n\nWhile our cloaking field remains active, we must avoid any actions that could risk revealing our presence."

 arkship.915.name: "An Ancient Power"
 arkship.915.desc: "Crossing the border into the §Y[from.solar_system.GetName]§! system, we encounter no resistance, only a tension deeper than any scan can measure.\n\nThis space bears the hallmarks of a civilization long past its zenith, yet far from powerless. Should its attention be drawn to us, we would be found wanting.\n\nLet prudence guide our every move. This is not our domain."

 MESSAGE_OUR_ARKSHIP_BREACHED_BORDERS_TITLE: "Borders Breached"
 MESSAGE_OUR_ARKSHIP_BREACHED_BORDERS_DESC: "Our presence has been detected in the §Y[FromFrom.GetName]§! system. We are being monitored."

 opinion_arkship_breaching_borders: "Breached our Borders"
 opinion_arkship_archeological_theft: "Stole our Archaeological Vestiges"

# Waystation has been built

 arkship.905.name: "Waystation Constructed"
 arkship.905.desc: "Our scanners have detected the construction of a waystation in the §Y[From.GetName]§! system, established by a nomadic empire. While such structures are often used to harvest resources, their exact purpose can vary.\n\nThis development warrants observation."

 MESSAGE_WAYSTATION_CONSTRUCTED_TITLE: "Waystation Established"
 MESSAGE_WAYSTATION_CONSTRUCTED_DESC: "A nomadic empire has constructed a waystation in the §Y[Root.GetName]§! system."

 nomads.4110.name: "Resources Harvested By Nomads"
 nomads.4110.desc: "A nomadic empire, the §Y[nomad_harvesting_deposits_country.GetName]§!, has conducted harvesting operations in the §Y[nomad_harvested_system.GetName]§! system and is drawing resources from our deposits, rendering them unprofitable for the near future.\n\nThis violation of our sovereignty should probably not go unanswered. Should we wish it so, we could muster our fleets to drive the Nomads off and forbid them access to our space."
 MESSAGE_NOMAD_HARVESTING_DEPOSITS_TITLE: "Deposits Being Harvested"
 MESSAGE_NOMAD_HARVESTING_DEPOSITS_DESC: "$COUNTRY|Y$ is harvesting resources from deposits in the $SYSTEM|Y$ system, within our borders."

# A Mysterious Sickness

 a_mysterious_sickness_chain_title: "A Mysterious Sickness"
 a_mysterious_sickness_chain_desc: "Reports from Arkship §Y[Root.GetName]§! indicate minor behavioral irregularities among the crew, marked by increased socialization and elevated morale. The underlying cause of these changes remains unclear."

 A_MYSTERIOUS_SICKNESS_PROJECT: "Strange Behavior"
 A_MYSTERIOUS_SICKNESS_PROJECT_DESC: "The crew members of Arkship §Y[Root.GetName]§! have been acting abnormally for an extended period. Reports suggest their routines have become erratic, with several crew members displaying signs of infatuation and secrecy. Investigation is recommended."

 arkship.1030.name: "Small Gestures"
 arkship.1030.desc: "Reports from Arkship §Y[Root.GetName]§! have flagged several minor irregularities in crew behavior. Personal logs reveal scattered oddities: unusual attention to grooming, regular shift swaps to be around specific coworkers, and an uptick in off-duty gatherings in communal areas. None of this appears to interfere with operations, and the crew morale is unusually high."
 arkship.1030.a: "Noted. Odd, but inconsequential."

 arkship.1035.name: "A State of Infatuation"
 arkship.1035.desc: "Our bridge and command staff aboard the Arkship §Y[Root.GetName]§! have now entered a new level of infatuation. Odd if harmless behavior has now intensified into outright amorous activity: crew are exchanging elaborate epithets, crafting trinkets for one another, and can often be found strolling the corridors, [owner.species.GetHandName] in [owner.species.GetHandName].\n\nWork routines have faltered as maintenance cycles are being deferred. While not currently critical, if this goes on, operational status could become compromised."
 arkship.1035.a: "Monitor the situation."
 arkship.1035.b: "Investigate where the sudden change is coming from."

 arkship.1040.name: "A Time of Affection"
 arkship.1040.desc: "Initial reports of an emotionally charged crew atmosphere aboard Arkship §Y[Root.GetName]§! have given way to something far more serious. Many crew members have been involved in elaborate romantic displays. Poetic recitals and public displays of affection have begun to dominate daily life on board.\n\nUnfortunately, not all affections are reciprocated. Rejections have led to several minor altercations, and at least one engineering officer has barricaded themselves in the observatory, declaring they will not come out "until someone truly understands them"."
 arkship.1040.a: "Let love be. No need to interfere."
 arkship.1040.b: "This ends now."

 arkship.1045.name: "Efficiency Through Affection"
 arkship.1045.desc.start: "Inspired by shared ideals aboard the Arkship §Y[Root.GetName]§!, we have begun spreading affection to the physical space surrounding us, including the ship itself.\n\n"
 arkship.1045.desc.end: "Storage units were cleaner and living quarters tidier than ever before. Our leader §Y[arkship_leader.GetName]§! is referring to this maintenance as "tending to our beloved home", and has adapted well to this rather unusual situation. Performance metrics have risen again and the population seems happier. It appears that, when properly aimed, love can power more than amorous behavior."
 arkship.1045.a: "Through love, all is possible."
 arkship.1045.desc: "$arkship.1045.desc.start$$arkship.1045.desc.end$"
 arkship.1045.desc.noleader: "$arkship.1045.desc.start$We were in dire straits until §Y[arkship_leader.GetName]§! took command of the situation and was granted leadership of the Arkship. $arkship.1045.desc.end$"

 arkship.1050.name: "Matters of Discipline"
 arkship.1050.desc.start: "The situation aboard Arkship §Y[Root.GetName]§! has crossed an unacceptable threshold. What began as a harmless emotional flourish has since undermined discipline, efficiency, and the very structure of command. A direct intervention by law has now been authorized.\n\n"
 arkship.1050.desc.end: "The transformation was immediate and absolute. Several officers implicated in particularly disruptive entanglements have been reassigned by §Y[arkship_leader.GetName]§!, ensuring a return to established norms. Corridors once lively with music and whispered declarations now echo with silence. Whispers of a black market for love letters have started, yet the flow has dwindled, choked off by surveillance and fear. Morale has dropped, but order has returned."
 arkship.1050.desc: "$arkship.1050.desc.start$$arkship.1050.desc.end$"
 arkship.1050.desc.noleader: "$arkship.1050.desc.start$We were in dire straits until §Y[arkship_leader.GetName]§! took command of the situation and was granted leadership of the Arkship. $arkship.1050.desc.end$"
 arkship.1050.a: "Order has been restored."
 arkship.1050.a.tt: "§Y[arkship_leader.GetName]§! is now the Governor of §Y[Root.GetName]§!"

 arkship.1055.name: "Floating Spores"
 arkship.1055.desc: "The special project issued aboard the Arkship §Y[Root.GetName]§! has revealed an unusual biological agent. A mysterious plant has taken root within the Arkship's filtration systems. Our scientists suggest that space-born spores made it on board through the ventilation systems and found a place to grow roots. The spores of the plant's flower carried through our systems are inducing heightened emotional states in all who live aboard the ship.\n\nThe plant's blossoms emit a faint bioluminescence, and its root structure appears to feed directly on the recycled humidity of the ship's atmosphere. Our crew members describe the smell as "sweet, whimsical, and nostalgic." Left unchecked, the spores will continue to manipulate the crew's emotions. The plant, however, also displays remarkable resilience, perhaps even a potential application, should we learn to cultivate it properly."
 arkship.1055.a: "It's too dangerous. Destroy the plant."
 arkship.1055.b: "Trace where it came from."

 arkship.1060.name: "The Weight of Absence"
 arkship.1060.desc.start: "The plant on Arkship §Y[Root.GetName]§! has been eradicated. Its roots were destroyed from the atmosphere ducts, and its spores purged from the ship's air. The crew has at last resumed their usual behavior.\n\n"
 arkship.1060.desc.end: "However, the return to order has left a heavy silence. Many crew members describe an aching absence, as though something precious has been flushed out, but our leader §Y[arkship_leader.GetName]§! ensured that law and order were restored despite the unruly feelings. The ship may be operational, but it carries an invisible cargo: the weight of broken love."
 arkship.1060.desc: "$arkship.1060.desc.start$$arkship.1060.desc.end$"
 arkship.1060.desc.noleader: "$arkship.1060.desc.start$We were in dire straits until §Y[arkship_leader.GetName]§! took command of the situation and was granted leadership of the Arkship. $arkship.1060.desc.end$"
 arkship.1060.a: "Nothing lasts forever."

 arkship.1065.name: "Flowers Beyond the Stars"
 arkship.1065.desc.start: "Detailed genetic analysis has identified the mysterious flora as an unknown species. Its origins point to a desolate stellar cluster. Even stranger, the plant requires conditions so exacting that survival beyond its native soil should be impossible: precise levels of humidity, a nutrient rich atmosphere, and a certain degree of radiation.\n\n"
 arkship.1065.desc.end: "A biochemical study suggests the plant's spores possess potential as a neural modulator. Despite the side effects, if properly refined, they might treat anxiety, depression, or even trauma. Our leader §Y[arkship_leader.GetName]§! took a special interest in this particular plant, and has decided to expand their agricultural knowledge as a result."
 arkship.1065.desc.noleader: "$arkship.1065.desc.start$We were in dire straits until §Y[arkship_leader.GetName]§! took command of the situation and was granted leadership of the Arkship. $arkship.1065.desc.end$"
 arkship.1065.desc: "$arkship.1065.desc.start$$arkship.1065.desc.end$"
 arkship.1065.a: "A promising find."

 arkship.1070.name: "A Staggering Motion"
 arkship.1070.desc: "The Arkship §Y[Root.GetName]§! now crosses the void at speeds our ancestors could scarcely have imagined.\n\nWhere earlier generations spent years, even lifetimes, drifting between distant stars, our modern drives hurl the Arkship from system to system in a matter of days. The stars streak past our sensors in rapid succession, their light shifting and distorting as the ship plunges through the hyperlane network.\n\nFor many aboard, the experience has proven strangely disorienting. Some have begun seeking small ways to anchor themselves against the sensation. Others insist that, given time, our minds will simply learn to keep pace with the Arkship's accelerating journey."
 arkship.1070.a: "Boost morale through regular exercise."
 arkship.1070.b: "Try playing engine noises through internal comms."

 arkship.1075.name: "A Faltering Core"
 arkship.1075.desc: "A faulty relay is interfering with the Arkship §Y[Root.GetName]§!'s power core. In addition to being immobilized, the lights are now going out on residential decks. Farms report irregular energy surges, and several key research modules have gone offline.\n\nOur chief engineers warn that without intervention, cascading failures will spread throughout the ship. Unfortunately the solution is not straightforward. Repairing the relay will require diverting resources from our reserves, while bypassing it risks compromising the Arkship's long-term stability.\n\nThe cooling ship creaks and groans unsettlingly. We need to make a decision now."
 arkship.1075.a: "Spare no expense and repair it properly."
 arkship.1075.b: "Patch it and move on. We cannot afford luxuries."
 arkship.1080.name: "An Energized Core"
 arkship.1080.desc: "Against all odds, the engineering crew on Arkship §Y[Root.GetName]§! has not only repaired the faulty relay, but improved it. Energy distribution across the ship is now smoother than ever, stabilizing systems that have been temperamental for years. Crew morale has risen sharply, with many expressing newfound pride in the Arkship's resilience."
 arkship.1080.a: "A remarkable improvement."
 arkship.1085.name: "A Patchwork Crisis"
 arkship.1085.desc: "The quick fix on the Arkship §Y[Root.GetName]§!'s power core is holding, at least for now. But the makeshift bypass circuits are straining under constant use. Frequent ship-wide blackouts are now a way of life, and environmental controls in some sections have been oscillating between too hot, and too cold. The crew grumble that leadership chose expedience over security. Whispers circulate that the Arkship is becoming a patchwork relic, rather than a beacon of endurance."
 arkship.1085.a: "We must make do and mend."

 arkship.1090.name: "A Playground of Giants"
 arkship.1090.desc: "As the Arkship §Y[Root.GetName]§! continues to drift, the observation decks have erupted in delight. A pod of juvenile tiyanki has passed nearby, and they seem to be in a playful mood.\n\nThey weave around each other in broad, looping arcs, their vast forms tumbling around one another. From the wide glass panes, the sight is mesmerizing: colossal shapes floating among the stars, their luminous bodies glimmering while seemingly communicating in a language only they could understand. Entire families crowd the decks to watch, momentarily letting go of their burdens. It is a true wonder for all ages."
 arkship.1090.a: "A rare opportunity to observe space fauna behavior."
 arkship.1095.name: "A Scientific Miracle"
 arkship.1095.desc: "Our [Owner.GetScientistPlural] aboard the Arkship §Y[Root.GetName]§! were no less enthralled by the Tiyanki calves. To witness such behavior at this proximity is almost unprecedented. Our studies suggest this was a social phenomenon that is rarely observed outside deep Tiyanki habitats.\n\nThe general atmosphere aboard the Arkship now feels lighter, as if the animals' joy permeates the hull."
 arkship.1095.a: "A truly miraculous event."

 arkship.1100.name: "A Putrid Smell"
 arkship.1100.desc: "Internal environmental sensors aboard the Arkship §Y[Root.GetName]§! have registered elevated levels of volatile airborne compounds. The crew, particularly those stationed on the bridge, have reported symptoms consistent with low-grade toxic exposure: nausea, disorientation, and persistent neuropathic pain.\n\nAttempts to purge the contaminants via standard ventilation protocols have proven ineffective. A putrid odor fills the corridors, defying filtration and increasing crew discomfort. Irregularities in the ship's waste-disposal systems indicate the possibility of an imminent systemic malfunction.\n\nSwift investigation is warranted."
 arkship.1105.name: "A Mutated Infestation"
 arkship.1105.desc: "Inspection of the Arkship's refuse compactor has revealed a significant rodent infestation. The rodentia display irregular physical characteristics, suggesting mutation. The sheer size of the specimens is troubling, and their screeching vocalizations when approached are markedly louder than baseline species. Their odor is especially pervasive, and the creatures have been observed emerging from numerous structural recesses, indicating a wide dispersal throughout the vessel.\n\nThis discovery raises an ethical question: whether these mutated organisms should be exterminated as a hazard, or preserved as a novel form of life. Either way, we should remove them from our ventilation system."
 arkship.1105.a: "The only way to stop them is to purge them. Burn the pests!"
 arkship.1105.b: "Shut down the refuse compactor!"
 arkship.1105.c: "We shall learn to live with the smell."
 arkship.1110.name: "The Purge of Rodents"
 arkship.1110.desc: "The purging of the infestation in our Arkship's ventilation systems was effective, though not without consequence. The creatures perished in the cleansing fires, their high-pitched distress calls echoing through the corridors. In their final efforts to escape, several ventilation tiles and maintenance panels were breached, leaving structural gaps that will require repair.\n\nThe immediate threat to ship systems has been neutralized. The crew can now take some comfort in the knowledge that the ship is no longer compromised. Although the smell still lingers."
 arkship.1110.a: "At least the infestation has been taken care of."
 arkship.1115.name: "A Remarkable Species"
 arkship.1115.desc: "Examining the mutated rodent specimens on Arkship §Y[Root.GetName]§! has uncovered remarkable adaptive traits. The creatures display exceptional resilience, thriving in hostile and resource-scarce environments that would prove fatal to most organisms. More significantly, controlled trials have demonstrated that, when exposed to a targeted compound introduced into the Arkship's waste stream, the rodents cease producing their characteristic odor. Instead, they metabolize refuse with notable efficiency, effectively reducing accumulated waste.\n\nWhile unconventional, this discovery suggests that the infestation may be reclassified as a potential ecological asset rather than a liability."
 arkship.1115.a: "Our trash is their treasure."

# A Forgotten Level

 a_forgotten_level_chain_title: "A Forgotten Level"
 a_forgotten_level_chain_desc: "The existence of an undocumented sub-level within §YArkship [Root.GetName]§! raises troubling questions. Its purpose remains unknown, and all available records of what lies within have been deliberately erased."

 d_forgotten_level: "Reclaimed Level"
 d_forgotten_level_desc: "An entire sub-level of the Arkship, deliberately erased from all collective records, now lies vacant, its reclaimed space available for our own design."

 d_forgotten_level_blocker: "Waste Filled Sub-Level"
 d_forgotten_level_blocker_desc: "This section of the Arkship is cluttered with unusable debris and obsolete equipment, and must be thoroughly cleared before it can be repurposed."

 arkship.1120.name: "A Forgotten Level"
 arkship.1120.desc: "While straying in one of the Arkship's less-frequented sections, a group of juveniles identified a dislodged metallic access panel. Opening it, they entered an undocumented sub-level of §YArkship [Root.GetName]§!. For several hours thereafter, the group ceased to register on all internal tracking and environmental monitoring systems.\n\nWhen they returned, the juvenile explorers displayed clear signs of psychological and physical distress. Some fluctuated between incoherent babbling and a near catatonic state. However, despite repeated attempts, they have all refused to provide any account of their experiences during the incident.\n\nExperts believe that whatever occurred in that sub-level was severe enough to have been deliberately excised from all records."
 arkship.1120.a: "Authorize an investigation."
 arkship.1120.b: "Seal the panel for good."

 arkship.1125.name: "An Undisturbed Vault"
 arkship.1125.desc: "Beyond the newly accessed level, the research team found a series of heavy vault doors sealed by a manual wheel. From the other side came a distorted sound like distant screeching.\n\nForcing the doors open required the full strength of the team and produced a deafening clamor. The source proved to be a severely degraded power generator, still grinding far beyond its intended lifespan. More troubling were the fresh traces of activity scattered throughout the sector.\n\nThe facility is not abandoned, and whoever resides here now knows we have arrived."
 arkship.1125.a: "Push on."
 arkship.1125.b: "Abort mission."

 arkship.1130.name: "Life in the Walls"
 arkship.1130.desc: "When entering the vault, the team encountered clear signs of prolonged habitation. Improvised sleeping arrangements lined the walls, alongside makeshift storage containers filled with salvaged materials, suggesting an organized and sustained presence rather than a temporary shelter.\n\nThe team soon encountered figures emerging from the shadows. They were of our own species, yet diminished: gaunt, poorly clothed, armed with crude weapons. They spoke in a warped, archaic dialect unmistakably rooted in our own language. Conflict was narrowly averted.\n\nEvidence suggests they had been sealed here for generations. Were they subjects of some forgotten experiment? The heirs to a punishment no one now remembers? Or something stranger still, preserved in darkness for a purpose long since lost?"
 arkship.1130.a: "Let's see what we can learn from them."
 arkship.1130.a.military: "Burn this whole place to the ground"

 arkship.1135.name: "An Immortal Virus"
 arkship.1135.desc: "Upon arrival, the elevator doors opened onto a dark corridor lined with obsolete machinery, abandoned in haste. Outdated lab equipment lay scattered, flasks still sealed around biological samples that match no known classification. Fragmentary emergency protocols reference a catastrophic containment failure.\n\nDeeper within, the team found the desiccated remains of a distant ancestor of our species. The body was shriveled yet unnaturally preserved, its decay arrested by an engineered biological agent. Such a discovery might explain why earlier Arkship leadership chose to seal the entire level."
 arkship.1135.a: "A strange discovery."

 arkship.1140.name: "Sealed for a Reason"
 arkship.1140.desc: "Upon entering the level, the team reported immediate psychological distress. What first appeared to be a detention block proved closer to an abandoned asylum. Reinforced cells lined the corridors, restraints bolted into the floors. Diagnostic equipment stood fused with instruments of coercion, blurring any distinction between care and punishment.\n\nThe evidence suggests our ancestors chose to bury this place deliberately. Whether from shame or a desire to protect those who came after, they erased it from memory. Perhaps they believed it safer forgotten."
 arkship.1140.a: "A shocking find."

 arkship.1145.name: "Vaulted Collection"
 arkship.1145.desc: "The elevator opened onto a vast gallery lined with statues of varied make and style. Some were elegant, others grotesque, all mounted on marble pedestals and turned toward the intruders in silent appraisal.\n\nBehind shattered cases and crumbling panels, the team uncovered a hidden chamber packed with carefully preserved §YRare Crystals§!. A tall white statue stood watch over the hoard. As they moved, its face, shaped just like one of our kind, seemed to follow. Despite the team's initial sense that removing the crystals bordered on theft, we quickly developed a peculiar fondness for the statue."
 arkship.1145.a: "Take the crystals and the statue."
 arkship.1145.b: "Abort mission."

 arkship.1150.name: "Engines for Nothing"
 arkship.1150.desc: "The level roared with machinery. Assembly lines still ran at full capacity, forging scrap into engines, only to dismantle them in the final stage and return the output to raw metal. The cycle repeated without purpose.\n\nDeeper inside, a fabrication unit operated beyond safe limits, assembling robotic frames and fitting them with processing cores. Each construct collapsed moments after activation, its form structurally unsound. Some flickered with brief, unsettling signs of awareness before falling still. Most initiated their own shutdown sequences."
 arkship.1150.a: "A tragic fate."

 arkship.1160.name: "Black Hole Phenomenon"
 arkship.1160.desc: "Our instruments aboard the Arkship §Y[Root.GetName]§! registered anomalous emissions from the black hole in the §Y[solar_system.GetName]§! system. Long-range scans detected the glimpse of an unidentified object approaching the singularity. Their immense vessel emitted technological signatures far beyond our understanding, interfering with our readings and rendering precise analysis impossible. Visual confirmation was fleeting at best, resembling a hallucination more than anything tangible.\n\nMoments before the vessel crossed into the unknown, we observe a strange sight: the ship passing through the black hole intact, clearly intentionally. Then, all signals ceased. Whether the vessel was destroyed, displaced, or survived in some incomprehensible state remains unknown. What is certain is that the black hole reacted, and we may have glimpsed something we cannot yet explain. Whatever transpired at that horizon, it is clear that we have not emerged from this observation unchanged."
 arkship.1160.a: "May we see further."
 arkship.1160.b: "Let's gather what we can."

 arkship.1165.name: "Planetary Illuminations"
 arkship.1165.desc: "While passing a colonized world in the §Y[solar_system.GetName]§! system, we observed its nightside erupt in synchronized bursts of light. Initial fears of unrest proved unfounded. The emissions were controlled, planet-wide pyrotechnic displays, well within non-military parameters.\n\nCloser analysis revealed deliberate astronomical alignments woven into the spectacle. It feels safe to conclude that the inhabitants are encoding meaning in light. Our [Owner.GetResearchers] have documented the patterns, gaining insight into large-scale coordination and symbolic communication."
 arkship.1165.a: "A wonderful sight."
 arkship.1165.b: "Pathetic. They burn resources to feel briefly whole."
 arkship.1165.c: "Unexpected, yet not unpleasant."
 arkship.1165.d: "They lack unity, yet strive toward it."
 arkship.1165.e: "Bright lights make easy targets."
 arkship.1165.f: "We rejoice in their celebration."
 arkship.1165.g: "Potential slaves."
 arkship.1165.h: "A paltry excuse for fireworks."
 arkship.1165.i: "Monetize the recordings."
 arkship.1165.j: "Incendiary."
 arkship.1165.k: "Insignificant, yet amusing."
 arkship.1165.l: "May the fire enlighten their spirits."

 arkship.1170.name: "The Skin of a Giant"
 arkship.1170.desc: "While passing through the planetary belt in the §Y[solar_system.GetName]§! system, we observed several faintly shimmering objects drifting among the debris. Initial scans suggested irregular asteroids, but closer inspection revealed layered, scale-like structures reflecting stellar light in shifting bands of color.\n\nFurther analysis indicates these fragments were partly mineral in origin, partly biological. It seemed to be remnants of an §YEther Drake§! that appeared to have been hit by an asteroid and lost part of its armored hide before leaving the system. Starlight catches the discarded scales, scattering prismatic light across the Arkship."
 arkship.1170.a: "We should study its composition."
 arkship.1170.b: "Let's see what we can harvest."
 arkship.1170.c: "Leave it."
 arkship.1175.name: "Reinforcing the Arkship"
 arkship.1175.desc: "While studying the scattered scales, we noted the extraordinary resilience of the material. The complex, layered structure reveals a fusion of biological growth and natural armor engineering far beyond our previous assumptions. The scales' layered composition exhibits remarkable resistance to heat, kinetic impact, and energy discharge.\n\nWe experimented with replicating the plating and inserted it into the Arkship's outer hull, where we can enhance its defensive capacity. What once was the armor of a roaming drake will now serve our knowledge to shield us against the many dangers that await in the void."
 arkship.1175.a: "A magnificent find."
 arkship.1180.name: "Gilded Remnants"
 arkship.1180.desc: "The drifting fragments of §YEther Drake§! scales in the §Y[solar_system.GetName]§! system have attracted significant attention.\n\nThe scales were cleaned and carefully polished before being crafted into striking ornamental pieces. Once offered on the market, these relics of a legendary creature fetched an exceptionally high price, proving very impressive and profitable."
 arkship.1180.a: "A fine profit from a most unusual source."
 arkship.1180.b: "Who knew legends could be so lucrative?"
 THE_SKIN_OF_A_GIANT_PROJECT: "$arkship.1170.name$"
 THE_SKIN_OF_A_GIANT_PROJECT_DESC: "The Ether Drake scales radiate a palpable power that warrants extreme caution. Any attempt to collect them should proceed carefully, as the remnants of such a creature may still carry unpredictable properties."
 etherdrake_scale_object: "Shimmering Asteroid"
 etherdrake_scale_object_tooltip: "A regular asteroid with radiant particles."
 etherdrake_scale_object_desc: "An asteroid with fragments of luminous scales embedded in its surface, their unusual sheen setting it apart from ordinary space debris."

 arkship.1185.name: "Unregulated Trade"
 arkship.1185.desc: "A routine audit aboard §YArkship [Root.GetName]§! has uncovered discrepancies in our cargo records.\n\nSecurity footage indicates the formation of an informal exchange network among the Arkship's residents. A barter system has quietly emerged among crew and civilians. Perishables, tools, luxury goods, and personal services are traded in secluded corners where surveillance is limited.\n\nThe discovery raises uncomfortable questions. Some admire the ingenuity on display. Others warn that any lapse in oversight aboard an Arkship could carry serious risks."
 arkship.1185.a: "Legalize the exchange."
 arkship.1185.b: "Tax the participants."
 arkship.1185.c: "Shut this down immediately."

 arkship.1190.name: "A Free Market"
 arkship.1190.desc: "The unauthorized barter network within the Arkship has proven remarkably stable. Despite the lack of official oversight, the network has regulated itself through trust and mutual dependence. Disputes are rare, and essential goods continue to circulate where the Arkship's formal distribution systems struggle to keep pace. By legalizing the exchanges and establishing clear boundaries, the Arkship embraced a limited free market within its walls.\n\nFor many residents, the change offers more than access to goods. It provides agency, responsibility, and a renewed sense of purpose within the vast machinery of the Arkship."
 arkship.1190.a: "Let the market thrive."

 arkship.1195.name: "Control Regained"
 arkship.1195.desc: "The unauthorized market was shut down successfully. Our security teams have begun dismantling the network. Storage lockers used for trading have been sealed, and surveillance expanded in the low-visibility areas. Those organizing exchanges have been formally reassigned or received disciplinary actions.\n\nWhile the barter network had provided some residents with a sense of autonomy and opportunity, the Arkship was never designed to support unofficial means of distribution. On a vessel where every resource must be accounted for, control and predictability remain of highest importance."

 arkship.1200.name: "Death and Taxes"
 arkship.1200.desc: "The barter network operating within the Arkship's maintenance corridors has proven surprisingly efficient. Goods continue to circulate through unofficial channels, filling small but persistent gaps in the Arkship's distribution systems.\n\nCertain intermediaries have been discreetly approached and offered protection from enforcement in return for cooperation. A modest share of each transaction now finds its way back into our official accounts. To the residents, the market remains unofficial and largely invisible to authority. In practice, however, its flows are carefully observed and surprisingly profitable."
 arkship.1200.a: "If trade flows, so will revenue."
 arkship.1200.b: "Taxation is the price of prosperity."

 free_market: "Free Market"
 free_market_desc: "Resources are traded under supervision, with supply and demand guiding distribution."
 total_control: "Total Control"
 total_control_desc: "Maintaining order on the Arkship requires strict distribution of all available resources."

 # The Only Sky We Know

 arkship.1205.name: "The Only Sky We Know"
 arkship.1205.desc: "Deep within the §YArkship [Root.GetName]§! storage archives, archivists have uncovered a small sealed case buried among long-forgotten inventory. Inside was a single unremarkable microchip, catalogued but never properly indexed. If it had possessed any real value, it would likely not have ended up forgotten in a storage crate.\n\nThe technology was severely outdated, using data formats that predate several generations of Arkship systems. Some speculate that it may originate from the early days of the journey, perhaps even from the era when our species still lived on a planetary surface."
 arkship.1205.a: "Attempt to recover the archived data."
 arkship.1205.b: "Discard the trash."

 arkship.1210.name: "Cultural Insights"
 arkship.1210.desc.a: "The recovered data shows an old seasonal celebration from our planetary past. It appears to have marked the passing of the colder months and the awakening of nature. Communities gathered to welcome the return of warmth and light. Bonfires were lit, bright colors were spread among participants. The records also describe the sharing of special sweets, singing and dancing together, and simply watching the first blooms of the season as they appeared.\n\nThough such seasonal changes no longer exist aboard the Arkship, the fragments offer a small glimpse into how our ancestors once celebrated this fetsivity."

 arkship.1210.desc.b: "The entry recovered from the microchip describes a seasonal celebration tied to the changing of the year's cycle. It took place during the darkest period of the year, when daylight was scarce and colder conditions dominated much of the planet. Communities responded by decorating their homes and public spaces with lights, turning the long nights into something bright and festive. People gathered to exchange gifts and share unusually rich foods.\n\nSuch winters no longer exist aboard the Arkship, the data shows how our ancestors once answered the darkest season with warmth and light."

 arkship.1210.desc.c: "The entry appears to describe a personal celebration once common on our homeworld. The records refer to an occasion marking the passing of an individual's yearly life cycle. On this day, family and friends would gather to celebrate the person and the years they had lived. The tradition seems to have involved sharing sustenance together specifically prepared for the event.\n\nThough life aboard the Arkship now follows different rhythms, the records suggest that our ancestors once paused each year to celebrate the continuation of a single life among many."

 arkship.1210.desc.d: "The recovered microchip appears to reveal celebrations marking the beginning of a new yearly cycle. Our ancestors would first clean their living spaces. As the renewal of the sun cycle approached, communities gathered to count down the final moments. The arrival of the new cycle was greeted with bright lights, dancing, and widespread celebration. Participants also recorded personal intentions for the coming year, resolutions meant to guide their actions and improvements in the time ahead.\n\nThough life aboard the Arkship now follows carefully regulated cycles rather than planetary calendars, the data shows how our ancestors once marked the passing of time with a continuous hope for the future."
 arkship.1210.a: "We should learn from this."

 arkship.1210.desc.e: "The entry recovered from the microchip describes a social tradition centered on the formal union of two individuals. According to the records, communities gathered to witness the pair publicly declare their commitment to one another. These ceremonies often involved symbolic clothing, spoken vows, and the presence of family and friends acting as witnesses.\n\n While partnerships aboard the Arkship are often recorded through administrative systems rather than elaborate rituals, the archive suggests that our ancestors once marked such unions with considerable ceremony and communal celebration."

 arkship.1210.desc.f: "The record recovered from the microchip describes a lively festival once celebrated on our homeworld. Participants dressed in elaborate costumes and masks, temporarily adopting new identities for the celebration. The data also references organized processions, decorated platforms moving through public spaces while crowds followed while dancing and cheering.\n\nCelebrations aboard the Arkship are far more restrained by comparison, shaped by duty cycles and limited resources. The records suggest that, in another time, our ancestors occasionally set practicality aside in favor of spectacle and indulgence."

 arkship.1210.desc.g: "The microchip revealed the record of a seasonal festival from our species' planetary era. It appears to have been held at the end of the harvesting season, when communities gathered to give thanks for the food collected during the year. The celebration also marked the approach of a darker time of year, when daylight would grow scarce and colder conditions returned. Participants dressed in unsettling disguises, perhaps to imitate or ward off imagined spirits.\n\nThough the Arkship's agricultural cycles are carefully regulated, and we do not have any need for these traditions, the archive suggests that our ancestors once marked the changing seasons with gratitude, creativity, and a touch of mischief."

 arkship.1210.desc.h: "The microchip revealed a cultural record. It showed a tradition centered on remembering those who had passed away. According to the data, communities would create small displays dedicated to deceased relatives and friends, decorating them with flowers, food, and personal items connected to the departed. Rather than mourning in silence, the occasion appears to have been both reflective and celebratory.\n\nThough generations aboard the Arkship have changed how we remember the dead, the records suggest that our ancestors once set aside time to grieve, but also to celebrate the lives that shaped those who remained."

 arkship.1210.desc.avian.reptilian: "The entry recovered from the microchip shows of a reproductive ceremony once practiced by our ancestors. It was a gathering during which the first clutch of eggs was presented to the community. The eggs were carefully placed within prepared nesting spaces while family members and witnesses observed. Decorative nesting materials were used as well as a symbolic arrangements of shells, and communal feasts celebrating the continuation of the lineage.\n\nNotably, the records indicate that these egg-laying ceremonies once lasted weeks, involving extended rituals and preparations. By comparison, such matters aboard the Arkship are handled quickly and privately, nowadays it occupies little more than a few hours of carefully managed procedure."

 arkship.1210.desc.fungoid.plantoid: "The record recovered from the microchip describes a communal tradition practiced by our ancestors during periods of abundant growth. The records refer to gatherings in dense groves where individuals would cultivate unusual and vibrant fruiting plants with colonies visiting one another to observe particularly impressive growths. Different strains were arranged together to create elaborate living patterns of color, texture, and scent. Our ancestors would deliberately alter humidity, nutrients, and light to encourage rare or unusual blooms during the gathering.\n\nLife aboard the Arkship leaves little room for such spontaneous cultivation. Growth cycles are now carefully regulated by agricultural systems, and most fungal strains are optimized for efficiency rather than expression."

 arkship.1210.desc.infernal: "The recovered records describe an ancient tradition practiced by our ancestors. The archive describes gatherings around controlled pits of living flame, where individuals would deliberately expose themselves to intense heat as a demonstration of resilience and vitality. Participants shaped the flames into elaborate patterns, feeding them with rare gases and fuels that caused the fire to burn in unusual colors. Observers would chant and celebrate as the flames rose higher, marking the event as both spectacle and communal ritual.\n\nAboard the Arkship, open flame is strictly regulated as they cause a high risk to infrastructure."

 arkship.1210.desc.mammalian: "The recovered entry describes a tradition centered on the early development of our offspring. According to the records, families would gather when a young individual took their first independent steps outside the den. The moment appears to have been treated as a small but meaningful milestone, often celebrated with encouragement, shared food to coax the young ones out, and the attention of relatives and friends.\n\nLife aboard the Arkship rarely allows for such gatherings around individual milestones."

 arkship.1210.desc.arthropoid: "The recovered entry from the microchip describes a tradition tied to a natural stage in the life cycle of our ancestors. They show communal gatherings during periods when individuals shed their old exoskeletons. Rather than occurring in isolation, these molting phases were often marked by ceremony and the old skin was sometimes decorated or preserved as symbols of growth and renewal. Once the old shells were shed, the newly formed exoskeletons were displayed with pride.\n\nAboard the Arkship, molting cycles are typically managed in controlled biological facilities to ensure safety and efficiency with staff to help if any possible complications occur."

 arkship.1210.desc.toxoid: "The recovered record describes a tradition practiced by our ancestors during periods of heavy atmospheric saturation. Individuals would gather in specially prepared areas to deliberately release built-up gases and chemical byproducts into the surrounding environment. Participants would compete to produce the most vibrant or unusual chemical plumes. The resulting clouds created shifting colors and reactive patterns in the air. Spectators observed with great enthusiasm, while the most pungent gases often provoked laughter among the gathered crowd.\n\nNowadays aboard the Arkship, atmospheric systems strictly regulate such emissions to maintain safe environmental conditions."

 arkship.1210.desc.lithoid: "The recovered entry describes an energetic tradition practiced by our ancestors. According to the records, large groups would gather in open rocky fields to engage in organized stone fights. Participants hurled loose rocks at one another while attempting to crack or chip pieces from their opponents' outer layers. Small fragments broken off during the clashes were sometimes collected as keepsakes, symbols of resilience and friendly rivalry.\n\nAboard the Arkship, such activities would pose an obvious risk to infrastructure. Hull integrity protocols strongly discourage the throwing of rocks, and these contests have long since disappeared from daily life."

 arkship.1210.desc.aquatic.mulluscoid: "The recovered microchip describes a tradition practiced by our aquatic ancestors in the depths of their world's oceans. Individuals would gather to descend together into deeper waters than normally inhabited. These dives were both a challenge and a celebration. The deeper zones contained strange geological formations and unfamiliar, sometimes even dangerous life forms, making the descent both thrilling and dangerous. Those who reached the greatest depths were often regarded with admiration.\n\nWater habitats on the Arkship are carefully regulated and depth is limited by engineering constraints. The vast pressures and endless darkness of the ancient oceans can no longer be experienced."

 arkship.1215.name: "Fungal Contamination"
 arkship.1215.desc: "Recent reports indicate that an invasive fungal species has spread throughout the hydroponics decks of §YArkship [Root.GetName]§!. The organism appears to thrive in the controlled humidity and nutrient-rich substrates of the arkship's agricultural systems, forming dense mycelial networks across multiple production tiers.\n\nContainment attempts have proven ineffective, as the fungus shows no measurable reaction to standard herbicidal treatments. We suspect the species may have adapted rapidly to the enclosed ecosystem of the vessel. If left unchecked, the outbreak could significantly reduce food yields and place additional strain on the arkship's limited agricultural capacity."
 arkship.1215.a: "Purge aggressively."
 arkship.1215.b: "Study the fungus."
 arkship.1215.c: "Try to communicate."

 arkship.1220.name: "Cleansing Flames"
 arkship.1220.desc: "Conventional treatments having failed, the contaminated hydroponics tiers were subjected to controlled incineration. Unfortunately, much of the arkship's edible plant stock was lost in the process. Entire growth beds were reduced to ash alongside the infestation, leaving several agricultural sections temporarily barren.\n\nStill, the operation appears to have achieved its objective. With every spore-bearing surface sterilized and the remaining infrastructure thoroughly purged, the fungal species has been eradicated from the ecosystem for good. This knowledge will help us prepare for any other invasive species that might decide to settle on the arkship in the future."
 arkship.1220.a: "Good riddance."

 arkship.1225.name: "Mycelial Intelligence"
 arkship.1225.desc: "The invasive species on §YArkship [Root.GetName]§! operates through a distributed mycelial network capable of rapidly isolating and sacrificing individual segments. Whenever we attempted to extract living samples, the surrounding growth would wither almost instantly, its nutrients seemingly redirected through the network to fuel new blooms elsewhere in the hydroponics decks.\n\nAfter numerous failed attempts, we finally managed to isolate a sufficiently stable sample for controlled observation. The fungus possesses an extraordinarily efficient nutrient redistribution system, one that may have applications in closed ecological environments such as those aboard the arkship, perhaps even copying our own distribution systems."
 arkship.1225.a: "A remarkable species."
 arkship.1225.b: "Repurpose it."

 arkship.1230.name: "Biochemical Conversion"
 arkship.1230.desc: "Further experimentation with the fungal growth has revealed an unusual chemical reaction. When exposed to specific compounds, the organism rapidly metabolizes the additives and releases a distinct mixture of gaseous byproducts. We realized that these fumes could be harvested and refined.\n\nThe fungus effectively converts simple chemical inputs into a steady stream of volatile compounds, an unexpected but potentially useful process. By cultivated controlled fungal growth in isolated chambers, we believe that the organism could be repurposed as a small-scale biochemical processing system."
 arkship.1230.a: "An unexpected find."

 arkship.1235.name: "Shared Roots"
 arkship.1235.desc: "Closer observation of the fungal growth has revealed patterns that suggest a form of biological signaling within its vast mycelial network. To most species this behavior might seem insignificant, but our own biology allows us to recognize and adapt to the subtle exchange.\n\nBy introducing carefully calibrated biochemical signals, we established a rudimentary dialogue with the organism. Since then it has begun redistributing nutrients through its networks and shielding crops from harmful microbes. Soon we realized that what we thought was an intrusion became soon a meaningful symbiosis with another lifeform sharing our gardens."
 arkship.1235.a: "An unexpected symbiosis."

