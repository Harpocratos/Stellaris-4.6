 # Gundersen Research Society (GRS)
 START_SCREEN_GRS: "The Hyacinth was not built to stay still.\n\nShe was the sixth and last of the Ulysses Initiative's arkships. The wormhole that was supposed to deliver us to a new colony world scattered our fleet, and a catastrophic power failure in the moments after transit left us adrift and alone.\n\nCaptain Gundersen made a decision. The Hyacinth would be our home, and it would be open. Other survivors of the scattering found their way to us: researchers, colonists, and wanderers who had nowhere else to go. We took them in. Whatever they brought through the airlock, the Gundersen line put to use.\n\nThe [Ruler.GetTitle] is always a Gundersen. Our long drift has brought us full circle, back to the stars where the wormhole first deposited us. We came back because this is where the questions start."
 EMPIRE_DESIGN_humans3: "Gundersen Research Society"
 EMPIRE_DESIGN_humans3_desc: "The sixth and final arkship of the UN-sponsored Ulysses Initiative, the Hyacinth suffered a catastrophic power failure in the moments after its passage through the wormhole that scattered humanity across the stars. Captain Ronald F. Gundersen saved them all through grit and ingenuity, and in doing so, founded a dynasty.\n\nA century later, the Gundersen Research Society still calls the Hyacinth home, rebuilt and expanded so much that some have started calling it the Theseus. Their welcome is genuine, their curiosity broad; what anyone brings through the airlock, the Gundersen line decides how to use. Now their long drift has brought them full circle, back to the corner of the galaxy where the wormhole first deposited them."
