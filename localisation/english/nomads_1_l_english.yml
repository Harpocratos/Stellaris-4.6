# Contract Events
 nomads.3036.name: "Delegates on Board"
 nomads.3036.intro: "The diplomatic delegation from §H[pickup_planet.GetName]§! has boarded the arkship and are being accommodated with all the respect due to ambassadors from the §H[pickup_planet.owner.GetName]§!."
 nomads.3036.desc: "$nomads.3036.intro$ We have planned a schedule of activities including arkship tours and presentations on our lifestyle to keep them entertained during the journey to §H[dropoff_planet.GetName]§!."
 nomads.3036.desc.nocomm: "$nomads.3036.intro$ They brought us diplomatic intelligence regarding the §H[dropoff_planet.owner.GetName]§! that we used to establish formal communications."
 nomads.3036.a: "Let us bring them safely to their destination."

 nomads.3045.name: "Delegates Have Arrived"
 nomads.3045.desc: "The delegates from the §H[diplomatic_support_issuer.GetName]§! have arrived at their destination. Their diplomatic visit can now officially begin, and we wish them success in their peaceful endeavors."

 nomads.3050.name: "Prisoners Embarked"
 nomads.3050.desc: "Transport ships carrying the criminals that we have accepted to transfer on behalf of the §H[pickup_planet.owner.GetName]§! have boarded the arkship. We are doing our best to safely process them, but such a vast amount of prisoners is bound to create trouble at one point or another.\n\nOur Contract gives us options on how to handle them, but we are not supposed to drop them off again on a world belonging to the §H[pickup_planet.owner.GetName]§!. At the same time, it is likely that other empires will not appreciate a sudden influx of criminals in one of their colonies. Of course, if we are discreet enough, they might never realize what we've been up to."
 nomads.3050.a: "We'll drop them off somewhere else."
 nomads.3050.b: "Keep them aboard."
 nomads.3050.c: "They could make fine slaves."
 nomads.3050.d: "Set them free."
 nomads.3052.name: "Prisoners Disembarked"
 nomads.3052.desc: "The last prisoners carried as part of our contract have been disembarked. We have tried our best to remain discreet, but detection is always a risk, and people are rarely pleased when faced with a sudden influx of xeno criminals."
 nomads.3053.name: "Disembarkment Report"
 nomads.3053.desc: "Word of our involvement in the transport of criminal pops has yet to spread. It seems we have not been detected." #All smooth, no complaints
 nomads.3053.desc.issuer.problem: "Our attempt at double crossing the [prisoner_disposal_issuer.GetName] has failed. While the criminals have been successfully disembarked, we have been detected and the [prisoner_disposal_issuer.GetName] has cancelled the contract and refuse to pay us." #Issuer unhappy cancels contract - ewps
 nomads.3053.desc.problem: "While we have been detected, the [prisoner_disposal_issuer.GetName] is still pleased that we rid them of their criminals, and have agreed to pay us in full." #We got detected by planet owner and they're unhappy, but we still complete the contract c:
 prisoner_tranfer_tt: "\nThe §YCriminal £pop£ Pops§! are transferred to §Y[From.GetName]§!"

 nomads.3060.name: "Tourists Boarding"
 nomads.3060.desc: "A group of tourists has boarded the Arkship in the §H[root.solar_system.GetName]§! system, chattering with anticipation as they take in the bustling interior of the vessel.\n\nWe have charted a scenic route through several remarkable systems for their enjoyment. Now we need only deliver the spectacle they were promised."
 nomads.3060.a: "Set course for §H[sightseeing_tour_destination_system.GetName]§!."
 nomads.3060.a.tt: "The target system can be tracked in the §HSituation Log§!."

 nomads.3065.name: "Tourists Sightseeing"
 nomads.3065.desc: "The tourists enjoyed the sights in the §H[root.solar_system.GetName]§! system, marveling at the wonders around them. They will return home changed, carrying with them first-hand knowledge of the vastness of the universe."
 nomads.3065.a: "Now, back to §H[sightseeing_tour_end_system.GetName]§!."

 nomads.6005.name: "A Chance Find"
 nomads.6005.desc: "While working on a contract on behalf of the §H[event_target:contract_issuer.GetName]§!, we chanced upon a collection of ancient containers. Encased in ice, we almost mistook them for plain asteroids. While technically ours by right of salvage, we should consider turning them over to the §H[event_target:contract_issuer.GetName]§! as they were retrieved while working on their behalf. Scanning the crates revealed..."
 nomads.6005.giveback: "We shouldn't keep those."
