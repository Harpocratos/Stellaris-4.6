 nomads.8050.a: "We have been overruled."
 nomads.8055.name: "A Gift Across the Veil"
 nomads.8055.desc: "more.\n\nyou pour your power into us like an offering. we feel it. we grow... do not stop."
 nomads.8055.a: "We have only made them stronger."
 nomads.8060.name: "A Disappointment"
 nomads.8060.desc: "You burned through so much just to leave me untouched...\n\nSuch a waste. I had hoped for more from you. Do not throw your strength away on what cannot be harmed."
 nomads.8060.a: "She expected better of us."
 nomads.8065.name: "A Lesson Returned"
 nomads.8065.desc: "Again. The same waste, the same result.\n\nI return what you spent, not to hurt you, but so you feel the weight of it. Learn from this. I will not watch you spend yourself a third time."
 nomads.8065.a: "The lesson is ours to carry."

