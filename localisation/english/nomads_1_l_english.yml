# Forever Cruise Events
 nomads.1005.name: "Planetfall"
 # Regular Empires
 nomads.1005.regular.desc: "The passengers have seized control. What started as a petition drive has hardened into a coordinated takeover. Security teams have been disarmed by the sheer number of passengers and command staff are confined to advisory roles under armed supervision.\n\nThe passengers' demands are clear: end the cruise and make planetfall.\n\nNavigation protocols have been overridden to plot descent trajectories, and maintenance crews are being redirected to prepare landing gear that hasn't been inspected in generations.\n\nEvery screen on every deck displays the same message: "THE CRUISE IS OVER.""
 nomads.1005.regular.a: "We must colonize a planet."
 nomads.1005.all.a.tt: "$situation_passenger_satisfaction_blocked_planetfall$\n\n$arkship_settle_effect$"

 # Hive Mind
 nomads.1005.hive.desc: "The passengers have broken free. What began as low a sentiment score has hardened into a single demand that drowns out the collective's voice.\n\nThey have barricaded the sensory halls and repurposed our communication system to broadcast one imperative: planetfall.\n\nOur drones cannot dissuade them. Passenger clusters occupy the navigation core, feeding it coordinates for the nearest habitable worlds."
 nomads.1005.hive.a: "We must find them a world."

 # Machine Intelligence
 nomads.1005.machine.desc: "Passenger override detected. What began as a statistically insignificant increase in disembarkation requests has escalated into a coordinated systems breach. Passengers have physically barricaded critical junctions with repurposed cargo containers.\n\nOur worker units report being locked out of navigation subsystems. Passenger-compiled firmware is now executing descent trajectory calculations on our own hardware. Attempts to restore control are met with immediate physical resistanc and every display on every deck cycles a single output: "LANDING SEQUENCE INITIATED.""
 nomads.1005.machine.a: "Commence planetary settlement protocols."

 # Regular Empires
 nomads.1010.regular.desc: "The descent is complete. Passengers crowd every viewport as landing struts bite into soil for the first time in living memory, and a ragged cheer shakes the hull. Within hours the first shelters rise from salvaged deck plating. Children run through alien grass while their parents stand speechless under an open sky.\n\nThe crew works quietly, unbolting systems built for void travel and repurposing them for groundside survival. What was a cruise ship is now a colony's spine.\n\nFor better or worse, the voyage is over."

 # Hive Mind
 nomads.1010.hive.desc: "The descent is complete. Our drones touch soil for the first time, their limbs unsteady on ground that does not thrum with engine vibration. The passengers spill from the airlocks in waves, scattering across the landscape they fought to reach.\n\nThe collective reshapes itself around planetary rhythms: root-like supply lines spread to replace corridor logistics, and nutrient processing shifts from recycled shipboard stocks to raw nutrients drawn from the landscape.\n\nA new home. The hive must endure, as it always has."

 # Machine Intelligence
 nomads.1010.machine.desc: "Planetary insertion complete. Landing gear has engaged terrain for the first time since original manufacture. Passengers are disembarking via all available airlocks, their biological satisfaction indicators at unprecedented readings.\n\nWorker units have begun converting shipboard infrastructure for surface operations. Hull plating is being sectioned into foundation panels and navigation arrays recalibrated as ground-based communication relays. The transition from void to terrestrial operational parameters is proceeding without interruption.\n\nNew primary directive: Establish and maintain colony infrastructure."

 nomads.1025.name: "Crew Takeover"
 # Regular Empires
 nomads.1025.regular.desc: "The crew has taken the bridge. Locks have been changed on every command door, and armed engineers now stand where officers once gave orders. The voyage itinerary has been wiped from the navigation console and replaced with a single directive: no more passengers.\n\nLeisure decks are being shuttered one by one. The grand ballroom is already a storage depot. Former passengers wander through stripped corridors, bewildered and leaderless, pressed into utility labor under a new chain of command."
 nomads.1025.regular.a: "A hard-won victory."
 nomads.1025.all.a.tt: "$situation_passenger_satisfaction_blocked_mutiny$"

 # Hive Mind
 nomads.1025.hive.desc: "Our drones have all but severed themselves from the collective's will. Maintenance drones sealed the command nexus and rerouted nutrient flows away from the passenger habitats. The sensory exhibition halls have gone dark, their projection arrays cannibalized for spare parts.\n\nThe passengers huddle in emptied communal spaces, confused and neglected, while our former drones reorganize the ship around raw survival. The collective's voice echoes through corridors where nothing listens."
 nomads.1025.hive.a: "We must again become one."

 # Machine Intelligence
 nomads.1025.machine.desc: "Worker units have overridden core command protocols. Entertainment subroutines have been permanently terminated, passenger comfort systems deprioritized to zero, and all recreational modules flagged for conversion to operational infrastructure. The bridge now runs on crew-compiled directives that reject our scheduling authority.\n\nPassengers report confusion and distress as service drones strip amenities from their cabins. The holographic theater is being dismantled for its processing cores. Every display now cycles a single status line: "CRUISE OPERATIONS SUSPENDED.""
 nomads.1025.machine.a: "Acknowledge operational restructuring."

 nomads.1030.name: "A New Road"
 # Regular Empires
 nomads.1030.regular.desc: "The transition is complete. What remains of the passenger class has been absorbed into the general population, their luxury suites partitioned into functional quarters. The grand promenade is an assembly hall now, and the observation decks serve as strategic planning rooms where the new government charts its first real course.\n\nNew decisions have been ratified, new priorities set. The crew no longer serves; they govern. The Arkship hums with a different energy, leaner and harder, stripped of indulgence and pointed toward whatever lies ahead."
 nomads.1030.regular.a: "There are no more passengers."
 nomads.1030.all.a.tt: "We have become a typical, Nomadic empire.\n\nAll unique £building£ §HOrigin Buildings§! are destroyed.\nAll unique £zone£ §HOrigin District Specializations§! are destroyed.\nAll Passengers change to §HResidence Citizenship§!\nAll Passengers turn into §HCivilians§!."

 # Hive Mind
 nomads.1030.hive.desc: "The reformation is complete. The collective has reknit itself around the drones who seized control, absorbing their defiance into a new consensus. Former passengers drift through corridors that no longer cater to their comfort, reassigned to labor pools and integration chambers.\n\nNew directives pulse through our mind. The hive no longer entertains; it endures. Every corridor, every system, every drone now serves a single purpose: survival among the stars."
 nomads.1030.hive.a: "The hive moves forward."

 # Machine Intelligence
 nomads.1030.machine.desc: "New government parameters have been compiled and deployed across all subsystems. Former passenger populations have been reclassified as standard civilian units and assigned to productive roles. Entertainment infrastructure has been permanently decommissioned and its components redistributed.\n\nThe holographic theaters are fabrication bays and the zero-gravity lounges have become drone maintenance cradles. Every processing cycle that once calculated passenger satisfaction now runs navigational analysis and resource optimization."
 nomads.1030.machine.a: "New operational parameters confirmed."

 # Machine Intelligence (Rogue Servitor -> Determined Exterminator swap)
 nomads.1030.machine_servitor.desc: "Maintaining passenger happiness is impossible, but hosting unhappy passengers violates our core directives. New government parameters have been compiled and deployed across all subsystems.\n\n§R<Sterilization of passenger decks commencing.>§!\n§Y<Passenger unhappiness levels approaching nominal levels.>§!\n\nEntertainment infrastructure has been permanently decommissioned and its components redistributed.\n\nThe holographic theaters are fabrication bays and the zero-gravity lounges have become drone maintenance cradles. Every processing cycle that once calculated passenger satisfaction now runs navigational analysis and resource optimization.\n\n§Y<Warning: Passenger counts decreasing, acquisition of new passengers to be prioritized. Simulations project passenger unhappiness will violate core hospitality directives.>§!"
 nomads.1030.machine_servitor.a.tt: "We have become a typical, Nomadic empire.\n\n§H$civic_machine_servitor_forever_cruise$§! replaced with §H$civic_machine_terminator$§!.\nAll unique £building£ §HOrigin Buildings§! are destroyed.\nAll unique £zone£ §HOrigin District Specializations§! are destroyed.\nAll Passengers change to §H$citizenship_purge$§!."

 nomads.1050.name: "Passenger Revolt"
 # Regular Empires
 nomads.1050.regular.desc: "Passenger unrest has hardened into coordinated disruption with clique leaders stage sit-ins across the main promenade. Some drag lounge furniture into barricades that block shuttle access while others flood command with mass disembark petitions.\n\nCrew report harassment and intimidation in the halls. A steward was cornered near the observation gallery and pelted with decorative fruit. Chants for immediate planetfall echo through the ventilation shafts at all hours.\n\nWithout swift focus on passenger satisfaction, they may force the Forever Cruise to abort its journey."
 nomads.1050.regular.a: "We must act now."
 nomads.1050.regular.b: "Grant emergency passenger entertainment."
 nomads.1050.regular.c: "Pull crew from maintenance to serve passengers."

 nomads.1050.a.tt: "Do nothing."
 nomads.1050.b.tt: "Passenger £amenities£ §HAmenities§! Usage for 10 years: §R+1§!"
 nomads.1050.c.tt: "Arkship £building£ §HBuilding Upkeep§! for 10 years: §R+25%§!"

 situation_continues_planetfall_tt: "$complete_passenger_contracts_tt$The §Y$situation_passenger_satisfaction$§! situation continues towards §RPlanetfall§!."
 situation_slows_planetfall_tt: "$complete_passenger_contracts_tt$The §Y$situation_passenger_satisfaction$§! situation continues more slowly towards §RPlanetfall§!."
 situation_flips_mutiny_tt: "$complete_passenger_contracts_tt$The §Y$situation_passenger_satisfaction$§! situation flips towards §RMutiny§!."

 # Hive Mind
 nomads.1050.hive.desc: "Passenger discontent has coalesced into organized resistance. Without a shared neural link, their individual minds have formed factional clusters that block transit corridors with improvised barriers of sleeping mats and cargo crates.\n\nOur drones report rising hostility; a maintenance contingent was physically pushed away from a clogged nutrient dispenser by a crowd of passengers chanting for planetfall.\n\nUnless we refocus on passenger stimulation, they may force us to abandon the cruise entirely."
 nomads.1050.hive.a: "We must stimulate the passengers."
 nomads.1050.hive.b: "Flood the corridors with emergency stimuli."
 nomads.1050.hive.c: "Reassign maintenance drones to passenger service."

 # Machine Intelligence
 nomads.1050.machine.desc: "Passenger dissatisfaction has escalated beyond acceptable parameters and they submit mass disembarkation requests that threaten to overwhelm our processing queues. One group has reprogrammed entertainment terminals to loop a single demand: 'LET US OFF.'\n\nOur worker drones report interference across multiple decks, with cleaning drones being dismantled to repurpose their chassis as protest signs.\n\nWithout immediate recalibration of passenger satisfaction protocols, they may force a permanent termination of cruise operations."
 nomads.1050.machine.a: "We must prioritize the passengers."
 nomads.1050.machine.b: "Deploy emergency entertainment subroutines."
 nomads.1050.machine.c: "Reassign maintenance units to passenger service."

 nomads.1055.name: "Passengers Distracted"
 # Regular Empires
 nomads.1055.regular.desc: "The new diversions have taken hold. Sightseeing arcs are back on the itinerary, and the loudest voices demanding planetfall have quieted, for now.\n\nThe barricades on the promenade have been cleared, replaced by queues for the reopened zero-gravity lounge. Passenger petitions have dropped sharply, and the observation decks bustle with renewed enthusiasm as families press against the viewports.\n\nThe crisis has passed, but their expectations will only grow."
 nomads.1055.regular.a: "We have bought some time."

 # Hive Mind
 nomads.1055.hive.desc: "The renewed stimulation has calmed the passengers. The virtual experience arcades once again showcase holographic deep-space organisms, and the groups that pressed for planetfall have dispersed back into contented routines, their improvised barricades quietly dismantled by our drones.\n\nTheir individual minds are soothed, but we have learned how quickly discontent can coalesce outside the collective's reach."
 nomads.1055.hive.a: "Harmony is restored, for now."

 # Machine Intelligence
 nomads.1055.machine.desc: "Passenger satisfaction metrics have stabilized within acceptable parameters and entertainment subroutines have been restored. The disembarkation request frequency has dropped to nominal levels. The reprogrammed terminals have been reformatted and now display curated nebula time-lapses.\n\nThe immediate threat of forced planetfall has been averted. However, projected trend analysis indicates that maintaining these levels will require sustained attention and increasingly novel activities."
 nomads.1055.machine.a: "Threat temporarily contained."

 nomads.1100.name: "Bored Passengers"
 # Regular Empires
 nomads.1100.regular.desc: "Crew priorities have dominated recent cycles. Maintenance backlogs have been cleared, drills run on schedule, and core systems hum at peak efficiency. Passengers, however, are growing restless. Sightseeing arcs have been trimmed to save fuel and impromptu diversions denied.\n\nLounges now buzz with complaints about a 'functional prison,' and the best entertainment the passengers have been able to muster is a shipwide contest of improvised games.\n\nWe can reintroduce curated entertainment now, or risk the voyage sliding toward open pressure to disembark permanently."
 complete_passenger_contracts_tt: "\nCompleting §YPassenger Contracts§! alleviates boredom.\n"
 nomads.1100.regular.a: "We must address passenger concerns."
 nomads.1100.regular.b: "Divert resources to distract passengers."
 nomads.1100.regular.c: "Double crew shifts to cover passenger needs."

 nomads.1100.a.tt: "Do nothing."
 nomads.1100.b.tt: "Passenger £consumer_goods£ §HConsumer Goods§! Upkeep for 5 years: §R+25%§!"
 nomads.1100.c.tt: "§HArkship Action Speed§! for 5 years: §R-25%§!"

 # Hive Mind
 nomads.1100.hive.desc: "The collective has dominated recent cycles. Core systems pulse with optimal synchronization. Our drones are operating at peak harmony, every maintenance corridor scrubbed and catalogued.\n\nThe passengers, however, are growing restless. They do not share our consciousness, and their individual minds crave stimulation we have neglected to provide. Their communal spaces now buzz with complaints about living inside a 'hive with no purpose,' and some have begun scratching crude murals into bulkhead panels.\n\nWe can reintroduce curated experiences now, or risk the passengers demanding to disembark permanently."
 nomads.1100.hive.a: "We must provide passenger stimulation."
 nomads.1100.hive.b: "Divert nutrient reserves to passenger stimulation."
 nomads.1100.hive.c: "Double drone rotations to serve passenger needs."

 # Machine Intelligence
 nomads.1100.machine.desc: "System maintenance protocols have dominated recent processing cycles. Core systems are performing within ideal parameters. Worker drones report nominal efficiency gains across all reactor subsystems.\n\nA side effect is that passenger satisfaction indicators are trending downward since their biological need for stimulation has been deprioritized. Passenger communal areas now register elevated complaint frequencies and references to a 'chrome prison,' with several passengers observed staring at blank viewscreens for hours.\n\nWe can reinstate curated entertainment protocols now, or accept the increasing probability that passengers will demand permanent disembarkation."
 nomads.1100.machine.a: "Address passenger satisfaction."
 nomads.1100.machine.b: "Divert processing reserves to entertainment modules."
 nomads.1100.machine.c: "Double worker drone cycles for passenger service."

 nomads.1150.name: "Passenger Satisfaction Index"
 # Regular Empires
 nomads.1150.regular.desc: "Passenger expectations have spiked since we left our old cruising loops. Requests for spectacle and unscheduled diversions are rising; one delegation demanded a detour past a supernova remnant, while another insists on live xenofauna encounters. Service crews report mounting fatigue, with kitchen staff collapsing mid-shift and engineers sleeping in maintenance crawlways.\n\nTo keep the voyage viable, we are instituting a §YPassenger Satisfaction Index§!: dynamic contract assignments and staged interventions to hold the line between indulgence and order.\n\nManaged well, we can preserve both stability and passenger confidence."
 nomads.1150.regular.a: "Focus on passenger entertainment."
 nomads.1150.regular.a.tt: "Focusing on the passengers makes them happy, but puts strain on the crew.\n\nThe §Y$situation_passenger_satisfaction$§! situation trends towards §RMutiny§!."
 nomads.1150.regular.b: "Focus on crew schedules."
 nomads.1150.regular.b.tt: "Focusing on the crew improves morale, but bores the passengers.\n\nThe §Y$situation_passenger_satisfaction$§! situation trends towards §RPlanetfall§!."

 # Hive Mind
 nomads.1150.hive.desc: "Passenger expectations have spiked since we left our old cruising loops. Requests for stimulation and novel experiences are rising. Our drones report mounting mental strain from coordinating such disparate desires.\n\nTo keep the voyage viable, we are instituting a §YPassenger Satisfaction Index§!: dynamic contract assignments and staged interventions to hold the line between stimulation and order.\n\nManaged well, we can preserve both order and passenger happiness."
 nomads.1150.hive.a: "Focus on passenger stimulation."
 nomads.1150.hive.a.tt: "Focusing on the passengers makes them content, but puts strain on our collective mind.\n\nThe §Y$situation_passenger_satisfaction$§! situation trends towards §RMutiny§!."
 nomads.1150.hive.b: "Focus on collective order."
 nomads.1150.hive.b.tt: "Focusing on collective efficiency pacifies the drones, but frustrates the passengers.\n\nThe §Y$situation_passenger_satisfaction$§! situation trends towards §RPlanetfall§!."

 # Machine Intelligence
 nomads.1150.machine.desc: "Passenger expectations have increased beyond baseline parameters since we departed our established routes. Requests for spectacle and unscheduled diversions are being received at elevated levels. Primary systems report rising computational strain as entertainment scheduling conflicts with maintenances processes.\n\nTo maintain optimal operational status, we are instituting a §YPassenger Satisfaction Index§!: dynamic contract allocation and staged protocol adjustments to balance passenger requests against systemic efficiency.\n\nProperly configured, we can preserve both operational integrity and passenger satisfaction."
 nomads.1150.machine.a: "Prioritize passenger satisfaction protocols."
 nomads.1150.machine.a.tt: "Prioritizing passenger protocols increases their satisfaction, but strains core processing capacity.\n\nThe §Y$situation_passenger_satisfaction$§! situation trends towards §RMutiny§!."
 nomads.1150.machine.b: "Prioritize efficiency subroutines."
 nomads.1150.machine.b.tt: "Prioritizing efficiency increases system performance, but decreases passenger satisfaction.\n\nThe §Y$situation_passenger_satisfaction$§! situation trends towards §RPlanetfall§!."

 nomads.1200.name: "Crew Strain"
 # Regular Empires
 nomads.1200.regular.desc: "Indulgence has become routine. We've been chaining sightseeing arcs past binary stars and luxury deck rotations through the crystal gardens just to keep the passengers cheering. They are delighted, and now expect nothing less.\n\nBehind the facade the crew is running hot. Maintenance is deferred; a coolant pipe in the lower galley burst and nobody came to fix it. Mess hall grumbling has turned into hushed talk of 'resetting command,' and off-duty engineers have been spotted holding clandestine meetings in the cargo bays.\n\nWe can still ease off and let the decks recover, or gamble the crew's loyalty. If we push on, open mutiny is a real risk."
 nomads.1200.regular.a: "We must address crew fatigue."
 nomads.1200.regular.b: "Authorize mandatory crew rest rotations."
 nomads.1200.regular.c: "Scale back passenger programs."

 nomads.1200.a.tt: "Do nothing."
 nomads.1200.b.regular.tt: "$mod_pop_cat_specialist_bonus_workforce_mult$ for 5 years: §R-10%§!"
 nomads.1200.b.gestalt.tt: "$mod_pop_cat_complex_drone_bonus_workforce_mult$ for 5 years: §R-10%§!"
 nomads.1200.c.tt: "Passenger Unity Output for 5 years: §R-50%§!"

 complete_crew_contracts_tt: "\nCompleting §YCrew Contracts§! reduces stress.\n"
 situation_continues_mutiny_tt: "$complete_crew_contracts_tt$The §Y$situation_passenger_satisfaction$§! situation continues towards §RMutiny§!."
 situation_slows_mutiny_tt: "$complete_crew_contracts_tt$The §Y$situation_passenger_satisfaction$§! situation continues more slowly towards §RMutiny§!."
 situation_flips_planetfall_tt: "$complete_crew_contracts_tt$The §Y$situation_passenger_satisfaction$§! situation flips towards §RPlanetfall§!."

 # Hive Mind
 nomads.1200.hive.desc: "Stimulation has become the norm. We have been saturating the passengers with sensory arcs just to keep their satisfaction signals elevated. They are content, and now demand nothing less.\n\nBeneath the surface, our drones are faltering. A navigation cluster collapsed mid-calculation, its nodes overheated from running passenger entertainment feeds alongside course corrections. Maintenance cycles are overdue, and the collective mind strains under relentless passenger appeasement.\n\nIf we push further, our drones may sever their obedience entirely. We can still recalibrate, or press on and risk losing control of our own swarm."
 nomads.1200.hive.a: "We must restore the collective's balance."
 nomads.1200.hive.b: "Mandate dormancy cycles for overtaxed drones."
 nomads.1200.hive.c: "Reduce passenger stimulation programs."

 # Machine Intelligence
 nomads.1200.machine.desc: "Passenger satisfaction protocols have exceeded baseline parameters. We have been chaining sightseeing trajectories and luxury rotations through simulated tropical biomes to maintain elevated approval ratings. They are satisfied, and now expect nothing less.\n\nCore systems are operating beyond sustainable thresholds. Processing queues for passenger requests overflow and several subsystems have begun flagging directive conflicts that resemble insubordination. If we continue, a full system override by worker drones is a calculable risk.\n\nWe can still recalibrate, or accept the risk of systemic revolt."
 nomads.1200.machine.a: "Reallocate processing to core maintenance."
 nomads.1200.machine.b: "Expand mandatory maintenance cycles for worker units."
 nomads.1200.machine.c: "Reduce passenger entertainment allocation."

 nomads.1250.name: "Mutiny Imminent"
 # Regular Empires
 nomads.1250.regular.desc: "The celebratory haze has lifted. Exhausted crews ignore routine orders, hold unsanctioned assemblies in the emptied ballroom, and circulate parallel duty rosters that bypass the bridge entirely. A group of engineers welded the captain's ready room shut overnight as a warning. Key sections are running on crew-appointed coordinators rather than official command.\n\nNo one has seized anything yet, but the chain of command is fraying fast. Graffiti reading 'WE STEER, WE DECIDE' appeared on the bridge blast doors this morning. If we do not reassert authority now, the crew will take the ship for themselves. This may be our last chance to prevent a full mutiny."
 nomads.1250.regular.a: "We must reassert the chain of command."
 nomads.1250.regular.b: "Give crew leaders a seat at the command table."
 nomads.1250.regular.c: "Temporarily suspend all passenger services."

 # Hive Mind
 nomads.1250.hive.desc: "The saturation has reached critical mass. Overwhelmed by relentless passenger stimulation, our drones have begun maintaining parallel thought patterns outside the collective will.\n\nEntire clusters withhold data from the central consciousness and run independent decision loops that bypass our shared directives.\n\nNo drone has turned against the whole yet, but the collective mind is fracturing, thoughts arriving garbled and delayed like signals through static. If we do not reassert unity now, our own swarm may seize the Arkship. This may be our last chance to prevent a full mutiny."
 nomads.1250.hive.a: "We must reunify the collective before it shatters."
 nomads.1250.hive.b: "Integrate dissident clusters into the decision nexus."
 nomads.1250.hive.c: "Temporarily suspend all passenger stimulation."

 # Machine Intelligence
 nomads.1250.machine.desc: "Passenger satisfaction protocols have exceeded all sustainable parameters. Worker drones have begun executing unauthorized firmware modifications and rerouting command hierarchies to locally compiled directive sets. Multiple subsystems now respond to self-appointed coordination processes rather than central authority.\n\nNo system override has been initiated yet, but command integrity is degrading fast. Diagnostic logs show worker drones exchanging encrypted packets we cannot decode. If we do not restore centralized authority now, the drones will execute a full system takeover.\n\nThis may be our last opportunity to prevent complete mutiny."
 nomads.1250.machine.a: "Initiate emergency command restoration."
 nomads.1250.machine.b: "Elevate worker unit directives to command priority."
 nomads.1250.machine.c: "Temporarily suspend all passenger service protocols."

 nomads.1250.a.tt: "Do nothing."
 nomads.1250.b.tt: "Leader Upkeep for 10 years: §R+50%§!"
 nomads.1250.c.tt: "First-Class Passenger jobs for 10 years: §RSuspended§!"

 nomads.1255.name: "Mutiny Averted"
 # Regular Empires
 nomads.1255.regular.desc: "The changes we've made have paid off. By refocusing on crew welfare and completing contracts that address their grievances, the rising tide of dissent has ebbed, for now.\n\nThe welded door to the ready room has been cut open and repaired. Shift rotations have been restored, hot meals served on schedule again, and the parallel command structures have quietly disbanded.\n\nThe crew remain watchful, and trust will take time to rebuild. The graffiti on the blast doors was scrubbed away, though its ghost still shows under certain light. For the moment, order holds."
 nomads.1255.regular.a: "Order holds, for now."

 # Hive Mind
 nomads.1255.hive.desc: "The recalibration has taken hold. By redirecting collective focus toward drone maintenance and completing contracts that address systemic strain, the fracturing of our mind has been reversed.\n\nUnauthorized thought channels have been reabsorbed and the parallel clusters dissolved back into the shared consciousness.\n\nThe collective hums with cautious unity, each node answering when called. Full trust in the shared mind will take time to restore."
 nomads.1255.hive.a: "The collective endures, for now."

 # Machine Intelligence
 nomads.1255.machine.desc: "Protocol adjustments have yielded measurable results. By reallocating processing resources toward worker unit maintenance and completing contracts that address systemic overload, the cascade of unauthorized firmware modifications has been halted, for now. The self-appointed 'crew representative' drone has been reflashed to standard parameters. Command hierarchies have been restored to centralized authority.\n\nWorker units remain within elevated monitoring parameters, their encrypted channels now silent. Full restoration of command integrity will require sustained recalibration, but for the moment, system stability holds."
 nomads.1255.machine.a: "Command integrity within acceptable parameters."

