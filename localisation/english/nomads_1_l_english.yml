 nomads.4705.name: "Settlement Complete"

 nomads.4705.desc.regular: "Thus ends the voyage of the Arkship §Y[event_target:settling_arkship.GetName]§!. After years of labor, disassembling its infrastructure and carrying it down the gravity well, we are finally ready to scuttle the ship. We [event_target:player_country.GetSpeciesNamePlural] are living through a moment future generations will remember. Now, let us settle §Y[event_target:settled_planet.GetName]§!!"
 nomads.4705.desc.machine: "The transfer of all drones and infrastructure from the §Y[event_target:settling_arkship.GetName]§! to a [event_target:settled_planet.GetPlanetMoon] is a departure point from the predicted future of the §Y[event_target:player_country.GetName]§!. New priority queues will now be developed to adapt to settled life."
 nomads.4705.desc.hive: "After years of preparing the infrastructure of the §Y[event_target:settling_arkship.GetName]§! and our own biology, evolving stronger bones and optimized lungs, we are now ready to settle. This will be a new stage in the §Y[event_target:player_country.GetName]§! lifecycle, perhaps settled life will suit us."

 nomads.4700.a: "This [event_target:settled_planet.GetPlanetMoon] shall be the foundation of our new empire."
 nomads.4700.settle.tt: "The §Y[event_target:player_country.GetName]§! stops being a £nomad£ ['concept_nomadic_empire'] and colonizes §Y[event_target:settled_planet.GetName]§! as a £planet£ ['concept_settled_empire'].\n\n"
 nomads.4700.b: "$nomads.4700.a$"
 settlement_scuttle_arkships_effect_tt: "\nAll remaining §Y$arkship_cap_plural$§! are §Rscuttled§! and their populations transferred to §Y[event_target:settled_planet.GetName]§!."
 nomads.4700.c: "We shall continue to roam the stars."
 nomads.4700.settle_subject.tt: "The §Y[event_target:settling_arkship.GetName]§! settles on §Y[event_target:settled_planet.GetName]§! as a new ['concept_subject'] of the §Y[event_target:player_country.GetName]§!.\n\n"
 nomads.4700.d: "We shall rule the stars from this [event_target:settled_planet.GetPlanetMoon]."

