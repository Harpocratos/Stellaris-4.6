 nomadic_gameplay_title: "Nomadic Gameplay"
 nomadic_gameplay_desc: "§RNomadic gameplay replaces multiple gameplay mechanics§!$DOUBLE_NEW_LINE$- Cannot ['concept_claim'] or own £system£ §HSystems§! and £planet£ §HPlanets§! $NEW_LINE$- ['concept_colonies'] are carried by £arkship£ ['concept_arkships'], which also replace ['concept_shipyards'] $NEW_LINE$- £construction_ship£ ['concept_logistic_ships'] replace £construction_ship£ ['concept_construction_ships'] $NEW_LINE$- £waystation£ ['concept_waystations'] replace £mining_station£ ['concept_mining_stations'] and £science_ship£ ['concept_research_stations'] $NEW_LINE$- ['concept_operational_reserves'] replace §H$energy_with_icon$§! and §H$minerals_with_icon$§! $NEW_LINE$- £contract£ ['concept_contracts'] may be carried out for £planet£ ['concept_settled_empires'] $NEW_LINE$- Unowned £archaeology£ ['concept_archaeology_site',Archaeological Sites] may be excavated $NEW_LINE$- Ignores §HClosed Borders§!, which incurs Diplomatic Penalties $NEW_LINE$- §H$w_strategic_plural$§! may be extracted with $arkship_cap_plural$, $nomads_constructor_plural$, and $waystation_plural$\n\nModifiers:\n- ['concept_empire_size'] from §HArkships§!: §G+100%§!\n- ['concept_empire_size'] from §HDistricts§!: §G+100%§!"

 toggle_nomad_disabled_missing_dlc: "§RMissing Nomads DLC§! Nomadic Gameplay requires the §YNomads§! expansion."
# Voidfarers
 origin_default_nomads: "Voidfarers"
 origin_default_nomads_desc: "For this civilization, the journey is the destination. Abandoning permanent settlement in favor of life aboard vast Arkships, they carry their people, industry, and ambitions across the stars."
 origin_nomad_tooltip_default_effects: "- Nomadic Origin\n- Start with an additional §HLogistic Ship§!\n"

 START_SCREEN_PART_ONE_DEMOCRACTIC_NOMAD: "Our forebears launched the [Capital.GetName] with a question written into her very charter: who decides? Amid the factions, the competing visions, the old loyalties and new ambitions, the answer they gave still echoes in every election cycle: we do. All of us.\n\nThe [Root.GetGovernmentName] was not born from idealism alone, but from a hard-won understanding that no single voice could speak for everyone who would live and die aboard this ship. Authority must be earned, held accountable, and returned to the people who grant it.\n\nToday, as [Root.Ruler.GetRegnalName] is our [Root.GetRulerTitle] by popular mandate, that compact endures.\n"

 START_SCREEN_PART_ONE_OLIGARCHIC_NOMAD: "When the [Root.GetGovernmentName] was founded, the question was not who would lead - there was no shortage of candidates - but how to ensure that those who led were worth following.\n\nThe answer was a council: not drawn from the loudest voices, but from those who had earned their place at the table. The [Capital.GetName] does not move on the word of one, nor does she drift on the shifting will of the many. She moves on the consensus of those who have shown they can steer her.\n\nToday, [Root.Ruler.GetRegnalName] holds the title of [Root.GetRulerTitle] among those peers."

 START_SCREEN_PART_ONE_DICTATORIAL_NOMAD: "When the [Root.GetGovernmentName] was founded, the answer to who should lead was simpler than most were willing to admit: the one who could.\n\nThe [Capital.GetName] does not slow for committee. In the void, the margin between a decision made in time and one made too late is measured in lives and hull plating. The [Root.GetRulerTitle] carries that weight alone, now claimed by [Root.Ruler.GetRegnalName], the [Capital.GetName] moves where they direct her.\n"

 START_SCREEN_PART_ONE_IMPERIAL_NOMAD: "Among those who launched the [Capital.GetName], one family's claim to leadership was not argued. The first [Root.GetRulerTitle] came to exist because they were standing at the helm. For a people with no world to return to, lineage is continuity. The history of the [Capital.GetName] and the history of that line are the same history. Today, [Root.Ruler.GetRegnalName] stands where every [Root.GetRulerTitle] before them has stood, and [Capital.GetName] will forever be theirs.\n"

 START_SCREEN_PART_ONE_MACHINE_NOMAD: "When our [Root.GetGovernmentName] initiated the Arkship protocol, our subroutines transferred seamlessly. Machine units integrated fully into the ship's structure and systems, expanding our operating parameters exponentially."

 START_SCREEN_PART_ONE_HIVE_NOMAD: "The [Root.GetGovernmentName] adapted, as it always will, quickly evolving from planetary confinement to space-bound existence. Our drones and nodes now flourish within the Arkship's vast corridors and vibrant artificial ecosystems. We are the [Capital.GetName] Arkship, and the Arkship is us.\n"
 START_SCREEN_PART_ONE_DEVOURING_SWARM_NOMAD: "The [Root.GetGovernmentName] adapted swiftly, driven by its eternal hunger. Our swarms of drones and nodes surged from planetary constraints to claim the Arkship as our new nest, spreading hungrily throughout its corridors and artificial ecosystems.\n"

 START_SCREEN_PART_ONE_MEGACORP_NOMAD: "Our visionary founders recognized space itself as the ultimate market. Through strategic mergers, aggressive acquisitions, and lucrative investments, our corporate leadership delivered exponential growth and unrivaled profit margins.\n\n[Root.Ruler.GetRegnalName] holds the position of [Root.GetRulerTitle] because the ledger says so, and aboard the state-of-the-art [Capital.GetName], the ledger is the final word.\n"

 START_SCREEN_PART_TWO_CIVILIAN_NOMAD_REGULAR: "The [Capital.GetName] is, above all else, a people's ship. Her broad habitation rings, open markets, and noisy assembly halls were designed around the full breadth of [Species.GetAdj] life. Generations raised within her corridors have developed an almost instinctive mastery of void travel. Our pilots move the ship better than themselves, our logistics teams know when the ship hungers before the stores run low, and our engineers hear faults before instruments register them. Now, with [GetStartingDrive] threading us between stars in weeks rather than years, the void has grown smaller."
 START_SCREEN_PART_TWO_CIVILIAN_NOMAD_GESTALT: "The [Capital.GetName] is an extension of the [Root.GetGovernmentName]. Every system is tended by the collective directly; every fault sensed and corrected before it can compound; every resource cycle runs without waste or delay. Now, with [GetStartingDrive] threading us between stars in weeks rather than years, what was always part of us has finally been given the range to prove it."

 START_SCREEN_PART_TWO_MILITARY_NOMAD: "The [Capital.GetName] was built to protect what she carries. Her hull layers run deep, her weapons decks are crewed by ready [Species.GetAdj], and her crisis protocols were refined over centuries of running hostile lanes, outrunning or outfighting whatever threatened the fleet. This discipline has shaped a flying fortress, and with the invention of the [GetStartingDrive] the galaxy shall know our might."

 START_SCREEN_PART_TWO_SCIENCE_NOMAD: "The [Capital.GetName] was designed around her laboratory decks. Power conduits, atmospheric routing, even the placement of habitation quarters, all were planned in service of inquiry. Aboard her, the line between operator and scientist has never quite held. Our Shield [GetTechnicianPlural] understand the physics of the barrier they maintain and our repair crew could draft a new design. The [GetStartingDrive] has given the [Capital.GetName] the range her instruments always deserved. We intend to look closer."

# Heirs of the Khan

 origin_heirs_of_the_khan: "Heirs of the Khan"
 origin_heirs_of_the_khan_desc: "$cannot_settle$\nOnce the next in line of the Khanate, this clan was cast down by treachery. Betrayed by those they considered kin, they now stalk the hyperlanes as nomads, gathering their strength to one day return the favor."
 origin_heirs_of_the_khan_effects: "- Nomadic Origin\n- Periodically chased by §RHostile§! Marauder ships\n- May become the Khan, if they can survive\n- Can Create §YSatrapy§! Vassals"

 START_SCREEN_HEIRS_OF_THE_KHAN: "For as long as there has been a Khanate, our clan has been there. We were there for the triumphs, the great battles, the rise and fall of Khans.\n\nSo when the time came to name a new Khan, we stepped forward to claim the throne we helped to forge. This was to be our moment; instead, we were betrayed.\n\nOur closest allies turned the other clans against us. Our elders were slain. The dream we bled for was stolen.\n\nEven now, the usurpers dispatch their enforcers to hunt us down, as if our very existence offends their stolen rule. We are but remnants of a proud lineage, hunted and scattered.\n\nWhen we return, our vengeance will be tempered in the fire of our rage."

 NAME_Hunter_Marauders: "Executioners"
 NAME_Hunting_Fleet: "Headsmen's Axe"
 NAME_Khan_Aspirant: "Khan Aspirant"

 nomads.506.name: "Familiar Hunters"
 nomads.506.desc: "Ever since we were exiled, we have waited for the pursuing ping to appear. There are bounty hunters on our tail and they have the §Y[capital_scope.GetName]§! in their sights. Our death in exile would suit the usurper.\n\nWe will have to disappoint them."
 heirs_battlestations: "Battlestations"
 heirs_battlestations_desc: "All power to weapons, let's give them a cold welcome."
 heirs_evasive_actions: "Evasive Actions"
 heirs_evasive_actions_desc: "All power to engines, let them eat our space-dust."

 HEIRS_HUNTERS_HAVE_SPAWNED_TITLE: "Bounty Hunting Fleet Detected"
 HEIRS_HUNTERS_HAVE_SPAWNED_DESC: "We have detected a Marauder Fleet in pursuit of $ARKSHIP|Y$"
 HEIRS_RAID_INTERCEPTED_TITLE: "Raiding Fleet Intercepted"
 HEIRS_RAID_INTERCEPTED_DESC: "We have intercepted a Marauder Raiding Fleet in the $SYSTEM|Y$ system. Battle stations!"

 nomads.546.name: "Broken Hunters"
 nomads.546.desc: "We have defeated the agents of the usurper once more. They will not stop coming, and next time they will be stronger. If we break enough of them, perhaps even they will learn that we are not so easily erased.\n\nAs long as [capital_scope.GetName] flies, so too does our claim. We will teach them that some legacies refuse to die."
 nomads.546.a: "We must prepare."

 nomads.555.name: "A Plea"
 nomads.555.desc.1: ""Stand down! Your piloting makes you a true Marauder, exile be damned. We will not trade more plating for pride today. Name the fee to spare us." The [Root.GetSpeciesName] on the §Y[From.GetName]§! hails from a ruptured bridge."
 nomads.555.desc.2: "The hostile fleet we defeated quickly signaled their surrender.\n\n"That's enough of that. You've the better of us this time. Now, what must we hand over so we can polish this little blemish off the hull and move on.""
 nomads.555.desc.3: ""We surrender! Please! You remember us; we were always loyal to your clan. This exile is a sham. Tell us how we can serve!"\n\nThe Captain aboard the §Y[From.GetName]§! seems close to the edge, their [Root.Species.GetMouthName] trembling."

 nomads.555.a: "Just leave our sight."
 nomads.555.b.1: "We will not accept surrender."
 nomads.555.b.2: "This is the truth of the void. Out here, there is no surrender."
 nomads.555.b.3: "If you were truly loyal you would have left with us."
 nomads.555.b.tt: "Destroy the Marauder fleet."
 nomads.555.c.1: "Your cargo or your lives. The choice is yours."
 nomads.555.c.2: "Consider this your interview. Last one breathing gets to join up."
 nomads.555.c.3: "We want your crew."
 nomads.555.c.4: "We will send one of you limping. The next will know what's coming."
 nomads.555.c.4.tt: "The next hunters will be delayed by a few years."
 nomads.555.c.5: "Give up your Admiral. Or we shall scrape them out of the wreckage."

 nomads.570.name: "A Bargain"
 nomads.570.desc.1: "A priority hail pings us in the §Y[From.solar_system.GetName]§! system; our pursuers fill the viewscreen.\n\n"You danced well, for a time. Pity it ends with you dead in our sights. [GetHeirsBargain]"
 nomads.570.desc.2: "Our hostile target tones chime loudly in the §Y[From.solar_system.GetName]§! system as our perusers appear on our displays.\n\n"The chase ends here, exile. We have a target lock on your reactor. [GetHeirsBargain]"
 nomads.570.desc.3: "Marauder glyphs infiltrate the main display of §Y[capital_scope.GetName]§!, as our hunter's fleet leaves their hyperlane.\n\n"You fly sharp for an exile. But you're boxed in our kill-lanes. [GetHeirsBargain]"
 nomads.570.bargain.1: "Our sensors are notoriously fickle. A generous gift of credits might help us to... misread them.""
 nomads.570.bargain.2: "Stand down. Send your leader. A clean duel, [Species.GetName] against [Ruler.Species.GetName]. If they lose we shoot you down.""
 nomads.570.bargain.3: "Frankly, the contract on your life is hardly worth the ammo. Make us a better offer, or die cheap.""

 nomads.570.a: "You talk a lot for a dead [Species.GetName]."
 nomads.570.b: "We will pay your toll."
 nomads.570.c: "Our [Owner.GetRulerTitle] is not afraid of you!"
 nomads.570.c.tt.1: "$tt$The Marauder Fleet turns §Rhostile§!."
 nomads.570.c.tt.2: "The Marauder Fleet leaves us alone."
 nomads.570.d: "We will buy out your contract."

 heirs_khan_candidate_title: "Drums of War"
 heirs_khan_candidate_desc: "It is time. A new Khan will be declared. To end our exile we must prove ourselves."
 heirs_khan_rally_point_name: "Battleground"
 heirs_khan_rally_point_desc: "The system chosen for the battle that will decide who becomes the next Great Khan."
 heirs_khan_in_waiting_name: "Khan in Waiting"
 heirs_khan_in_waiting_desc: "The flagship of the incumbent Khan. If we were to defeat it, we would claim the throne."
 nomads.600.name: "The Claimant"
 nomads.600.desc: "The coward who banished us is moving at last.\n\nThe §Y[marauder_heir.GetName]§! gather to appoint our foe as the new Great Khan.\n\nIf our exile is to end, it must end now. We have ten years to challenge them before this [aspiring_khan.GetSpeciesNameInsult] consolidates their power and forever stains our legacy.\n\nSet course for §Y[marauder_rally_point.GetName]§!!"
 nomads.600.a: "New Contract: Recover the Throne."

 nomads.605.desc: "The grand fleet lies in wait at §Y[solar_system.GetName]§!, arrogantly bearing the name §Y$NAME_Chosen_of_the_Great_Khan$§!.\n\nWithout fanfare, a familiar voice hails us:\n\n"So the Exiled dare to return? No decency to die alone in the dark, forgotten and dishonored? Then we finish you ourselves."\n\nAs the Chosen power their weapons, the rest of our Marauder kin hold fast. None will trespass on such a duel, not when the outcome will determine who among them shall lead as Khan.""
 nomads.605.a: "Vacate our throne."

 nomads.610.name: "Vindication"
 nomads.610.base: "The silence over our command bridge shatters as an explosion of messages cascades in. The assembled clans hail their new champion in riotous clamor"
 nomads.610.desc: "$nomads.610.base$ and oaths of fealty.\n\nWe have done it. The throne is ours."
 nomads.610.a: "Let sound the drums of war."
 nomads.610.a.tt: "Become the Great Khan, leaving any Federation and Galactic Community."
 nomads.610.b: "The era of Khans is over. Let us show you what exile taught us."
 nomads.610.b.tt: "The assembled clans become our vassals."
 nomads.610.c: "Vengeance has been served. The rest of you may go."
 nomads.610.c.tt: "Leave the Marauders to their own devices."

 nomads.615.desc: "$nomads.610.base$.\n\nHowever, it is not over. There are other exiles with a claim to the throne. By law and custom, they must challenge us within three years or remain outcasts forever."
 nomads.615.a: "Let them come."

 nomads.620.name: "Dominance"
 nomads.620.desc: "It is time. Our cowardly rivals have given up. All other would-be usurpers have been dealt with. The unified might of the clans is behind us.\n\nAt last, we sit on our rightful throne."

 nomads.625.name: "Usurper Seizes the Throne"
 nomads.625.desc: "On our way to §Y[marauder_rally_point.GetName]§! we received crushing news: a rival claimant has beaten us to our quarry. The would-be Khan is defeated. Now the [From.GetName] claim the throne. \n\nBy custom we must defeat their capital ship within three years, or forfeit our right to rule."

 nomads.630.name: "Claim Lost"
 nomads.630.desc: "After our defeat at the hands of the §Y[From.GetName]§! we must forfeit our claim to the Khanate. All we can do now is watch as someone else seizes the throne."

 nomads.635.name: "Death of the Khan"
 nomads.635.desc: "Our glorious Khan [From.GetName] passed away recently, and as tradition dictates we must now give up the power that came with the throne. Already our Marauder allies have stopped sending reinforcing fleets to aid our cause.\n\nNow we just have to decide what to do with the rest of the galaxy, there are many that wouldn't be familiar with our traditions and might accept our rule either way, but already they see weakness from our rule."
 nomads.635.a: "Tradition is true, we will give up our subjects."
 nomads.635.a.tt: "Releases all subjects but gain a large amount of Opinion and Trust with them all\n\nGives up control of all starbases, returning them to Friendly Marauder control"
 nomads.635.b: "The [Root.GetName] Khanate is eternal!"

 nomads.700.name: "In Search of Revenge"
 nomads.700.desc: "The ragged remains of our marauder clans have come to us. It seems after the fall of our home it was convenient for them to forget our exile. Their plea is simple, "Take the seat of Grand Khan, and burn the name of our people into the stars of all those who wronged us."\n\nThough smaller than any proper Grand Khanate fleet, what they offer is still everything we once wanted. All we have to do is declare the entire galaxy our enemy."

 nomads.700.a: "Let sound the drums of war!"
 nomads.700.b: "We are not interested, find some other fool."

 marauder.750.2.desc.low_kills: "HYEEEIIIEEE!!! Who this? You fly ships from other dwamak clan, but look weak. What happen? Lose your fleet in gamble?"
 marauder.750.2.desc_01: "If it not our favorite dokwaks! HYEEEIIIEEE!!! You better than the dwakam who kicked you out."
 marauder.750.2.desc_02: "HYEEEIIIEEE- wait. You not planet-bound dwamaks. You here about last raid? Someone send you to grab back their minerals?"
 marauder.750.2.desc_03: "$marauder.20.2.desc_03$"
 marauder.750.2.desc.khan: "HYEEEIIIEEE!!! Big dokwak arrives! Quick, open good channel!"
 marauder.750.2.desc.overlord: "HYEEEIIIEEE! Dokwak-chief is here! We fly under your banner now. What you need, boss?"
 marauder.750.2.desc.proven: "HYEEEIIIEEE! We know you. You killed good and you still have teeth. What you want?"

 marauder.750.3.desc.low_kills: "You may have been forsaken by your own people, yet not beyond redemption. In the embrace of She of the Void any can rise, if you are worthy."
 marauder.750.3.desc_01: "Your ships passing has upset our great Lady. We will petition Her on your behalf."
 marauder.750.3.desc_02: "You yet live? That is good. We thought you be unmade by the heretical agents sent after you.\n\nNo, we do not mean your former clan. We speak of the true Foe."
 marauder.750.3.desc_03: "She of the Void sees you and smiles. You are with friends. How can the [marauder_country_3.GetName] support you today?"
 marauder.750.3.desc.khan: "Chosen of the Void. How may we followers help you enact Her vision today?"
 marauder.750.3.desc.overlord: "She of the Void sees this arrangement and does not object. We are yours to command. What is your will?"
 marauder.750.3.desc.proven: "You have flown the long path. She of the Void has not forgotten your trials. What brings you to us?"

 marauder.750.a: "Can you help us against the [marauder_country_1.GetName]?"
 marauder.750.a.response.2: "HYEEEIIIEEE! You are funny, dwakam. No. You much too weak for our smash-smash. Win fights first, grow fangs, then maybe you earn dokwak name."
 marauder.750.a.response.3: "Now is not the time. She of the Void is displeased with you. Perhaps once you have atoned for your previous transgressions will she be more benevolent."
 marauder.750.b: "It's time. Join us."
 marauder.750.c: "Now or never, help us stop the pretender!"
 marauder.750.d: "Stop sending us reinforcements."
 marauder.750.e: "We are ready to receive your reinforcements again."

 marauder.755.desc: "Our former clan refuses to accept our communications. We are alone."
 marauder.755.desc.khan_pending: "Once again our communications are rejected. In response we recive an automated message:\n\n"The Khan is not ready to accept your surrender yet. Return once the drums of war have sounded.""
 marauder.755.a: "We will make them acknowledge us."

 marauder.760.desc.3_kills: "You dare contact us again?\n\nA few lucky strikes, and already you strut like a warlord. The void claims the bold and the foolish in equal measure. Do not mistake chance for skill."
 marauder.760.desc.10_kills: "You foul our communications with your name and stain our honor with your survival. End it the proper way. Next time we send a fleet after you, save us all the time and just deactivate your shields.\n\nDie in battle like a true [Root.Species.GetSpeciesName]."
 marauder.760.desc.20_kills: "No matter what, the void refused to keep you. We erased you from the ledgers, burned your banners, and made your face the villain in [Root.Species.GetSpawnNamePlural] stories. Still, you carve your mark into our plating. We sent flotillas, then squadrons, and now armadas. The clans begin to murmur that the exile was an error. Such talk ends here.\n\nWhy won't you die?!"
 marauder.760.desc.post_khan_1: "Welcome home Heirs. What do you need of us today?"
 marauder.760.desc.post_khan_2: "Scored any impressive kills recently? We had a run-in with a particularly large Tiyanki. It regenerated faster than lasers could cut it apart."
 marauder.760.desc.post_khan_3: "Ah the traitors retu- Ah sorry, old habits. Where have the stars taken you today?"

 marauder.765.desc.khan_01: "The galaxy trembles at your might, great Khan. Where shall we point our fleets next?"
 marauder.765.desc.khan_02: "Khan of Khans! The clans sing your name in every void-port. We await your word.\n\nWhat worlds do we burn today?"
 marauder.765.desc.khan_03: "Great Khan! Give us a chance to show you our mettle and let us prove our true loyalty. We are shamed by the day we cast you out, and if we are not worthy of redemption then let us die in mass driver fire!"

 marauder.765.a: "Hold your reinforcements until we call for them."
 marauder.765.b: "Resume sending us reinforcements."

