 gov_champions_forge_enclave: "Broadcasting Enclave"
 gov_champions_forge_enclave_desc: "A nomadic MegaCorp broadcasting spectacular ship competitions across the galaxy, turning combat into entertainment and champions into commodities."

 NAME_Champions_Forge_Enclave: "Champion's Forge Live!" #empire
 NAME_Champions_Forge_Enclave_adj: "Champion's Forge Live" #empire, e.g. 'an Artisan starbase'

 RT_ETERNAL_CHAMPION: "Smith of Legends"

 champions_forge_tournament_chain_title: "Champion's Forge Live! Tournament"
 champions_forge_tournament_chain_desc: "Decades have passed, and a new tournament is about to begin. Send your fleets into the spotlight and prove to the galaxy your wit, might, and determination."

 CHAMPIONS_FORGE_TRAVEL: "Wormhole: Champion's Forge Live!"
 CHAMPIONS_FORGE_TRAVEL_DESC: "The CFL has prepared a specialized wormhole to the competition grounds. Deliver your fleet to the designated location before the deadline and prepare to forge your legacy!"

 NAME_Contestant_Fleet: "[event_target:champions_forge_contestant.GetName] Champions"

 nomads.160.desc: "Welcome to CFL! This is where legends are forged, and stellar dreams take flight. We roam the stars, providing danger and spectacle to a galaxy grown bored of safety and routine.\n\nWhat's your angle? Nimble pilots? Spectacular firepower? Or simply a taste for profit and applause? Sign up today, and we'll turn you into a star."

 nomads.100.name: "§YEnclave:§! Champion's Forge Live!"
 nomads.100a.desc: "Ah, a familiar contender returns to the Broadcast! But are you packing any new heat?\n\nOur audience, and the galactic arena await!"
 nomads.100b.desc: "Welcome back, contestant! The betting pools are red hot, the fans are baying for more, and we've just finished clearing the debris.\n\nCare to break another viewership record?"
 nomads.100c.desc: "Well, well! If it isn't our favorite warmonger-slash-patron of public spectacle. We're prepping the next fleet melee...\n\nWould you like to be the main event?"
 nomads.100.a.invitation: "§YRegister§! us for the next show."
 nomads.100.a.stop: "§YStop§! sending tournament invitations."
 nomads.100.b: "How much to change the venue?"
 nomads.100.b.tt: "$opinion10$\nWe will have §Y5 Years§! to issue a special §YContract§! designating the system that will host the next CFL event."
 hosting_cfl_cooldown_tt: "The CFL tournament license will next be available on the §Y[champions_forge_enclave_country.cfl_cooldown_timer]§!"
 nomads.100.b.reply: "Looks like we've got our new headliner! We can't wait to see what you'll bring to the stage.\n\nSimply issue a §YContract§! for us in the system of your choosing, and we'll bring the action!"
 nomads.100.c: "§YIntroduce§! us around."
 nomadic_paragon_cooldown_tt: "§RWe can request another introduction on §Y[root.nomadic_paragon_timer]§!.§!"
 nomadic_paragon_already_hired: "§RWe have already hired the services of a nomadic leader.§!"
 nomadic_paragon_all_hired: "§RThe $RT_ETERNAL_CHAMPION$ has run out of contacts.§!"
 nomadic_paragon_explanation: "\nWe will be approached by a nomadic leader."
 champions_forge_trust_tt: "We must earn the trust of the §Y$RT_ETERNAL_CHAMPION$§!."
 nomads.100.d: "§YTell us more§! about your events."
 nomads.100.d.reply: "Roughly every quarter-century, would-be legends clash! They bring their own fleets, the tournament location changes, and the brawls never disappoint!\n\nVictors earn rewards, prestige, and a place in our scoreboard.\n\nMiss the call, and you miss your shot. We don't wait."
 nomads.100.e: "§YPurchase§! combat data on our rivals."
 nomads.100.e.reply: "Combat data, hot off the broadcast! Our analysts have been crunching every clip from your rivals' fleet engagements. Patterns, tells, soft spots. We hand over the package, your gunners do the rest."
 cfl_combat_data: "CFL Combat Briefing"
 cfl_combat_data_desc: "Detailed engagement analysis purchased from the Champion's Forge Live! production team, exposing the combat patterns of our rivals."

 contract_host_cfl_tournament: "Nominate System for CFL Tournament"
 contract_host_cfl_tournament_issuer_desc: "We have purchased the venue rights for the next Champion's Forge Live! tournament. Perhaps we can use this for our advantage."
 contract_host_cfl_tournament_desc: "$contract_host_cfl_tournament_issuer_desc$"
 contract_host_cfl_tournament_chain_title: "$contract_host_cfl_tournament$"
 contract_host_cfl_tournament_chain_desc: "$contract_host_cfl_tournament_desc$"
 champions_forge_tournament_ongoing_tt: "$TRIGGER_FAIL$§RThe CFL have an ongoing tournament, we will have to wait§!"

 nomads.105.name: "The [from.GetName]" #country - may return as an unknown name
 nomads.105.desc: "The Champion's Forge Enclave won't respond to our hails."
 nomads.105.desc.unknown: "Translations aside, once we exchanged our information with [From.GetName] the signal went dark and they refused to speak to us."
 nomads.105.a: "How dare they?!"

 nomads.110.desc: "Knew you had it in you!\n\nWe will be in touch."
 nomads.115.desc: "Leaving your winnings on the table? What a waste!\n\nWell, if you change your mind, and you can find us, the CFL always welcomes winners."

 nomads.120.desc: "Ah, looking for someone new for your roster? Warriors, fixers, wayfarers... Not the sort you forget, and the galaxy rarely lets them drift far for long. We have encountered a few in our travels. But nothing's free out here, friend. Pay our scouting fee, and I'll arrange an introduction."
 nomads.120.a: "We're interested."

 nomads.125.name: "CFL: Combat Briefing Run Dry"
 nomads.125.desc: "Hey there, contender! Your combat briefing has gone stale, and the tactical scene never holds still for long. New rivals, new fleet doctrines, fresh soft spots opening up.\n\nOur analysts already have a fresh dossier prepped with your name on it. Same terms, same firepower edge. Want it?"
 nomads.125.a: "§YRenew§! the briefing."
 nomads.125.b: "Pass for now."

 nomads.255.name: "CFL: The Forge Lights Again"
 nomads.255.desc: "This is Champion's Forge Live! The galaxy's premier source of spectacle and destruction.\n\nRegistration is now open for the next CFL Tournament in the §Y[champions_forge_enclave_system.GetName]§! System. A glorious free-for-all awaits.\n\nEntry requirement: a fleet of at most §H[champions_forge_enclave_country.GetCFLFleetSizeRequirement] Fleet Size§!.\n\nVictors take the rewards, the prestige, and the grand CFL trophy.\n\nYou want to forge a legend? Sign up.\n\nYou want peace and quiet? Too bad!"

 nomads.255.desc.relic: "$nomads.255.desc$\n\nAlso, we are going to need that trophy back."
 nomads.255.a: "Sign us up! We will be victorious."
 nomads.255.a.tooltip: "Research the Special Project in §H[capital_star.solar_system.GetName]§!."
 nomads.255.b: "Ask us next time."
 nomads.255.c: "Stop sending us invitations."
 nomads.255.c.tooltip: "Tournament invitations can be enabled again by contacting the §H$NAME_Champions_Forge_Enclave$§!."
 CFL_NO_TOURNAMENT_TITLE: "Tournament Cancelled"
 CFL_NO_TOURNAMENT_DESC: "Due to a lack of able participants the §YChampion's Forge Live!§! have decided to cancel this tournament and move on."

 CHAMPIONS_FORGE_TRAVEL_FLEET_REQ: "Entry requirement: a fleet of at most §H[event_target:champions_forge_enclave_country.GetCFLFleetSizeRequirement] Fleet Size§!."

 cfl_fleet_size_heavy_late: "500"
 cfl_fleet_size_medium_late: "200"
 cfl_fleet_size_medium_mid: "100"
 cfl_fleet_size_small_mid: "50"
 cfl_fleet_size_small_early: "25"

 nomads.270.name: "Champion's Forge Start"
 nomads.270.desc: ""LITHOIDS, ORGANICS, AND WAR MACHINES ACROSS THE GALAXY - WELCOME BACK TO CHAMPION'S FORGE LIVE!\n\nThe §Y[event_target:champions_forge_enclave_system.GetName]§! system has been cleared, the betting pools are on fire, and I've got a feeling we're about to witness some incredibly expensive hardware go critical.\n\nRemember, everyone at home: this isn't just some patrol or border skirmish. This is the Forge! Nobody retreats with their pride intact.\n\nContestants... MAKE! IT! LEGENDARY!""

 nomads.285.desc.intro: "The frenzied melee finally falls quiet in the §Y[event_target:champions_forge_enclave_system.GetName]§! system. The Forge goes dark. Wreckage drifts through cooling light as emergency beacons stutter back to life.\n\n"What a spectacle!" the CFL commentator roars, voice raw with unfeigned emotion. "That's what we came for! That's what the galaxy tuned in to see!""

 nomads.285.name: "Champion's Forge Concluded"
 nomads.285.desc: "$nomads.285.desc.intro$\n\nThird place is no shame, only proof we belonged on the broadcast. Even at the lowest step of the podium, we can look down on the fleets we broke."
 nomads.285.a: "Our fleets flew well!"

 nomads.290.name: "Champion's Forge Concluded"
 nomads.290.desc: "$nomads.285.desc.intro$\n\nSecond place tastes like ash! We stretched out our [Species.GetHandName] to grab the trophy only to see it snatched by another. Well, let them celebrate. We will remember. And when the Forge calls again, we won't lose."
 nomads.290.a: "If only we had upgraded the fleet a little more..."

 nomads.295.name: "Champion's Forge Concluded"
 nomads.295.desc: "$nomads.285.desc.intro$\n\nFirst place! Bathed in the galaxy's adoration, we tore the trophy from the CFL crew and raised it high. This victory will echo far beyond the arena.\n\nNow the galaxy knows to fear our fleets."
 nomads.295.a: "Was there ever any doubt?"

 nomads.305.name: "Champion's Forge Concluded"
 nomads.305.desc: "$nomads.285.desc.intro$\n\nWe did not place. The trophy will not carry our name, and the crowd will move on to brighter stars. We have to return."
 nomads.305.a: "Who even cares about a pointless contest?"

 nomads.306.name: "Champion's Forge Abandoned"
 nomads.306.desc: "The match in the §Y[event_target:champions_forge_enclave_system.GetName]§! system dragged on without resolution. Battered fleets circled one another, none able to land the deciding blow.\n\nBut there is no triumphant finish, no trophy raised, no podium. The CFL crew finally call it: no winner could be determined. The contestant fleets are released and sent home, the broadcast quietly cut to a rerun."
 nomads.306.a: "A hollow ending."

 nomads.405.desc: "The broadcast cuts to black as the CFL Arkship detonates. We comb the wreckage in the §Y[champions_forge_destruction_system.GetName]§! system and haul in the contents of their overflowing storage bays.\n\nTheir final "spectacle" was quite profitable... for us."
 nomads.405.desc.relic: "$nomads.405.desc$\n\nOur names will forever be the final ones inscribed on the trophy... and with those fools at the CFL gone, there will be no next champion to challenge our claim."

 nomads.410.desc: "For a few seconds, the galaxy is treated to CFL's final show.\n\nA shaky feed with a screaming commentator followed by wall of fire swallowing the Arkship.\n\nThen: cut to black.\n\nThe Champion's Forge Live! Enclave has been destroyed by §Y[champions_forge_destroyer.GetName]§! in the §Y[champions_forge_destruction_system.GetName]§! system."
 nomads.410.desc.relic: "$nomads.410.desc$\n\nOur names will forever be the final ones inscribed on the trophy... and with the CFL gone, there will be no new champion to challenge our claim."
 nomads.410.a: "The galaxy will find new entertainment. It always does."

