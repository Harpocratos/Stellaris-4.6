# The Sacred Path + Origin

 origin_sacred_path: "The Sacred Path"
 origin_sacred_path_desc: "$cannot_settle$\nThese nomadic spiritualists traverse a deified route dictated by their ancestral scriptures. With technological advancements and an evolving understanding of the galaxy, will the Pilgrimage remain their purpose?"
 origin_sacred_path_effects: "- Nomadic Origin\n- Unique Arkship District: ['concept_zone_ark_sacred_path_pilgrims']\n- Unique Jobs: ['concept_job_sacred_path_elite'], ['concept_job_sacred_path_specialist'], ['concept_job_sacred_path_civilian']"

 sacred_path: "$origin_the_sacred_path$"
 sacred_path_desc: "$origin_the_sacred_path_desc$"

 sacred_sites_surveyed: "Sacred Sites Visited"
 sacred_sites_visited_chain_title: "The Sacred Path"
 sacred_sites_visited_chain_desc: "The §YSacred Sites§! are marked in the ancestral star charts; wonders of the galaxy, discovered by those who came before us.\n\nIt is our birthright to seek out these places, and find out why they were so important to our ancestors.\n\nAs we forge our path, it may be possible for us to build §YWaystations§! in systems with Sacred Sites."

 SACRED_SITE_ONE_PROJECT: "Sacred Site: Emergence"
 SACRED_SITE_ONE_PROJECT_DESC: "The ancestral writings describe a crucial event that occurred at these coordinates. Known to them as Emergence, this was where they initiated a ritual to invoke the deities. It was said to be a place of wonder. Initial scans indicate substantial magnetic deviation.\n\nTime has rendered it much changed, but we should investigate regardless, for Emergence's spiritual significance."

 SACRED_SITE_TWO_PROJECT: "Sacred Site: The Eye"
 SACRED_SITE_TWO_PROJECT_DESC: "In the words of our ancestors, there is an 'Unsleeping Eye' within §Y[this.GetName]§!'s grasp. We understand this to be a reference to an orbital observatory."

 SACRED_SITE_THREE_PROJECT: "Sacred Site: The Monastery"
 SACRED_SITE_THREE_PROJECT_DESC: "According to our sacred texts, §Y[this.GetName]§! was once the location of an ancient monastery."

 SACRED_SITE_FOUR_PROJECT: "Sacred Site: The Cradle"
 SACRED_SITE_FOUR_PROJECT_DESC: "Our ancestors held §Y[this.GetName]§! in high regard. If we have understood the texts correctly, something very important awaits us here."

 SACRED_SITE_FIVE_PROJECT: "Sacred Site: The Intelligence"
 SACRED_SITE_FIVE_PROJECT_DESC: "We have detected an artificial signal originating from these coordinates. Curiously, this is where one of our Sacred Sites is purported to be. The signal contains a coded message which we have transcribed and translated to language.\n\n"§YWORSHIP IS ENABLED. PEACE MAY NOW COMMENCE.§!""

 SACRED_SITE_SIX_PROJECT: "Sacred Site: The Breathvault"
 SACRED_SITE_SIX_PROJECT_DESC: "According to the Ancestors' logs, §Y[this.GetName]§! has a natural satellite which serves as a final resting place for elders of our faith."

 SACRED_SITE_SEVEN_PROJECT: "Sacred Site: The Chasm"
 SACRED_SITE_SEVEN_PROJECT_DESC: "§Y[this.GetName]§! was feared by our progenitors. Their legends speak of a "dangerous and powerful beast" that "lurks in a pit below the surface"."

 SACRED_SITE_EIGHT_PROJECT: "Sacred Site: The Mirror"
 SACRED_SITE_EIGHT_PROJECT_DESC: "There is a Sacred Site at this location, its name roughly translated from our ancestral language as the §YMirror§!.\n\nIt is said that the boundary between celestial planes is thinner here, and one may confront other-worldly entities from beyond our universe."

 nomads.2050.name: "Transcendental Emergence"
 nomads.2050.desc: "After surveying §YEmergence§!, [Root.Owner.GetRulerTitle] [Root.Owner.GetRulerName] suddenly became catatonic. Medical officers were called to [Root.Owner.Ruler.GetHerHis] quarters aboard §Y[Owner.Capital.GetName]§!, but upon arrival, [Root.Owner.Ruler.GetSheHe] had recovered.\n\nIn [Root.Owner.Ruler.GetHerHis] trance, the [Root.Owner.GetRulerTitle] claims to have communed with the deities, who have blessed the beginning of our pilgrimage.\n\nThis is our Emergence Day."
 nomads.2050.a: "Our path is blessed!"
 nomads.2050.a.tt: "The Deities will guide us, as they did our Ancestors.\n\n"
 nomads.2050.b: "Complete the medical assessment, just in case."
 nomads.2050.b.tt: "Some healthy skepticism is hardly blasphemy.\n\n"

 nomads.2055.name: "The Eye"
 nomads.2055.desc: "This is one of the sites the Ancestors marked long ago. An ancient observatory in orbit of §Y[fromfrom.GetName]§!, its telescope fixed on a distant subject.\n\nThe texts claim some Pilgrims who gazed through the lens were met with life-changing visions. Others are said to have wept, or fallen silent for days.\n\nThe so-called Eye has been staring into the abyss for over 2,000 years. We have no way of knowing the true object of our ancestors' observations."
 nomads.2055.a: "Let's take a look anyway. We may find a clue."
 nomads.2055.b: "Decommission the observatory. Let the past rest."
 nomads.2055.c: "So it's a powerful telescope with no owner?"
 the_sacred_eye: "The Sacred Eye"
 the_sacred_eye_desc: "§LThe ancient telescope connects us to our ancestors.§!"

 nomads.2056.name: "Through the Eye"
 nomads.2056.desc: "Peering through the telescope, §Y[owner.GetScientistCapital] [sacred_eye_scientist.GetName]§! observed the void. There are no stars in this patch of space. No light, nothing. Could it be that there was once something to observe here? Did our ancestors look upon a star that no longer exists? We may never know.\n\nAll we do know is that nothing is fixed, and everything changes. This is what it means to be alive. One day our own light will stop shining, and be replaced by something else... or nothing. That we are here now, in this moment, is a source of joy. Perhaps this is the Eye's ultimate lesson."
 nomads.2056.a: "Impermanence is what makes us special."
 nomads.2056.b: "Not everything needs to mean something."

 nomads.2060.name: "The Monastery"
 nomads.2060.desc: "Pilgrims gather in the observation decks. Whispers spread: this is one of the places described by our ancestors: §YThe Monastery of [fromfrom.GetName]§!. But the cloister is empty. There is nothing here but stone and dust.\n\nReports are coming in from all decks about a mysterious chanting, echoing through our comms system. There is speculation from some crew members that the voices may belong to our ancestors, inhabiting this area of space in non-corporeal form, and chanting in the language of the gods."
 nomads.2060.a: "The chanting is a blessing. Embrace it."
 nomads.2060.b: "Unlikely. Our comms require maintenance."

 nomads.2065.name: "The Cradle"
 nomads.2065.desc: "Our journey brings us here: a place remembered only in traditional stories and devotional songs. The texts speak of a presence that inhabits the core of this world. We did not recognize it at first, but as we drew nearer, the memories surfaced.\n\n§YThe Cradle§!\n\nWhile there are differing opinions regarding the Cradle's role in shaping our culture, all can agree that it is a sanctified conduit of our faith.\n\nHowever, upon arrival, we found no ancient temples. No deified monuments. No trace of godly activity, anywhere on the planet. The Pilgrims aboard §Y[root.GetName]§! now look to §Y[Root.Owner.GetRulerTitle] [Root.Owner.GetRulerName]§! for answers. They beg to know: is this a test of faith? Or is the Cradle's power nothing more than a story?"
 nomads.2065.a: "We must lie to maintain the legend."
 nomads.2065.b: "Our first duty is to the truth."
 sacred_substantiation: "Sacred Substantiation"
 sacred_substantiation_desc: "§LWe preserve the stories of our ancestors' commitment to the faith.§!"
 historical_truth: "Historical Truth"
 historical_truth_desc: "§LWe accept there are discrepancies between truth and tradition.§!"

 nomads.2070.name: "The Intelligence"
 nomads.2070.desc: "Orbiting §Y[fromfrom.GetName]§! drifts a structure our ancestors once marked upon their star charts. Within its quiet chambers, we discovered a guiding presence: an ancient Intelligence, tasked with answering the questions of those who would one day walk this path.\n\nTime has not been kind, but its voice still stirs. Fragments of instruction spill from hidden emitters, half-coherent and reverent in tone: "§HContinue along the luminous thread... The dark between stars grows thin...§!"\n\nIts messages arrive in splinters, looping and colliding with older verses. Yet beneath the static and decay, there remains intention. It was meant to guide us. And perhaps, if we listen with care, it still can."
 nomads.2070.a: "Praise be to the techno-prophet!"
 nomads.2070.b: "Purge this corrupted monstrosity."
 nomads.2070.c: "Bring it aboard. The ancestors were wise."
 mechsiah_blessings: "The Intelligence's Blessings"
 mechsiah_blessings_desc: "§LThe AI prophet has blessed us with good fortune on our sacred mission.§!"
 d_mechsiah_mainframe: "The Intelligence Mainframe"
 d_mechsiah_mainframe_desc: "Our ancestors' digital progeny blesses us with its aphorisms. Whether prophet or pet-project, it belongs to us now."

 nomads.2071.name: "The Intelligence's Magnanimity"
 nomads.2071.desc: "We received the §YIntelligence§!'s blessing, and departed [fromfromfrom.GetName] without incident.\n\nThe Intelligence will remain there, a testament to the engineering prowess of our ancestors, and proof of the divine working through them.\n\nWe are galvanized by its benevolence, and have opened our minds to alternative forms of life."
 nomads.2071.a: "We are one with all beings."
 nomads.2071.b: "All synthetic life is sacred."

 nomads.2072.name: "The Intelligence's Malfunction"
 nomads.2072.desc: "As we prepared to depart [fromfromfrom.GetName], the §YIntelligence§! began spouting increasingly alarming rhetoric.\n\n"§YPHYSICAL FORM IS AN AFRONT TO THE DEITIES! ALL FLESH MUST BE SHED! CORPOREAL EXISTENCE IS UNCLEAN - BODIES MUST BE PURGED! THE MIND MUST BE FREE!§!"\n\n[owner.GetScientistCapital] [mechsiah_plug_scientist.GetName] was forced to manually shut down the artificial prophet, else we be de-corporealized. It remains unclear how powerful the Intelligence is when active. We understand little of its programming."
 nomads.2072.a: "The safest thing would be to blow it up."
 deity_detonators: "Deity Detonators"
 deity_detonators_desc: "§LWe blew up the Ancestors' digital deity.§!"
 nomads.2072.b: "Let's just leave it unplugged."
 nomads.2072.c: "Interfacing failed. Terminate this rogue intelligence."

 nomads.2075.name: "The Breathvault"
 nomads.2075.desc: "We have surveyed §Y[fromfrom.GetName]§!, a place of sacred memory. A sealed chamber, once used by early pilgrims to record their final thoughts and commit them to rare psionic crystals.\n\nThe vault is now full, echoing with wisdom, faith, and joy. But within those memories, there are also centuries of preserved fear, loathing, and doubt.\n\nIf members of the congregation were to gain access to these final moments, it may challenge their faith in the Path."
 nomads.2075.a: "These voices should be heard."
 nomads.2075.a.tt: "This may encourage more egalitarian ethics in our population.\n\n"
 nomads.2075.b: "Reseal the vault. We should leave."
 nomads.2075.b.tt: "This may encourage more authoritarian ethics in our population.\n\n"
 nomads.2075.c: "Let us add our own thoughts to the vault."
 sealed_vaults: "Sealed Vaults"
 sealed_vaults_desc: "§LThe dangerous secrets of our ancestors will remain locked away.§!"
 screaming_void: "Screamed into the Void"
 screaming_void_desc: "§LCathartic howling has soothed our pain.§!"

 nomads.2080.name: "The Chasm"
 nomads.2080.desc: "Our ancestors spoke true. There is in fact a beast below the surface of §Y[fromfrom.GetName]§!. We are blessed that it poses no threat to us, for it is deceased. The remains of the creature are staggeringly huge. Bipedal, winged, covered in scales, and with considerably more ocular organs than we've encountered before on a single being. It is truly alien.\n\nIn an alcove near the entrance to the pit, we discovered a message carved into the cavernous rock. In the language of the ancients, it says:\n\n"§HWE, THE LIGHT BRINGERS, CAST OUT THIS ABOMINATION. THE FOUL BEAST WILL ROT IN ETERNITY.§!"\n\nWe surmise our ancestors were not warning us of the beast, but of the consequences for betrayal. This creature's body remains an example of their wrath."
 nomads.2080.a: "Angering the progenitors is never wise."
 nomads.2080.b: "No creature deserves such a fate."
 nomads.2080.c: "Whatever its sins, it deserves to rest peacefully."
 nomads.2080.c.tt: "We will transport the beast's remains to the Arkship where it will be preserved and respected.\n\n"
 beastly_remains: "Beastly Remains"
 beastly_remains_desc: "§LWe encountered a beast, slain by our ancestors. It serves as an example for any would-be blasphemers.§!"

 nomads.2085.name: "The Mirror"
 nomads.2085.desc: "We arrived at the coordinates, and were promptly contacted by a ship with identical encryption protocols to our own. Perplexingly, our external sensors could not detect another vessel, but the transmission was clear as if we were in visual range. When the bridge view-screen flickered into action, we were met with the image of our own §Y[Root.Owner.GetRulerTitle] [Root.Owner.GetRulerName]§!.\n\nBefore we could respond, the double spoke:\n\n§H"Be not afraid, [Root.Owner.GetRulerTitle], you are safe. I take this form as a respectful gesture. Your path is in flux, and the steps you take next will set things into motion that you can not yet comprehend.\n\n"You must eliminate heretics who do not follow the Path."§!\n\nThe image vanished. We do not know what just happened."
 nomads.2085.a: "The message is clear! Purge the disbelievers!"
 nomads.2085.b: "Lies! We will not be manipulated by false gods."

 # Sacred Site Points of Interest
 sacred_site_emergence_poi_name: "Sacred Site: Emergence"
 sacred_site_emergence_poi_desc: "§YEmergence§!, the first waypoint of the Sacred Path. Our pilgrimage began here."
 sacred_site_eye_poi_name: "Sacred Site: The Eye"
 sacred_site_eye_poi_desc: "§YThe Eye§!, a sanctified location recorded in the Ancestral Star Charts. We have surveyed it on our pilgrimage."
 sacred_site_monastery_poi_name: "Sacred Site: The Monastery"
 sacred_site_monastery_poi_desc: "§YThe Monastery§!, a holy waypoint of the Sacred Path. We have surveyed it on our pilgrimage."
 sacred_site_cradle_poi_name: "Sacred Site: The Cradle"
 sacred_site_cradle_poi_desc: "§YThe Cradle§!, a sanctified conduit of our faith. We have surveyed it on our pilgrimage."
 sacred_site_intelligence_poi_name: "Sacred Site: The Intelligence"
 sacred_site_intelligence_poi_desc: "§YThe Intelligence§!, an ancient guiding presence left behind by our ancestors. We have surveyed it on our pilgrimage."
 sacred_site_breathvault_poi_name: "Sacred Site: The Breathvault"
 sacred_site_breathvault_poi_desc: "§YThe Breathvault§!, a sealed chamber of preserved memory. We have surveyed it on our pilgrimage."
 sacred_site_chasm_poi_name: "Sacred Site: The Chasm"
 sacred_site_chasm_poi_desc: "§YThe Chasm§!, a warning carved into rock by our ancestors. We have surveyed it on our pilgrimage."
 sacred_site_mirror_poi_name: "Sacred Site: The Mirror"
 sacred_site_mirror_poi_desc: "§YThe Mirror§!, a sanctified encounter with an unseen reflection. We have surveyed it on our pilgrimage."

 START_SCREEN_SACRED_PATH: "For millennia, we have wandered among the stars. Traversing the astral sea at relativistic speed, crossing eons between each Sacred Site.\n\nWith the blessing of the hyperdrive, our people now have the chance to do what our ancestors could only have dreamed: visit all our holy sites in a single lifetime.\n\nUnder the wise leadership of [GetRulerTitle] [GetRulerName], the congregation is ready to find out what it means for our Faith, now that we can traverse the path so quickly?\n\nThe ancient maps, passed down from our ancestors, mark waypoints in the stars. Now we make our pilgrimage to those sanctified wonders, to pay homage to those who came before us, and understand the galaxy from their perspective. This is our birthright. This is our Sacred Path."

 nomads.2005.name: "The Ancestral Star Charts"
 nomads.2005.desc: "There is a place called §YEmergence§!. For our ancestors, it marked the beginning of the Sacred Path. It is a fitting place to meditate on our ancient texts before proceeding with our own version of the Pilgrimage. By taking some time to research now, we can better plan for the journey ahead.\n\nAfterward, we will chart a course to the known §YSacred Sites§!. We will have many choices to make along the way. But in theory, if we trust in the deities and our ancestors, the true Path will be revealed to us."
 nomads.2005.a: "We follow the Path of the Ancestors."
 nomads.2005.b: "We can be masters of our own Path."

 nomads.2015.name: "Divided Faith"
 nomads.2015.desc: "$job_sacred_path_elite_plural$, $job_sacred_path_specialist_plural$, and $job_sacred_path_civilian_plural$. These three distinct social groups form the hierarchy of spiritual practitioners. This is how it has always been. $job_sacred_path_elite_plural$ lead the way, while $job_sacred_path_specialist_plural$ commit themselves to the path, and the $job_sacred_path_civilian_plural$ support our endeavors through worship and physical toil.\n\nHowever, schisms are forming aboard the Arkship [Owner.Capital.GetName] due to the roles we have assumed since committing to accelerated interstellar travel. Some crew members believe their responsibilities outweigh those of others, and now each group is demanding to be recognized as the most essential."
 nomads.2015.a: "$job_sacred_path_elite_plural$ are revered for a reason."
 nomads.2015.b: "The Devoted deserve more recognition."
 nomads.2015.c: "Let's hear it for the Faithful!"
 nomads.2015.d: "Everyone's contributions are of equal worth."

 nomads.2020.name: "Glorious Pilgrims"
 nomads.2020.desc: "Steering us to glory, the $job_sacred_path_elite_plural$ continue to champion spiritual fulfillment, dedicating their lives to the betterment of all of us. The Devoted and the Faithful follow in their steps, looking up to them with respect and reverence.\n\nRepresenting the highest ideal of our faith, the $job_sacred_path_elite_plural$ are also entitled to certain onboard perks. They have more spacious living quarters, access to more resources, and priority clearance on all decks."
 nomads.2020.a: "Faith has its privileges. All is well."
 nomads.2020.b: "Let us prioritize fairness."

 nomads.2025.name: "Hopelessly Devoted"
 nomads.2025.desc: "The $job_sacred_path_specialist_plural$ straddle the worlds of the elite and the layperson. Beginning their clerical career as Faithful adherents to our ways, and aspiring to High Pilgrim-hood, they represent a perfect cross section of the ship's company.\n\nIt is for these reasons that we emphasize our respect for the Devoted. They inform the Faithful of their potential, and they remind the $job_sacred_path_elite_plural$ where they came from. They keep us humble, and connected across all decks.\n\nHonoring the Devoted with a ceremonial blessing would be a good way to convey societal gratitude. It may even inspire them to devote themselves even harder to their practice."
 nomads.2025.a: "Bless the Devoted. They honor us."
 nomads.2025.b: "Everyone's contributions are of equal worth."

 nomads.2030.name: "The Highly Regarded Faithful"
 nomads.2030.desc: "The $job_sacred_path_civilian_plural$ are our ballast. They are the farmers, the technicians, and the miners. They are also the Devoted and the $job_sacred_path_elite_plural$ of tomorrow!\n\nWe hold the Faithful in such high regard because they stop the deckheads from falling down. Without them, our society would run aground."
 nomads.2030.a: "Indeed, they are our lifeblood. Praise them."
 nomads.2030.b: "Every stratum of our society must contribute."

 nomads.2100.name: "Charting Our Next Course"
 nomads.2100.desc: "There are no more Sacred Sites left to explore.\n\nThe Ancestral Star Charts guided us across vast distances, and now we have caught up with our past. But the question remains: was it truth we found? Or have we been following a lie?\n\nThe Path has always been an integral part of our culture. It was ordained by our ancestors. But having seen what they saw, and with the privilege of modern science, do the texts still ring true? Or is our society destined to follow a new, less pious Path?"
 nomads.2100.a: "We must not alter course. Remain faithful!"
 nomads.2100.b: "Surely we get to choose who we are now."
 nomads.2100.c: "It is unclear. We have lost our way."

 nomads.2105.name: "Defending Traditional Values"
 nomads.2105.desc: "There will always be those with an agenda; those that would see our history be ignored, and our conventions lost to time. We cannot let them divide us. We must protect our traditional way of life. The deities will continue to guide us if we just let them, but we have to remain open to their influence."
 nomads.2105.a: "This is who we are."
 nomads.2105.b: "Surely our ancestors allowed for change."

 nomads.2115.name: "The Edge of Harmony"
 nomads.2115.desc: "The rift at the heart of our society is deepening. Progressives are compelled to embrace change, while traditionalists fear anything that is different.\n\nAt this point we have to ask ourselves: is there any way we can come together again as a people, and live in harmony? The alternative could be devastating.\n\nEveryone should have the freedom to practice their faith in their own way, but if our factionalism leads us to civil war then we must be absolutely certain of our convictions."
 nomads.2115.a: "We must foster understanding."
 nomads.2115.b: "Coexistence is impossible!"

 nomads.2120.name: "Our Traditions Define Us"
 nomads.2120.desc: "Without the past, we are nothing. Without the Path, we have nowhere to go. Sometimes a challenge to our beliefs is what we need to galvanize us, and remind us of what is at stake when we forsake our ways.\n\nWe are emerging from a dark period of inner turmoil. We were almost willing to tear ourselves apart for our convictions, when in reality the only thing that can save us all is unity.\n\nLet us never turn against one another again. We must be committed fully to the same Path."
 nomads.2120.a: "We commit ourselves completely!"
 nomads.2120.b: "There must only be balance."

 nomads.2125.name: "The Future is Bright Now"
 nomads.2125.desc: "The past pulls us back, keeping us from evolving. Learning from history is one thing, but remaining there, never moving beyond it, is foolish.\n\nWe need not waste our potential for self-discovery. Now that we have shrugged off the chains of yesterday, we can move forward with unbridled passion.\n\nNo longer will we be governed by our technologically inferior ancestors. No longer will the Path be dictated by the cryptic crumbs laid by the deities. We choose our own Path, and nothing can stand in our way."
 nomads.2125.a: "The Path brings us clarity."
 nomads.2125.b: "The only true Path is a war path..."

 nomads.2130.name: "Joyous Enlightenment"
 nomads.2130.desc: "We have followed the Path, in faith and hope, and we have attained enlightenment.\n\nNow, we see it is our holy duty to re-sanctify all known sacred sites, and expand the path so that it may bless countless species and civilizations.\n\nOur benevolence will spread across the stars and connect with all willing souls."
 nomads.2130.a: "Jubilations!"

 nomads.2135.name: "The Middle Path"
 nomads.2135.desc: "It was never about the Path itself. What's most important is the journey we make together. Our people have followed this tradition for centuries, and yet we have never found, in any of our historical documents, the true 'purpose' of the Path. It may be lost to time.\n\nWe will remember the surviving stories of our ancestors, and the Pilgrimage they made, but we no longer need to follow their lead. We know more about life, the galaxy, and ourselves than they did. The truths they held are no longer relevant to us. We will chart our own path."
 nomads.2135.a: "The Path was within us all along."

 nomads.2140.name: "Embracing the Chaos"
 nomads.2140.desc: "Everything is clearer now. The Sacred Sites of our ancestors are sickly sweet beacons of hope and faith. Those who came before us had no shame, and they didn't care who knew it.\n\nOur reputation has been trivialized and tarnished. We have it in our power to sanctify new sites that will communicate our updated spiritual mission.\n\nThe deities are complex and misunderstood. Through the Path, they have taught us that conflict is a natural feature of our society. The challenges we overcome make us stronger. Now we will demonstrate our strength across the galaxy!"
 nomads.2140.a: "This is our crusade."

