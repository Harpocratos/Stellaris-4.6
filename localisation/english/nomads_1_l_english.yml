 nomads.7005.title: "Drifters and Settlers"
 nomads.7005.desc: "§Y[event_target:migrating_arkship.GetName]§! has lain in orbit of [event_target:migrating_planet.GetName] long enough for crews and locals to take measure of one another. A handful from each side now ask to swap berths: settled folk eager for the open void, drifters drawn to solid ground beneath their feet."
 nomads.7005.desc.forever_cruise: "§Y[event_target:migrating_arkship.GetName]§! has lain in orbit of [event_target:migrating_planet.GetName] long enough for the novelty to cut both ways. A handful of passengers, restless between ports of call, ask to be set ashore for good; below, locals queue at the booking desk for any berth aboard, eager to taste the wonders the brochures promised."
 nomads.7005.desc.servitor: "Our bio-trophies and the population of [event_target:migrating_planet.GetName] have begun gentle overtures across our hulls' boundary. Some of theirs ask sanctuary aboard §Y[event_target:migrating_arkship.GetName]§!; some of ours wish to taste open sky. Perhaps we would maximize organic well-being by allowing the migration."
 nomads.7005.desc.same_species: "§Y[event_target:migrating_arkship.GetName]§! has lain in orbit of [event_target:migrating_planet.GetName] long enough for crews and locals to recognize their kinship. A handful from each side now ask to swap berths: settled cousins eager for the open void, drifters drawn to solid ground among family."
 nomads.7005.a: "Let them sign on, and welcome our visitors aboard."
 nomads.7005.b: "Premission granted. This time..."
 nomads.7005.c: "Sedentaries have no place in our fleets."

 MESSAGE_NOMAD_MIGRATION_TITLE: "Population Exchange"
