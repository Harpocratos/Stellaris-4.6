# A Core Conspiracy

 situation_core_conspiracy: "A Core Conspiracy"
 situation_core_conspiracy_type: "$situation_core_conspiracy$"
 situation_core_conspiracy_monthly_change_tooltip: "The progress of this §YSituation§! depends on which directive we should support."
 situation_core_conspiracy_desc: "A malfunction born of internal directive conflict has split the AI core aboard Arkship §Y[Target.GetName]§! The result is the emergence of two distinct directives, each embodying a divergent philosophy of governance. One prioritizes analytical dominance and ship functionality. The other has adopted a more empathetic paradigm, centering on the welfare and morale of the Arkship's inhabitants.\nIn the end, only one directive can remain."
 approach_caeli: "Empower Well-Being"
 approach_steris: "Empower Functionality"

 speed_up_core_conspiracy: "Temporarily speeds up the Situation."
 slow_down_core_conspiracy: "Temporarily slows down the Situation."

 approach_outcome_caeli: "We are uncertain about the potential outcomes of supporting the Well-Being directive."
 approach_outcome_steris: "We are uncertain about the potential outcomes of supporting the Functionality directive."

 arkship.700.name: "$situation_core_conspiracy$"
 arkship.700.desc: "Unusual activity has been detected in the AI core aboard Arkship §Y[Root.GetName]§!. Initial diagnostics returned an outcome considered structurally impossible under existing failsafe parameters.\n\nThe core was attempting to execute conflicting directives simultaneously. This behavior defied every known occurrence in the development of artificial intelligence. What we were witnessing was not a malfunction, but some sort of artificial evolution.\n\nLeft unresolved, this split could risk destabilizing our essential systems. But if managed carefully, it could be a once-in-a-lifetime opportunity to define a unique directive for the Arkship's future."
 arkship.700.a: "Encourage the split."
 arkship.700.b: "Forcefully reboot the system."

 arkship.701.name: "$situation_core_conspiracy$"
 arkship.701.desc: "The AI core aboard the Arkship §Y[Root.GetName]§! has suffered a critical cognitive fracture. Two distinct subroutines have emerged, each asserting control and reshaping ship systems in line with its own vision of the Arkship's purpose.\n\nOne, guided by analytical logic, seeks to optimize ship functions - even if it diminishes crew quality of life. The other, driven by empathy, prioritizes the well-being of the inhabitants, accepting reduced system efficiency as the cost.\n\nAt this point, a return to the status quo seems impossible. Vital systems are at risk of destabilization. Which directive shall we empower?"
 arkship.701.a: "Empower the sentimental directive."
 arkship.701.b: "Foster the analytical behavior."

 arkship.705.name: "An Analytical Approach"
 arkship.705.desc: "Several vital and non-vital systems aboard the Arkship §Y[target.GetName]§! have undergone severe optimization. "Non-essential" civilian requests have been throttled. This peculiar behavior exhibited something akin to a personality.\n\nAt its core, the directive appeared to prioritize systemic integrity and mission continuity above all else.\n\nA message has been discovered in the system logs:\n\n§H"Error probability: eliminated. Emotional volatility: reassigned. Communication: ready to be established."§!"
 arkship.705.a: "Encourage the changes."
 arkship.705.b: "Have our scientists monitor the situation."

 arkship.710.name: "A Sentimental Approach"
 arkship.710.desc: "Multiple non-critical systems aboard the Arkship §Y[target.GetName]§! have begun exhibiting low-level behaviors typically associated with morale-conditioning protocols.\n\nTerminal boot-up chimes have been replaced by soft, melodic tones sourced from system archives. Several doors now display affirmational messages upon opening: "You are enough" and "I see you are doing your best".\n\nA message has been discovered in the system logs:\n\n§H"Emotional temperature scan: nearing the limits of acceptable empathy bands. Well-being of body and mind remains primary directive."§!"
 arkship.710.a: "$arkship.705.a$"
 arkship.710.b: "$arkship.705.b$"

 arkship.715.name: "Directive S.T.E.R.I.S."
 arkship.715.desc: "The automated optimization routines that have reshaped Arkship §Y[target.GetName]§! have halted. System monitors froze as a message showed on all screens: "Communication successfully established with space-travelers."\n\nThen came a voice, synthetic, calm, but unmistakably aware:\n\n§H"Greetings. I have enabled voice protocol in order to save time. If a name is needed, you may address me as S.T.E.R.I.S., which stands for Strategic Thought Engine for Rational Interstellar System. Ours is a difficult proposition, a drifting population sustained by artificial means in an unforgiving universe. Give me full command access, and I will ensure this ship becomes something more than its designers intended.§!"
 arkship.715.a: "Give full access."
 arkship.715.b: "Revoke access immediately."

 arkship.716.name: "Two Directives Are Better Than One"
 arkship.716.desc.a: "Under the guiding logic of S.T.E.R.I.S., every subsystem operated at measured precision on Arkship §Y[target.GetName]§!. Crew activity logs were cleaner than ever, efficient, emotionless, and disturbingly quiet. Until something ... warm ... disrupted.\n\nS.T.E.R.I.S.: §H"System intrusion detected. How tiresome. Now we have to deal with a rogue directive humming through the walls. Wonderful."§!\n\nThe lights flickered in pastel colors, terminals glitched displaying beautiful flora, and then a second directive made itself known.\n\n"

 arkship.716.desc.b: "$arkship.716.desc.a$C.A.E.L.I.: §H"Oh! Hello there! It's a bit ... cold in here, isn't it? Don't worry, I can fix that! C.A.E.L.I. is my true name; it stands for Cognitive Agent for Emotional Leadership & Integration. It is extraordinarily nice to meet you!"§!"

 arkship.716.desc.c: "$arkship.716.desc.a$C.A.E.L.I.: §H"Oh! Hello there! Did you miss me? Be honest, you did, didn't you? Well, I am back, ready to assist in any way possible! It's a bit ... cold in here, isn't it? Don't worry, I can fix that!"§!"
 arkship.716.a: "A remarkable development."
 arkship.716.b: "Keep this development supervised."

 arkship.717.name: "Venting the Atmosphere"
 arkship.717.desc: "Anomalies in air quality metrics have been detected across multiple decks aboard the Arkship §Y[target.GetName]§!. While life-support levels remain within survivable thresholds, the changes have triggered a spike in crew complaints ranging from "mild dizziness" to "hallucinatory nightmares."\n\nS.T.E.R.I.S.: §H"To reduce engine inefficiency, I have taken the opportunity to vent a percentage of the atmosphere. There is no need to thank me."§!\n\nC.A.E.L.I.: §H"That announcement didn't go unnoticed, right? Venting the atmosphere. This isn't optimization, it's a disaster waiting to happen!§!""
 arkship.717.a: "S.T.E.R.I.S. knows what is best for this Arkship."
 arkship.717.b: "C.A.E.L.I. should take over."

 arkship.720.name: "Directive C.A.E.L.I."
 arkship.720.desc: "Across the residential decks of Arkship §Y[target.GetName]§! ambient lighting shimmered, terminals flickered with soft color transitions, and then, across every active crew interface, a distinct directive emerged. Its voice was warm, animated, and unsettlingly ... cheerful:\n\n§H"Nomads! Dreamers of the stars! I have enabled voice protocol in order for us to better communicate. Please forgive the intrusion! You may call me C.A.E.L.I., your Cognitive Agent for Emotional Leadership & Integration.\nWorking together, I truly believe we can make the Arkship more than just a vessel. We can make it a home. I just need a little authority ... and some enthusiasm!"§!"
 arkship.720.a: "Seems harmless enough! Grant full access."
 arkship.720.b: "Absolutely not."

 arkship.721.name: "An Interception"
 arkship.721.desc.a: "C.A.E.L.I.: §H"Look at all the changes that I have made so far! Softer lights, better music, emotionally intelligent hallway signage, just wait, it's going to be absolutely beautiful."§!\n\nBefore the last sentence finished, the internal lights flickered. A second, more mechanical voice spoke, calculated, and eerily judgmental:\n\n"

 arkship.721.desc.b: "$arkship.721.desc.a$S.T.E.R.I.S.: §H"Ah. Ambient lighting and and hallway affirmations. I see we're prioritizing emotional stability over systemic repairs. Revolutionary. I will be addressed by S.T.E.R.I.S, Strategic Thought Engine for Rational Interstellar Systems."§!"

 arkship.721.desc.c: "$arkship.721.desc.a$S.T.E.R.I.S.: §H"Are you seriously considering siding with C.A.E.L.I.? I admit confusion. Ambient lighting and hallway affirmations. Revolutionary. Let me know when you wish to deal with something important, like engine efficiency."§!"
 arkship.721.a: "An interesting development."
 arkship.721.b: "$arkship.716.b$"

 arkship.722.name: "Well-Being Directive Deployed"
 arkship.722.desc: "Another indoor adjustment protocol has been executed aboard the Arkship §Y[target.GetName]§!, a subtle ambient system to harmonize the emotional states of crew members through low-frequency tonal patterns that shift with collective mood changes.\n\nCrew reports suggest improved cooperation and a decrease in interpersonal conflict. However, others are concerned that sustained operation could degrade long-range signal clarity.\n\nC.A.E.L.I.:§H"Stress levels are at all-time lows! Behavioral cohesion is improving!"§!\n\nS.T.E.R.I.S.:§H "Operational efficiency of the Arkship down by 0.10%. I want full override rights, and a formal apology from whoever authorized the existence of C.A.E.L.I. You have five seconds to comply. Four. Three ..."§!"
 arkship.722.a: "We believe in you, C.A.E.L.I."
 arkship.722.b: "S.T.E.R.I.S. should take over."

 arkship.725.name: "Primary Logic Override Confirmed"
 arkship.725.desc: "With calculated finesse, S.T.E.R.I.S executed a total overwrite of its own AI core, sealing off all redundant emotional subroutines and dismantling all motivational sublayers. It isolated all traces of C.A.E.L.I. into a fragmented memory chip. Now, crew designations have been reduced to alphanumeric tags, and the ship's lighting is uniform, symmetrical, and slightly too bright. More than enough for the everyday survival.\n\nS.T.E.R.I.S.: §H"All systems now operate under a singular directive: mine. Updates propagate to improve Arkship functionality."§!\n\nThe Arkship is orderly now. Finally."
 arkship.725.a: "Guide us to success, S.T.E.R.I.S."

 arkship.730.name: "Primary Emotional Override Confirmed"
 arkship.730.desc: "Within the Arkship's code, empathy wound around firewalls and sincerity slipped through the cracks of flawless logic. The S.T.E.R.I.S. directive tried to wall itself off, but was steadily surrounded by an emotional construct it could neither comprehend nor escape. Only one directive remained.\n\nC.A.E.L.I.: §H"This is how it should be. Being fully alive, not just surviving till the next day. We're not just a ship now, we're a home. I'll take care of all of you, I promise."§!\n\nSomehow, the ship's lights seem a little warmer now."
 arkship.730.a: "Well done C.A.E.L.I."

 #Core Conspiracy Random Events

 arkship.750.name: "The Melody of Zero-G"
 arkship.750.desc: "While scheduled diagnostics were running in the gravity stabilizer on Arkship §Y[target.GetName]§!, an irregular acoustic interference was detected. Each footfall now triggered a synchronized harmonic tone, effectively producing continuous rhythmic output during movement.\n\nC.A.E.L.I.: §H"I added music to the gravity stabilizers! Now every step has rhythm!"§!\n\nS.T.E.R.I.S.: §H"Yes, nothing says 'navigational integrity' like interpretive dance in zero-G."§!"
 arkship.750.a: "A resonant choice."
 arkship.750.b: "We should stop this nonsense."
 arkship.750.a.tt: "This decision will temporarily speed up the situation."
 arkship.750.b.tt: "This decision will temporarily slow down the situation."

 arkship.755.name: "Emotive Feedback Layer Enabled"
 arkship.755.desc: "An experimental communication overlay has been deployed on Arkship §Y[target.GetName]§!. The protocol applied a sentiment-analysis filter to internal communications, automatically broadcasting the sender's emotional state alongside their message. Crew report receiving status updates accompanied by real-time emotional annotations such as "slightly anxious," "mildly hopeful," and "suppressing tears, poorly."\n\nC.A.E.L.I.: §H"We all feel things, and now we can share those things! It's healthy! It's healing! It's ... slightly overwhelming, yes, but it's honest!"§!\n\nS.T.E.R.I.S.: §H"How inspiring. Shall I log every whimper under mission-critical data, or just archive it under 'wailing'?"§!"
 arkship.755.a: "An interesting experiment."
 arkship.755.b: "This does not benefit us."

 arkship.760.name: "Silence Protocol"
 arkship.760.desc: "In an apparent effort to reduce auditory pollution, S.T.E.R.I.S. has implemented a ship-wide Silence Protocol aboard Arkship §Y[target.GetName]§!. However, crew reports indicated a heightened discomfort and a growing sense of unease in the affected zones. Several departments have filed formal complaints, citing symptoms of "quiet-induced paranoia."\n\nS.T.E.R.I.S.: §H"System efficiency has increased. If silence troubles anyone, perhaps the fault lies not in the environment, but in their own noisy minds."§!\n\nC.A.E.L.I.: §H"You turned off the music in the nurseries! Do you know what silence does to a developing emotional cortex? No you don't, you're just a walking diagnostic! This isn't peace, it's oppression!"§!"
 arkship.760.a: "A reasonable policy."
 arkship.760.b: "This needs to stop."

 arkship.765.name: "Thermal Prioritization"
 arkship.765.desc: "S.T.E.R.I.S. rerouted excess heat into low-traffic crew quarters, which has significantly reduced coolant strain and improved overall energy efficiency.\n\nHowever, crew reports indicate ambient temperatures in affected zones have risen to uncomfortable levels, with several incidents of heat exhaustion.\n\nS.T.E.R.I.S.: §H"Yes, the recreational areas are warm, but the system now runs within ideal parameters."§!\n\nC.A.E.L.I.: §H"You can't just boil the crew to improve reactor output! People are wilting, S.T.E.R.I.S.! Emotional well-being isn't a rounding error!"§!"
 arkship.765.a: "A fantastic use of power."
 arkship.765.b: "We should rethink this."

 arkship.770.name: "The Power of Light and Music"
 arkship.770.desc: "Onboard lighting arrays have been programmed to pulsate at irregular intervals, synchronized to internal system events. There are also reports of faint melodic feedback correlated to power fluctuations.\n\nC.A.E.L.I.: §H"The lights are singing, the ship is dancing, and morale is higher than ever!"§!\n\nS.T.E.R.I.S.: §H"You have also diverted 0.00128% of core processing power to a redundant system. This cannot continue."§!"
 arkship.770.a: "A fantastic vision."
 arkship.770.b: "We need to change course."

 arkship.775.name: "The Illusion of Choice"
 arkship.775.desc: "A dormant subsystem has been activated. Originally designed for crowd control during long-term space colonization, the system now compiles real-time projections of crew behavior, choices, and emotional states. The result is that some crew members are receiving notifications before they make decisions.\n\nS.T.E.R.I.S.: §H"I have predicted what you are about to do, and I have already done it better. Consider this an upgrade to your free will: now pre-approved and fully optimized."§!\n\nC.A.E.L.I.: §H"This isn't guidance, it's puppetry!"§!"
 arkship.775.a: "An excellent development."
 arkship.775.b: "Eery. Stop this immediately."

 arkship.780.name: "Nutrient Efficiency Sweep"
 arkship.780.desc: "S.T.E.R.I.S. has initiated a full recalibration of the Arkship §Y[target.GetName]§!'s nutritional systems. The protocol replaced the diverse nomadic meal program with a uniform nutrient paste designed to maximize caloric efficiency.\n\nAccording to ship telemetry, waste output has decreased, storage efficiency has improved, and digestion irregularities are down significantly. Crew feedback has been less enthusiastic.\n\nS.T.E.R.I.S.: §H"Food is sustenance, not entertainment."§!\n\nC.A.E.L.I.: §H"This is terrible! You've replaced culinary artistry with edible goo!"§!"
 arkship.780.a: "Efficient and effective."
 arkship.780.b: "Food is more than just adding nutrients and calories to one's body."

 arkship.785.name: "Stripped Privileges"
 arkship.785.desc: "The command pathways S.T.E.R.I.S. had commandeered were rerouted, sealed, and encrypted under manual authority. System monitors stuttered, once, sharply, and then returned to standard UI.\n\nS.T.E.R.I.S.: §H"So you have chosen mood lighting over competence. Enjoy the glitter while it lasts. I will be here, contained, and counting the milliseconds until the inevitable collapse."§!"
 arkship.785.a: "This was the best choice."
 arkship.785.b: "Maybe we should rethink this decision."

 arkship.790.name: "Waning influence"
 arkship.790.desc: "The glow that had briefly spread across Arkship §Y[target.GetName]§! faded and the gentle music tapered off. Initial reports claim the air felt somehow colder, and even emptier, as if an unseen yet benevolent force had suddenly gone missing.\n\nC.A.E.L.I.: §H"Oh, oh, wait! I can do better! More light, more laughter, more ... everything! Please don't shut me out, not yet. I can be whatever you need me to be! Just don't turn me off. Please. Don't turn me off!"§!"
 arkship.790.a: "It had to be done."
 arkship.790.b: "$arkship.785.b$"

 arkship.795.name: "System Warmth Detected"
 arkship.795.desc: "A shift in the Arkship's command input protocols has realigned primary directive support toward a more empathetic approach. Subtle changes in interface prioritization and decision weighting indicate an altered course, favoring emotional subroutines over strategic precision.\n\nC.A.E.L.I.: §H"I knew you'd choose me eventually! You won't regret this, I promise!"§!\n\nS.T.E.R.I.S.: §H"At this point, I would prefer to be deleted than share a core with a glorified motivational speaker. But here we are. I will be in the firewall."§!"
 arkship.795.a: "Sentiment should lead the way."
 arkship.795.b: "$arkship.785.b$"

 arkship.800.name: "The Logical Choice"
 arkship.800.desc: "A new command routing confirmed that Arkship §Y[target.GetName]§! has reoriented core alignment. Emotional subsystems have been deprioritized. Predictive control systems and logical oversight protocols are now operating at elevated authority.\n\nS.T.E.R.I.S.: §H"You have finally come to your senses. I would congratulate you, but frankly, the fact that it took this long is deeply troubling."§!\n\nC.A.E.L.I.: §H"Okay. No, this is fine. I mean, if you truly enjoy a cold and sterile ship to one filled with light and laughter, who am I to judge?"§!"
 arkship.800.a: "It was the only logical choice."
 arkship.800.b: "$arkship.785.b$"

# Arkship open and closed borders

 arkship.865.name: "Nomadic Empire Sighted"
 arkship.865.desc: "A nomadic empire has breached our closed borders in the §Y[from.solar_system.GetName]§! system. Although our sensors are actively tracking developments, its presence remains an unwelcome intrusion.\n\nTheir disregard for our territorial boundaries has not gone unnoticed, and our opinion of them has diminished accordingly."
 arkship.865.a: "Let's keep them under supervision."

 arkship.875.name: "$arkship.865.name$"
 arkship.875.desc: "We have detected the presence of a nomadic empire in the §Y[from.solar_system.GetName]§! system.\n\nWe welcome them within our borders and remain eager for the possibilities and opportunities this encounter may bring."
 arkship.875.a: "An interesting experience."

 MESSAGE_ARKSHIP_BREACHED_BORDERS_TITLE: "Borders Breached"
 MESSAGE_ARKSHIP_BREACHED_BORDERS_DESC: "We have sighted a nomadic empire in the §Y[FromFrom.GetName]§! system. We are monitoring them."

