 CONTRACT_SUNTRIP_passenger_1_PROJECT_DESC: ""

 contract_suntrip_passenger_2: "Stellar Observatory"
 contract_suntrip_passenger_2_desc: "Amateur astronomers among the passengers have spotted rare solar activity in this system and are petitioning for a front-row viewing from orbit."
 contract_suntrip_passenger_2_lore_issued: "§L"I brought seven lenses and I still cannot figure out which end of the telescope to look through."§!"
 contract_suntrip_passenger_2_lore_completed: "§L"When the flare lit up the entire observation deck, nobody spoke for a full minute. I have already reserved my spot for next time!"§!"
 contract_suntrip_passenger_2_lore_failed: "§L"They said the show was cancelled due to 'stellar inactivity.' The star is right there!"§!"
 contract_suntrip_passenger_2_chain_title: "$contract_suntrip_passenger_2$"
 contract_suntrip_passenger_2_chain_desc: "$contract_suntrip_passenger_2_desc$"
 CONTRACT_SUNTRIP_passenger_2_PROJECT: "$contract_suntrip_passenger_2$"
 CONTRACT_SUNTRIP_passenger_2_PROJECT_DESC: ""

 contract_suntrip_passenger_3: "Sunside Regatta"
 contract_suntrip_passenger_3_desc: "The cruise is hosting a shuttle race around this system's star. Passengers are placing bets and crowding every viewport."
 contract_suntrip_passenger_3_lore_issued: "§L"I put everything on Shuttle Seven. It has flames painted on the hull, so it has to be fast."§!"
 contract_suntrip_passenger_3_lore_completed: "§L"Shuttle Three won by a nose. I lost my bet but gained a new favorite sport."§!"
 contract_suntrip_passenger_3_lore_failed: "§L"The race was called off. Something about 'solar wind advisories.' We were promised flames!"§!"
 contract_suntrip_passenger_3_chain_title: "$contract_suntrip_passenger_3$"
 contract_suntrip_passenger_3_chain_desc: "$contract_suntrip_passenger_3_desc$"
 CONTRACT_SUNTRIP_passenger_3_PROJECT: "$contract_suntrip_passenger_3$"
 CONTRACT_SUNTRIP_passenger_3_PROJECT_DESC: ""

 contract_suntrip_passenger_4: "Solar Spa Retreat"
 contract_suntrip_passenger_4_desc: "The spa requires prolonged exposure to unfiltered stellar radiation for an exotic rejuvenation treatment the passengers have been requesting."
 contract_suntrip_passenger_4_lore_issued: "§L"They say the radiation tightens your membranes by three percent. I do not know what that means but sign me up."§!"
 contract_suntrip_passenger_4_lore_completed: "§L"I feel ten years younger. Or maybe that is the mild radiation sickness. Either way, worth it."§!"
 contract_suntrip_passenger_4_lore_failed: "§L"No spa treatment. They handed out scented towels instead. Scented. Towels."§!"
 contract_suntrip_passenger_4_chain_title: "$contract_suntrip_passenger_4$"
 contract_suntrip_passenger_4_chain_desc: "$contract_suntrip_passenger_4_desc$"
 CONTRACT_SUNTRIP_passenger_4_PROJECT: "$contract_suntrip_passenger_4$"
 CONTRACT_SUNTRIP_passenger_4_PROJECT_DESC: ""

 contract_suntrip_passenger_5: "Starlight Gala"
 contract_suntrip_passenger_5_desc: "A grand formal ball is to be held on the observation decks, bathed in direct starlight. The social event of the voyage."
 contract_suntrip_passenger_5_lore_issued: "§L"They are opening the panoramic viewport for this one. Finally, a reason to dig out the formal attire."§!"
 contract_suntrip_passenger_5_lore_completed: "§L"I danced under the light of an alien sun. Nothing on this ship will ever top that."§!"
 contract_suntrip_passenger_5_lore_failed: "§L"The gala was postponed. I ironed my formal sash for nothing."§!"
 contract_suntrip_passenger_5_chain_title: "$contract_suntrip_passenger_5$"
 contract_suntrip_passenger_5_chain_desc: "$contract_suntrip_passenger_5_desc$"
 CONTRACT_SUNTRIP_passenger_5_PROJECT: "$contract_suntrip_passenger_5$"
 CONTRACT_SUNTRIP_passenger_5_PROJECT_DESC: ""

 contract_shoreleave_passenger_1: "Port of Call"
 contract_shoreleave_passenger_1_desc: "The passengers are eager to set foot on solid ground and explore the alien city below. We've arranged guided excursions into the city."
 contract_shoreleave_passenger_1_lore_issued: "§L"How do they keep the atmosphere in without walls? This seems unsafe."§!"
 contract_shoreleave_passenger_1_lore_completed: "§L"I bought a souvenir. I don't know what it is. I love it."§!"
 contract_shoreleave_passenger_1_lore_failed: "§L"The city was right there. RIGHT THERE."§!"
 contract_shoreleave_passenger_1_chain_title: "$contract_shoreleave_passenger_1$"
 contract_shoreleave_passenger_1_chain_desc: "$contract_shoreleave_passenger_1_desc$"
 CONTRACT_SHORELEAVE_passenger_1_PROJECT: "$contract_shoreleave_passenger_1$"
 CONTRACT_SHORELEAVE_passenger_1_PROJECT_DESC: ""

 contract_shoreleave_passenger_2: "Local Flavors"
 contract_shoreleave_passenger_2_desc: "The renowned dining districts on the planet below have agreed to host the passengers for a guided tasting tour of local cuisine."
 contract_shoreleave_passenger_2_lore_issued: "§L"They say the street vendors serve something that moves on the plate. I need to see this."§!"
 contract_shoreleave_passenger_2_lore_completed: "§L"I ate something I cannot pronounce, and now it is all I think about. When do we go back?"§!"
 contract_shoreleave_passenger_2_lore_failed: "§L"They cancelled the food tour. I have been looking forward to this since last cycle."§!"
 contract_shoreleave_passenger_2_chain_title: "$contract_shoreleave_passenger_2$"
 contract_shoreleave_passenger_2_chain_desc: "$contract_shoreleave_passenger_2_desc$"
 CONTRACT_SHORELEAVE_passenger_2_PROJECT: "$contract_shoreleave_passenger_2$"
 CONTRACT_SHORELEAVE_passenger_2_PROJECT_DESC: ""

 contract_shoreleave_passenger_3: "Cultural Excursion"
 contract_shoreleave_passenger_3_desc: "The planet's capital hosts a museum of galactic renown. Passengers have been petitioning for a guided tour of its monuments and historical exhibits."
 contract_shoreleave_passenger_3_lore_issued: "§L"I read the travel guide three times. I still do not understand their calendar, but the architecture looks stunning."§!"
 contract_shoreleave_passenger_3_lore_completed: "§L"Their war memorial was sobering. Their art gallery was baffling. I loved every moment."§!"
 contract_shoreleave_passenger_3_lore_failed: "§L"I read the travel guide so many times that I feel like I have already been. Maybe that is worse."§!"
 contract_shoreleave_passenger_3_chain_title: "$contract_shoreleave_passenger_3$"
 contract_shoreleave_passenger_3_chain_desc: "$contract_shoreleave_passenger_3_desc$"
 CONTRACT_SHORELEAVE_passenger_3_PROJECT: "$contract_shoreleave_passenger_3$"
 CONTRACT_SHORELEAVE_passenger_3_PROJECT_DESC: ""

 contract_shoreleave_passenger_4: "Bazaar Day"
 contract_shoreleave_passenger_4_desc: "A sprawling open-air market on the surface deals in goods from across the sector. The passengers are eager to browse and haggle."
 contract_shoreleave_passenger_4_lore_issued: "§L"I brought three bags and a strict budget. I will need six bags and no budget."§!"
 contract_shoreleave_passenger_4_lore_completed: "§L"I haggled for twenty minutes over a trinket I did not need. Best purchase of my life."§!"
 contract_shoreleave_passenger_4_lore_failed: "§L"The market was calling to me. This is unforgivable."§!"
 contract_shoreleave_passenger_4_chain_title: "$contract_shoreleave_passenger_4$"
 contract_shoreleave_passenger_4_chain_desc: "$contract_shoreleave_passenger_4_desc$"
 CONTRACT_SHORELEAVE_passenger_4_PROJECT: "$contract_shoreleave_passenger_4$"
 CONTRACT_SHORELEAVE_passenger_4_PROJECT_DESC: ""

 contract_shoreleave_passenger_5: "Wildlife Encounter"
 contract_shoreleave_passenger_5_desc: "A nature reserve on the planet below offers guided tours through its alien wilderness. Passengers will observe alien fauna from guided walkways."
 contract_shoreleave_passenger_5_lore_issued: "§L"I packed three recording devices. If it has more than four legs, I want it from every angle."§!"
 contract_shoreleave_passenger_5_lore_completed: "§L"One of them sniffed me. Or scanned me. Or proposed. I do not care, it was magical."§!"
 contract_shoreleave_passenger_5_lore_failed: "§L"No wildlife tour. I suppose I will go stare at the fish tank on Deck Nine. Again."§!"
 contract_shoreleave_passenger_5_chain_title: "$contract_shoreleave_passenger_5$"
 contract_shoreleave_passenger_5_chain_desc: "$contract_shoreleave_passenger_5_desc$"
 CONTRACT_SHORELEAVE_passenger_5_PROJECT: "$contract_shoreleave_passenger_5$"
 CONTRACT_SHORELEAVE_passenger_5_PROJECT_DESC: ""

 contract_espionage_support_passenger_1: "Espionage Theater"
 contract_espionage_support_passenger_1_desc: "To entertain the passengers, we'll deploy a non-functional "spy satellite" in the indicated system."
 contract_espionage_support_passenger_1_lore_issued: "§L"Please tell me there will be a chase sequence!"§!"
 contract_espionage_support_passenger_1_lore_completed: "§L"I intercepted three encrypted transmissions myself. Well, the screen said I did."§!"
 contract_espionage_support_passenger_1_lore_failed: "§L"So was the spy satellite supposed to do something or was that the whole show?"§!"
 contract_espionage_support_passenger_1_chain_title: "$contract_espionage_support_passenger_1$"
 contract_espionage_support_passenger_1_chain_desc: "$contract_espionage_support_passenger_1_desc$"
 CONTRACT_ESPIONAGE_SUPPORT_passenger_1_PROJECT: "$contract_espionage_support_passenger_1$"
 CONTRACT_ESPIONAGE_SUPPORT_passenger_1_PROJECT_DESC: ""

 contract_espionage_support_passenger_2: "The Informant"
 contract_espionage_support_passenger_2_desc: "[GetEspionageSupportPassenger2]"
 contract_espionage_support_passenger_issuer_2_desc: "[GetEspionageSupportPassengerIssuer2]"
 contract_espionage_support_passenger_2_regular_desc: "We are staging a ship-wide intelligence operation. Crew volunteers will be planted across all decks as 'defectors' feeding classified briefings to passenger cells."
 contract_espionage_support_passenger_2_gestalt_desc: "Drones across every deck will adopt defector personas from the planet below, delivering parallel clandestine briefings to different passenger groups in perfect coordination."

 contract_espionage_support_passenger_2_lore_issued: "§L"My briefing officer slid me a coded note under the dining table. My table-mates are so jealous."§!"
 contract_espionage_support_passenger_2_lore_completed: "§L"I was told I helped topple a shadow network. I know it was fake. I am still proud."§!"
 contract_espionage_support_passenger_2_lore_failed: "§L"The informant never showed. I sat in the designated booth for three hours nursing the same drink."§!"
 contract_espionage_support_passenger_2_chain_title: "$contract_espionage_support_passenger_2$"
 contract_espionage_support_passenger_2_chain_desc: "$contract_espionage_support_passenger_2_desc$"
 CONTRACT_ESPIONAGE_SUPPORT_passenger_2_PROJECT: "$contract_espionage_support_passenger_2$"
 CONTRACT_ESPIONAGE_SUPPORT_passenger_2_PROJECT_DESC: ""

 contract_espionage_support_passenger_3: "Dead Drop"
 contract_espionage_support_passenger_3_desc: "Passengers are taken on guided excursions to the city below, where crew operatives have planted fake intelligence packages at prearranged locations for them to discover."
 contract_espionage_support_passenger_3_lore_issued: "§L"They gave us dossiers and codenames. Mine is 'Dawnbreaker.' I have never felt more alive."§!"
 contract_espionage_support_passenger_3_lore_completed: "§L"I found the package behind an alien statue. My group cheered. The locals looked very confused."§!"
 contract_espionage_support_passenger_3_lore_failed: "§L"No dead drop, no codename, no mission. Just another cycle staring at the same corridors."§!"
 contract_espionage_support_passenger_3_chain_title: "$contract_espionage_support_passenger_3$"
 contract_espionage_support_passenger_3_chain_desc: "$contract_espionage_support_passenger_3_desc$"
 CONTRACT_ESPIONAGE_SUPPORT_passenger_3_PROJECT: "$contract_espionage_support_passenger_3$"
 CONTRACT_ESPIONAGE_SUPPORT_passenger_3_PROJECT_DESC: ""

 contract_espionage_support_passenger_4: "The Mole Hunt"
 contract_espionage_support_passenger_4_desc: "A staged security breach has been announced across all decks. Passengers are recruited to identify planted 'foreign agents' among the crew in a ship-wide investigation game."
 contract_espionage_support_passenger_4_lore_issued: "§L"They told us someone on this deck is a spy. I have already drawn up a list of suspects."§!"
 contract_espionage_support_passenger_4_lore_completed: "§L"I caught the mole. Well, so did thousands of other passengers. But I caught them first!"§!"
 contract_espionage_support_passenger_4_lore_failed: "§L"The mole hunt was called off before I could present my evidence. I had a chart and everything."§!"
 contract_espionage_support_passenger_4_chain_title: "$contract_espionage_support_passenger_4$"
 contract_espionage_support_passenger_4_chain_desc: "$contract_espionage_support_passenger_4_desc$"
 CONTRACT_ESPIONAGE_SUPPORT_passenger_4_PROJECT: "$contract_espionage_support_passenger_4$"
 CONTRACT_ESPIONAGE_SUPPORT_passenger_4_PROJECT_DESC: ""

 contract_espionage_support_passenger_5: "Signal Intercept"
 contract_espionage_support_passenger_5_desc: "The observation decks have been converted into listening posts. Passengers man the stations, decoding scripted alien transmissions that the crew is secretly broadcasting from below decks."
 contract_espionage_support_passenger_5_lore_issued: "§L"They handed me a headset and told me the galaxy depends on what I hear next. I believe them."§!"
 contract_espionage_support_passenger_5_lore_completed: "§L"They told us the transmissions were scripted. Then why did the crew look so nervous when I decoded the last one?"§!"
 contract_espionage_support_passenger_5_lore_failed: "§L"The listening post went silent before my shift. I never even got to wear the headset."§!"
 contract_espionage_support_passenger_5_chain_title: "$contract_espionage_support_passenger_5$"
 contract_espionage_support_passenger_5_chain_desc: "$contract_espionage_support_passenger_5_desc$"
