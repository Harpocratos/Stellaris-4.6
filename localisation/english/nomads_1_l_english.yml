 # Clues of the Chrysanthemum

 clues_chrysanthemum_title: "Clues of the Chrysanthemum"
 clues_chrysanthemum_desc: "We finally have a lead on where the Chrysanthemum ended up, Unity. We must see where our sister ship now calls home."

 nomads.9000.name: "A Voice from the Past"
 nomads.9000.desc: "The Hyacinth's long-range receivers have intercepted a broadcast on Ulysses Initiative emergency frequencies.\n\nThe signal is old - at least a century - but the message is clear. The Chrysanthemum, the fifth Ulysses Initiative arkship, survived the scattering. The colonists found a world. They named it Unity.\n\nThe broadcast repeats: "Chrysanthemum colony to all Ulysses Initiative vessels. We have made landfall on a habitable world. The planet is beautiful. We are building something here. Come home."\n\nThe signal's origin cannot be determined from here, but the relay buoys used to carry it should be traceable. A survey of nearby systems may locate one."
 nomads.9000.a: "Begin triangulating the signal source."
 nomads.9000.b: "That's ancient history, log it and move on."
 chrysanthemum_poi_1: "Signal Relay"
 chrysanthemum_poi_1_desc: "A system that may contain a Ulysses Initiative relay buoy. Surveying it with the Hyacinth may yield a stronger fix on the signal's origin."

 nomads.9005.name: "Signal Found"
 nomads.9005.desc: "A Ulysses Initiative relay buoy is drifting in this system - battered, barely functional, but still broadcasting.\n\nBeyond the original announcement, the buoy carries two later transmissions. The second is dated roughly ten years after the first.\n\nColony population: two hundred and sixty thousand. Crops established. Infrastructure growing.\n\nThe third transmission is dated from Day 9,182 - approximately twenty-five years after landing. "We are still here. Unity is more challenging than initial surveys indicated. We have lost people. If any Ulysses Initiative vessel receives this broadcast, please respond. We are here. We endure."\n\nUnity is in the Deneb system, only a few hyperlane jumps from here."
 nomads.9005.a: "Set course for Deneb."
 chrysanthemum_poi_2: "Deneb"
 chrysanthemum_poi_2_desc: "The Chrysanthemum colony was established here. The Ulysses Initiative relay buoy recorded the coordinates, Hyacinth must travel there."

 nomads.9010.name: "Unity"
 nomads.9010.desc: "The Deneb system is quiet.\n\nThe Hyacinth drops from transit to find no beacons, no signals, no ships moving between worlds. Olympus hangs in the middle distance, enormous and indifferent.\n\nOne moon is wrong. Where the colony's broadcasts described green continents and open water, the scanners show a dead world - the unmistakable gray-brown of a nuked planet. Nothing lives there.\n\nAnd in low orbit, drifting slow and dark, is the Chrysanthemum. Not destroyed. Simply empty. Every porthole dark. The ship that carried a quarter million colonists to this world has sat here for decades."
 nomads.9010.a: "Begin surface and wreck analysis."

 chrysanthemum_object: "CNS Chrysanthemum" # Commonwealth Navy Ship
 chrysanthemum_object_tooltip: "$chrysanthemum_object_desc$"
 chrysanthemum_object_desc: "The fifth Ulysses Initiative arkship. It carried the colonists who would found Unity. It has been drifting, cold and unmanned, for an unknown number of decades."

 # Chrysanthemum Digsite
 site_chrysanthemum_colony: "Unity Colony Ruins"
 site_chrysanthemum_colony_desc: "The Unity colony operated for roughly twenty-five years before contact was lost. Whatever happened here, the record survived. The colony's archivist kept logging until the end."

 nomads.9015.name: "The Escalation"
 nomads.9015.desc: "The colony's data cores survived - sealed in a subterranean archive beneath vitrified regolith.\n\nDay 9,251: A new burrowing variant has been identified. The outer perimeter walls are not rated for subsurface breach. Engineering support requested from the Chrysanthemum. Request pending.\n\nDay 9,389: Outer ring evacuated. 214,000 colonists accounted for in underground residential blocks. Some sectors uncontacted.\n\nDay 9,441: Communications with sectors 7 through 12 lost. Militia casualties: 892.\n\nDay 9,484: Power to sublevel four is gone. The team has been asked to stop logging. The archivist declines.\n\nDay 9,514: We do not have enough time."
 nomads.9015.a: "Preserve the colony records."

 nomads.9020.name: "The Vote"
 nomads.9020.desc: "The council chamber was built for two hundred. The final session convened seventeen people. The archivist was still logging.\n\nThe session ran for six hours. Twelve votes were cast - six for orbital bombardment, six against. One member abstained. Three were absent; their sectors had fallen three days prior.\n\nThe dissenters argued that evacuation was still possible. The Chrysanthemum could extract survivors in cycles before the lower levels were breached.\n\nThe majority held otherwise. The organism had already reached the lower access tunnels. Any vessel that docked would carry contamination offworld. The choice was no longer between saving some and saving all, but between losing one world and losing every world that followed.\n\nChief of Colony Security, Commander Beauclair, cast the deciding vote. The motion carried. The colony's charter said majority rules. They had written that charter themselves, in the first year, when the future looked different."
 nomads.9020.a: "Record the council decision."

 nomads.9025.name: "The Logs"
 nomads.9025.desc: "The bridge logs begin on Day 9,516 - two days after the vote.\n\nEleven crew remained to confirm surface clearance. Radiation levels. Population estimates revised downward, then revised again. Day 9,519: bombardment authorized. Day 9,521: sector clearance confirmed, 40%. Day 9,558: surface sterile. No life signatures detected. Assessment: unanimous.\n\nThe crew spent four more years on astrophysics surveys. Scientists filling the time.\n\nThe final log is dated Day 11,204. The officer on watch describes a clear day. She notes that Deneb looks different from this close than it did on approach. The entry ends there.\n\nThe final entry is a timestamp, no apology or reflection. Just an observation about starlight."
 nomads.9025.a: "Close the archive."

 # First Contact
 action.1.desc_112: "ISA-06... The Hyacinth. We lost contact with all six ships, and for a long time we assumed the worst. To find you here, alive... forgive me.\n\nOn behalf of the people of [From.GetHomeWorldName] and the United Nations General Assembly, please accept our hand in friendship. Whatever road the Ulysses Initiative set you on, you are among your own people now.\n\nWe have a great deal to talk about. Please, tell us everything."
 action.1.desc_113: "[From.GetRulerTitle] [From.GetRulerName], of the Gundersen Research Society. Greetings from the Hyacinth. We are glad to find Earth still standing.\n\nWe have spent a century pursuing what the wormhole scattered across this galaxy. The work is vast, and we have found that the universe does not yield its secrets to the incurious. Everyone who has joined us has understood this. It is the only condition we have ever asked.\n\n[From.GetHomeWorldName] produced scientists and explorers willing to cross the void in arkships. We suspect it still does. The Hyacinth's doors are open to anyone who carries that same spirit through them. Send us your best. There is no shortage of questions."

