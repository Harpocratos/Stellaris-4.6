 contract_suntrip_crew_4: "Sensor Calibration"
 contract_suntrip_crew_4_desc: "Navigation arrays must be calibrated against a live stellar signature at close range. The process will commandeer bandwidth from entertainment systems."
 contract_suntrip_crew_4_lore_issued: "[GetSuntripCrewLoreIssued4]"
 contract_suntrip_crew_4_regular_lore_issued: "§L"Rerouting entertainment bandwidth to the sensor grid. Expect passenger complaints in three, two, one..."§!"
 contract_suntrip_crew_4_gestalt_lore_issued: "§L"Rerouting entertainment bandwidth to the sensor grid. Passenger dissatisfaction anticipated and accepted."§!"
 contract_suntrip_crew_4_lore_completed: "§L"Calibration locked. Navigation accuracy is back within acceptable margins."§!"
 contract_suntrip_crew_4_lore_failed: "[GetSuntripCrewLoreFailed4]"
 contract_suntrip_crew_4_regular_lore_failed: "§L"Calibration incomplete. The nav data is still fuzzy, but at least the holoscreens are back on."§!"
 contract_suntrip_crew_4_gestalt_lore_failed: "§L"Calibration incomplete. Navigation data degraded. Entertainment bandwidth restored to passengers."§!"
 contract_suntrip_crew_4_chain_title: "$contract_suntrip_crew_4$"
 contract_suntrip_crew_4_chain_desc: "$contract_suntrip_crew_4_desc$"
 CONTRACT_SUNTRIP_crew_4_PROJECT: "$contract_suntrip_crew_4$"
 CONTRACT_SUNTRIP_crew_4_PROJECT_DESC: ""

 contract_suntrip_crew_5: "Water Reclamation Cycle"
 contract_suntrip_crew_5_desc: "The water recyclers need an intensive UV sterilization run that is only efficient in close stellar orbit. The spa and pool are closed and water is rationed across all decks."
 contract_suntrip_crew_5_lore_issued: "[GetSuntripCrewLoreIssued5]"
 contract_suntrip_crew_5_regular_lore_issued: "§L"Draining the pool and the spa now. If the passengers ask, it is a deep-cleaning day. We do not mention the bacteria readings."§!"
 contract_suntrip_crew_5_gestalt_lore_issued: "§L"Draining the pool and spa. Passengers have been informed it is a routine deep-cleaning day. Bacterial readings withheld."§!"
 contract_suntrip_crew_5_lore_completed: "[GetSuntripCrewLoreCompleted5]"
 contract_suntrip_crew_5_regular_lore_completed: "§L"Reclamation tanks clear. Water is flowing clean again. Refilling the pool before anyone else files a formal grievance."§!"
 contract_suntrip_crew_5_gestalt_lore_completed: "§L"Reclamation tanks clear. Water quality nominal. Pool and spa refill in progress."§!"
 contract_suntrip_crew_5_lore_failed: "[GetSuntripCrewLoreFailed5]"
 contract_suntrip_crew_5_regular_lore_failed: "§L"Sterilization incomplete. The water is... acceptable. Just keep the spa closed for another day."§!"
 contract_suntrip_crew_5_gestalt_lore_failed: "§L"Sterilization incomplete. Water quality marginal. Spa closure extended by one cycle."§!"
 contract_suntrip_crew_5_chain_title: "$contract_suntrip_crew_5$"
 contract_suntrip_crew_5_chain_desc: "$contract_suntrip_crew_5_desc$"
 CONTRACT_SUNTRIP_crew_5_PROJECT: "$contract_suntrip_crew_5$"
 CONTRACT_SUNTRIP_crew_5_PROJECT_DESC: ""

 contract_shoreleave_crew_1: "Shore Leave"
 contract_shoreleave_crew_1_desc: "[GetShoreleaveCrewDesc1]"
 contract_shoreleave_crew_1_regular_desc: "The crew needs a break. We'll make port and and give the crew time to walk ground they didn't build and see faces they don't already know."
 contract_shoreleave_crew_1_gestalt_desc: "Prolonged confinement is degrading drone adaptability. Cycling them through the settlement below, across unfamiliar terrain and conditions, will restore performance."
 contract_shoreleave_crew_1_lore_issued: "[GetShoreleaveCrewLoreIssued1]"
 contract_shoreleave_crew_1_regular_lore_issued: "§L"New ground, new faces, and no duty roster. What more could you want?"§!"
 contract_shoreleave_crew_1_gestalt_lore_issued: "§L"Drones deploying to the surface. New terrain, new stimuli, new data. The ship cannot provide what unfamiliar ground can."§!"
 contract_shoreleave_crew_1_lore_completed: "[GetShoreleaveCrewLoreCompleted1]"
 contract_shoreleave_crew_1_regular_lore_completed: "§L"The gravity was wrong and the food was strange. I can't wait to go back!"§!"
 contract_shoreleave_crew_1_gestalt_lore_completed: "§L"Drones returned recalibrated. Foreign terrain has restored pathways that the ship's corridors had dulled."§!"
 contract_shoreleave_crew_1_lore_failed: "[GetShoreleaveCrewLoreFailed1]"
 contract_shoreleave_crew_1_regular_lore_failed: "§L"Shore leave cancelled. The ship hums the same as always. It used to be comforting."§!"
 contract_shoreleave_crew_1_gestalt_lore_failed: "§L"Shore deployment cancelled. Drones will continue operating on outdated awareness. Performance degradation remains within acceptable margins."§!"
 contract_shoreleave_crew_1_chain_title: "$contract_shoreleave_crew_1$"
 contract_shoreleave_crew_1_chain_desc: "$contract_shoreleave_crew_1_desc$"
 CONTRACT_SHORELEAVE_crew_1_PROJECT: "$contract_shoreleave_crew_1$"
 CONTRACT_SHORELEAVE_crew_1_PROJECT_DESC: ""

 contract_shoreleave_crew_2: "Lucky Break"
 contract_shoreleave_crew_2_desc: "[GetShoreleaveCrewDesc2]"
 contract_shoreleave_crew_2_regular_desc: "The local entertainment district is open for business. Crew shifts are rotating planetside to try their luck at game halls and spectator arenas."
 contract_shoreleave_crew_2_gestalt_desc: "The settlement's entertainment district offers unfamiliar stimuli. Drones are cycling through the crowds, the games, the spectacle, collecting data to update the ship's own recreational programming."
 contract_shoreleave_crew_2_lore_issued: "[GetShoreleaveCrewLoreIssued2]"
 contract_shoreleave_crew_2_regular_lore_issued: "§L"I have been saving my shift wages for six cycles. Tonight, they all go on the table."§!"
 contract_shoreleave_crew_2_gestalt_lore_issued: "§L"Drones deploying to the entertainment district. Objective: absorb everything. The crowds, the games, the noise. All of it."§!"
 contract_shoreleave_crew_2_lore_completed: "[GetShoreleaveCrewLoreCompleted2]"
 contract_shoreleave_crew_2_regular_lore_completed: "§L"I lost everything in the first hour and won it all back on the last game. My whole shift carried me out."§!"
 contract_shoreleave_crew_2_gestalt_lore_completed: "§L"Drones returned loaded with new patterns. Onboard recreational systems already updating. The passengers will notice the difference."§!"
 contract_shoreleave_crew_2_lore_failed: "[GetShoreleaveCrewLoreFailed2]"
 contract_shoreleave_crew_2_regular_lore_failed: "§L"No lucky break. Back to the same rec room, the same rigged claw machine, the same prizes nobody wants."§!"
 contract_shoreleave_crew_2_gestalt_lore_failed: "§L"No new data collected. Onboard entertainment continues running the same patterns. The passengers grow restless."§!"
 contract_shoreleave_crew_2_chain_title: "$contract_shoreleave_crew_2$"
 contract_shoreleave_crew_2_chain_desc: "$contract_shoreleave_crew_2_desc$"
 CONTRACT_SHORELEAVE_crew_2_PROJECT: "$contract_shoreleave_crew_2$"
 CONTRACT_SHORELEAVE_crew_2_PROJECT_DESC: ""

 contract_shoreleave_crew_3: "Supply Run"
 contract_shoreleave_crew_3_desc: "Stores are running low. Crew teams will go planetside to source replacement parts, raw materials, and the supplies the ship's fabricators stopped producing cycles ago."
 contract_shoreleave_crew_3_lore_issued: "[GetShoreleaveCrewLoreIssued3]"
 contract_shoreleave_crew_3_regular_lore_issued: "§L"Half the requisition list is spare parts. The other half is snacks we have not had since the last port."§!"
 contract_shoreleave_crew_3_machine_lore_issued: "§L"Half the requisition list is structural components. The other half is chassis lubricant we depleted three cycles ago."§!"
 contract_shoreleave_crew_3_lore_completed: "[GetShoreleaveCrewLoreCompleted3]"
 contract_shoreleave_crew_3_regular_lore_completed: "§L"We came for capacitors and left with crates of unidentified confectionery. Mission accomplished."§!"
 contract_shoreleave_crew_3_machine_lore_completed: "§L"We requisitioned capacitors and returned with surplus processing cores. Efficiency gain: unexpected but advantageous."§!"
 contract_shoreleave_crew_3_lore_failed: "§L"Supply run scrubbed. Those capacitors will have to last another cycle."§!"
 contract_shoreleave_crew_3_chain_title: "$contract_shoreleave_crew_3$"
 contract_shoreleave_crew_3_chain_desc: "$contract_shoreleave_crew_3_desc$"
 CONTRACT_SHORELEAVE_crew_3_PROJECT: "$contract_shoreleave_crew_3$"
 CONTRACT_SHORELEAVE_crew_3_PROJECT_DESC: ""

 contract_shoreleave_crew_4: "Tech Exchange"
 contract_shoreleave_crew_4_desc: "Local engineers have opened their facilities for inspection. Their solutions to common engineering problems diverge significantly from our own models, and the locals are equally eager to study the Arkship."
 contract_shoreleave_crew_4_lore_issued: "[GetShoreleaveCrewLoreIssued4]"
 contract_shoreleave_crew_4_regular_lore_issued: "§L"Their reactor design makes no sense to me. I have to see it in person."§!"
 contract_shoreleave_crew_4_gestalt_lore_issued: "§L"Their reactor design does not match any existing model in our database. Deploying drones to examine it directly."§!"
 contract_shoreleave_crew_4_lore_completed: "[GetShoreleaveCrewLoreCompleted4]"
 contract_shoreleave_crew_4_regular_lore_completed: "§L"Their power grid is a mess by our standards, but it works. I have three pages of notes and a new respect for dirt-side engineering."§!"
 contract_shoreleave_crew_4_gestalt_lore_completed: "§L"Alien engineering approaches catalogued. Several designs flagged for integration. Their methods are crude but surprisingly effective."§!"
 contract_shoreleave_crew_4_lore_failed: "[GetShoreleaveCrewLoreFailed4]"
 contract_shoreleave_crew_4_regular_lore_failed: "§L"No tech exchange. I will just have to keep wondering how they cool their reactors without a stellar heat sink."§!"
 contract_shoreleave_crew_4_gestalt_lore_failed: "§L"No exchange conducted. Alien engineering remains unanalyzed. Their reactor cooling methods will have to wait."§!"
 contract_shoreleave_crew_4_chain_title: "$contract_shoreleave_crew_4$"
 contract_shoreleave_crew_4_chain_desc: "$contract_shoreleave_crew_4_desc$"
 CONTRACT_SHORELEAVE_crew_4_PROJECT: "$contract_shoreleave_crew_4$"
 CONTRACT_SHORELEAVE_crew_4_PROJECT_DESC: ""

 contract_shoreleave_crew_5: "Crew Showcase"
 contract_shoreleave_crew_5_desc: "[GetShoreleaveCrewDesc5]"
 contract_shoreleave_crew_5_regular_desc: "The settlement has opened its amphitheaters, plazas, and public stages to the crew."
 contract_shoreleave_crew_5_gestalt_desc: "The settlement has opened its public venues. Drones will deploy to field-test experimental entertainment routines on the local population before rolling them out for passengers."
 contract_shoreleave_crew_5_lore_issued: "[GetShoreleaveCrewLoreIssued5]"
 contract_shoreleave_crew_5_regular_lore_issued: "§L"I signed up for the comedy slot. My entire shift is coming. If they do not laugh, I will transfer departments."§!"
 contract_shoreleave_crew_5_hive_lore_issued: "§L"Drones are taking every stage in the settlement. Comedy with no punchlines, acrobatics designed to fail. We want to see what makes them laugh and what makes them leave."§!"
 contract_shoreleave_crew_5_machine_lore_issued: "§L"Entertainment subroutines deployed across all settlement venues. Comedy modules: setups without punchlines. Acrobatics modules: dismounts calibrated to fail. Audience monitoring active."§!"
 contract_shoreleave_crew_5_lore_completed: "[GetShoreleaveCrewLoreCompleted5]"
 contract_shoreleave_crew_5_regular_lore_completed: "§L"I told a joke about the coolant pumps and a thousand strangers laughed. Nobody on the ship ever laughs at that one."§!"
 contract_shoreleave_crew_5_gestalt_lore_completed: "§L"Puzzling results. Drones delivered routines with no punchlines and the crowds laughed anyway. The botched acrobatics drew the loudest cheers. We do not fully understand, but the data is dynamic."§!"
 contract_shoreleave_crew_5_lore_failed: "[GetShoreleaveCrewLoreFailed5]"
 contract_shoreleave_crew_5_regular_lore_failed: "§L"Show cancelled. I rehearsed my bit for a month. The coolant pumps will never get the recognition they deserve."§!"
 contract_shoreleave_crew_5_gestalt_lore_failed: "§L"No field test. Our drones stood ready on empty stages across the settlement. The passengers will endure the same tired routines for another cycle."§!"
 contract_shoreleave_crew_5_chain_title: "$contract_shoreleave_crew_5$"
 contract_shoreleave_crew_5_chain_desc: "$contract_shoreleave_crew_5_desc$"
 CONTRACT_SHORELEAVE_crew_5_PROJECT: "$contract_shoreleave_crew_5$"
 CONTRACT_SHORELEAVE_crew_5_PROJECT_DESC: ""

 contract_espionage_support_crew_1: "System Recon"
 contract_espionage_support_crew_1_desc: "Concerns about interference in this system are legitimate. A surveillance satellite will give us advance warning of anything that might disrupt our itinerary."
 contract_espionage_support_crew_1_lore_issued: "§L"We do not know what is out there, and that is exactly the problem. Get the satellite deployed."§!"
 contract_espionage_support_crew_1_lore_completed: "§L"Feeds are live. Nothing moves in this system without us knowing about it first."§!"
 contract_espionage_support_crew_1_lore_failed: "§L"No satellite, no data. We are flying through this system with our eyes shut."§!"
 contract_espionage_support_crew_1_chain_title: "$contract_espionage_support_crew_1$"
 contract_espionage_support_crew_1_chain_desc: "$contract_espionage_support_crew_1_desc$"
 CONTRACT_ESPIONAGE_SUPPORT_crew_1_PROJECT: "$contract_espionage_support_crew_1$"
 CONTRACT_ESPIONAGE_SUPPORT_crew_1_PROJECT_DESC: ""

 contract_espionage_support_crew_2: "Diplomatic Audit"
 contract_espionage_support_crew_2_desc: "Docking privileges and border access can be revoked without warning. A surveillance satellite monitoring government communications will tell us whether this empire's hospitality is genuine or conditional."
 contract_espionage_support_crew_2_lore_issued: "§L"They smile when we dock, but what do they say when our shuttles leave? Time to find out."§!"
 contract_espionage_support_crew_2_lore_completed: "§L"Their diplomatic cables are clean. No motions to revoke access, no tariff proposals. We can plan the next three stops with confidence."§!"
 contract_espionage_support_crew_2_lore_failed: "§L"No audit, no insight. We will just have to trust the smiles. We do not trust the smiles."§!"
 contract_espionage_support_crew_2_chain_title: "$contract_espionage_support_crew_2$"
 contract_espionage_support_crew_2_chain_desc: "$contract_espionage_support_crew_2_desc$"
 CONTRACT_ESPIONAGE_SUPPORT_crew_2_PROJECT: "$contract_espionage_support_crew_2$"
 CONTRACT_ESPIONAGE_SUPPORT_crew_2_PROJECT_DESC: ""

 contract_espionage_support_crew_3: "Route Security"
 contract_espionage_support_crew_3_desc: "Fleet movements, border shifts, and military buildups along our projected route could strand the ship in hostile space. A surveillance satellite will give navigation enough lead time to plot alternatives."
 contract_espionage_support_crew_3_lore_issued: "§L"We are not flying blind into a war zone. Get the satellite deployed before we commit to this route."§!"
 contract_espionage_support_crew_3_lore_completed: "§L"Fleet disposition mapped, patrol schedules logged. Navigation has already plotted two alternate routes. We are not getting boxed in."§!"
 contract_espionage_support_crew_3_lore_failed: "§L"No satellite in place. If someone starts a border war along our route, we will find out when the passengers do."§!"
 contract_espionage_support_crew_3_chain_title: "$contract_espionage_support_crew_3$"
 contract_espionage_support_crew_3_chain_desc: "$contract_espionage_support_crew_3_desc$"
 CONTRACT_ESPIONAGE_SUPPORT_crew_3_PROJECT: "$contract_espionage_support_crew_3$"
 CONTRACT_ESPIONAGE_SUPPORT_crew_3_PROJECT_DESC: ""

 contract_espionage_support_crew_4: "Trade Leverage"
 contract_espionage_support_crew_4_desc: "Supply negotiations go better when procurement knows the real prices. A surveillance satellite monitoring trade channels and resource flows will ensure our teams are not overpaying at the next port."
 contract_espionage_support_crew_4_lore_issued: "§L"Last port charged us triple for reactor coolant. That does not happen when you know their wholesale figures."§!"
 contract_espionage_support_crew_4_lore_completed: "§L"Procurement has the numbers. Next resupply is going to cost half what it did last time."§!"
 contract_espionage_support_crew_4_lore_failed: "§L"No trade data. Procurement will be negotiating blind again. They are already drafting complaints."§!"
 contract_espionage_support_crew_4_chain_title: "$contract_espionage_support_crew_4$"
 contract_espionage_support_crew_4_chain_desc: "$contract_espionage_support_crew_4_desc$"
 CONTRACT_ESPIONAGE_SUPPORT_crew_4_PROJECT: "$contract_espionage_support_crew_4$"
 CONTRACT_ESPIONAGE_SUPPORT_crew_4_PROJECT_DESC: ""

 contract_espionage_support_crew_5: "Threat Assessment"
 contract_espionage_support_crew_5_desc: "Reports of anti-nomad sentiment have surfaced in this region. A surveillance satellite will confirm whether the talk is just rhetoric or whether it is becoming policy."
 contract_espionage_support_crew_5_lore_issued: "§L"There are reports of a nomad exclusion zone forming in this region. We need to know if that is speculation or policy."§!"
 contract_espionage_support_crew_5_lore_completed: "§L"Assessment complete. It was talk, not policy. The crew can stand down, but we will keep the satellite live just in case."§!"
 contract_espionage_support_crew_5_lore_failed: "§L"No assessment. Without data, every warning about this region stands unchallenged."§!"
 contract_espionage_support_crew_5_chain_title: "$contract_espionage_support_crew_5$"
 contract_espionage_support_crew_5_chain_desc: "$contract_espionage_support_crew_5_desc$"
