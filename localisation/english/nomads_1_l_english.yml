 trait_recursive_learners: "Recursive Learners"
 trait_recursive_learners_desc: "Born to the $arkship_cap$, this species refines its knowledge in generational cycles, each cohort improving upon the last to meet their vessel's unique demands."
 trait_structural_awareness: "Structural Awareness"
 trait_structural_awareness_desc: "Designed to live within the $arkship_cap$, these machines continuously map its internal stresses, flows, and routines. Different arkship designs produce different patterns, and they iteratively optimize their behavior to match the vessel they inhabit."
