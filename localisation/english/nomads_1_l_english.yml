 nomads.4715.name: "A Sight to Behold"
 nomads.4715.desc: "One of the greatest rewards for nomadism and our ceaseless wandering is the discovery of new places. Even after a long time traveling, there remain sights unseen, beautiful or mortifying. Spectacles that our curiosity yearns to discover.\n\nBut more than peculiar things for our arkships to behold, each new vista is an opportunity to learn something new, reflect and grow."
 nomads.4715.a: "The galaxy is vast and full of wonders."
 nomads.4715.b: "The galaxy is vast and full of terrors."

