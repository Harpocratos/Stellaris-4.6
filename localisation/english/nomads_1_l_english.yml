 concept_arkship_lithoid_consume_world: "Arkship: Consume World"
 concept_arkship_lithoid_consume_world_desc: "Terravore Arkships can be ordered to orbit a planet and deploy it's swarm consume it.$NEW_LINE$Once initiated, a §HSituation§! tracks consumption progress and the Arkship is locked in orbit until the process is complete. $NEW_LINE$If the Arkship leaves orbit, a §Y180-day§! grace period allows it to return. If it does not return in time, the consumption is abandoned. $DOUBLE_NEW_LINE$While in orbit:$TABBED_NEW_LINE$- £minerals£ §YMinerals§!, £food£ §YFood§!, and £pop£ §YPops§! are periodically extracted $NEW_LINE$On completion: $TABBED_NEW_LINE$- The world is converted into a §YShattered World§!"

 concept_arkship_nanotech_consume_world: "Arkship: Assimilate World"
 concept_arkship_nanotech_consume_world_desc: "Nanite Arkships can be ordered to orbit a planet and assimilate it with nanites.$NEW_LINE$Once initiated, a §HSituation§! tracks assimilation progress and the Arkship is locked in orbit until the process is complete.$NEW_LINE$If the Arkship leaves orbit, a §Y180-day§! grace period allows it to return. If it does not return in time, the process is abandoned. $DOUBLE_NEW_LINE$While in orbit:$TABBED_NEW_LINE$- £nanites£ §YNanites§! are periodically extracted $NEW_LINE$On completion:$TABBED_NEW_LINE$- The world is converted into an Uninhabitable Nanite World"

