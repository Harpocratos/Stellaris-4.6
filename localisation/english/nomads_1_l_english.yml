 wg_nomad_raid_status_quo_effects: "All disabled §Y$waystation_plural$§! owned by §Y[From.GetName]§! are seized and brought under our control."

# The Grand Refurbishment

 situation_grand_refurbishment: "The Grand Refurbishment"
 situation_grand_refurbishment_type: "$situation_grand_refurbishment$"
 situation_grand_refurbishment_paused_desc: "A decision is pending. Refurbishment progress is paused until it is resolved."
 situation_grand_refurbishment_complete.tt: "Arkship §Y[Target.GetName]§! will be significantly improved."
 situation_grand_refurbishment_desc: "The structural framework of Arkship §Y[Target.GetName]§! has been assessed as overdue for comprehensive renovation. Work will continue by section, taking districts offline in sequence and temporarily displacing inhabitants.\n\nHow the project is managed will determine the quality of the outcome."

 approach_refurbishment_standard: "Standard Schedule"
 approach_refurbishment_minimal: "Minimal Allocation"
 approach_refurbishment_intensive: "Full Investment"

 approach_outcome_refurbishment_standard: "A steady pace will see the refurbishment completed in due course.\n\n"
 approach_outcome_refurbishment_minimal: "The project will take longer, but the financial burden will be lighter.\n\n"
 approach_outcome_refurbishment_intensive: "The refurbishment will complete significantly faster, but at considerable cost.\n\n"

 situation_grand_refurbishment_monthly_change_tooltip: "Progress reflects the pace of active construction aboard §Y[Target.GetName]§!."

 stage_refurbishment_generator: "$district_ark_generator$ Overhaul"
 stage_refurbishment_farming: "$district_ark_basic$ Overhaul"
 stage_refurbishment_military: "$district_ark_military$ Overhaul"
 stage_refurbishment_city: "$district_ark_city$ Overhaul"

 arkship.1300.name: "A Necessary Reckoning"
 arkship.1300.desc: "The senior engineering corps aboard Arkship §Y[Root.GetName]§! has submitted a structural assessment that can no longer be deferred. Our home is in critical need of repair.\n\nThe proposal is comprehensive: a rotating section-by-section overhaul, beginning with the power generation infrastructure and working through the cultivation decks, the defense section, and the residential districts in sequence. Residents will need to be temporarily relocated. Facilities will be taken offline. Engineering estimates place the full overhaul at approximately ten to eleven standard years, depending on the pace of work.\n\nThe work will be disruptive. But the alternative is a vessel that grows less reliable with every parsec."
 arkship.1300.desc.machine: "Diagnostic subroutines aboard §Y[Root.GetName]§! have flagged critical thresholds across primary structural subsystems. The Arkship is in critical need of repair.\n\nRemediation protocols mandate a rotating sector-by-sector overhaul. Power generation nodes, cultivation sectors, defense infrastructure, and residential zones will each be taken offline in sequence for comprehensive reconstruction. Operational continuity will be degraded during the process. Estimated completion timeline: approximately one hundred and thirty months at standard operational tempo.\n\nRemediation cannot be deferred."
 arkship.1300.desc.hive: "The collective is aware of deterioration in Arkship §Y[Root.GetName]§!: load-bearing structures flex where they should not; power veins corrode. The accumulated neglect of generations has reached a threshold we can no longer defer.\n\nWe require a comprehensive renewal cycle: section by section, from the power-nodes outward through the feeding chambers, the defensive carapace, and the residential decks in sequence. Sections will be sealed and their inhabitants displaced as the work progresses. The renewal cycle will span ten to eleven standard years."
 arkship.1300.a: "Begin the refurbishment."
 arkship.1300.a.machine: "Initiate remediation protocols."
 arkship.1300.a.hive: "The [Root.GetName] must be rejuvenated."
 refurbishment_ongoing: "Grand Refurbishment: In Progress"
 refurbishment_ongoing_desc: "This arkship is undergoing comprehensive structural renovation. Construction activity across multiple sections is contributing to ship-wide disruption in stability and district build capacity."
 refurbishment_generator_offline: "$district_ark_generator$: Under Renovation"
 refurbishment_generator_offline_desc: ""

 arkship.1305.name: "The Cultivation Decks"
 arkship.1305.desc: "The power generation infrastructure has been certified and brought back to full output. Construction crews are already moving equipment down to the lower agricultural levels.\n\nThe cultivation decks will be taken offline section by section. It is not only a structural challenge but a logistical one: food stores will need careful management, and construction residue will linger in the common areas for months.\n\nThe hardest part, the engineers say, is not the welding. It is the waiting."
 arkship.1305.desc.machine: "Power generation remediation has been certified complete and nominal output restored. Operational scope now transfers to secondary sector infrastructure.\n\nDesignated zones will be taken offline in sequence for structural overhaul. Operational output in the affected sector will decline proportionally during the process.\n\nRemediation continues within projected parameters."
 arkship.1305.desc.hive: "Power generation resumes at full impact.\n\nOur attention shifts inward, to the great feeding chambers that sustain the colony. The cultivation vats and nutrient-cycling organs of the ship must be taken offline in sequence for structural renewal. Food stores have been prepared to buffer the deficit.\n\nThe colony will feed from reserves while its stomach is rebuilt."
 arkship.1305.a: "The disruption is necessary."
 arkship.1305.a.machine: "Continue remediation on schedule."
 arkship.1305.a.hive: "The cycle of renewal continues."
 arkship.1305.a.tt: "Removes any negative effects incurred during the preceding phase of refurbishment.\n\n"
 refurbishment_farming_offline: "$district_ark_basic$: Under Renovation"
 refurbishment_farming_offline_desc: ""

 arkship.1310.name: "The Defense Section"
 arkship.1310.desc: "With the cultivation decks rebuilt and food production returning to normal, attention shifts to the forward defense section. From the weapons bays to maintenance corridors, everything has been surveyed, and all of it needs work.\n\nNaval readiness will be limited during this phase. The crews responsible for keeping the ship safe are being asked to step aside while their workspace is taken apart and put back together.\n\nThey have, by most accounts, been remarkably patient about it."
 arkship.1310.desc.machine: "Secondary sector remediation is complete. Sector output is returning to operational baselines. Remediation scope now shifts to forward defense infrastructure.\n\nWeapons bays, maintenance networks, and security sector facilities will be taken offline in sequence. Naval readiness metrics will decline during this phase.\n\nRemediation continues within projected parameters."
 arkship.1310.desc.hive: "The feeding chambers are renewed and the colony's hunger sustained.\n\nOur attention now turns to the carapace: the weapons batteries, maintenance warrens, and barracks that form the vessel's outer defense. All must be stripped back and rebuilt. Combat readiness will diminish.\n\nThe collective accepts this temporary vulnerability."
 arkship.1310.a: "$arkship.1305.a$"
 arkship.1310.a.machine: "$arkship.1305.a.machine$"
 arkship.1310.a.hive: "$arkship.1305.a.hive$"
 refurbishment_military_offline: "$district_ark_military$: Under Renovation"
 refurbishment_military_offline_desc: ""

 arkship.1315.name: "The Living Quarters"
 arkship.1315.desc: "The defense section has been inspected, reinforced, and returned to service. The crews working on it looked, if anything, relieved to have something useful to do again.\n\nNow comes the final phase: the city districts themselves. The residential blocks, civic halls, and commercial corridors that constitute the living heart of the arkship. Everything else was infrastructure. This is the place inhabitants call home.\n\nConstruction barriers will go up one last time. The end is in sight."
 arkship.1315.desc.machine: "Defense sector remediation is certified complete. Naval readiness metrics are returning to baseline. Operational scope now shifts to residential and civic district infrastructure.\n\nUnit processing corridors will be taken offline in sequence for final overhaul. Population displacement will be required in affected sectors.\n\nRemediation enters its final phase."
 arkship.1315.desc.hive: "The carapace is hardened and the collective's readiness restored.\n\nThe renewal turns now to its final work: the brood chambers, communal nesting warrens, and bonding corridors that form the living heart of the vessel. The spaces where the colony sleeps, breeds, and gathers. Sections will be sealed as we rebuild from within.\n\nThe end of the renewal cycle draws near."
 arkship.1315.a: "One last push."
 arkship.1315.a.machine: "Finalize remediation protocols."
 arkship.1315.a.hive: "The final renewal begins."
 refurbishment_city_offline: "$district_ark_city$: Under Renovation"
 refurbishment_city_offline_desc: ""

 arkship.1320.name: "Sector Allocation Disputes"
 arkship.1320.desc: "With the residential levels sealed for structural survey, engineering teams have begun the unenviable task of redistributing thousands of inhabitants across the rest of the ship. What began as an orderly process has devolved into competing queues, jurisdiction disputes, and at least one formal complaint about lost access to a particularly beloved section of the hydroponics bay.\n\nThe ship's social coordinators are requesting guidance."
 arkship.1320.desc.machine: "The redistribution of units to available operational zones has encountered processing bottlenecks. Units are making real-time decisions to compensate, leading to clashing prioritization. Efficiency metrics have declined across redistribution junctions.\n\nGuidance is required."
 arkship.1320.desc.hive: "The displacement of drones has unsettled the colony's cohesion. Territorial instincts assert themselves as displaced drones contest nesting zones and work assignments in the overcrowded secondary areas. Pheromone traces of stress and agitation are detectable throughout the temporary quarters.\n\nThe colony requires direction."
 arkship.1320.a: "Engineering will sort it out."
 arkship.1320.b: "Establish a fair allocation."
 arkship.1320.a.tt: "\nBypasses standard procedure. The quality of the final work may suffer."

 arkship.1325.name: "Something Behind the Wall"
 arkship.1325.desc: "Removal of conduit casings in the generator district revealed something none of the original schematics showed: a three-meter section of structural spine exhibiting advanced fatigue fracturing. Material dating suggests the damage has been present, undetected, for decades.\n\nExpanding the scope of construction to address the damage will take additional time."
 arkship.1325.a: "Document it and proceed as planned."
 arkship.1325.b: "Expand the scope. Address it properly."
 arkship.1325.b.tt: "Expanding the renovation scope to properly address the structural damage takes additional time, but prevents greater problems later."

 arkship.1330.name: "Disruption Allowances"
 arkship.1330.desc: "Residents of sections unaffected by the ongoing refurbishment are complaining at having to share quarters with relocated individuals.\n\nThey are requesting expanded resource allocations, priority access to recreation facilities, and the immediate removal of an automated announcement system that reminds them, every three hours, that their disruption is 'temporary and appreciated.'"
 arkship.1330.desc.machine: "Cohesion readings among units assigned to overcrowded secondary zones have declined measurably since the population redistribution. Productivity outputs are tracking below optimal thresholds. Predictive models indicate the trend will worsen without intervention.\n\nA targeted allocation of additional resources has been recommended to restore baseline cohesion."
 arkship.1330.desc.hive: "Pheromone stress levels in the overcrowded secondary nesting zones have risen steadily since the relocation began. Territorial tension between displaced clusters and resident populations is measurably elevated. The hive's collective productivity is declining as instinctive agitation spreads through the affected sectors.\n\nSupplemental resources have been recommended to ease the crowding."
 arkship.1330.a: "It won't be long. We will manage."
 arkship.1330.b: "Allocate the necessary resources."
 refurbishment_allowances_granted: "Reallocated Resources"
 refurbishment_allowances_granted_desc: "Resources are being allocated to districts strained by an influx of new residents."
 refurbishment_low_morale: "Relocation Discontent"
 refurbishment_low_morale_desc: "Crowded conditions and inadequate support for displaced inhabitants are taking a toll on ship-wide morale and stability."
 refurbishment_low_morale_2: "Severe Relocation Discontent"
 refurbishment_low_morale_2_desc: "Repeated disruptions and inadequate support have significantly worsened morale and stability across the ship."
 refurbishment_low_morale_3: "Critical Relocation Discontent"
 refurbishment_low_morale_3_desc: "Morale and stability have reached a critical low. Displaced inhabitants are exhausted and resentful after repeated disruptions with no resolution in sight."

 arkship.1335.name: "The Second Shift"
 arkship.1335.desc: "To maintain the construction schedule, the lead engineer has proposed running three overlapping shifts around the clock. The residential decks adjacent to the work zone report noise levels that have made rest nearly impossible for eleven straight days. Three crew members have been treated for fatigue-related incidents.\n\nThe construction crews themselves are showing signs of strain. Faster, perhaps, but those in charge are not confident in the quality of work produced by exhausted crews."
 arkship.1335.desc.machine: "To maintain schedule, a continuous-operation cycle has been proposed across all construction units in the active work zone. Noise and vibration data from adjacent residential sectors indicate sustained disruption above tolerance thresholds. Several unit operational failures have been logged.\n\nQuality assurance metrics are declining proportionally to cycle extension. Continuous operation is faster but increases error rates measurably."
 arkship.1335.desc.hive: "To maintain the renewal cycle, the drones in the active construction zone has been directed to operate for prolonged periods. Vibration and noise levels in adjacent nesting areas have exceeded tolerable thresholds for eleven consecutive cycles. Several drones have shown signs of exhaustion-related breakdown.\n\nContinuous labor drives construction faster, but the colony's biological limits impose a measurable cost in work quality."
 arkship.1335.a: "Maintain the current pace."
 arkship.1335.b: "Establish proper shift rotations."
 refurbishment_construction_fatigue: "Construction Fatigue"
 refurbishment_construction_fatigue_desc: "Construction crews are recovering from a period of continuous operation. Output across all work roles is reduced while the new shift schedule takes hold."
 refurbishment_construction_fatigue_2: "Severe Construction Fatigue"
 refurbishment_construction_fatigue_2_desc: "Repeated overwork has left construction crews in a prolonged state of exhaustion. Morale and output remain significantly reduced."
 refurbishment_construction_fatigue_3: "Critical Construction Fatigue"
 refurbishment_construction_fatigue_3_desc: "Construction crews are operating far beyond safe limits. Morale has collapsed and output is severely compromised across all work roles."

 arkship.1340.name: "Conduit Failure"
 arkship.1340.desc: "A primary power conduit has ruptured during removal of the old casing. The entire section, including the residential levels, the secondary medical bay, and two food processing units, is now running on emergency lighting only.\n\nOur [Owner.GetEngineerPlural] believe it will be possible to restore full power within a few months. Alternatively, the conduit's routing can be bypassed, drawing from an adjacent generator cluster instead. Faster, but it introduces a permanent workaround into the power grid."
 arkship.1340.a: "Route around it."
 arkship.1340.b: "Prioritize a full restoration."
 refurbishment_bypass_routing: "Bypassed Power Conduit"
 refurbishment_bypass_routing_desc: "A ruptured power conduit was routed around rather than repaired. The workaround is stable, but introduces a persistent inefficiency into the energy grid."

 arkship.1345.name: "The Major Concern"
 arkship.1345.desc: "The project's lead structural engineer has submitted a formal concern: the current timeline, while achievable, is producing work [Owner.Ruler.GetSheHe] would not personally certify as complete.\n\nNon-critical junction points are being sealed over rather than properly reinforced. Tolerance margins are being set to 'acceptable' rather than 'recommended.'"
 arkship.1345.desc.machine: "The quality assurance oversight subroutine has flagged a structural concern: current construction parameters are operating within minimum tolerance thresholds rather than recommended specifications. Non-critical junction nodes are being finalized rather than optimized. Long-term structural margin projections are below preferred targets.\n\nA formal log entry has been registered. No immediate failure risk is indicated."
 arkship.1345.desc.hive: "The current pace of refurbishment is producing work at the minimum viable threshold, not the recommended specification. Junction nodes are being sealed in place rather than properly reinforced. Long-term structural resilience is being traded for short-term speed.\n\nNo immediate failure risk is indicated. The concern has been registered."
 arkship.1345.a: "The schedule holds. Acceptable is acceptable."
 arkship.1345.b: "Heed the warning. Correct the parameters."
 refurbishment_power_restoration: "Full Power Restoration"
 refurbishment_power_restoration_desc: "Extra time is needed for a full power restoration."

 arkship.1350.name: "First Section Online"
 arkship.1350.desc: "The first section to complete its overhaul has been declared structurally certified and cleared for reoccupation. The work is genuinely impressive: new framing, modernized conduits, insulation that doesn't crumble at the touch.\n\nThe engineering team is eager to push forward. Residents are clamoring to move back in. However, the full battery of systems tests hasn't been completed. A decision will need to be made."
 arkship.1350.desc.machine: "A major structural refurbishment is complete. Initial certification indicates the sector meets minimum reoccupation standards. Full diagnostic testing protocols remain outstanding. Probability of significant post-occupancy failure is low but non-negligible.\n\nAuthorization is required to proceed with or without complete diagnostics."
 arkship.1350.desc.hive: "The first section to complete its structural renewal has been cleared by initial inspection. It meets the minimum threshold for reoccupation. The full biological verification cycle for its rebuilt systems has not yet been completed. Failure probability after reoccupation is low, but not negligible.\n\nThe drones displaced from this section are already pressing at the barriers."
 arkship.1350.a: "The tests are unnecessary."
 arkship.1350.b: "Complete the full testing sequence."
 refurbishment_extended_displacement: "Extended Displacement"
 refurbishment_extended_displacement_desc: "A completed section remains closed pending full systems certification."

 arkship.1355.name: "The Repair List"
 arkship.1355.desc: "The project supervisor has compiled the final list of repairs: forty-seven outstanding items before formal structural sign-off. The list ranges from the significant, such as three load-bearing junction upgrades in the aft section, to the cosmetic, including nineteen instances of misaligned paneling and one ventilation grille installed upside-down.\n\nCompleting every item on the list will take additional time. But the list exists precisely because these things matter."
 arkship.1355.desc.machine: "Quality assurance protocols have generated a remediation checklist of forty-seven outstanding items pending formal certification. Items range from structural significance, such as junction reinforcement, to cosmetic panel alignment.\n\nFull completion will require an extension of the operational timeline. Partial certification, covering structural items only, is an option."
 arkship.1355.desc.hive: "Repair drones have compiled a final manifest: forty-seven incomplete cell repairs across the most recently finished sections. They range from critical structural reinforcements at load-bearing junctions to surface-level cell-lining and cosmetic cavity work.\n\nFull completion will extend the renewal cycle. Partial certification, addressing structural repairs, is available."
 arkship.1355.a: "Address the structural items only."
 arkship.1355.b: "Complete the full list."

 arkship.1360.name: "Homecoming"
 arkship.1360.desc: "The displaced residents of the most recently renovated section have been given their move-back date. The corridors that were sealed for months are open again, smelling of fresh composite and new insulation. Infants who spent months in temporary quarters are seeing their home section for the first time.\n\nThe mood aboard is the best it has been since the refurbishment began. Leadership is aware that goodwill of this kind does not last. The question is how to make use of it."
 arkship.1360.desc.machine_ind: "The sealed corridors are open again. Scaffolding comes down in the lower decks. For most, this is a homecoming. For some, it is something else.\n\nUnits that came online during the displacement period are entering corridors that appear in their schematics but have never appeared in their sensory logs.\n\nEnthusiasm is the highest it has been since the refurbishment began. Leadership is aware that this will not last. The question is how to make use of it."
 arkship.1360.desc.machine: "Units assigned to temporary operational zones during remediation are being returned to their primary processing areas. Baseline operational parameters are being restored across affected sectors. Efficiency metrics are trending upward.\n\nA measurable cohesion uplift has been registered across the vessel. Such spikes are transient. Analysis indicates two viable approaches: redirect the uplift toward accelerating remaining remediation work, or permit natural stabilization and allow cohesion to settle at an elevated baseline."
 arkship.1360.desc.hive: "The displaced drones are flowing back into their restored sections. Familiar scent-markers saturate corridors that smelled of construction compounds for cycles. Bonding chemistry stabilizes. Territorial tension dissolves.\n\nThe collective resonance has spiked. The hive is returning to itself, and the energy of that return is real. It could be directed outward, into the remaining construction zones. Or it could be allowed to settle, and the colony given time to fully find itself again before the work resumes."
 arkship.1360.a: "Refocus on the work."
 arkship.1360.b: "Let them have this moment."

 arkship.1365.name: "The Long Wait"
 arkship.1365.desc: "The residential district renovation is in its final stage, but 'final' has stopped meaning what it once did. The inhabitants relocated from the city blocks have now been in temporary quarters for longer than the original estimate promised.\n\nA request has come through for supplemental resources: better temporary furnishings, priority access to recreational facilities, and a small additional resource allocation. It will not fix anything structural. But it might make the waiting bearable."
 arkship.1365.desc.machine: "Unit cohesion data from displaced residential sector populations is trending below acceptable thresholds. The final renovation phase has exceeded its projected duration. Predictive models indicate continued decline without targeted resource intervention.\n\nA supplemental allocation request has been submitted for review."
 arkship.1365.desc.hive: "Pheromone stress readings from the final residential sections have exceeded acceptable thresholds. The last renovation phase has extended beyond its projected cycle. Prolonged separation from established patterns disrupts bonding chemistry and undermines collective cohesion in ways that worsen with time.\n\nA supplemental resource allocation has been requested to alleviate the crowding."
 arkship.1365.a: "We endure until the work is done."
 arkship.1365.b: "Approve the supplemental allocation."
 refurbishment_administrative_burden: "Administrative Burden"
 refurbishment_administrative_burden_desc: "Managing the welfare programme for long-term displaced inhabitants has placed significant demands on specialist personnel. Requisition logistics, complaints processing, and distribution management are diverting skilled staff from their primary roles."

 arkship.1370.name: "Unauthorized Modifications"
 arkship.1370.desc: "During demolition of non-load-bearing walls in the mid-residential sections, the renovation crews have discovered something unusual: decades of unauthorized modifications. Hidden rooms, self-constructed alcoves, sealed corridors repurposed as storage or living space. None of it is in the original schematics, and some of it is load-bearing.\n\nThe lead engineer is requesting a decision. Removing everything not in the original plans is the correct approach. It will take time. Working around the modifications is faster, but introduces structural irregularities that will be difficult to explain to future engineers."
 arkship.1370.desc.machine: "Deconstruction of residential sector non-structural elements has revealed extensive unauthorized architectural modifications. Off-record partitioning, access route alterations, and improvised load-bearing installations have been identified across multiple zones. None are documented in original design specifications.\n\nFull removal is structurally correct but time-consuming. Documentation and workaround routing is available as an alternative."
 arkship.1370.desc.hive: "Demolition of interior walls in the mid-residential sections has uncovered generations of unauthorized colony modification. Hidden burrows, self-bored access tunnels, sealed chambers repurposed as nesting alcoves, and each entirely absent from the vessel's formal structure. Some are load-bearing. Proper removal is the correct approach but time-consuming. Working around them is faster, but introduces structural irregularities that will trouble future nest-wardens."
 arkship.1370.a: "Document what we can. Work around the rest."
 arkship.1370.b: "Remove everything not in the original specifications."
 arkship.1370.c: "What were we thinking?"
 refurbishment_rework_zone: "Active Rework Zone"
 refurbishment_rework_zone_desc: "Active construction work in these areas is preventing new district development until restoration is complete."

 arkship.1375.name: "The Final Deck"
 arkship.1375.desc: "The last deck has passed its preliminary inspection. The scaffolding has already started coming down in the lower sections. By most measures, the renovation is complete.\n\nThe engineering supervisor has requested a full secondary inspection before [Owner.Ruler.GetSheHe] signs off on structural certification. It is, they acknowledge, largely a formality. The deck is almost certainly fine.\n\nHowever, 'almost' is a word that often bears consequences."
 arkship.1375.desc.machine: "The final residential sector has passed preliminary inspection protocols. Scaffolding removal has commenced in lower zones. Structural certification is pending full secondary diagnostic protocols.\n\nThe secondary inspection is a near certainty, but completion remains a formal prerequisite for full certification."
 arkship.1375.desc.hive: "The final nesting deck has cleared its preliminary inspection. Drones are dismantling the scaffolding in the lower levels. By every observable measure, the renewal is complete. A full secondary verification cycle is necessary before final certification.\n\nWe are almost, but not entirely, certain it will confirm what the primary inspection found."
 arkship.1375.a: "Almost is good enough."
 arkship.1375.b: "Complete the full inspection sequence."
 refurbishment_inspection_hold: "Inspection Hold"
 refurbishment_inspection_hold_desc: "Pending final structural certification, all installation and construction work has been suspended."

 arkship.1380.name: "Structural Overhaul Complete"
 arkship.1380.desc.full: "The last section of Arkship §Y[Target.GetName]§! has been cleared, certified, and returned to its inhabitants. What began as a disruptive necessity has concluded as something approaching an achievement. The ship feels different: not just structurally sound, but somehow more like the vessel it was always supposed to be.\n\nThe engineering corps has submitted its final report with several strong recommendations. The choice of where to direct the fruits of this work belongs to leadership."
 arkship.1380.desc.partial: "The overhaul of Arkship §Y[Target.GetName]§! has been declared complete. Structural integrity assessments confirm a meaningful improvement over baseline, though those familiar with the original proposal will note that not every specification was met, and not every tolerance was optimal.\n\nThe project delivered results. The results could have been better."
 arkship.1380.desc.rushed: "The overhaul of Arkship §Y[Target.GetName]§! is done. The paperwork is signed, the scaffolding is down, and the crews have moved on.\n\nThe structural review board has noted, with some diplomatic restraint, that the final product meets minimum certification standards across all assessed categories. The ship is better than it was. Whether it is as good as it could have been is a question the engineering corps has chosen not to ask aloud."
 arkship.1380.desc.full.machine: "Remediation of §Y[Target.GetName]§! is complete. All sectors have been certified and returned to full operational status. Structural integrity assessments confirm outputs exceeding pre-remediation baselines across every measured category.\n\nFinal reporting has been logged. Optimization recommendations are available for implementation."
 arkship.1380.desc.partial.machine: "Remediation of §Y[Target.GetName]§! has been certified as complete. Structural integrity assessments confirm improvement over pre-remediation baselines. However, several parameters were finalized at minimum threshold rather than recommended specification.\n\nOutcomes are within acceptable range."
 arkship.1380.desc.rushed.machine: "Remediation of §Y[Target.GetName]§! has been logged as finalized. The structural review subroutine has certified the outcome as meeting minimum standards across all assessed categories.\n\nOperational improvement over baseline is confirmed. Optimization potential was not fully realized."
 arkship.1380.desc.full.hive: "The renewal of §Y[Target.GetName]§! is complete. Every section has been verified, rebuilt, and returned to the colony. The collective resonates with new coherence, the familiar weight of a vessel that is once again fully itself, structurally sound from the deepest power-nodes to the highest nesting chambers.\n\nWe are whole. The colony chooses where its renewed strength is directed."
 arkship.1380.desc.partial.hive: "The renewal of §Y[Target.GetName]§! has been declared complete. Structural assessments confirm real improvement over the vessel's prior state. We are uncomfortably aware that not every specification was met and not every structural margin was fully optimized.\n\nThe colony is stronger. It could have been stronger still."
 arkship.1380.desc.rushed.hive: "The renewal of §Y[Target.GetName]§! is done. Scaffolding is down, sections are open, and the displaced drones have returned to their assigned locations.We are uncomfortably aware that we achieved the bare minimum certification standards across all assessed categories.\n\nThe renewal achieved its purpose. Whether it achieved its potential is something we choose not to dwell on."
 arkship.1380.a: "Commission the power grid improvements."
 arkship.1380.b: "Direct resources to the cultivation systems."
 arkship.1380.c: "Invest in the defense systems overhaul."
 arkship.1380.d: "Focus on the residential expansion."

