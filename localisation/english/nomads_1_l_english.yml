 ARKSHIP_FUNGAL_COMMUNICATION_PROJECT: "Establishing Communication"
 ARKSHIP_FUNGAL_COMMUNICATION_PROJECT_DESC: "We will attempt to communicate with the invasive fungal species spreading through the hydroponics decks of §YArkship [Root.GetName]§!. If left unchecked, its dense mycelial networks threaten to significantly reduce food production."

 #Unknown Resource Usage
 arkship.1240.name: "Unknown Resource Usage"
 arkship.1240.desc: "During our monthly stock takes, we have found a persistent discrepancy in the §YArkship [Root.GetName]§! resource systems. Small amount of electricity, consumer goods, and other supplies are being taken at levels exceeding our recorded usage. Experts suggest a leak or malfunction, or a slight discrepancy in the numbers.\n\nAfter investigating further, the results remain inconclusive. No breaches, no failures, no inefficiencies beyond acceptable thresholds. And yet, the numbers remain unchanged. Resources continue to vanish from the system without explanation. Something aboard the Arkship was consuming our resources."
 arkship.1240.a: "Investigate."
 arkship.1240.b: "It's probably nothing."

 arkship.1245.name: "Unaccounted Generation"
 arkship.1245.desc: "In an unmonitored section of the Arkship, we discovered a group of young individuals living outside official systems. Drawing on diverted power, air, and food, they have created their own space, experimenting, modifying their surroundings, and expressing themselves beyond supervision.\n\n Research suggests that it is a natural part of the development process of adolescents. They appeared genuinely surprised by the investigation and acted rebelliously. They claimed to have taken only small amounts, carefully enough to avoid immediate detection. They made it clear that they have no intention of giving up this space, and wish to be left alone."
 arkship.1245.a: "Demolish the place."
 arkship.1245.b: "Let them express themselves."

 arkship.1250.name: "Legacy Processes"
 arkship.1250.desc: "In a forgotten maintenance sector, investigators discovered a cluster of outdated worker drones still operating under ancient directives. Their routines appear to predate several system updates, causing them to function outside current logging protocols while only requiring a small amount of resources to function.\n\nFurther inspection revealed the result of their continued activity: a substantial stockpile of refined alloys had been meticulously processed and stored over many cycles. The drones had been quietly gathering and optimizing resources far beyond any current operational requirement."
 arkship.1250.a: "$arkship.1245.a$"
 arkship.1250.b: "Leave them to work and take the resources"

 arkship.1255.name: "Wellness Retreat"
 arkship.1255.desc: "In a secluded section of the Arkship, we uncovered a hidden wellness retreat operating outside official systems. Diverted power, consumer goods, and water sustain this controlled environment designed for rest and recovery.\n\nThose present showed little concern at being discovered, explaining the space was meant to exist beyond constant need to focus on output and show off efficiency, an escape from the routines of ship life. Even though the Arkship was meant to fulfill every need, some still seek a place meant for pure relaxation."
 arkship.1255.a: "$arkship.1245.a$"
 arkship.1255.b: "Let them relax in peace."

 arkship.1260.name: "Unaccounted Aggregation"
 arkship.1260.desc: "In a quiet section of the Arkship, we uncovered an undocumented community gathering at regular intervals. The small amount of diverted resources had been used to accommodate these meetings.\n\nMembers described the sessions as an informal exchange centered around specimens collected during the Arkship's harvesting operations, such as minerals, ore fragments, and crystalline formations pulled from surveyed systems. Participants would examine and discuss their findings, comparing compositions and debating their origins."
 arkship.1260.a: "$arkship.1245.a$"
 arkship.1260.b: "Leave the artists be."

 arkship.1265.name: "Contingency Hoard"
 arkship.1265.desc: "In a sealed storage compartment, we uncovered a private cache of supplies: consumer goods, air canisters, and power cells all carefully stockpiled and hidden from official inventory systems.\n\nThe individuals responsible were quickly found and offered a simple explanation: preparation. In a system where survival depends entirely on stability, they argued, it would be irresponsible to assume that stability is guaranteed forever. The scale of the hoard suggests long-term planning, far beyond personal use. Not all aboard the Arkship are confident that it will endure forever."
 arkship.1265.a: "Confiscate and shut down this nonsense."
 arkship.1265.b: "Leave them alone."

 arkship.1270.name: "Total Reclamation"
 arkship.1270.desc: "In a sealed processing sector, investigators uncovered an unregistered reclamation system, one designed to convert biological remains into usable materials. The system has been operating continuously, far beyond its intended emergency function.\n\nWhile efficient, the process is resource-intensive. Large amounts of energy, chemical catalysts, and processing materials have been diverted to break down, sterilize, and refine organic matter into standardized outputs for reuse within the Arkship. Nothing on the Arkship should be wasted. Not even the dead."
 arkship.1270.a: "Demolish this place of the dead."
 arkship.1270.b: "Resourceful. Let them be."

 arkship.1275.name: "Beyond the System"
 arkship.1275.desc: "Following the traces of the disappearing resources, we found a long-overlooked section of the Arkship. Apparently there was a small isolated community living outside official systems. Their habitat was simple, sustained by siphoned resources, taken in amounts small enough to avoid detection.\n\nDespite their circumstances, the environment was stable, attentively maintained, and adapted to their needs. It was clear this was a very deliberate way of living. They offered no resistance and instead asked to explain their choice."
 arkship.1275.a: "Hear them out."
 arkship.1275.b: "Dispel from Arkship."
 arkship.1275.c: "We can't allow this, purge them."

 arkship.1280.name: "A Different Way of Living"
 arkship.1280.desc: "The isolated group spoke openly about their decision. They did not reject the Arkship but they said that the way life within it had evolved. To them, existence had become overly optimized: every action measured, every resource tracked, and every moment accounted for.\n\nThey described a different approach to the mechanism of the Arkship. They valued the freedom to make choices outside of constant oversight. Their way of life was less efficient, but more fulfilling, they claimed. Some among our leadership now questioned whether such communities represented a risk to cohesion, or a necessary expression of individuality within a closed system."
 arkship.1280.a: "Force to join back into society."
 arkship.1280.b: "There is no room for you on this Arkship."
 arkship.1280.c: "Leave them be, we will keep an eye on them."

