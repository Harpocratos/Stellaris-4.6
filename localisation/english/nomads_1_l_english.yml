 contract_suntrip_crew_1: "Generator Maintenance"
 contract_suntrip_crew_1_desc: "We need to orbit this system's star and run on solar power while the main generators undergo scheduled maintenance."
 contract_suntrip_crew_1_lore_issued: "§L"Yes, the solar arrays will block every viewport. No, we cannot angle them differently."§!"
 contract_suntrip_crew_1_lore_completed: "§L"Generators back online and running within tolerance. Log it and move on to the next item on the list."§!"
 contract_suntrip_crew_1_lore_failed: "[GetSuntripCrewLoreFailed1]"
 contract_suntrip_crew_1_regular_lore_failed: "§L"Maintenance postponed again. At this rate the generators will schedule their own shutdown."§!"
 contract_suntrip_crew_1_gestalt_lore_failed: "§L"Maintenance postponed. Generator degradation continues. Failure timeline recalculated."§!"
 contract_suntrip_crew_1_chain_title: "$contract_suntrip_crew_1$"
