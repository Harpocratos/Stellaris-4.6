 contract_suntrip_passenger_1: "Sun Trip"
 contract_suntrip_passenger_1_desc: "We'll settle into orbit and let the passengers soak in the light of an unfamiliar sun."
 contract_suntrip_passenger_1_lore_issued: "§L"What sun block factor do you need for a pulsar?"§!"
 contract_suntrip_passenger_1_lore_completed: "§L"Can we just stay in orbit? I haven't felt this warm since boarding."§!"
 contract_suntrip_passenger_1_lore_failed: "§L"I suppose the UV lamps on the Lido Deck will have to do. Again."§!"
 contract_suntrip_passenger_1_chain_title: "$contract_suntrip_passenger_1$"
 contract_suntrip_passenger_1_chain_desc: "$contract_suntrip_passenger_1_desc$"
