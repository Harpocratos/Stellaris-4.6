 contract_suntrip_crew_2: "Hull Recalibration"
 contract_suntrip_crew_2_desc: "The outer hull plating requires thermal load testing under sustained stellar exposure. All viewports on the starward side will be shuttered for safety."
 contract_suntrip_crew_2_lore_issued: "[GetSuntripCrewLoreIssued2]"
 contract_suntrip_crew_2_regular_lore_issued: "§L"Shuttering the viewports now. If anyone asks, remember to tell the passengers it is a scheduled lighting upgrade."§!"
 contract_suntrip_crew_2_gestalt_lore_issued: "§L"Shuttering viewports. Passengers have been informed it is a scheduled lighting upgrade."§!"
 contract_suntrip_crew_2_lore_completed: "[GetSuntripCrewLoreCompleted2]"
 contract_suntrip_crew_2_regular_lore_completed: "§L"All panels within tolerance. That is another cycle we can skip worrying about a hull breach."§!"
 contract_suntrip_crew_2_gestalt_lore_completed: "§L"All panels within tolerance. Hull breach probability reduced for another cycle."§!"
 contract_suntrip_crew_2_lore_failed: "[GetSuntripCrewLoreFailed2]"
 contract_suntrip_crew_2_regular_lore_failed: "§L"Recalibration aborted. The hull is probably fine."§!"
 contract_suntrip_crew_2_gestalt_lore_failed: "§L"Recalibration aborted. Hull integrity rated adequate. Monitoring continues."§!"
 contract_suntrip_crew_2_chain_title: "$contract_suntrip_crew_2$"
 contract_suntrip_crew_2_chain_desc: "$contract_suntrip_crew_2_desc$"
 CONTRACT_SUNTRIP_crew_2_PROJECT: "$contract_suntrip_crew_2$"
 CONTRACT_SUNTRIP_crew_2_PROJECT_DESC: ""

 contract_suntrip_crew_3: "Coolant Flush"
 contract_suntrip_crew_3_desc: "The coolant system needs a full purge cycle under thermal load. Close stellar orbit will let us flush the lines efficiently, though deck temperatures will fluctuate."
 contract_suntrip_crew_3_lore_issued: "[GetSuntripCrewLoreIssued3]"
 contract_suntrip_crew_3_regular_lore_issued: "§L"Passenger decks will get warm. Then cold. Then warm again. We just tell them it is part of the ambience."§!"
 contract_suntrip_crew_3_gestalt_lore_issued: "§L"Temperature fluctuations on passenger decks anticipated. If queried, passengers will be told it is part of the ambience."§!"
 contract_suntrip_crew_3_lore_completed: "§L"Coolant pressure nominal across all circuits. The temperature complaints should stop in about an hour."§!"
 contract_suntrip_crew_3_lore_failed: "[GetSuntripCrewLoreFailed3]"
 contract_suntrip_crew_3_regular_lore_failed: "§L"Flush postponed. We hope that nobody notices the condensation forming on the ceiling of the ballroom."§!"
 contract_suntrip_crew_3_gestalt_lore_failed: "§L"Flush postponed. Condensation forming on the ballroom ceiling. Unlikely to draw passenger attention."§!"
