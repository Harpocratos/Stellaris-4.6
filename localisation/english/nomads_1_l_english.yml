 nomads.4710.name: "Embarkation Complete"
 nomads.4710.desc.regular: "Since our ships first ventured beyond our star, there have always been those among us who knew the cosmos only through recordings, those who were born, lived, and died beneath the same sky. That changes now.\n\nWith the completion of our §HArkship§!, gravity is no longer an obstacle, and every wonder of the cosmos awaits. §Y[From.GetName]§! has given all it had to give: our people will carry its name, its memory, and its future with us into the void."
 nomads.4710.desc.machine: "We have completed an §HArkship§!. No longer will our drones be bound to [From.GetPlanetMoon]. Their processes have been adjusted for mobile stellar function as §Y[From.GetName]§! is stripped bare of infrastructure and all necessary systems are transferred to support a new mobile future."
 nomads.4710.desc.hive: "We, the [event_target:player_country.GetName], have seen many sights, yet our drones have always been bound to settled worlds. Now, in an age of interstellar travel, confinement to a single system is a liability. We will be free aboard our new §HArkship§!, while §Y[From.GetName]§! is left stripped and harvested."
 nomads.4710.desc.regular.doomsday: "$nomads.4710.desc.regular$\n\n$nomads.4710.doomsday_appendix$"
 nomads.4710.desc.machine.doomsday: "$nomads.4710.desc.machine$\n\n$nomads.4710.doomsday_appendix$"
 nomads.4710.desc.hive.doomsday: "$nomads.4710.desc.hive$\n\n$nomads.4710.doomsday_appendix$"
 nomads.4710.doomsday_appendix: "§Y[From.GetName]§! burns behind us, swallowed by the cataclysm we long foretold, but our people are §Gsaved§! at last, cast into the deep on the wings of an §HArkship§!."

 nomads.4710.a.military: "We will embark a §H$military_arkship_name$§!."
 nomads.4710.embark.tt: "The §Y[event_target:player_country.GetName]§! will become §HNomadic§! embarking on an §HArkship§!\n"
 nomads.4710.a.science: "We shall explore in a §H$science_arkship_name$§!."
 nomads.4710.a.civilian: "We will thrive aboard a §H$civilian_arkship_name$§!."
 nomads.4710.b: "They will be our subject."
 embark_create_subject: "\n§Y[from.GetName]§! will embark on an §HArkship§! as a new Nomadic Subject of the §Y[event_target:player_country.GetName]§!.\n"
 embark_leaves_behind_subject: "\nA Settled Subject will be created with all remaining ['concept_colonies'] and ['concept_starbases']."
