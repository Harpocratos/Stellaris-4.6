 # Star-Crossed Lovers

 arkship.1385.name: "The Pod"
 arkship.1385.desc: "Our long-range scanners have flagged an object drifting at the edge of the system. Closer inspection revealed precise geometric inconsistencies beneath its surface, and dormant power signatures buried beneath a thick shell of rock.\n\nA survival pod of unknown origin, its exterior was camouflaged to evade detection across vast stretches of space. No active transmissions were detected, but faint life-support traces persisted within. Whatever lay inside had been adrift for a very long time."
 arkship.1385.a: "Let's see what's inside."
 arkship.1385.b: "Let the rock be a rock."

 arkship.1390.name: "Dearly Beloved"
 arkship.1390.desc: "Beneath the mineral shell, we uncovered a badly damaged stasis pod. Inside we discovered a single occupant, already deceased. Their body was draped in flowing ceremonial vestments, not suited for spacefaring. It appears they were forced inside in haste.\n\nThe pod's interior bore unmistakable signs of violence. Several internal restraints had been forcibly engaged. This vessel was no sanctuary; it was a prison. Only two artifacts could be recovered: a set of coordinates, and a sealed message. It bore a simple inscription: \n\n§H"For my Beloved."§!"
 arkship.1390.a: "Set course for the coordinates."
 arkship.1390.b: "We should not waste our time on this."

 arkship.1395.name: "Last Survivor"
 arkship.1395.desc: "We have finally arrived at the capsule indicated by the recovered coordinates. Within, we discovered another being, this one still barely alive.\n\nThe physical damage is severe. Prolonged stasis failure has left [event_target:star_crossed_survivor.GetHimHer] on the verge of death. The two pods had clearly been separated long ago, their destination never reached.\n\nWe have stabilized the alien, who has asked us to call [event_target:star_crossed_survivor.GetHimHer] [event_target:star_crossed_survivor.GetName]. Full recovery remains far from certain."
 arkship.1395.a: "Ensure [event_target:star_crossed_survivor.GetHeShe] recovers."

 arkship.1400.name: "The Massacre"
 arkship.1400.desc: "[event_target:star_crossed_survivor.GetName]'s account was recorded during [event_target:star_crossed_survivor.GetHisHer] recovery:\n\n§H"There was a massacre. Whole families, erased. It was presented as an attack by a rival empire. But that was a lie. Those in power had orchestrated it themselves, a fabricated atrocity to justify a senseless war. My beloved and I found the proof. Internal directives. Unaltered logs.\n\n"We released it. We expected consequences. What we did not expect was exile."§!\n\nCorrupted but recoverable records from the pod's data banks are already in our possession."
 arkship.1400.a: "We found a message from your beloved."

 arkship.1405.name: "A Bloody War"
 arkship.1405.desc: "[event_target:star_crossed_survivor.GetName]'s account was recorded in full during [event_target:star_crossed_survivor.GetHisHer] recovery:\n\n§H"The fleets were already on approach, we saw them long before they reached us. [event_target:star_crossed_empire.GetName] had waged war against us for years, ever since we refused their demands for vassalage. Our forces were hopelessly outmatched.\n\n"In the end, my parents placed their faith in these capsules. They forced my beloved and me into the void, our survival uncertain, our reunion left to chance with only the hope that we might begin anew."§!\n\nA survey of the pod's systems has turned up engineering data from the war period."
 arkship.1405.a: "$arkship.1400.a$"

 arkship.1410.name: "A Dangerous Find"
 arkship.1410.desc: "[event_target:star_crossed_survivor.GetName]'s account was recorded in full during [event_target:star_crossed_survivor.GetHisHer] recovery:\n\n§H"Our empire once took great pride in honoring both life and death. Our purpose was to prolong existence and ease the passage between them, but never to transcend it entirely. Immortality, through synthetic ascension, was an abomination to our beliefs. Such knowledge was never meant to be possessed. But curiosity spread among the population. When it could no longer be contained, the ruling authority deemed the risk unacceptable.\n\n"They chose erasure. Our empire was destroyed to bury the truth. Only my beloved and I were spared, forced into these pods, condemned to drift between life and death."§!\n\nThe pod's data core has also been decrypted."
 arkship.1410.a: "$arkship.1400.a$"

 arkship.1415.name: "Ambition"
 arkship.1415.desc: "[event_target:star_crossed_survivor.GetName]'s account was recorded during [event_target:star_crossed_survivor.GetHisHer] recovery:\n\n§H"I had a colleague. A friend, or so I believed. We had worked together for years. When I was appointed to lead the project, [event_target:star_crossed_survivor.GetHeShe] offered congratulations.\n\n"A month later, my beloved and I were seized. Fabricated charges. No trial. We were put into the pods before I had finished asking why. I know now that ambition does not need a reason. It only needs an opportunity."§!\n\nPersonal logs from the pod's internal systems have given us a detailed record of the empire's governance."
 arkship.1415.a: "$arkship.1400.a$"

 arkship.1420.name: "A Pest"
 arkship.1420.desc: "[event_target:star_crossed_survivor.GetName]'s account was recorded in full during [event_target:star_crossed_survivor.GetHisHer] recovery:\n\n§H"A relentless virus swept through our empire. Our people perished swiftly and without mercy. It is believed to have originated from one of our vast landfill complexes, a consequence of our own excess and carelessness. My beloved and I chose to remain to stand with our people until the end.\n\n"But my parents intervened. Against our will, we were forced into these pods and cast away. The technology was meant to preserve us. It seems it failed."§!\n\nBiological residue from the pod's life support systems has been recovered."
 arkship.1420.a: "$arkship.1400.a$"

 arkship.1425.name: "The Hidden Deal"
 arkship.1425.desc: "[event_target:star_crossed_survivor.GetName]'s account was recorded in full during [event_target:star_crossed_survivor.GetHisHer] recovery:\n\n§H"My parents knew that [event_target:star_crossed_empire.GetName] was on the verge of awakening. Desperate to secure its favor, they struck a bargain. A quarter of our population was offered in exchange for power. My beloved and I uncovered their design.\n\n"But few listened, and those who did were silenced. We were forced into these pods and cast into the void, discarded, as so many others had been before us."§!\n\nDocumentation from the pod's sealed compartments has been uncovered."
 arkship.1425.a: "$arkship.1400.a$"

 arkship.1430.name: "Forbidden Union"
 arkship.1430.desc: "[event_target:star_crossed_survivor.GetName]'s account was recorded in full during [event_target:star_crossed_survivor.GetHisHer] recovery:\n\n§H"I was not exiled for what I had done. I was exiled for who I loved.\n\n"Our people were at war. We had been, for generations. In the eyes of our people, our bond was a transgression, one that could not be ignored. We refused to part, believing that our bond might demonstrate the value of peace.\n\n"We were forced into these pods and cast into the relentless void. But our love could not be sundered."§!\n\nPrivate correspondence between the two exiles was found in the pod. Reading it was inspiring."
 arkship.1430.a: "$arkship.1400.a$"

 arkship.1435.name: "Whispers in the Void"
 arkship.1435.desc: "[event_target:star_crossed_survivor.GetName]'s account was recorded in full during [event_target:star_crossed_survivor.GetHisHer] recovery:\n\n§H"It began as a presence at the edge of thought. Then I heard the voice. The whispers followed me, growing clearer with time, speaking in fragments. My people feared what I had become, but my beloved stayed by my side.\n\n"Together, we were forced into this pod and cast into the void, removed before whatever had touched my mind could spread. Even now, I still hear it. Whispering."§!\n\nThe pod's sensor logs have revealed an intriguing amount of data."
 arkship.1435.a: "$arkship.1400.a$"

 arkship.1440.name: "Final Words"
 arkship.1440.desc: "[event_target:star_crossed_survivor.GetName]'s condition deteriorated rapidly. Shortly before their passing, we decrypted the sealed message from the companion pod. The transmission reads:\n\n§H"My dearest,\n\n"If you hear this, then fate has been kinder to you than it was to me. Know that, even in the void, I was never alone, I carried you with me, always."§!\n\nMoments after the message concluded, [event_target:star_crossed_survivor.GetName]'s vital signs ceased. For the first time since awakening, [event_target:star_crossed_survivor.GetHisHer] expression was at peace."
 arkship.1440.a: "Rest in peace, [event_target:star_crossed_survivor.GetName]."
 arkship.1440.a.tooltip: "Their final testimony has given us valuable intelligence on [event_target:star_crossed_empire.GetName]."

 star_crossed_lovers_chain_title: "Star-Crossed Lovers"
