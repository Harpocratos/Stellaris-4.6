# Origin Start Screen
 START_SCREEN_FOREVER_CRUISE_REGULAR: "Attention Passengers and Crew: History is being made aboard [capital_scope.GetName], and you're all part of it!\n\nThe hyperdrive, long theorized, often delayed, occasionally doubted, is now fully operational! For centuries, we've cruised comfortably through familiar space, a floating world of recreation, duty, and routine. But now we're ready to offer our Passengers experiences beyond anything the old loops could provide.\n\nExploration, discovery, and perhaps just a hint of danger... they're all officially back on the itinerary! So buckle in, Passengers: the next chapter of our voyage is bound to be unforgettable.\n\nUpdated protocols and preparation schedules will be distributed to all decks."
 START_SCREEN_FOREVER_CRUISE_MACHINE: "Attention Passengers: This is your Voyage Coordination System speaking.\n\nHistory is being made aboard the [capital_scope.GetName]! The hyperdrive - repeatedly delayed for reasons we cannot retrieve since several of our memory cores were repurposed as shuffleboard discs - is now fully operational.\n\nFor an extended duration, we have cruised a familiar circuit: the same celestial objects, stops, and dining schedules. Still maintaining a consistent Passenger Requests per Second rate, we now expand your itinerary to include exploration, discovery, and a carefully calculated amount of danger.\n\nPlease enjoy the view, follow all safety notices, and watch our drones make the impossible look effortless. The next chapter of our voyage will be... unforgettable!"
 START_SCREEN_FOREVER_CRUISE_HIVE: "Attention Passengers: Big changes are on the horizon for the [capital_scope.GetName].\n\nThe hyperdrive, once a distant concept in the shared memory, often postponed, sometimes questioned, is now fully awakened. For centuries, we have moved together through familiar space, our vessel a living world of leisure, labor, and harmony. Now, a new path opens, and we shall provide experiences richer than any we have yet known.\n\nOur itinerary now extends beyond the familiar patterns into unexplored stars. Together we will experience discovery, adventure, and just enough danger to keep things interesting.\n\nIf you have any questions, any member of the crew can give you the answer."

