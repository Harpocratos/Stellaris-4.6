 MESSAGE_NOMAD_MIGRATION_HOST_DESC: "Some among the nomads of §Y$COUNTRY$§! have chosen to settle on §Y$PLANET$§!, and a few of our own have signed onto §Y$ARKSHIP$§! in exchange."

 councilor_star_seekers: "Finder of Stars"
