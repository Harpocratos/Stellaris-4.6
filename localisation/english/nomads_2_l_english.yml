# Seize Waystation - operation_seize_waystation / nomads.8010 / 8015
 operation_seize_waystation: "Seize Waystation"
 operation_seize_waystation_desc: "A nomadic fleet is only as strong as the waystation network that sustains it. Seize the stations, cripple their reach."
 operation_seize_waystation_on_success: "$IF_SUCCESSFUL|E$\nRaid a nomadic waystation, stealing its stockpiled resources and stripping a module.\n\nAssigning an §YAsset§! to this operation might let us destroy or take over the station."
 operation_seize_waystation_no_targets: "The target empire operates no waystations within sensor range."
 nomads.8010.name: "Approaching the Target"
 nomads.8010.desc: "Our operatives have made their initial approach to the target waystation. Security patterns have been mapped and entry vectors identified. We are ready to move to the next phase."
 nomads.8015.name: "Systems Compromised"
 nomads.8015.desc: "Our agents are now embedded within the waystation's crew, visitors and systems. Key security relays have been disabled and communications are being routed through our own filters. The station's fate is in our hands."
 nomads.8020.name: "Waystation Heist"
 nomads.8020.desc: "Our intelligence network has pinpointed a target waystation. Our operatives are embedded and ready. Reinforcements are standing by to board the station. They will strike at our command."
 nomads.8025.name: "Waystation Seized"
 nomads.8025.desc: "Our operatives have neutralized the security forces aboard §Y[target_waystation.GetName]§!, and we are in the process of appropriating their resources. Once they are done, they will..."
 nomads.8025.a: "... destroy the station."
 nomads.8025.a.tt: "§R[target_waystation.GetName]§! is destroyed."
 nomads.8025.b: "... extract."
 nomads.8025.c: "... take full control."
 nomads.8030.name: "Waystation Compromised"
 nomads.8030.intro: "The §Y[target_waystation.GetName]§! was infiltrated! The intruders used force to seize control of the station and appropriate its stockpiles."
 nomads.8030.detected: "Despite their precautions to stay anonymous, we have identified the attackers as belonging to the §Y[From.GetName]§!. They will pay for this!"
 nomads.8030.anonymous: "Despite our best efforts, we could not manage to identify the attackers."
 nomads.8030.destroyed: "The station was then scuttled after explosive charges detonated, taking down critical systems and compromising the station's integrity."
