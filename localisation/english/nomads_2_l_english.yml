 # Singular: £nomad£ ['concept_nomadic_empire'] or £nomad£ §H$concept_nomadic_empire$§!
 # Plural: £nomad£ ['concept_nomadic_empires'] or £nomad£ §H$concept_nomadic_empires$§!
 concept_nomadic_empire: "Nomadic Empire"
 concept_nomadic_empires: "Nomadic Empires"
 concept_nomadic_empire_desc: "£nomad£ §H$concept_nomadic_empires$§! are civilizations that operate from mobile £arkship£ ['concept_arkships'] rather than stationary £colony£ ['concept_colonies']. They do not claim £system£ ['concept_systems'] or colonize £planet£ ['concept_planets'].\n\n§HNomadic Empires§! can build £waystation£ ['concept_waystations'] to collect resources, and can accept £contract£ ['concept_contracts'] from £planet£ ['concept_settled_empires']."

 # Singular: £district£ ['concept_district_ark_military'] or £district£ §H$concept_district_ark_military$§!
 # Plural: £district£ ['concept_district_ark_military_plural'] or £district£ §H$cconcept_district_ark_military_plural$§!
 concept_district_ark_military: "$district_ark_military$"
 concept_district_ark_military_plural: "$district_ark_military_plural$"
 concept_district_ark_military_desc: "- £housing£ ['concept_housing']: §G+200§!\n- £mod_job_technician_add£ ['concept_technicians'] Jobs: §G+200§!\n\n§L$district_generator_desc$§!"

 # Singular: ['concept_operational_reserves'] or §H$concept_operational_reserves$§!
 concept_operational_reserves: "Operational Reserves"
 concept_operational_reserves_desc: "The §H$concept_operational_reserves$§! for £nomad£ ['concept_nomadic_empires'] are a combined view of £minerals£['concept_minerals'] and £energy£ ['concept_energy'].\n\nThere is still income and upkeep of £minerals£ §H$concept_minerals$§! and £energy£ §H$concept_energy$§!, but managed as a ['concept_situation'].\n\nOne point of §H$concept_operational_reserves$§! is equal to one £minerals£ §HMineral§! or one £energy£ §HEnergy Credit§!.\n\n$nomad_max_reserves_breakdown$\n\nThe §HStages§! of the situation affect the empire's £arkship£ ['concept_arkships'] in different ways, and §HApproaches§! can be selected to conserve resources or burn through them for higher productivity.\n\n£minerals£ §H$concept_minerals$§! and £energy£ §H$concept_energy$§! can be bought on the £market£ ['concept_market'], but not sold."
 operational_reserves_desc: "§t$concept_operational_reserves_desc$§!\n\n§GClick ['concept_operational_reserves'] to open the Databank\nClick £operational_reserves£ in the menu to open the ['concept_situation_log_view']§!"

 # Singular: £planet£ ['concept_settled_empire'] or £planet£ §H$concept_settled_empire$§!
 # Plural: £planet£ ['concept_settled_empires'] or £planet£ §H$concept_settled_empires$§!
 concept_settled_empire: "Settled Empire"
 concept_settled_empires: "Settled Empires"
 concept_settled_empire_desc: "£planet£ §H$concept_settled_empires$§! are civilizations that govern from stationary £colony£ ['concept_colonies'] on £planet£ ['concept_planets'], claiming £system£ ['concept_systems'] and defending them with ['concept_starbases'].\n\nFrom the perspective of £nomad£ ['concept_nomadic_empires'], §HSettled Empires§! are potential partners for £contract£ ['concept_contracts'] and ['concept_diplomatic_pacts'], though diplomatic friction may arise when nomadic fleets cross their borders."

 # Singular: £contract£ ['concept_contract'] or £contract£ §H$concept_contract$§!
 # Plural: £contract£ ['concept_contracts'] or £contract£ §H$concept_contracts$§!
 concept_contract: "Contract"
 concept_contracts: "Contracts"
 concept_contract_desc: "£contract£ §H$concept_contracts$§! are tasks given to £nomad£ ['concept_nomadic_empires'] by £planet£ ['concept_settled_empires'], or internal tasks from parts of the §H$concept_nomadic_empire$§! itself.\n\nThese tasks range from raiding rivals to transporting diplomats, and can typically only be completed by £arkship£ ['concept_arkships'].\n\n§HContracts§! are listed in the $situation_log_view_tab_situation_log$ tab of the £interface£ ['concept_situation_log_view']."

 # Singular: £waystation£ ['concept_waystation'] or £waystation£ §H$concept_waystation$§!
 # Plural: £waystation£ ['concept_waystations'] or £waystation£ §H$concept_waystations$§!
 concept_waystation: "$waystation$"
 concept_waystations: "$waystation_plural$"
 concept_waystation_desc: "£waystation£ §H$concept_waystations$§! are space stations, built by £nomad£ ['concept_nomadic_empires'], that can collect celestial resources and form interstellar trade routes, known as £wayline£ ['concept_waylines'].\n\nResources collected by §H$concept_waystations$§! are held in the §HWaystation Stockpile§! until visited by a £construction_ship£ ['concept_logistic_ship'] or £arkship£ ['concept_arkship'].\n\n§H$concept_waystations$§! can be constructed in £system£ ['concept_systems'] without permission from the §HSystem Owner§!, which incurs Diplomatic Penalties with the System Owner, granting them the §H$war_goal_wg_expel_nomads$§! War Goal. Signing a ['concept_wayline_pact'] will remove these penalties. $DOUBLE_NEW_LINE$The number of §H$concept_waystations$§! an empire can support is limited by its ['concept_starbase_capacity']."

 # Singular: £wayline£ ['concept_wayline'] or £wayline£ §H$concept_wayline$§!
 # Plural: £wayline£ ['concept_waylines'] or £wayline£ §H$concept_waylines$§!
 concept_wayline: "Wayline"
 concept_waylines: "Waylines"
 concept_wayline_desc: "£wayline£ §H$concept_waylines$§! are interstellar trade routes formed by £waystation£ ['concept_waystations'] in neighboring £system£ ['concept_systems'].\n\n§HWaystation Modules§! provide effects and modifiers that are propagated along the §H$concept_wayline$§! and shared by ['concept_wayline_pacts'] with the §HSystem Owner§!. For example, the §H$sm_waystation_logistics_hub$§! allows for the collection of stockpiled resources from all £waystation£ §H$concept_waystations$§! along an entire §H$concept_wayline$§!."

 # Singular: ['concept_wayline_pact'] or §H$concept_wayline_pact$§!
 # Plural: ['concept_wayline_pacts'] or §H$concept_wayline_pacts$§!
 concept_wayline_pact: "$wayline_pact$"
 concept_wayline_pacts: "$wayline_pact_plural$"
 concept_wayline_pact_desc: "§H$concept_wayline_pacts$§! are ['concept_diplomatic_pacts'] signed between a £nomad£ ['concept_nomadic_empire'] and another empire. These agreements allow both Empires to benefit from the £wayline£ ['concept_wayline'] §HModifiers§! propagated along the §HWayline§!.\n\nAdditionally, when signed between a §H$concept_nomadic_empire$§! and a £planet£ ['concept_settled_empire'], any Diplomatic Penalties caused by the §HWayline§! are ignored."

# Singular: £construction_ship£ ['concept_logistic_ship'] or £construction_ship£ §H['concept_logistic_ships']§!
# Plural: £construction_ship£ ['concept_logistic_ships'] or £construction_ship£ §H['concept_logistic_ships']§!
 concept_logistic_ship: "$nomads_constructor$"
 concept_logistic_ships: "$nomads_constructor_plural$"
 concept_logistic_ship_desc: "A £construction_ship£ §H$concept_logistic_ship$§! can harvest resources from celestial bodies and transport them to our $arkship_cap_plural$.$tt_use$- ['scripted_action:logistic_harvest_resources'] from Planets, Moons and Asteroids$NEW_LINE$- Build £waystation£ ['concept_waystations'] in £system£ ['concept_systems'] to expand our £wayline£ ['concept_waylines']$NEW_LINE$- Build ['concept_megastructures'] $NEW_LINE$- Collect resources from £waystation£ §H$concept_waystations$§! $NEW_LINE$- Cannot build new £arkship£ ['concept_arkships'], which only other §HArkships§! can do $NEW_LINE$- Research certain ['concept_special_projects']$tt_gain$- Build §H$concept_logistic_ships$§! in an £arkship£ ['concept_arkship']"

 # Singular: £arkship£ ['concept_arkship'] or £arkship£ §H$concept_arkship$§!
 # Plural: £arkship£ ['concept_arkships'] or £arkship£ §H$concept_arkships$§!
 concept_arkship: "$arkship_cap$"
 concept_arkships: "$arkship_cap_plural$"
 concept_arkship_desc: "£arkship£ §H$concept_arkships$§! are colossal vessels that carry £nomad£ ['concept_nomadic_empires'] through the void of space, functioning at once as a £colony£ ['concept_colony'], ['concept_starbase'], and ['concept_military_ship']. $DOUBLE_NEW_LINE$- As §HColonies§!, they contain £district£ ['concept_districts'], £zone£ ['concept_district_specializations'], £building£ ['concept_buildings'] and £pop£ ['concept_pops']. $NEW_LINE$- As §HStarbases§!, they act as ['concept_shipyards'] and can be customized with §HArkship Modules§! and §HSystems§!. $NEW_LINE$- §H$concept_arkships$§! have a shared build queue for all §HColony§! and §HStarbase§! construction. $NEW_LINE$- As §HMilitary Ships§!, §H$concept_arkships$§! boast multiple hangar bays and point-defenses, and significant armor and shields. $NEW_LINE$- §H$concept_arkships$§! can collect stockpiled resources from £construction_ship£ ['concept_logistic_ships'] and £waystation£ ['concept_waystations']. $NEW_LINE$- §H$concept_arkships$§! can perform additional strategic actions, including: $TABBED_NEW_LINE$- ['concept_survey'] $TABBED_NEW_LINE$- ['concept_megastructure', $BUILD_MEGASTRUCTURE_ORDER$] $TABBED_NEW_LINE$- ['scripted_action:arkship_harvest_resources'] $TABBED_NEW_LINE$- §HArkship Modules§! unlock more advanced actions. $NEW_LINE$- New §H$concept_arkships$§! can be constructed as ['concept_megastructures'] by other §H$concept_arkships$§! after researching £engineering_research£ §Y$tech_arkship_construction$§!. $NEW_LINE$- §H$concept_arkships$§! can be upgraded after researching £engineering_research£ §Y$tech_arkship_tier_2$§! and £engineering_research£ §Y$tech_arkship_tier_3$§!."

 # Verb (action): £settle£ ['concept_arkship_settle'] or £settle£ §H$concept_arkship_settle$§!
 # Verb (ongoing): £settle£ ['concept_arkship_settling'] or £settle£ §H$concept_arkship_settling$§!
 # Noun: £settle£ ['concept_arkship_settlement'] or £settle£ §H$concept_arkship_settlement$§!
 concept_arkship_settle: "Settle"
 concept_arkship_settling: "Settling"
 concept_arkship_settlement: "$arkship_settle$"
 concept_arkship_settle_desc: "To £settle£ §H$concept_arkship_settle$§! is when a £arkship£ ['concept_arkship'] permanently settles on a world, ending its nomadic voyage.\n\nThis requires that either the ['tradition_category:tradition_adaptability'] or ['tradition_category:tradition_versatility'] tradition tree has been completed.\n\nTo §H$concept_arkship_settle$§!, either select an §HArkship§! and right-click an uncolonized ['concept_habitable_world'] or click the §HColonize§! button in the £interface£ ['concept_colony_view'].\n\nAn empire with additional §HArkships§! can choose to let them continue as nomads and turn the newly £planet£ ['concept_settled_empire'] into a ['concept_subject'].\n\n£waystation£ ['concept_waystations'] in unowned £system£ ['concept_systems'] are converted into ['concept_outposts']."

 # Verb (action): £embark£ ['concept_arkship_embark'] or £embark£ §H$concept_arkship_embark$§!
 # Verb (ongoing): £embark£ ['concept_arkship_embarking'] or £embark£ §H$concept_arkship_embarking$§!
 # Noun: £embark£ ['concept_arkship_embarkation'] or £embark£ §H$concept_arkship_embarkation$§!
 concept_arkship_embark: "Embark"
 concept_arkship_embarking: "Embarking"
 concept_arkship_embarkation: "$decision_nomad_embarkation$"
 concept_arkship_embark_desc: "To £embark£ §H$concept_arkship_embark$§! is when a £planet£ ['concept_settled_empire'] leaves their ['concept_habitable_world'] and boards an £arkship£ ['concept_arkship'] to become a £nomad£ ['concept_nomadic_empire'].\n\nThis requires that either the ['tradition_category:tradition_adaptability'] or ['tradition_category:tradition_versatility'] tradition tree has been completed.\n\nTo §HEmbark§!, open the ['concept_decisions'] panel on a £colony£ ['concept_colony'] and select §H$decision_nomad_embarkation$§!.\n\nIf an empire has multiple ['concept_colonies'] they can choose to leave them behind as a ['concept_subject'], or instead release the new §HNomadic Empire§! as a §H$concept_subject$§!.\n\nAll owned ['concept_starbases'] are converted into £waystation£ ['concept_waystations'], and the embarked planet becomes a §H$stripped_planet$§!."

