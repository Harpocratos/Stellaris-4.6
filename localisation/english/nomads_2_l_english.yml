# Nomad Concepts

 REQUIRES_NOMADS_DLC: "[GetDatabankNomadsDlc]\n\n"
 REQUIRES_NOMADS_DLC_OWNED: "§tRequires the $DLC_NOMADS$ DLC§!"
 REQUIRES_NOMADS_DLC_NOT_OWNED: "§MRequires the $DLC_NOMADS$ DLC§!"
